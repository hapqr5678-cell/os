">fgets<\/span><span class=\"p\">(<\/span><span class=\"n\">ptr<\/span><span class=\"p\">,<\/span><span class=\"w\"> <\/span><span class=\"n\">SMSIZE<\/span><span class=\"p\">,<\/span><span class=\"w\"> <\/span><span class=\"n\">stdin<\/span><span class=\"p\">)<\/span><span class=\"w\"> <\/span><span class=\"o\">==<\/span><span class=\"w\"> <\/span><span class=\"nb\">NULL<\/span><span class=\"p\">)<\/span><span class=\"w\"> <\/span><span class=\"n\">ptr<\/span><span class=\"p\">[<\/span><span class=\"mi\">0<\/span><span class=\"p\">]<\/span><span class=\"w\"> <\/span><span class=\"o\">=<\/span><span class=\"w\"> <\/span><span class=\"sc\">'\\0'<\/span><span class=\"p\">;<\/span><span class=\"w\">   <\/span><span class=\"c1\">// 直接讀進 shared memory<\/span>\n<span class=\"n\">ptr<\/span><span class=\"p\">[<\/span><span class=\"n\">strcspn<\/span><span class=\"p\">(<\/span><span class=\"n\">ptr<\/span><span class=\"p\">,<\/span><span class=\"w\"> <\/span><span class=\"s\">\"<\/span><span class=\"se\">\\n<\/span><span class=\"s\">\"<\/span><span class=\"p\">)]<\/span><span class=\"w\"> <\/span><span class=\"o\">=<\/span><span class=\"w\"> <\/span><span class=\"sc\">'\\0'<\/span><span class=\"p\">;<\/span><span class=\"w\">                          <\/span><span class=\"c1\">// 去掉換行<\/span>\n<span class=\"n\">munmap<\/span><span class=\"p\">(<\/span><span class=\"n\">ptr<\/span><span class=\"p\">,<\/span><span class=\"w\"> <\/span><span class=\"n\">SMSIZE<\/span><span class=\"p\">);<\/span>\n<span class=\"n\">close<\/span><span class=\"p\">(<\/span><span class=\"n\">fd<\/span><span class=\"p\">);<\/span><span class=\"w\">                                               <\/span><span class=\"c1\">// 不 unlink，資料留給 consumer<\/span>\n<\/code><\/pre><\/div>\n\n<h3 id=\"lab7-practicelab7ex2consumerc\">practice/lab7/ex2/consumer.c<\/h3>\n<div class=\"hl\"><pre><span><\/span><code><span class=\"kt\">int<\/span><span class=\"w\"> <\/span><span class=\"n\">fd<\/span><span class=\"w\"> <\/span><span class=\"o\">=<\/span><span class=\"w\"> <\/span><span class=\"n\">shm_open<\/span><span class=\"p\">(<\/span><span class=\"n\">NAME<\/span><span class=\"p\">,<\/span><span class=\"w\"> <\/span><span class=\"n\">O_RDONLY<\/span><span class=\"p\">,<\/span><span class=\"w\"> <\/span><span class=\"mo\">0666<\/span><span class=\"p\">);<\/span><span class=\"w\">                 <\/span><span class=\"c1\">// 開已存在的<\/span>\n<span class=\"kt\">char<\/span><span class=\"w\"> <\/span><span class=\"o\">*<\/span><span class=\"n\">ptr<\/span><span class=\"w\"> <\/span><span class=\"o\">=<\/span><span class=\"w\"> <\/span><span class=\"n\">mmap<\/span><span class=\"p\">(<\/span><span class=\"nb\">NULL<\/span><span class=\"p\">,<\/span><span class=\"w\"> <\/span><span class=\"n\">SMSIZE<\/span><span class=\"p\">,<\/span><span class=\"w\"> <\/span><span class=\"n\">PROT_READ<\/span><span class=\"p\">,<\/span><span class=\"w\"> <\/span><span class=\"n\">MAP_SHARED<\/span><span class=\"p\">,<\/span><span class=\"w\"> <\/span><span class=\"n\">fd<\/span><span class=\"p\">,<\/span><span class=\"w\"> <\/span><span class=\"mi\">0<\/span><span class=\"p\">);<\/span>\n<span class=\"n\">printf<\/span><span class=\"p\">(<\/span><span class=\"s\">\"Read from shared memory: %s<\/span><span class=\"se\">\\n<\/span><span class=\"s\">\"<\/span><span class=\"p\">,<\/span><span class=\"w\"> <\/span><span class=\"n\">ptr<\/span><span class=\"p\">);<\/span><span class=\"w\">            <\/span><span class=\"c1\">// 印內容<\/span>\n<span class=\"n\">munmap<\/span><span class=\"p\">(<\/span><span class=\"n\">ptr<\/span><span class=\"p\">,<\/span><span class=\"w\"> <\/span><span class=\"n\">SMSIZE<\/span><span class=\"p\">);<\/span>\n<span class=\"n\">close<\/span><span class=\"p\">(<\/span><span class=\"n\">fd<\/span><span class=\"p\">);<\/span>\n<span class=\"n\">shm_unlink<\/span><span class=\"p\">(<\/span><span class=\"n\">NAME<\/span><span class=\"p\">);<\/span><span class=\"w\">                                        <\/span><span class=\"c1\">// 讀完刪除物件<\/span>\n<\/code><\/pre><\/div>\n\n<p>結果（與投影片一致）：<\/p>\n<div class=\"hl\"><pre><span><\/span><code>$ ./producer\nEnter the message: hello\n$ ./consumer\nRead from shared memory: hello\n<\/code><\/pre><\/div>\n\n<p><strong>評論<\/strong>：\n- 正確且完整，每一步都有錯誤檢查，且改正了範例的兩個問題（未初始化 buffer、印位址）。\n- 注意執行順序：<strong>一定要先跑 producer 再跑 consumer<\/strong>。consumer 會 <code>shm_unlink<\/code>，所以連續跑兩次 consumer，第二次會出現 <code>Failed to open the shared memory: No such file or directory<\/code>。\n- 若使用者輸入剛好 1023 個字元以上，<code>fgets<\/code> 會截斷，仍有 <code>'\\0'<\/code> 結尾，安全。\n- 沒有同步機制：若 consumer 在 producer 寫入過程中讀，可能讀到不完整資料（本題不要求）。\n- 執行中可用 <code>ls -l /dev/shm<\/code> 看到 <code>myShareMemory<\/code>（大小 1024）。<\/p>\n<h2 id=\"lab7-34-exercise-2-50-pts\">3.4 Exercise 2 題目（50 pts.）<\/h2>\n<ul>\n<li><strong>producer.c<\/strong>：建立 shared memory；使用者可以輸入訊息寫進 shared memory。<\/li>\n<li><strong>consumer.c<\/strong>：把 shared memory 的內容印到螢幕上。<\/li>\n<li>編譯：<code>gcc -o producer producer.c -lrt<\/code>、<code>gcc -o consumer consumer.c -lrt<\/code>。<\/li>\n<li>參考解法：即上面學生版程式（已完整）。<\/li>\n<\/ul>\n<hr />\n<h2 id=\"lab7-4\">4. 上機考實作步驟<\/h2>\n<h3 id=\"lab7-exercise-1message-queue\">Exercise 1：Message Queue<\/h3>\n<div class=\"hl\"><pre><span><\/span><code>mkdir<span class=\"w\"> <\/span>-p<span class=\"w\"> <\/span>~/lab7/exercise1<span class=\"w\"> <\/span><span class=\"o\">&amp;&amp;<\/span><span class=\"w\"> <\/span><span class=\"nb\">cd<\/span><span class=\"w\"> <\/span>~/lab7/exercise1\nvim<span class=\"w\"> <\/span>sender.c\nvim<span class=\"w\"> <\/span>receiver.c\ngcc<span class=\"w\"> <\/span>sender.c<span class=\"w\"> <\/span>-o<span class=\"w\"> <\/span>sender<span class=\"w\"> <\/span>-lrt\ngcc<span class=\"w\"> <\/span>receiver.c<span class=\"w\"> <\/span>-o<span class=\"w\"> <\/span>receiver<span class=\"w\"> <\/span>-lrt\n\n<span class=\"c1\"># 開兩個 terminal（Ctrl+Shift+T 開新分頁）<\/span>\n./receiver<span class=\"w\">          <\/span><span class=\"c1\"># terminal 1（也可以先開 sender，兩邊都有 O_CREAT）<\/span>\n./sender<span class=\"w\">            <\/span><span class=\"c1\"># terminal 2：輸入 test、123、exit<\/span>\n\n<span class=\"c1\"># 除錯／清理殘留的 queue（補充）<\/span>\nls<span class=\"w\"> <\/span>/dev/mqueue/\ncat<span class=\"w\"> <\/span>/dev/mqueue/myMsgQueue<span class=\"w\">      <\/span><span class=\"c1\"># 看 QSIZE 等資訊<\/span>\nrm<span class=\"w\"> <\/span>/dev/mqueue/myMsgQueue\n<\/code><\/pre><\/div>\n\n<h3 id=\"lab7-exercise-2shared-memory\">Exercise 2：Shared Memory<\/h3>\n<div class=\"hl\"><pre><span><\/span><code>mkdir<span class=\"w\"> <\/span>-p<span class=\"w\"> <\/span>~/lab7/exercise2<span class=\"w\"> <\/span><span class=\"o\">&amp;&amp;<\/span><span class=\"w\"> <\/span><span class=\"nb\">cd<\/span><span class=\"w\"> <\/span>~/lab7/exercise2\nvim<span class=\"w\"> <\/span>producer.c\nvim<span class=\"w\"> <\/span>consumer.c\ngcc<span class=\"w\"> <\/span>-o<span class=\"w\"> <\/span>producer<span class=\"w\"> <\/span>producer.c<span class=\"w\"> <\/span>-lrt\ngcc<span class=\"w\"> <\/span>-o<span class=\"w\"> <\/span>consumer<span class=\"w\"> <\/span>consumer.c<span class=\"w\"> <\/span>-lrt\n./producer<span class=\"w\">          <\/span><span class=\"c1\"># Enter the message: hello<\/span>\nls<span class=\"w\"> <\/span>-l<span class=\"w\"> <\/span>/dev/shm<span class=\"w\">      <\/span><span class=\"c1\"># 看到 myShareMemory（kernel persistence）<\/span>\n./consumer<span class=\"w\">          <\/span><span class=\"c1\"># Read from shared memory: hello<\/span>\nls<span class=\"w\"> <\/span>-l<span class=\"w\"> <\/span>/dev/shm<span class=\"w\">      <\/span><span class=\"c1\"># 已被 shm_unlink 刪除<\/span>\n<\/code><\/pre><\/div>\n\n<h3 id=\"lab7-_3\">考場最小骨架（背起來）<\/h3>\n<div class=\"hl\"><pre><span><\/span><code><span class=\"cm\">/* message queue */<\/span>\n<span class=\"n\">mqd_t<\/span><span class=\"w\"> <\/span><span class=\"n\">q<\/span><span class=\"w\"> <\/span><span class=\"o\">=<\/span><span class=\"w\"> <\/span><span class=\"n\">mq_open<\/span><span class=\"p\">(<\/span><span class=\"s\">\"/q\"<\/span><span class=\"p\">,<\/span><span class=\"w\"> <\/span><span class=\"n\">O_CREAT<\/span><span class=\"w\"> <\/span><span class=\"o\">|<\/span><span class=\"w\"> <\/span><span class=\"n\">O_RDWR<\/span><span class=\"p\">,<\/span><span class=\"w\"> <\/span><span class=\"mo\">0644<\/span><span class=\"p\">,<\/span><span class=\"w\"> <\/span><span class=\"nb\">NULL<\/span><span class=\"p\">);<\/span>\n<span class=\"n\">mq_send<\/span><span class=\"p\">(<\/span><span class=\"n\">q<\/span><span class=\"p\">,<\/span><span class=\"w\"> <\/span><span class=\"n\">msg<\/span><span class=\"p\">,<\/span><span class=\"w\"> <\/span><span class=\"n\">strlen<\/span><span class=\"p\">(<\/span><span class=\"n\">msg<\/span><span class=\"p\">)<\/span><span class=\"w\"> <\/span><span class=\"o\">+<\/span><span class=\"w\"> <\/span><span class=\"mi\">1<\/span><span class=\"p\">,<\/span><span class=\"w\"> <\/span><span class=\"mi\">0<\/span><span class=\"p\">);<\/span>\n<span class=\"k\">struct<\/span><span class=\"w\"> <\/span><span class=\"nc\">mq_attr<\/span><span class=\"w\"> <\/span><span class=\"n\">a<\/span><span class=\"p\">;<\/span><span class=\"w\"> <\/span><span class=\"n\">mq_getattr<\/span><span class=\"p\">(<\/span><span class=\"n\">q<\/span><span class=\"p\">,<\/span><span class=\"w\"> <\/span><span class=\"o\">&amp;<\/span><span class=\"n\">a<\/span><span class=\"p\">);<\/span>\n<span class=\"kt\">char<\/span><span class=\"w\"> <\/span><span class=\"o\">*<\/span><span class=\"n\">buf<\/span><span class=\"w\"> <\/span><span class=\"o\">=<\/span><span class=\"w\"> <\/span><span class=\"n\">malloc<\/span><span class=\"p\">(<\/span><span class=\"n\">a<\/span><span class=\"p\">.<\/span><span class=\"n\">mq_msgsize<\/span><span class=\"p\">);<\/span>\n<span class=\"n\">mq_receive<\/span><span class=\"p\">(<\/span><span class=\"n\">q<\/span><span class=\"p\">,<\/span><span class=\"w\"> <\/span><span class=\"n\">buf<\/span><span class=\"p\">,<\/span><span class=\"w\"> <\/span><span class=\"n\">a<\/span><span class=\"p\">.<\/span><span class=\"n\">mq_msgsize<\/span><span class=\"p\">,<\/span><span class=\"w\"> <\/span><span class=\"nb\">NULL<\/span><span class=\"p\">);<\/span>\n<span class=\"n\">mq_close<\/span><span class=\"p\">(<\/span><span class=\"n\">q<\/span><span class=\"p\">);<\/span><span class=\"w\"> <\/span><span class=\"n\">mq_unlink<\/span><span class=\"p\">(<\/span><span class=\"s\">\"/q\"<\/span><span class=\"p\">);<\/span>\n\n<span class=\"cm\">/* shared memory */<\/span>\n<span class=\"kt\">int<\/span><span class=\"w\"> <\/span><span class=\"n\">fd<\/span><span class=\"w\"> <\/span><span class=\"o\">=<\/span><span class=\"w\"> <\/span><span class=\"n\">shm_open<\/span><span class=\"p\">(<\/span><span class=\"s\">\"/s\"<\/span><span class=\"p\">,<\/span><span class=\"w\"> <\/span><span class=\"n\">O_CREAT<\/span><span class=\"w\"> <\/span><span class=\"o\">|<\/span><span class=\"w\"> <\/span><span class=\"n\">O_RDWR<\/span><span class=\"p\">,<\/span><span class=\"w\"> <\/span><span class=\"mo\">0666<\/span><span class=\"p\">);<\/span>\n<span class=\"n\">ftruncate<\/span><span class=\"p\">(<\/span><span class=\"n\">fd<\/span><span class=\"p\">,<\/span><span class=\"w\"> <\/span><span class=\"mi\">1024<\/span><span class=\"p\">);<\/span>\n<span class=\"kt\">char<\/span><span class=\"w\"> <\/span><span class=\"o\">*<\/span><span class=\"n\">p<\/span><span class=\"w\"> <\/span><span class=\"o\">=<\/span><span class=\"w\"> <\/span><span class=\"n\">mmap<\/span><span class=\"p\">(<\/span><span class=\"nb\">NULL<\/span><span class=\"p\">,<\/span><span class=\"w\"> <\/span><span class=\"mi\">1024<\/span><span class=\"p\">,<\/span><span class=\"w\"> <\/span><span class=\"n\">PROT_READ<\/span><span class=\"w\"> <\/span><span class=\"o\">|<\/span><span class=\"w\"> <\/span><span class=\"n\">PROT_WRITE<\/span><span class=\"p\">,<\/span><span class=\"w\"> <\/span><span class=\"n\">MAP_SHARED<\/span><span class=\"p\">,<\/span><span class=\"w\"> <\/span><span class=\"n\">fd<\/span><span class=\"p\">,<\/span><span class=\"w\"> <\/span><span class=\"mi\">0<\/span><span class=\"p\">);<\/span>\n<span class=\"n\">strcpy<\/span><span class=\"p\">(<\/span><span class=\"n\">p<\/span><span class=\"p\">,<\/span><span class=\"w\"> <\/span><span class=\"s\">\"hello\"<\/span><span class=\"p\">);<\/span>\n<span class=\"n\">munmap<\/span><span class=\"p\">(<\/span><span class=\"n\">p<\/span><span class=\"p\">,<\/span><span class=\"w\"> <\/span><span class=\"mi\">1024<\/span><span class=\"p\">);<\/span><span class=\"w\"> <\/span><span class=\"n\">close<\/span><span class=\"p\">(<\/span><span class=\"n\">fd<\/span><span class=\"p\">);<\/span><span class=\"w\"> <\/span><span class=\"cm\">/* 讀方最後 */<\/span><span class=\"w\"> <\/span><span class=\"n\">shm_unlink<\/span><span class=\"p\">(<\/span><span class=\"s\">\"/s\"<\/span><span class=\"p\">);<\/span>\n<\/code><\/pre><\/div>\n\n<hr />\n<h2 id=\"lab7-5\">5. 常見錯誤與陷阱<\/h2>\n<p><strong>Message Queue<\/strong>\n1. 名稱沒有以 <code>/<\/code> 開頭（如 <code>\"myMsgQueue\"<\/code>）→ <code>mq_open<\/code> 失敗（EINVAL）。\n2. <code>mq_receive<\/code> 的 <code>msg_len<\/code> <strong>小於<\/strong> <code>mq_msgsize<\/code> → EMSGSIZE 錯誤；<code>msg_len<\/code> 謊報比實際 buffer 大 → 有 overflow 風險。\n3. 送字串時用 <code>strlen(buf)<\/code> 沒 <code>+1<\/code> → receiver 收到的沒有 <code>'\\0'<\/code>，印出垃圾（除非 buffer 事先清 0）。\n4. 以為 <code>mq_close<\/code> 會刪 queue → 不會，要 <code>mq_unlink<\/code>。\n5. 沒 unlink 導致舊 queue 殘留，新程式的 <code>attr<\/code> 被忽略。\n6. <code>fgets<\/code> 會把 <code>\\n<\/code> 一起讀進來，用 <code>strcmp(buf, \"exit\")<\/code> 比較會失敗——要先去掉換行，或比 <code>\"exit\\n\"<\/code>。\n7. 判斷 <code>mq_open<\/code> 失敗要和 <code>(mqd_t)-1<\/code> 比。\n8. 忘了 <code>-lrt<\/code>（舊 glibc 會 undefined reference to <code>mq_open<\/code>）。\n9. 非 root 時 <code>mq_maxmsg<\/code> 不能超過系統上限（<code>/proc/sys/fs/mqueue/msg_max<\/code>，預設 10），設 11 以上會 EINVAL（補充）。<\/p>\n<p><strong>Shared Memory<\/strong>\n1. 建立後<strong>忘了 <code>ftruncate<\/code><\/strong> → 物件大小為 0，存取映射區會 <strong>SIGBUS<\/strong>。\n2. 判斷 <code>mmap<\/code> 失敗要用 <code>MAP_FAILED<\/code>，不是 <code>NULL<\/code>。\n3. 用 <code>MAP_PRIVATE<\/code> → 寫入的資料別的 process 看不到。\n4. <code>shm_open<\/code> 用 <code>O_RDONLY<\/code> 卻 <code>mmap<\/code> 要 <code>PROT_WRITE<\/code> → 權限錯誤。\n5. 誤用 <code>O_WRONLY<\/code>（shm_open 只有 <code>O_RDONLY<\/code> / <code>O_RDWR<\/code>）。\n6. producer 結束時就 <code>shm_unlink<\/code> → consumer 打不開。\n7. consumer 用 <code>%p<\/code> 印出的是位址不是內容。\n8. 多個 process 同時讀寫沒有同步 → race condition（需要 semaphore）。\n9. 忘了 <code>-lrt<\/code>。<\/p>\n<hr />\n<h2 id=\"lab7-6\">6. 筆試模擬題<\/h2>\n<p><strong>Q1（選擇）<\/strong> 下列哪個函式會「刪除」POSIX message queue？\n(A) <code>mq_close<\/code>　(B) <code>mq_unlink<\/code>　(C) <code>mq_receive<\/code>　(D) <code>mq_open<\/code> 加 <code>O_TRUNC<\/code><\/p>\n<blockquote>\n<p><strong>答：B<\/strong>。<code>mq_close<\/code> 只關閉 descriptor，不刪 queue。<\/p>\n<\/blockquote>\n<p><strong>Q2（是非）<\/strong> 呼叫 <code>mq_unlink()<\/code> 時，若還有其他 process 開著這個 queue，queue 會立即被銷毀、其他 process 讀取會失敗。<\/p>\n<blockquote>\n<p><strong>答：錯<\/strong>。名字立即移除，但銷毀<strong>延後到所有參照都 close 之後<\/strong>。<\/p>\n<\/blockquote>\n<p><strong>Q3（選擇）<\/strong> 建立 message queue 時，<code>mq_open()<\/code> 會用到 <code>struct mq_attr<\/code> 的哪兩個欄位？\n(A) mq_flags、mq_curmsgs　(B) mq_maxmsg、mq_msgsize　(C) mq_flags、mq_maxmsg　(D) mq_msgsize、mq_curmsgs<\/p>\n<blockquote>\n<p><strong>答：B<\/strong>。<\/p>\n<\/blockquote>\n<p><strong>Q4（簡答）<\/strong> <code>mq_receive()<\/code> 的 <code>msg_len<\/code> 有什麼限制？<\/p>\n<blockquote>\n<p><strong>答：<\/strong> 必須大於或等於 queue 的 <code>mq_msgsize<\/code>，否則呼叫失敗（EMSGSIZE）；而 buffer 實際大小也必須至少 <code>msg_len<\/code>。<\/p>\n<\/blockquote>\n<p><strong>Q5（輸出預測）<\/strong> sender 呼叫 <code>mq_send(mqd, \"hi\", 2, 0)<\/code>（沒有 +1），receiver 用一個<strong>未清空<\/strong>的 buffer 接收後 <code>printf(\"%s\", buf)<\/code>，可能發生？<\/p>\n<blockquote>\n<p><strong>答：<\/strong> 收到的 2 bytes 沒有 <code>'\\0'<\/code>，printf 會繼續印出 buffer 後面的殘留垃圾，直到遇到某個 <code>'\\0'<\/code>。應送 <code>strlen+1<\/code>。<\/p>\n<\/blockquote>\n<p><strong>Q6（選擇）<\/strong> Linux 中 POSIX shared memory 物件存放在哪裡？\n(A) <code>/tmp<\/code>　(B) <code>/proc/shm<\/code>　(C) <code>/dev/shm<\/code>　(D) <code>/var/shm<\/code><\/p>\n<blockquote>\n<p><strong>答：C<\/strong>。<\/p>\n<\/blockquote>\n<p><strong>Q7（簡答）<\/strong> 何謂 kernel persistence？對 producer/consumer 有什麼意義？<\/p>\n<blockquote>\n<p><strong>答：<\/strong> 物件在沒有任何 process 開著時仍然存在，直到系統關機或呼叫 <code>shm_unlink()<\/code>。因此 producer 寫完資料結束後，consumer 之後再執行仍能讀到資料。<\/p>\n<\/blockquote>\n<p><strong>Q8（排序）<\/strong> 將 producer 使用 shared memory 的步驟排序：① <code>mmap<\/code> ② <code>shm_open<\/code> ③ 寫入資料 ④ <code>ftruncate<\/code> ⑤ <code>munmap<\/code> + <code>close<\/code><\/p>\n<blockquote>\n<p><strong>答：<\/strong> ② → ④ → ① → ③ → ⑤。<\/p>\n<\/blockquote>\n<p><strong>Q9（選擇）<\/strong> 要讓修改對其他 process 可見，<code>mmap<\/code> 的 flags 要用？\n(A) <code>MAP_PRIVATE<\/code>　(B) <code>MAP_ANONYMOUS<\/code>　(C) <code>MAP_SHARED<\/code>　(D) <code>MAP_FIXED<\/code><\/p>\n<blockquote>\n<p><strong>答：C<\/strong>。<code>MAP_PRIVATE<\/code> 的修改是私有的。<\/p>\n<\/blockquote>\n<p><strong>Q10（是非）<\/strong> <code>mmap()<\/code> 失敗時回傳 <code>NULL<\/code>。<\/p>\n<blockquote>\n<p><strong>答：錯<\/strong>。回傳 <code>MAP_FAILED<\/code>（即 <code>(void *)-1<\/code>）。<\/p>\n<\/blockquote>\n<p><strong>Q11（簡答）<\/strong> shared memory-mapped file 與 POSIX shared memory 最主要的差別？<\/p>\n<blockquote>\n<p><strong>答：<\/strong> 前者需要明確建立一個實體檔案來映射；後者不需要建立對應的檔案（kernel 在 /dev/shm 建立偽檔案）。<\/p>\n<\/blockquote>\n<p><strong>Q12（簡答）<\/strong> 為什麼兩個 process 同時存取 shared memory 時需要 semaphore，而 message queue 通常不用？<\/p>\n<blockquote>\n<p><strong>答：<\/strong> shared memory 只是共用一塊記憶體，kernel 不管讀寫順序，同時存取會產生 race condition，必須自己同步；message queue 的 send/receive 由 kernel 管理，queue 空時 receive 會阻塞、訊息一則一則完整傳遞，本身就有同步效果。<\/p>\n<\/blockquote>\n<p><strong>Q13（選擇）<\/strong> 編譯使用 POSIX IPC 的程式時，投影片要求加上哪個 gcc 選項？\n(A) <code>-lpthread<\/code>　(B) <code>-lm<\/code>　(C) <code>-lrt<\/code>　(D) <code>-shared<\/code><\/p>\n<blockquote>\n<p><strong>答：C<\/strong>。連結 librt。<\/p>\n<\/blockquote>\n<p><strong>Q14（輸出預測）<\/strong> 投影片 consumer.c 執行後印出的是什麼？<\/p>\n<blockquote>\n<p><strong>答：<\/strong> 映射區的<strong>位址<\/strong>（<code>%p<\/code>，例如 <code>0x7f3a1c2d4000<\/code>），而不是 shared memory 的內容。<\/p>\n<\/blockquote>\n<p><strong>Q15（程式填空）<\/strong> receiver 在收到 <code>\"exit\"<\/code> 時跳出迴圈：<\/p>\n<div class=\"hl\"><pre><span><\/span><code><span class=\"k\">if<\/span><span class=\"w\"> <\/span><span class=\"p\">(<\/span><span class=\"n\">__________<\/span><span class=\"p\">(<\/span><span class=\"n\">buffer<\/span><span class=\"p\">,<\/span><span class=\"w\"> <\/span><span class=\"s\">\"exit\"<\/span><span class=\"p\">)<\/span><span class=\"w\"> <\/span><span class=\"o\">==<\/span><span class=\"w\"> <\/span><span class=\"mi\">0<\/span><span class=\"p\">)<\/span><span class=\"w\"> <\/span><span class=\"k\">break<\/span><span class=\"p\">;<\/span>\n<\/code><\/pre><\/div>\n\n<blockquote>\n<p><strong>答：<\/strong> <code>strcmp<\/code>。<\/p>\n<\/blockquote>", "toc": [{"id": "lab7-1-lab", "name": "1. 這個 LAB 在學什麼", "kids": []}, {"id": "lab7-21", "name": "2.1 核心觀念", "kids": [{"id": "lab7-message-queue", "name": "什麼是 Message Queue"}, {"id": "lab7-posix-message-queue", "name": "POSIX Message Queue 五個主要函式"}, {"id": "lab7-close-vs-unlink", "name": "close vs unlink（必考）"}, {"id": "lab7-mq_attr", "name": "mq_attr 屬性"}, {"id": "lab7-mq_receive-buffer", "name": "mq_receive 的 buffer 大小規則（必考）"}, {"id": "lab7-mqd_t", "name": "mqd_t"}]}, {"id": "lab7-22-api", "name": "2.2 API 速查表", "kids": []}, {"id": "lab7-23", "name": "2.3 程式範例逐行解說", "kids": [{"id": "lab7-example1senderc", "name": "投影片 example1/sender.c"}, {"id": "lab7-example1receiverc", "name": "投影片 example1/receiver.c"}, {"id": "lab7-practicelab7ex1senderc", "name": "學生作業 practice/lab7/ex1/sender.c"}, {"id": "lab7-practicelab7ex1receiverc", "name": "practice/lab7/ex1/receiver.c"}]}, {"id": "lab7-24-exercise-1-50-pts", "name": "2.4 Exercise 1 題目（50 pts.）", "kids": []}, {"id": "lab7-31", "name": "3.1 核心觀念", "kids": [{"id": "lab7-process", "name": "兩種讓不相關 process 共享記憶體的技術"}, {"id": "lab7-_1", "name": "位置"}, {"id": "lab7-posix-shared-memory", "name": "POSIX Shared Memory 使用流程"}, {"id": "lab7-devshm-kernel-persistence", "name": "/dev/shm 與 kernel persistence（必考）"}, {"id": "lab7-_2", "name": "同步問題"}, {"id": "lab7-message-queue-vs-shared-memory", "name": "Message Queue vs Shared Memory（補充比較）"}]}, {"id": "lab7-32-api", "name": "3.2 API 速查表", "kids": []}, {"id": "lab7-33", "name": "3.3 程式範例逐行解說", "kids": [{"id": "lab7-producerc", "name": "投影片 producer.c"}, {"id": "lab7-consumerc", "name": "投影片 consumer.c"}, {"id": "lab7-practicelab7ex2producerc", "name": "學生作業 practice/lab7/ex2/producer.c"}, {"id": "lab7-practicelab7ex2consumerc", "name": "practice/lab7/ex2/consumer.c"}]}, {"id": "lab7-34-exercise-2-50-pts", "name": "3.4 Exercise 2 題目（50 pts.）", "kids": []}, {"id": "lab7-4", "name": "4. 上機考實作步驟", "kids": [{"id": "lab7-exercise-1message-queue", "name": "Exercise 1：Message Queue"}, {"id": "lab7-exercise-2shared-memory", "name": "Exercise 2：Shared Memory"}, {"id": "lab7-_3", "name": "考場最小骨架（背起來）"}]}, {"id": "lab7-5", "name": "5. 常見錯誤與陷阱", "kids": []}, {"id": "lab7-6", "name": "6. 筆試模擬題", "kids": []}]}];
const $ = s => document.querySelector(s);
const content = $('#content'), toc = $('#toc'), tabs = $('#tabs'), results = $('#results'), q = $('#q');
let cur = null;

// theme
function setTheme(t){document.documentElement.dataset.theme=t;try{localStorage.setItem('theme',t)}catch(e){}}
let saved=null;try{saved=localStorage.getItem('theme')}catch(e){}
setTheme(saved || (matchMedia('(prefers-color-scheme: dark)').matches?'dark':'light'));
const flip=()=>setTheme(document.documentElement.dataset.theme==='dark'?'light':'dark');
$('#theme').onclick=flip;$('#theme2').onclick=flip;
$('#menu').onclick=()=>document.body.classList.toggle('open');
$('#top').onclick=()=>scrollTo({top:0,behavior:'smooth'});

PAGES.forEach(p=>{
  const b=document.createElement('button');b.textContent=p.short;b.dataset.id=p.id;
  b.onclick=()=>{location.hash=p.id};tabs.appendChild(b);
});

function prepAnswers(){
  // 模擬題 section：把答案 blockquote 藏起來
  const h2s=[...content.querySelectorAll('h2')];
  const qh=h2s.find(h=>h.textContent.includes('模擬題'));
  if(!qh) return;
  const bar=document.createElement('div');bar.className='ansbar';
  bar.innerHTML='<button data-a="hide">全部遮住答案</button><button data-a="show">全部顯示答案</button>';
  qh.after(bar);
  const list=[];
  for(let n=bar.nextElementSibling;n && n.tagName!=='H2';n=n.nextElementSibling){
    if(n.tagName==='BLOCKQUOTE'){n.classList.add('ans','hide');n.onclick=()=>n.classList.toggle('hide');list.push(n)}
  }
  bar.onclick=e=>{const a=e.target.dataset.a;if(a)list.forEach(n=>n.classList.toggle('hide',a==='hide'))};
}

function show(pid, anchor){
  const p=PAGES.find(x=>x.id===pid)||PAGES[0];
  if(cur!==p.id){
    content.innerHTML=p.html; cur=p.id; prepAnswers();
    toc.innerHTML=p.toc.map(t=>`<a href="#${t.id}">${t.name}</a>`+t.kids.map(k=>`<a class="sub" href="#${k.id}">${k.name}</a>`).join('')).join('');
    tabs.querySelectorAll('button').forEach(b=>b.classList.toggle('on',b.dataset.id===p.id));
    document.title=p.short+'｜OS Lab 複習';
  }
  results.hidden=true;content.hidden=false;
  if(anchor){const el=document.getElementById(anchor);if(el){el.scrollIntoView();return}}
  scrollTo(0,0);
}

function route(){
  const h=decodeURIComponent(location.hash.slice(1));
  document.body.classList.remove('open');
  if(!h){show(PAGES[0].id);return}
  const pid=h.split('-')[0];
  show(pid, h.includes('-')?h:null);
}
addEventListener('hashchange',route);

// 目前段落高亮
addEventListener('scroll',()=>{
  const hs=[...content.querySelectorAll('h2,h3')];let last=null;
  for(const h of hs){if(h.getBoundingClientRect().top<120) last=h; else break}
  toc.querySelectorAll('a').forEach(a=>a.classList.toggle('cur',last && a.getAttribute('href')==='#'+last.id));
},{passive:true});

// 搜尋：以 h2/h3 段落為單位
const index=[];
PAGES.forEach(p=>{
  const d=document.createElement('div');d.innerHTML=p.html;
  let sec={id:null,name:p.title,text:''};
  const push=()=>{if(sec.text.trim())index.push({pid:p.id,page:p.short,...sec})};
  [...d.children].forEach(n=>{
    if(/^H[23]$/.test(n.tagName)){push();sec={id:n.id,name:n.textContent,text:''}}
    else sec.text+=' '+n.textContent;
  });
  push();
});
const esc=s=>s.replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
const reEsc=s=>s.replace(/[.*+?^${}()|[\]\\]/g,'\\$&');
let t;
q.addEventListener('input',()=>{clearTimeout(t);t=setTimeout(search,120)});
function search(){
  const s=q.value.trim();
  if(!s){results.hidden=true;content.hidden=false;return}
  const lo=s.toLowerCase();
  const hits=index.filter(x=>(x.name+' '+x.text).toLowerCase().includes(lo));
  const re=new RegExp(reEsc(esc(s)),'gi');
  results.innerHTML=`<h1>搜尋「${esc(s)}」</h1><p class="empty">${hits.length} 個段落符合</p>`+hits.slice(0,80).map(x=>{
    const i=x.text.toLowerCase().indexOf(lo);
    const snip=i<0?x.text.slice(0,120):x.text.slice(Math.max(0,i-50),i+90);
    return `<a class="r" href="#${x.id||x.pid}"><b>${esc(x.page)}</b>　${esc(x.name).replace(re,m=>`<mark>${m}</mark>`)}<small>…${esc(snip).replace(re,m=>`<mark>${m}</mark>`)}…</small></a>`;
  }).join('');
  results.hidden=false;content.hidden=true;scrollTo(0,0);
}
results.addEventListener('click',e=>{if(e.target.closest('a'))q.value=''});

route();
</script>
