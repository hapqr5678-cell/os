an><span class=\"n\">dup<\/span><span class=\"p\">)<\/span><span class=\"w\"> <\/span><span class=\"n\">arr<\/span><span class=\"p\">[<\/span><span class=\"n\">cnt<\/span><span class=\"o\">++<\/span><span class=\"p\">]<\/span><span class=\"w\"> <\/span><span class=\"o\">=<\/span><span class=\"w\"> <\/span><span class=\"n\">x<\/span><span class=\"p\">;<\/span>\n<span class=\"w\">    <\/span><span class=\"p\">}<\/span>\n<span class=\"w\">    <\/span><span class=\"n\">printf<\/span><span class=\"p\">(<\/span><span class=\"s\">\"Before sort: \"<\/span><span class=\"p\">);<\/span>\n<span class=\"w\">    <\/span><span class=\"k\">for<\/span><span class=\"w\"> <\/span><span class=\"p\">(<\/span><span class=\"kt\">int<\/span><span class=\"w\"> <\/span><span class=\"n\">i<\/span><span class=\"w\"> <\/span><span class=\"o\">=<\/span><span class=\"w\"> <\/span><span class=\"mi\">0<\/span><span class=\"p\">;<\/span><span class=\"w\"> <\/span><span class=\"n\">i<\/span><span class=\"w\"> <\/span><span class=\"o\">&lt;<\/span><span class=\"w\"> <\/span><span class=\"mi\">5<\/span><span class=\"p\">;<\/span><span class=\"w\"> <\/span><span class=\"n\">i<\/span><span class=\"o\">++<\/span><span class=\"p\">)<\/span><span class=\"w\"> <\/span><span class=\"n\">printf<\/span><span class=\"p\">(<\/span><span class=\"s\">\"%d \"<\/span><span class=\"p\">,<\/span><span class=\"w\"> <\/span><span class=\"n\">arr<\/span><span class=\"p\">[<\/span><span class=\"n\">i<\/span><span class=\"p\">]);<\/span>\n<span class=\"w\">    <\/span><span class=\"n\">sort<\/span><span class=\"p\">(<\/span><span class=\"n\">arr<\/span><span class=\"p\">);<\/span>\n<span class=\"w\">    <\/span><span class=\"n\">printf<\/span><span class=\"p\">(<\/span><span class=\"s\">\"<\/span><span class=\"se\">\\n<\/span><span class=\"s\">After sort: \"<\/span><span class=\"p\">);<\/span>\n<span class=\"w\">    <\/span><span class=\"k\">for<\/span><span class=\"w\"> <\/span><span class=\"p\">(<\/span><span class=\"kt\">int<\/span><span class=\"w\"> <\/span><span class=\"n\">i<\/span><span class=\"w\"> <\/span><span class=\"o\">=<\/span><span class=\"w\"> <\/span><span class=\"mi\">0<\/span><span class=\"p\">;<\/span><span class=\"w\"> <\/span><span class=\"n\">i<\/span><span class=\"w\"> <\/span><span class=\"o\">&lt;<\/span><span class=\"w\"> <\/span><span class=\"mi\">5<\/span><span class=\"p\">;<\/span><span class=\"w\"> <\/span><span class=\"n\">i<\/span><span class=\"o\">++<\/span><span class=\"p\">)<\/span><span class=\"w\"> <\/span><span class=\"n\">printf<\/span><span class=\"p\">(<\/span><span class=\"s\">\"%d \"<\/span><span class=\"p\">,<\/span><span class=\"w\"> <\/span><span class=\"n\">arr<\/span><span class=\"p\">[<\/span><span class=\"n\">i<\/span><span class=\"p\">]);<\/span>\n<span class=\"w\">    <\/span><span class=\"n\">printf<\/span><span class=\"p\">(<\/span><span class=\"s\">\"<\/span><span class=\"se\">\\n<\/span><span class=\"s\">\"<\/span><span class=\"p\">);<\/span>\n<span class=\"w\">    <\/span><span class=\"k\">return<\/span><span class=\"w\"> <\/span><span class=\"mi\">0<\/span><span class=\"p\">;<\/span>\n<span class=\"p\">}<\/span>\n<\/code><\/pre><\/div>\n\n<hr />\n<h2 id=\"lab4-5\">5. 上機考實作步驟<\/h2>\n<h3 id=\"lab4-exercise-1static-library\">Exercise 1：Static library<\/h3>\n<div class=\"hl\"><pre><span><\/span><code>mkdir<span class=\"w\"> <\/span>-p<span class=\"w\"> <\/span>~/lab4/exercise<span class=\"w\"> <\/span><span class=\"o\">&amp;&amp;<\/span><span class=\"w\"> <\/span><span class=\"nb\">cd<\/span><span class=\"w\"> <\/span>~/lab4/exercise\nvim<span class=\"w\"> <\/span>exlib.h<span class=\"w\">          <\/span><span class=\"c1\"># int *sort(int *arr);<\/span>\nvim<span class=\"w\"> <\/span>sort.c\nvim<span class=\"w\"> <\/span>exercise.c\n\ngcc<span class=\"w\"> <\/span>-c<span class=\"w\"> <\/span>sort.c<span class=\"w\">                         <\/span><span class=\"c1\"># → sort.o<\/span>\nar<span class=\"w\"> <\/span>rcs<span class=\"w\"> <\/span>exlib.a<span class=\"w\"> <\/span>sort.o<span class=\"w\">                 <\/span><span class=\"c1\"># 把 sort.o 加入 exlib.a<\/span>\ngcc<span class=\"w\"> <\/span>exercise.c<span class=\"w\"> <\/span>-L.<span class=\"w\"> <\/span>exlib.a<span class=\"w\"> <\/span>-o<span class=\"w\"> <\/span>exercise1\n./exercise1\n<\/code><\/pre><\/div>\n\n<h3 id=\"lab4-exercise-2shared-library\">Exercise 2：Shared library<\/h3>\n<div class=\"hl\"><pre><span><\/span><code>gcc<span class=\"w\"> <\/span>-c<span class=\"w\"> <\/span>-fPIC<span class=\"w\"> <\/span>sort.c<span class=\"w\">                   <\/span><span class=\"c1\"># 重新以 -fPIC 編譯<\/span>\ngcc<span class=\"w\"> <\/span>sort.o<span class=\"w\"> <\/span>-shared<span class=\"w\"> <\/span>-o<span class=\"w\"> <\/span>exlib.so\ngcc<span class=\"w\"> <\/span>exercise.c<span class=\"w\"> <\/span>-L.<span class=\"w\"> <\/span>exlib.so<span class=\"w\"> <\/span>-o<span class=\"w\"> <\/span>exercise2\n./exercise2<span class=\"w\">                           <\/span><span class=\"c1\"># 若出現 cannot open shared object file ↓<\/span>\nsudo<span class=\"w\"> <\/span>cp<span class=\"w\"> <\/span>exlib.so<span class=\"w\"> <\/span>/lib/exlib.so\n./exercise2\nldd<span class=\"w\"> <\/span>exercise2<span class=\"w\">                         <\/span><span class=\"c1\"># 確認 exlib.so =&gt; /lib/exlib.so<\/span>\nls<span class=\"w\"> <\/span>-l<span class=\"w\">                                 <\/span><span class=\"c1\"># 比較 exercise1 與 exercise2 大小<\/span>\n<\/code><\/pre><\/div>\n\n<h3 id=\"lab4-static-adynamic-so\">驗證 static 不需要 .a、dynamic 需要 .so（補充實驗）<\/h3>\n<div class=\"hl\"><pre><span><\/span><code>mv<span class=\"w\"> <\/span>exlib.a<span class=\"w\"> <\/span>/tmp/<span class=\"w\"> <\/span><span class=\"o\">&amp;&amp;<\/span><span class=\"w\"> <\/span>./exercise1<span class=\"w\">       <\/span><span class=\"c1\"># 仍可執行<\/span>\nsudo<span class=\"w\"> <\/span>mv<span class=\"w\"> <\/span>/lib/exlib.so<span class=\"w\"> <\/span>/tmp/<span class=\"w\"> <\/span><span class=\"o\">&amp;&amp;<\/span><span class=\"w\"> <\/span>./exercise2<span class=\"w\">   <\/span><span class=\"c1\"># 執行失敗<\/span>\nsudo<span class=\"w\"> <\/span>mv<span class=\"w\"> <\/span>/tmp/exlib.so<span class=\"w\"> <\/span>/lib/<span class=\"w\">           <\/span><span class=\"c1\"># 還原<\/span>\n<\/code><\/pre><\/div>\n\n<hr />\n<h2 id=\"lab4-6\">6. 常見錯誤與陷阱<\/h2>\n<ol>\n<li><strong>做 .so 時沒加 <code>-fPIC<\/code><\/strong>：在 x86-64 上連結 <code>-shared<\/code> 會報 <code>relocation ... can not be used when making a shared object; recompile with -fPIC<\/code>。注意 Exercise 1 的 <code>sort.o<\/code> 沒用 <code>-fPIC<\/code>，Exercise 2 要<strong>重新編譯<\/strong>。<\/li>\n<li><strong>執行時找不到 .so<\/strong>：<code>error while loading shared libraries<\/code>。解法：複製到 <code>/lib<\/code>（投影片做法），或 <code>LD_LIBRARY_PATH=.<\/code>（補充）。<\/li>\n<li>以為 <code>-L.<\/code> 會影響執行時期搜尋 → 不會，<code>-L<\/code> 只影響<strong>連結時期<\/strong>。<\/li>\n<li><code>ar rc<\/code> 忘了 <code>s<\/code> → 可能沒有符號索引。<\/li>\n<li><code>ar<\/code> 的參數順序：<strong>先放 archive 名稱，再放 .o<\/strong>：<code>ar rcs exlib.a sort.o<\/code>。<\/li>\n<li><code>-lexlib<\/code> 要求檔名是 <code>libexlib.a/.so<\/code>；投影片是直接寫檔名 <code>exlib.a<\/code>，兩種寫法不要混。<\/li>\n<li>更新 static library 後忘了重新連結程式 → 執行檔仍是舊程式碼。<\/li>\n<li>沒 <code>#include \"exlib.h\"<\/code> → implicit declaration 警告（C99 後是錯誤）。<\/li>\n<li><code>srand()<\/code> 放在迴圈裡或沒呼叫 → 每次跑出一樣的數字。<\/li>\n<\/ol>\n<hr />\n<h2 id=\"lab4-7\">7. 筆試模擬題<\/h2>\n<p><strong>Q1（選擇）<\/strong> 關於 static library，何者錯誤？\n(A) 副檔名常為 .a　(B) 在連結時期複製進執行檔　(C) 更新 library 後不需重新編譯程式　(D) 執行檔不需要 .a 就能執行<\/p>\n<blockquote>\n<p><strong>答：C<\/strong>。static library 更新後必須重新連結程式。<\/p>\n<\/blockquote>\n<p><strong>Q2（選擇）<\/strong> <code>gcc -c -fPIC add.c<\/code> 中 <code>-fPIC<\/code> 的意義？\n(A) 產生執行檔　(B) 產生位置無關碼　(C) 開啟最佳化　(D) 連結 pthread<\/p>\n<blockquote>\n<p><strong>答：B<\/strong>。shared library 會被載入不同位址，需要 position-independent code。<\/p>\n<\/blockquote>\n<p><strong>Q3（簡答）<\/strong> <code>ar rcs lib.a add.o sub.o<\/code> 中 r、c、s 各代表什麼？<\/p>\n<blockquote>\n<p><strong>答：<\/strong> r：取代或新增檔案到 archive；c：archive 不存在就建立且不警告；s：建立符號索引（等同 ranlib）。<\/p>\n<\/blockquote>\n<p><strong>Q4（情境）<\/strong> 執行 <code>./example_dynamic<\/code> 出現 <code>cannot open shared object file: No such file or directory<\/code>，但編譯時成功，為什麼？如何解決？<\/p>\n<blockquote>\n<p><strong>答：<\/strong> 編譯時 <code>-L.<\/code> 只讓 linker 找到 lib.so；執行時的 dynamic linker 只搜尋系統路徑（如 /lib、/usr/lib），找不到目前目錄的 lib.so。解法：<code>sudo cp lib.so /lib/<\/code>（或設定 LD_LIBRARY_PATH）。<\/p>\n<\/blockquote>\n<p><strong>Q5（選擇）<\/strong> 想知道一個執行檔用到哪些 shared library，應用？\n(A) <code>ar t<\/code>　(B) <code>ldd<\/code>　(C) <code>nm<\/code>　(D) <code>strace -c<\/code><\/p>\n<blockquote>\n<p><strong>答：B<\/strong>。<\/p>\n<\/blockquote>\n<p><strong>Q6（是非）<\/strong> 多個程式使用同一個 shared library 時，記憶體中可只載入一份程式碼。<\/p>\n<blockquote>\n<p><strong>答：對<\/strong>。這是 shared library 省記憶體的原因。<\/p>\n<\/blockquote>\n<p><strong>Q7（是非）<\/strong> shared library 的執行效率通常比 static library 高。<\/p>\n<blockquote>\n<p><strong>答：錯<\/strong>。static 較快（少一層間接呼叫）；shared 需動態載入。<\/p>\n<\/blockquote>\n<p><strong>Q8（輸出預測）<\/strong> 投影片 main.c 中 <code>add(5)<\/code>、<code>sub(5)<\/code> 的輸出？<\/p>\n<blockquote>\n<p><strong>答：<\/strong> <code>After add, n1 = 6<\/code>、<code>After sub, n2 = 4<\/code>。<\/p>\n<\/blockquote>\n<p><strong>Q9（排序題）<\/strong> 將建立並使用 shared library 的指令依序排列：\n① <code>gcc main.c -L. lib.so -o app<\/code>　② <code>gcc add.o sub.o -shared -o lib.so<\/code>　③ <code>gcc -c -fPIC add.c sub.c<\/code>　④ <code>sudo cp lib.so /lib/<\/code>　⑤ <code>./app<\/code><\/p>\n<blockquote>\n<p><strong>答：<\/strong> ③ → ② → ① → ④ → ⑤（④ 只要在 ⑤ 之前即可）。<\/p>\n<\/blockquote>\n<p><strong>Q10（簡答）<\/strong> 列出 dynamic library 的一個優點與一個缺點。<\/p>\n<blockquote>\n<p><strong>答：<\/strong> 優點：省硬碟與記憶體、更新 library 只需替換 .so。缺點：不同程式需要不同版本時有相依性問題；執行時需載入，稍慢；執行環境必須有該 .so。<\/p>\n<\/blockquote>\n<p><strong>Q11（選擇）<\/strong> 刪除 <code>lib.a<\/code> 後執行 <code>./example_static<\/code> 會？\n(A) 正常執行　(B) 找不到 library 錯誤　(C) Segmentation fault　(D) 需重新編譯才能執行<\/p>\n<blockquote>\n<p><strong>答：A<\/strong>。程式碼已在連結時複製進執行檔。<\/p>\n<\/blockquote>\n<p><strong>Q12（簡答）<\/strong> 為何 Exercise 2 的 sort.c 需要重新編譯，不能沿用 Exercise 1 的 sort.o？<\/p>\n<blockquote>\n<p><strong>答：<\/strong> Exercise 1 的 sort.o 沒有使用 <code>-fPIC<\/code>，不是位置無關碼，無法用 <code>-shared<\/code> 包成 .so（x86-64 上會報 relocation 錯誤）。<\/p>\n<\/blockquote>", "toc": [{"id": "lab4-1-lab", "name": "1. 這個 LAB 在學什麼", "kids": []}, {"id": "lab4-2", "name": "2. 核心觀念", "kids": [{"id": "lab4-21-library", "name": "2.1 Library 是什麼"}, {"id": "lab4-22-static-vs-dynamic", "name": "2.2 Static vs Dynamic（必考比較表）"}, {"id": "lab4-23", "name": "2.3 建置流程"}, {"id": "lab4-24", "name": "2.4 重要名詞"}]}, {"id": "lab4-3", "name": "3. 指令速查表", "kids": []}, {"id": "lab4-4", "name": "4. 程式範例逐行解說", "kids": [{"id": "lab4-41-mainc-addc-subc-libh", "name": "4.1 投影片範例：main.c / add.c / sub.c / lib.h"}, {"id": "lab4-42-static", "name": "4.2 Static 流程實錄"}, {"id": "lab4-43-dynamic", "name": "4.3 Dynamic 流程實錄（含錯誤）"}, {"id": "lab4-44-practicelab4", "name": "4.4 學生作業 practice/lab4"}]}, {"id": "lab4-5", "name": "5. 上機考實作步驟", "kids": [{"id": "lab4-exercise-1static-library", "name": "Exercise 1：Static library"}, {"id": "lab4-exercise-2shared-library", "name": "Exercise 2：Shared library"}, {"id": "lab4-static-adynamic-so", "name": "驗證 static 不需要 .a、dynamic 需要 .so（補充實驗）"}]}, {"id": "lab4-6", "name": "6. 常見錯誤與陷阱", "kids": []}, {"id": "lab4-7", "name": "7. 筆試模擬題", "kids": []}]}, {"id": "lab5", "short": "Lab 5", "title": "Lab 5 複習：Kernel Module", "html": "<h1 id=\"lab5-lab-5-kernel-module\">Lab 5 複習：Kernel Module<\/h1>\n<blockquote>\n<p>來源：Lab5.pptx（36 張投影片，含講者備註）＋ practice/lab5/（d2ts.c、myage.c、Makefile）\n註：投影片中的資料夾名稱寫 <code>lab3/...<\/code>（沿用舊版），內容就是本 Lab 的 kernel module。<\/p>\n<\/blockquote>\n<hr />\n<h2 id=\"lab5-1-lab\">1. 這個 LAB 在學什麼<\/h2>\n<p>寫可以在<strong>執行中的 kernel 動態載入／卸載<\/strong>的程式——<strong>Loadable Kernel Module（.ko）<\/strong>。學會 module 的基本結構（<code>init_module<\/code> / <code>cleanup_module<\/code>、<code>printk<\/code>、<code>MODULE_LICENSE<\/code>）、用 <code>obj-m<\/code> 的 Makefile 編譯、<code>insmod / lsmod / modinfo / dmesg / rmmod<\/code> 操作；用 <code>module_param<\/code> 從 <code>insmod<\/code> 傳參數；用 <code>EXPORT_SYMBOL<\/code> 讓一個 module 的變數／函式給另一個 module 用（載入／卸載順序有相依性）。Exercise：<code>date2timestamp<\/code> + <code>myage<\/code> 兩個 module 算出你活了幾年幾天。<\/p>\n<hr />\n<h2 id=\"lab5-2\">2. 核心觀念<\/h2>\n<h3 id=\"lab5-21-package-vs-kernel-module\">2.1 Package vs Kernel module<\/h3>\n<table>\n<thead>\n<tr>\n<th><\/th>\n<th>Package（如 apt、gcc、make）<\/th>\n<th>Kernel module<\/th>\n<\/tr>\n<\/thead>\n<tbody>\n<tr>\n<td>執行位置<\/td>\n<td><strong>user space<\/strong><\/td>\n<td><strong>kernel space<\/strong><\/td>\n<\/tr>\n<tr>\n<td>如何用系統資源<\/td>\n<td>呼叫 system call<\/td>\n<td>本身就在 kernel 裡，直接用 kernel 函式<\/td>\n<\/tr>\n<tr>\n<td>載入方式<\/td>\n<td>執行程式<\/td>\n<td><code>insmod<\/code> 動態載入到執行中的 kernel<\/td>\n<\/tr>\n<tr>\n<td>典型例子<\/td>\n<td>應用程式<\/td>\n<td><strong>驅動程式（driver）<\/strong>、檔案系統<\/td>\n<\/tr>\n<\/tbody>\n<\/table>\n<h3 id=\"lab5-22-kernel-module-vs-user-program\">2.2 Kernel module vs User program（補充整理，常考）<\/h3>\n<table>\n<thead>\n<tr>\n<th><\/th>\n<th>User program<\/th>\n<th>Kernel module<\/th>\n<\/tr>\n<\/thead>\n<tbody>\n<tr>\n<td>進入點<\/td>\n<td><code>main()<\/code><\/td>\n<td><code>init_module()<\/code>（載入時）／<code>cleanup_module()<\/code>（卸載時）<\/td>\n<\/tr>\n<tr>\n<td>執行方式<\/td>\n<td>從頭跑到尾結束<\/td>\n<td>載入後常駐 kernel，被動等待被呼叫，直到 <code>rmmod<\/code><\/td>\n<\/tr>\n<tr>\n<td>輸出<\/td>\n<td><code>printf<\/code> → terminal<\/td>\n<td><code>printk<\/code> → kernel log（<code>dmesg<\/code> 看）<\/td>\n<\/tr>\n<tr>\n<td>可用函式庫<\/td>\n<td>libc（stdio.h…）<\/td>\n<td>只能用 kernel 提供的函式（<code>&lt;linux/...&gt;<\/code>）<\/td>\n<\/tr>\n<tr>\n<td>出錯後果<\/td>\n<td>該 process 死掉<\/td>\n<td>可能讓<strong>整個系統<\/strong>當掉（kernel panic／oops）<\/td>\n<\/tr>\n<tr>\n<td>權限<\/td>\n<td>user mode<\/td>\n<td>kernel mode（最高權限），需要 sudo 才能載入<\/td>\n<\/tr>\n<\/tbody>\n<\/table>\n<h3 id=\"lab5-23-module-vs-lab2-syscallobj-m-vs-obj-y\">2.3 Module vs Lab2 的 syscall（<code>obj-m<\/code> vs <code>obj-y<\/code>）<\/h3>\n<ul>\n<li>Lab2：<code>obj-y<\/code> → 編進 kernel 映像，要<strong>重編整個 kernel + reboot<\/strong>。<\/li>\n<li>Lab5：<code>obj-m<\/code> → 編成 <code>.ko<\/code>，<strong>不用重編 kernel、不用重開機<\/strong>，<code>insmod<\/code> 就載入，<code>rmmod<\/code> 就移除。保持 kernel 精簡、彈性。<\/li>\n<\/ul>\n<h3 id=\"lab5-24-module\">2.4 Module 基本元素<\/h3>\n<ul>\n<li><code>#include &lt;linux/module.h&gt;<\/code>：所有 module 都需要。<\/li>\n<li><code>int init_module(void)<\/code>：<code>insmod<\/code> 時執行。<strong>回傳 0 = 成功；回傳非 0（負的錯誤碼）= 失敗，module 不會被載入。<\/strong><\/li>\n<li><code>void cleanup_module(void)<\/code>：<code>rmmod<\/code> 時執行。<\/li>\n<li><code>printk(KERN_INFO \"...\")<\/code>：<code>KERN_INFO<\/code> 是 log 等級（一般資訊）；還有 <code>KERN_ERR<\/code>（錯誤）、<code>KERN_WARNING<\/code>（警告）等。注意 <code>KERN_INFO<\/code> 和字串之間<strong>沒有逗號<\/strong>。<\/li>\n<li><code>MODULE_LICENSE(\"GPL\")<\/code>：宣告授權，表示原始碼開放、須遵守 GPL。（補充：沒寫會讓 kernel 被標為 tainted，且無法使用只 export 給 GPL 的符號。）<\/li>\n<li><code>MODULE_AUTHOR<\/code>、<code>MODULE_DESCRIPTION<\/code>：資訊，會出現在 <code>modinfo<\/code>。<\/li>\n<\/ul>\n<h3 id=\"lab5-25-module-parameters\">2.5 Module Parameters<\/h3>\n<ul>\n<li><code>module_param(name, type, perm)<\/code>：宣告參數；name=變數名、type=型別（如 <code>int<\/code>）、perm 本課設 0。<\/li>\n<li><code>MODULE_PARM_DESC(name, desc)<\/code>：參數說明，會顯示在 <code>modinfo<\/code> 的 <code>parm:<\/code> 欄位。<\/li>\n<li>使用：<code>sudo insmod hello_module_2.ko year=2024 month=8 date=1<\/code>。<\/li>\n<li><strong>陷阱（備註）<\/strong>：輸入 <code>month=08<\/code> 這種前導 0 的寫法會被當成<strong>八進位<\/strong>；<code>01<\/code>~<code>07<\/code> 剛好正常，<code>08<\/code>、<code>09<\/code> 不是合法八進位 → <code>invalid param<\/code>。<\/li>\n<\/ul>\n<h3 id=\"lab5-26-symbols-export_symbol\">2.6 Symbols 與 EXPORT_SYMBOL<\/h3>\n<ul>\n<li>module 中宣告的全域變數、函式都是 <strong>symbol<\/strong>（<code>int year = 2023;<\/code> → variable symbol；<code>void doSomething(){}<\/code> → function symbol）。<\/li>\n<li><code>EXPORT_SYMBOL(symbol_name)<\/code>：把 symbol 匯出到 kernel 符號表，<strong>其他 module<\/strong> 才能用 <code>extern<\/code> 宣告後使用。<\/li>\n<li><strong>相依順序<\/strong>：B 用了 A 的 symbol →<\/li>\n<li>載入：<strong>先 insmod A，再 insmod B<\/strong>（否則 B 會 <code>Unknown symbol<\/code>）。<\/li>\n<li>卸載：<strong>先 rmmod B，再 rmmod A<\/strong>（A 的 <code>Used by<\/code> 計數不為 0 時無法移除，會顯示 <code>Module symbol_A is in use by: symbol_B<\/code>）。<\/li>\n<li><code>lsmod<\/code> 的 <code>Used by<\/code> 欄位會顯示 <code>symbol_A ... 1 symbol_B<\/code>。<\/li>\n<\/ul>\n<h3 id=\"lab5-27\">2.7 其他<\/h3>\n<ul>\n<li><code>cat /proc/modules<\/code>：列出已載入的 module；<code>lsmod<\/code> 其實就是解析這個檔案再輸出。<\/li>\n<li><code>.ko<\/code> = Kernel Object，可在執行時載入而不必重編 kernel、重開機。<\/li>\n<li>apt 其他功能（備註）：<code>update<\/code>、<code>upgrade<\/code>、<code>remove<\/code>（保留設定檔）、<code>purge<\/code>（連設定檔刪）、<code>autoremove<\/code>、<code>search<\/code>、<code>show<\/code>、<code>list --installed<\/code>。<\/li>\n<li>數已安裝套件：<code>cat /var/lib/dpkg/status | grep Package: &gt; ~/Desktop/packages<\/code>，再 <code>wc -l<\/code>（<code>|<\/code> 是 pipe，<code>&gt;<\/code> 是重新導向到檔案）。<\/li>\n<\/ul>\n<hr />\n<h2 id=\"lab5-3-api\">3. 指令／API 速查表<\/h2>\n<table>\n<thead>\n<tr>\n<th>名稱<\/th>\n<th>用途<\/th>\n<th>重要參數／說明<\/th>\n<th>範例<\/th>\n<\/tr>\n<\/thead>\n<tbody>\n<tr>\n<td><code>make<\/code><\/td>\n<td>依 Makefile 編譯出 <code>.ko<\/code><\/td>\n<td>呼叫 kernel build 系統<\/td>\n<td><code>make<\/code><\/td>\n<\/tr>\n<tr>\n<td><code>make clean<\/code><\/td>\n<td>清除編譯產物<\/td>\n<td>—<\/td>\n<td><code>make clean<\/code><\/td>\n<\/tr>\n<tr>\n<td><code>modinfo x.ko<\/code><\/td>\n<td>看 module 資訊<\/td>\n<td>license、author、description、parm<\/td>\n<td><code>modinfo hello_module.ko<\/code><\/td>\n<\/tr>\n<tr>\n<td><code>sudo insmod x.ko [參數=值]<\/code><\/td>\n<td>載入 module<\/td>\n<td><strong>要加 <code>.ko<\/code><\/strong><\/td>\n<td><code>sudo insmod hello_module_2.ko year=2024 month=8 date=1<\/code><\/td>\n<\/tr>\n<tr>\n<td><code>lsmod<\/code><\/td>\n<td>列出已載入 module<\/td>\n<td>Size、Used by<\/td>\n<td><code>lsmod \\| head -3<\/code><\/td>\n<\/tr>\n<tr>\n<td><code>cat /proc/modules<\/code><\/td>\n<td>同上（原始資料）<\/td>\n<td>—<\/td>\n<td>—<\/td>\n<\/tr>\n<tr>\n<td><code>sudo dmesg \\| tail<\/code><\/td>\n<td>看 kernel 訊息（最後 10 行）<\/td>\n<td><code>tail -2<\/code> 看最後 2 行<\/td>\n<td><code>sudo dmesg \\| tail -3<\/code><\/td>\n<\/tr>\n<tr>\n<td><code>sudo rmmod name<\/code><\/td>\n<td>卸載 module<\/td>\n<td><strong>不加 <code>.ko<\/code><\/strong><\/td>\n<td><code>sudo rmmod hello_module<\/code><\/td>\n<\/tr>\n<tr>\n<td><code>printk(KERN_INFO \"fmt\", ...)<\/code><\/td>\n<td>印到 kernel log<\/td>\n<td><code>KERN_ERR<\/code>、<code>KERN_WARNING<\/code><\/td>\n<td><code>printk(KERN_INFO \"ts=%lld\\n\", ts);<\/code><\/td>\n<\/tr>\n<tr>\n<td><code>module_param(name, type, 0)<\/code><\/td>\n<td>宣告參數<\/td>\n<td>—<\/td>\n<td><code>module_param(year, int, 0);<\/code><\/td>\n<\/tr>\n<tr>\n<td><code>MODULE_PARM_DESC(name, \"desc\")<\/code><\/td>\n<td>參數說明<\/td>\n<td>顯示於 modinfo<\/td>\n<td><code>MODULE_PARM_DESC(year, \"year of time\");<\/code><\/td>\n<\/tr>\n<tr>\n<td><code>EXPORT_SYMBOL(sym)<\/code><\/td>\n<td>匯出符號<\/td>\n<td>另一 module 用 <code>extern<\/code><\/td>\n<td><code>EXPORT_SYMBOL(ts);<\/code><\/td>\n<\/tr>\n<tr>\n<td><code>time64_t mktime64(year, mon, day, hour, min, sec)<\/code><\/td>\n<td>日期轉 Unix timestamp（秒）<\/td>\n<td><code>#include &lt;linux/time64.h&gt;<\/code>；mon 1~12<\/td>\n<td><code>mktime64(2001, 8, 1, 0, 0, 0)<\/code><\/td>\n<\/tr>\n<tr>\n<td><code>ktime_get_real_seconds()<\/code><\/td>\n<td>取得目前 Unix time（秒）<\/td>\n<td><code>#include &lt;linux/timekeeping.h&gt;<\/code>（補充：投影片沒指定用哪個函式）<\/td>\n<td><code>time64_t now = ktime_get_real_seconds();<\/code><\/td>\n<\/tr>\n<tr>\n<td><code>return -EINVAL;<\/code><\/td>\n<td>init 失敗中止載入<\/td>\n<td>insmod 顯示 <code>Invalid parameters<\/code><\/td>\n<td>—<\/td>\n<\/tr>\n<\/tbody>\n<\/table>\n<hr />\n<h2 id=\"lab5-4\">4. 程式範例逐行解說<\/h2>\n<h3 id=\"lab5-41-hello_modulec\">4.1 hello_module.c<\/h3>\n<div class=\"hl\"><pre><span><\/span><code><span class=\"cp\">#include<\/span><span class=\"w\"> <\/span><span class=\"cpf\">&lt;linux/module.h&gt;<\/span><span class=\"w\">   <\/span><span class=\"c1\">// needed by all modules<\/span>\n\n<span class=\"kt\">int<\/span><span class=\"w\"> <\/span><span class=\"nf\">init_module<\/span><span class=\"p\">(<\/span><span class=\"kt\">void<\/span><span class=\"p\">)<\/span><span class=\"w\"> <\/span><span class=\"p\">{<\/span>\n<span class=\"w\">    <\/span><span class=\"n\">printk<\/span><span class=\"p\">(<\/span><span class=\"n\">KERN_INFO<\/span><span class=\"w\"> <\/span><span class=\"s\">\"Hello module insert successfully!<\/span><span class=\"se\">\\n<\/span><span class=\"s\">\"<\/span><span class=\"p\">);<\/span>\n<span class=\"w\">    <\/span><span class=\"k\">return<\/span><span class=\"w\"> <\/span><span class=\"mi\">0<\/span><span class=\"p\">;<\/span><span class=\"w\">               <\/span><span class=\"c1\">// 非 0 代表 init 失敗，module 無法載入<\/span>\n<span class=\"p\">}<\/span>\n\n<span class=\"kt\">void<\/span><span class=\"w\"> <\/span><span class=\"nf\">cleanup_module<\/span><span class=\"p\">(<\/span><span class=\"kt\">void<\/span><span class=\"p\">)<\/span><span class=\"w\"> <\/span><span class=\"p\">{<\/span>\n<span class=\"w\">    <\/span><span class=\"n\">printk<\/span><span class=\"p\">(<\/span><span class=\"n\">KERN_INFO<\/span><span class=\"w\"> <\/span><span class=\"s\">\"Hello module remove successfully!<\/span><span class=\"se\">\\n<\/span><span class=\"s\">\"<\/span><span class=\"p\">);<\/span>\n<span class=\"p\">}<\/span>\n\n<span class=\"n\">MODULE_LICENSE<\/span><span class=\"p\">(<\/span><span class=\"s\">\"GPL\"<\/span><span class=\"p\">);<\/span>\n<span class=\"n\">MODULE_AUTHOR<\/span><span class=\"p\">(<\/span><span class=\"s\">\"William\"<\/span><span class=\"p\">);<\/span>\n<span class=\"n\">MODULE_DESCRIPTION<\/span><span class=\"p\">(<\/span><span class=\"s\">\"OSlab3: hello_module\"<\/span><span class=\"p\">);<\/span>\n<\/code><\/pre><\/div>\n\n<ul>\n<li><code>insmod<\/code> → dmesg 出現 <code>Hello module insert successfully!<\/code><\/li>\n<li><code>rmmod<\/code> → dmesg 出現 <code>Hello module remove successfully!<\/code><\/li>\n<\/ul>\n<h3 id=\"lab5-42-makefilemodule\">4.2 Makefile（module 用）<\/h3>\n<div class=\"hl\"><pre><span><\/span><code><span class=\"nv\">obj-m<\/span><span class=\"w\"> <\/span><span class=\"o\">+=<\/span><span class=\"w\"> <\/span>hello_module.o\n\n<span class=\"nf\">all<\/span><span class=\"o\">:<\/span>\n<span class=\"w\">    <\/span>make<span class=\"w\"> <\/span>-C<span class=\"w\"> <\/span>/lib/modules/<span class=\"k\">$(<\/span>shell<span class=\"w\"> <\/span>uname<span class=\"w\"> <\/span>-r<span class=\"k\">)<\/span>/build<span class=\"w\"> <\/span><span class=\"nv\">M<\/span><span class=\"o\">=<\/span><span class=\"k\">$(<\/span>PWD<span class=\"k\">)<\/span><span class=\"w\"> <\/span>modules\n<span class=\"nf\">clean<\/span><span class=\"o\">:<\/span>\n<span class=\"w\">    <\/span>make<span class=\"w\"> <\/span>-C<span class=\"w\"> <\/span>/lib/modules/<span class=\"k\">$(<\/span>shell<span class=\"w\"> <\/span>uname<span class=\"w\"> <\/span>-r<span class=\"k\">)<\/span>/build<span class=\"w\"> <\/span><span class=\"nv\">M<\/span><span class=\"o\">=<\/span><span class=\"k\">$(<\/span>PWD<span class=\"k\">)<\/span><span class=\"w\"> <\/span>clean\n<\/code><\/pre><\/div>\n\n<ul>\n<li><code>obj-m += hello_module.o<\/code>：要編成 module 的目標，<strong>名稱要和 .c 檔名相符<\/strong>。<\/li>\n<li><code>-C /lib/modules/$(uname -r)/build<\/code>：切換到<strong>目前執行中 kernel<\/strong> 的 build 目錄（kernel headers），用它的 build 系統。<\/li>\n<li><code>M=$(PWD)<\/code>：module 原始碼在目前目錄。<\/li>\n<li><code>modules<\/code>：編譯 module；<code>clean<\/code>：清除。<\/li>\n<li>指令前<strong>必須是 TAB<\/strong>。<\/li>\n<\/ul>\n<h3 id=\"lab5-43-hello_module_2cmodule-parameter\">4.3 hello_module_2.c（module parameter）<\/h3>\n<div class=\"hl\"><pre><span><\/span><code><span class=\"cp\">#include<\/span><span class=\"w\"> <\/span><span class=\"cpf\">&lt;linux/module.h&gt;<\/span>\n<span class=\"kt\">int<\/span><span class=\"w\"> <\/span><span class=\"n\">date<\/span><span class=\"w\"> <\/span><span class=\"o\">=<\/span><span class=\"w\"> <\/span><span class=\"mi\">1<\/span><span class=\"p\">,<\/span><span class=\"w\"> <\/span><span class=\"n\">month<\/span><span class=\"w\"> <\/span><span class=\"o\">=<\/span><span class=\"w\"> <\/span><span class=\"mi\">1<\/span><span class=\"p\">,<\/span><span class=\"w\"> <\/span><span class=\"n\">year<\/span><span class=\"w\"> <\/span><span class=\"o\">=<\/span><span class=\"w\"> <\/span><span class=\"mi\">2000<\/span><span class=\"p\">;<\/span><span class=\"w\">        <\/span><span class=\"c1\">// 預設值<\/span>\n<span class=\"n\">module_param<\/span><span class=\"p\">(<\/span><span class=\"n\">date<\/span><span class=\"p\">,<\/span><span class=\"w\"> <\/span><span class=\"kt\">int<\/span><span class=\"p\">,<\/span><span class=\"w\"> <\/span><span class=\"mi\">0<\/span><span class=\"p\">);<\/span>\n<span class=\"n\">MODULE_PARM_DESC<\/span><span class=\"p\">(<\/span><span class=\"n\">date<\/span><span class=\"p\">,<\/span><span class=\"w\"> <\/span><span class=\"s\">\"date of time\"<\/span><span class=\"p\">);<\/span>\n<span class=\"n\">module_param<\/span><span class=\"p\">(<\/span><span class=\"n\">month<\/span><span class=\"p\">,<\/span><span class=\"w\"> <\/span><span class=\"kt\">int<\/span><span class=\"p\">,<\/span><span class=\"w\"> <\/span><span class=\"mi\">0<\/span><span class=\"p\">);<\/span>\n<span class=\"n\">MODULE_PARM_DESC<\/span><span class=\"p\">(<\/span><span class=\"n\">month<\/span><span class=\"p\">,<\/span><span class=\"w\"> <\/span><span class=\"s\">\"month of time\"<\/span><span class=\"p\">);<\/span>\n<span class=\"n\">module_param<\/span><span class=\"p\">(<\/span><span class=\"n\">year<\/span><span class=\"p\">,<\/span><span class=\"w\"> <\/span><span class=\"kt\">int<\/span><span class=\"p\">,<\/span><span class=\"w\"> <\/span><span class=\"mi\">0<\/span><span class=\"p\">);<\/span>\n<span class=\"n\">MODULE_PARM_DESC<\/span><span class=\"p\">(<\/span><span class=\"n\">year<\/span><span class=\"p\">,<\/span><span class=\"w\"> <\/span><span class=\"s\">\"year of time\"<\/span><span class=\"p\">);<\/span>\n\n<span class=\"kt\">int<\/span><span class=\"w\"> <\/span><span class=\"nf\">init_module<\/span><span class=\"p\">(<\/span><span class=\"kt\">void<\/span><span class=\"p\">)<\/span><span class=\"w\"> <\/span><span class=\"p\">{<\/span>\n<span class=\"w\">    <\/span><span class=\"n\">printk<\/span><span class=\"p\">(<\/span><span class=\"n\">KERN_INFO<\/span><span class=\"w\"> <\/span><span class=\"s\">\"Hello module 2 insert successfully!<\/span><span class=\"se\">\\n<\/span><span class=\"s\">\"<\/span><span class=\"p\">);<\/span>\n<span class=\"w\">    <\/span><span class=\"n\">printk<\/span><span class=\"p\">(<\/span><span class=\"n\">KERN_INFO<\/span><span class=\"w\"> <\/span><span class=\"s\">\"Today is %d/%d/%d.<\/span><span class=\"se\">\\n<\/span><span class=\"s\">\"<\/span><span class=\"p\">,<\/span><span class=\"w\"> <\/span><span class=\"n\">year<\/span><span class=\"p\">,<\/span><span class=\"w\"> <\/span><span class=\"n\">month<\/span><span class=\"p\">,<\/span><span class=\"w\"> <\/span><span class=\"n\">date<\/span><span class=\"p\">);<\/span>\n<span class=\"w\">    <\/span><span class=\"k\">return<\/span><span class=\"w\"> <\/span><span class=\"mi\">0<\/span><span class=\"p\">;<\/span>\n<span class=\"p\">}<\/span>\n<span class=\"p\">...<\/span>\n<\/code><\/pre><\/div>\n\n<p><code>sudo insmod hello_module_2.ko year=2024 month=8 date=1<\/code> → dmesg：<\/p>\n<div class=\"hl\"><pre><span><\/span><code>Hello module 2 insert successfully!\nToday is 2024/8/1.\n<\/code><\/pre><\/div>\n\n<p>若不帶參數 → <code>Today is 2000/1/1.<\/code>（用預設值）。\n<code>modinfo hello_module_2.ko<\/code> 會看到 <code>parm: date:date of time (int)<\/code> 等。\n（dmesg 中出現的 <code>disagrees about version of symbol module_layout<\/code> 是版本不一致的警告，示範中仍載入成功。）<\/p>\n<h3 id=\"lab5-44-symbol_ac-symbol_bc\">4.4 symbol_A.c / symbol_B.c<\/h3>\n<div class=\"hl\"><pre><span><\/span><code><span class=\"cm\">/* symbol_A.c */<\/span>\n<span class=\"kt\">int<\/span><span class=\"w\"> <\/span><span class=\"n\">symbol_variable<\/span><span class=\"w\"> <\/span><span class=\"o\">=<\/span><span class=\"w\"> <\/span><span class=\"mi\">99<\/span><span class=\"p\">;<\/span>\n<span class=\"kt\">int<\/span><span class=\"w\"> <\/span><span class=\"nf\">symbol_function<\/span><span class=\"p\">(<\/span><span class=\"kt\">int<\/span><span class=\"w\"> <\/span><span class=\"n\">x<\/span><span class=\"p\">){<\/span>\n<span class=\"w\">    <\/span><span class=\"k\">if<\/span><span class=\"w\"> <\/span><span class=\"p\">(<\/span><span class=\"n\">x<\/span><span class=\"w\"> <\/span><span class=\"o\">&gt;<\/span><span class=\"w\"> <\/span><span class=\"mi\">0<\/span><span class=\"p\">)<\/span><span class=\"w\"> <\/span><span class=\"k\">return<\/span><span class=\"w\"> <\/span><span class=\"mi\">1<\/span><span class=\"p\">;<\/span>\n<span class=\"w\">    <\/span><span class=\"k\">else<\/span><span class=\"w\"> <\/span><span class=\"k\">if<\/span><span class=\"w\"> <\/span><span class=\"p\">(<\/span><span class=\"n\">x<\/span><span class=\"w\"> <\/span><span class=\"o\">==<\/span><span class=\"w\"> <\/span><span class=\"mi\">0<\/span><span class=\"p\">)<\/span><span class=\"w\"> <\/span><span class=\"k\">return<\/span><span class=\"w\"> <\/span><span class=\"mi\">0<\/span><span class=\"p\">;<\/span>\n<span class=\"w\">    <\/span><span class=\"k\">else<\/span><span class=\"w\"> <\/span><span class=\"k\">return<\/span><span class=\"w\"> <\/span><span class=\"mi\">-1<\/span><span class=\"p\">;<\/span>\n<span class=\"p\">}<\/span>\n<span class=\"kt\">int<\/span><span class=\"w\"> <\/span><span class=\"nf\">init_module<\/span><span class=\"p\">(<\/span><span class=\"kt\">void<\/span><span class=\"p\">){<\/span><span class=\"w\"> <\/span><span class=\"n\">printk<\/span><span class=\"p\">(<\/span><span class=\"n\">KERN_INFO<\/span><span class=\"w\"> <\/span><span class=\"s\">\"Symbol A insert successfully!<\/span><span class=\"se\">\\n<\/span><span class=\"s\">\"<\/span><span class=\"p\">);<\/span><span class=\"w\"> <\/span><span class=\"k\">return<\/span><span class=\"w\"> <\/span><span class=\"mi\">0<\/span><span class=\"p\">;<\/span><span class=\"w\"> <\/span><span class=\"p\">}<\/span>\n<span class=\"kt\">void<\/span><span class=\"w\"> <\/span><span class=\"nf\">cleanup_module<\/span><span class=\"p\">(<\/span><span class=\"kt\">void<\/span><span class=\"p\">){<\/span><span class=\"w\"> <\/span><span class=\"n\">printk<\/span><span class=\"p\">(<\/span><span class=\"n\">KERN_INFO<\/span><span class=\"w\"> <\/span><span class=\"s\">\"Symbol A remove successfully!<\/span><span class=\"se\">\\n<\/span><span class=\"s\">\"<\/span><span class=\"p\">);<\/span><span class=\"w\"> <\/span><span class=\"p\">}<\/span>\n<span class=\"n\">EXPORT_SYMBOL<\/span><span class=\"p\">(<\/span><span class=\"n\">symbol_variable<\/span><span class=\"p\">);<\/span>\n<span class=\"n\">EXPORT_SYMBOL<\/span><span class=\"p\">(<\/span><span class=\"n\">symbol_function<\/span><span class=\"p\">);<\/span>\n<span class=\"n\">MODULE_LICENSE<\/span><span class=\"p\">(<\/span><span class=\"s\">\"GPL\"<\/span><span class=\"p\">);<\/span>\n<\/code><\/pre><\/div>\n\n<div class=\"hl\"><pre><span><\/span><code><span class=\"cm\">/* symbol_B.c */<\/span>\n<span class=\"k\">extern<\/span><span class=\"w\"> <\/span><span class=\"kt\">int<\/span><span class=\"w\"> <\/span><span class=\"n\">symbol_variable<\/span><span class=\"p\">;<\/span>\n<span class=\"k\">extern<\/span><span class=\"w\"> <\/span><span class=\"kt\">int<\/span><span class=\"w\"> <\/span><span class=\"nf\">symbol_function<\/span><span class=\"p\">(<\/span><span class=\"kt\">int<\/span><span class=\"p\">);<\/span>\n<span class=\"kt\">int<\/span><span class=\"w\"> <\/span><span class=\"nf\">init_module<\/span><span class=\"p\">(<\/span><span class=\"kt\">void<\/span><span class=\"p\">){<\/span>\n<span class=\"w\">    <\/span><span class=\"n\">printk<\/span><span class=\"p\">(<\/span><span class=\"n\">KERN_INFO<\/span><span class=\"w\"> <\/span><span class=\"s\">\"Symbol B insert successfully!<\/span><span class=\"se\">\\n<\/span><span class=\"s\">\"<\/span><span class=\"p\">);<\/span>\n<span class=\"w\">    <\/span><span class=\"n\">printk<\/span><span class=\"p\">(<\/span><span class=\"n\">KERN_INFO<\/span><span class=\"w\"> <\/span><span class=\"s\">\"Symbol_variable: %d<\/span><span class=\"se\">\\n<\/span><span class=\"s\">\"<\/span><span class=\"p\">,<\/span><span class=\"w\"> <\/span><span class=\"n\">symbol_variable<\/span><span class=\"p\">);<\/span>\n<span class=\"w\">    <\/span><span class=\"n\">printk<\/span><span class=\"p\">(<\/span><span class=\"n\">KERN_INFO<\/span><span class=\"w\"> <\/span><span class=\"s\">\"Symbol_function(100): %d<\/span><span class=\"se\">\\n<\/span><span class=\"s\">\"<\/span><span class=\"p\">,<\/span><span class=\"w\"> <\/span><span class=\"n\">symbol_function<\/span><span class=\"p\">(<\/span><span class=\"mi\">100<\/span><span class=\"p\">));<\/span>\n<span class=\"w\">    <\/span><span class=\"n\">printk<\/span><span class=\"p\">(<\/span><span class=\"n\">KERN_INFO<\/span><span class=\"w\"> <\/span><span class=\"s\">\"Symbol_function(0): %d<\/span><span class=\"se\">\\n<\/span><span class=\"s\">\"<\/span><span class=\"p\">,<\/span><span class=\"w\"> <\/span><span class=\"n\">symbol_function<\/span><span class=\"p\">(<\/span><span class=\"mi\">0<\/span><span class=\"p\">));<\/span>\n<span class=\"w\">    <\/span><span class=\"n\">printk<\/span><span class=\"p\">(<\/span><span class=\"n\">KERN_INFO<\/span><span class=\"w\"> <\/span><span class=\"s\">\"Symbol_function(-100): %d<\/span><span class=\"se\">\\n<\/span><span class=\"s\">\"<\/span><span class=\"p\">,<\/span><span class=\"w\"> <\/span><span class=\"n\">symbol_function<\/span><span class=\"p\">(<\/span><span class=\"mi\">-100<\/span><span class=\"p\">));<\/span>\n<span class=\"w\">    <\/span><span class=\"k\">return<\/span><span class=\"w\"> <\/span><span class=\"mi\">0<\/span><span class=\"p\">;<\/span>\n<span class=\"p\">}<\/span>\n<\/code><\/pre><\/div>\n\n<p>Makefile 同時編兩個：<code>obj-m += symbol_A.o<\/code> 與 <code>obj-m += symbol_B.o<\/code>。\n先 insmod A、再 insmod B，dmesg：<\/p>\n<div class=\"hl\"><pre><span><\/span><code>Symbol A insert successfully!\nSymbol B insert successfully!\nSymbol_variable: 99\nSymbol_function(100): 1\nSymbol_function(0): 0\nSymbol_function(-100): -1\n<\/code><\/pre><\/div>\n\n<p><code>lsmod<\/code> 顯示 <code>symbol_A ... 1 symbol_B<\/code>（被 B 使用）。（投影片的 symbol_B.c 中 <code>MODULE_DESCRIPTION<\/code> 寫成 <code>symbol_A<\/code>，是投影片的小筆誤。）<\/p>\n<h3 id=\"lab5-45-practicelab5d2tscdate2timestamp\">4.5 學生作業 practice/lab5/d2ts.c（date2timestamp）<\/h3>\n<div class=\"hl\"><pre><span><\/span><code><span class=\"kt\">int<\/span><span class=\"w\"> <\/span><span class=\"n\">year<\/span><span class=\"w\"> <\/span><span class=\"o\">=<\/span><span class=\"w\"> <\/span><span class=\"mi\">2000<\/span><span class=\"p\">,<\/span><span class=\"w\"> <\/span><span class=\"n\">month<\/span><span class=\"w\"> <\/span><span class=\"o\">=<\/span><span class=\"w\"> <\/span><span class=\"mi\">1<\/span><span class=\"p\">,<\/span><span class=\"w\"> <\/span><span class=\"n\">date<\/span><span class=\"w\"> <\/span><span class=\"o\">=<\/span><span class=\"w\"> <\/span><span class=\"mi\">1<\/span><span class=\"p\">;<\/span>\n<span class=\"n\">time64_t<\/span><span class=\"w\"> <\/span><span class=\"n\">ts<\/span><span class=\"w\"> <\/span><span class=\"o\">=<\/span><span class=\"w\"> <\/span><span class=\"mi\">0<\/span><span class=\"p\">;<\/span>\n<span class=\"n\">module_param<\/span><span class =\"p\">)<\/span><span class=\"w\"> <\/span><span class=\"n\">days_in_month<\/span><span class=\"p\">[<\/span><span class=\"mi\">1<\/span><span class=\"p\">]<\/span><span class=\"w\"> <\/span><span class=\"o\">=<\/span><span class=\"w\"> <\/span><span class=\"mi\">29<\/span><span class=\"p\">;<\/span><span class=\"w\">     <\/span><span class=\"c1\">// 閏年 2 月 29 天<\/span>\n<span class=\"w\">    <\/span><span class=\"k\">if<\/span><span class=\"w\"> <\/span><span class=\"p\">(<\/span><span class=\"n\">year<\/span><span class=\"w\"> <\/span><span class=\"o\">&lt;<\/span><span class=\"w\"> <\/span><span class=\"mi\">1970<\/span><span class=\"w\"> <\/span><span class=\"o\">||<\/span><span class=\"w\"> <\/span><span class=\"n\">month<\/span><span class=\"w\"> <\/span><span class=\"o\">&lt;<\/span><span class=\"w\"> <\/span><span class=\"mi\">1<\/span><span class=\"w\"> <\/span><span class=\"o\">||<\/span><span class=\"w\"> <\/span><span class=\"n\">month<\/span><span class=\"w\"> <\/span><span class=\"o\">&gt;<\/span><span class=\"w\"> <\/span><span class=\"mi\">12<\/span><span class=\"w\"> <\/span><span class=\"o\">||<\/span>\n<span class=\"w\">        <\/span><span class=\"n\">date<\/span><span class=\"w\"> <\/span><span class=\"o\">&lt;<\/span><span class=\"w\"> <\/span><span class=\"mi\">1<\/span><span class=\"w\"> <\/span><span class=\"o\">||<\/span><span class=\"w\"> <\/span><span class=\"n\">date<\/span><span class=\"w\"> <\/span><span class=\"o\">&gt;<\/span><span class=\"w\"> <\/span><span class=\"n\">days_in_month<\/span><span class=\"p\">[<\/span><span class=\"n\">month<\/span><span class=\"w\"> <\/span><span class=\"o\">-<\/span><span class=\"w\"> <\/span><span class=\"mi\">1<\/span><span class=\"p\">])<\/span><span class=\"w\"> <\/span><span class=\"p\">{<\/span>\n<span class=\"w\">        <\/span><span class=\"n\">printk<\/span><span class=\"p\">(<\/span><span class=\"n\">KERN_ERR<\/span><span class=\"w\"> <\/span><span class=\"s\">\"Invalid argument(s).<\/span><span class=\"se\">\\n<\/span><span class=\"s\">\"<\/span><span class=\"p\">);<\/span>\n<span class=\"w\">        <\/span><span class=\"k\">return<\/span><span class=\"w\"> <\/span><span class=\"o\">-<\/span><span class=\"n\">EINVAL<\/span><span class=\"p\">;<\/span><span class=\"w\">                  <\/span><span class=\"c1\">// 負值 → insmod 失敗<\/span>\n<span class=\"w\">    <\/span><span class=\"p\">}<\/span>\n<span class=\"w\">    <\/span><span class=\"n\">ts<\/span><span class=\"w\"> <\/span><span class=\"o\">=<\/span><span class=\"w\"> <\/span><span class=\"n\">mktime64<\/span><span class=\"p\">(<\/span><span class=\"n\">year<\/span><span class=\"p\">,<\/span><span class=\"w\"> <\/span><span class=\"n\">month<\/span><span class=\"p\">,<\/span><span class=\"w\"> <\/span><span class=\"n\">date<\/span><span class=\"p\">,<\/span><span class=\"w\"> <\/span><span class=\"mi\">0<\/span><span class=\"p\">,<\/span><span class=\"w\"> <\/span><span class=\"mi\">0<\/span><span class=\"p\">,<\/span><span class=\"w\"> <\/span><span class=\"mi\">0<\/span><span class=\"p\">);<\/span>\n<span class=\"w\">    <\/span><span class=\"n\">printk<\/span><span class=\"p\">(<\/span><span class=\"n\">KERN_INFO<\/span><span class=\"w\"> <\/span><span class=\"s\">\"date2timestamp insert successfully! ts=%lld<\/span><span class=\"se\">\\n<\/span><span class=\"s\">\"<\/span><span class=\"p\">,<\/span><span class=\"w\"> <\/span><span class=\"n\">ts<\/span><span class=\"p\">);<\/span>\n<span class=\"w\">    <\/span><span class=\"k\">return<\/span><span class=\"w\"> <\/span><span class=\"mi\">0<\/span><span class=\"p\">;<\/span>\n<span class=\"p\">}<\/span>\n<\/code><\/pre><\/div>\n\n<ul>\n<li>驗證順序正確：先確認 <code>month<\/code> 在 1~12，<strong>才<\/strong>用 <code>days_in_month[month - 1]<\/code>（<code>||<\/code> 短路求值，避免越界）。<\/li>\n<li>閏年判斷：可被 4 整除且不被 100 整除，或可被 400 整除。<\/li>\n<li><code>year=2001 month=8 date=1<\/code> → <code>ts=996624000<\/code>（2001-08-01 00:00:00 UTC 的 Unix 時間）。<\/li>\n<li><code>year=1970 month=13 date=-1<\/code> → <code>Invalid argument(s).<\/code>，insmod 顯示 <code>ERROR: could not insert module ...: Invalid parameters<\/code>。<\/li>\n<\/ul>\n<p><strong>practice/lab5/myage.c<\/strong><\/p>\n<div class=\"hl\"><pre><span><\/span><code><span class=\"k\">extern<\/span><span class=\"w\"> <\/span><span class=\"n\">time64_t<\/span><span class=\"w\"> <\/span><span class=\"n\">ts<\/span><span class=\"p\">;<\/span>\n<span class=\"k\">extern<\/span><span class=\"w\"> <\/span><span class=\"kt\">int<\/span><span class=\"w\"> <\/span><span class=\"nf\">is_adult<\/span><span class=\"p\">(<\/span><span class=\"n\">time64_t<\/span><span class=\"w\"> <\/span><span class=\"n\">now<\/span><span class=\"p\">);<\/span>\n<span class=\"kt\">int<\/span><span class=\"w\"> <\/span><span class=\"nf\">init_module<\/span><span class=\"p\">(<\/span><span class=\"kt\">void<\/span><span class=\"p\">)<\/span><span class=\"w\"> <\/span><span class=\"p\">{<\/span>\n<span class=\"w\">    <\/span><span class=\"n\">time64_t<\/span><span class=\"w\"> <\/span><span class=\"n\">now<\/span><span class=\"w\"> <\/span><span class=\"o\">=<\/span><span class=\"w\"> <\/span><span class=\"n\">ktime_get_real_seconds<\/span><span class=\"p\">();<\/span><span class=\"w\">   <\/span><span class=\"c1\">// 目前時間（秒）<\/span>\n<span class=\"w\">    <\/span><span class=\"n\">time64_t<\/span><span class=\"w\"> <\/span><span class=\"n\">diff<\/span><span class=\"w\"> <\/span><span class=\"o\">=<\/span><span class=\"w\"> <\/span><span class=\"n\">now<\/span><span class=\"w\"> <\/span><span class=\"o\">-<\/span><span class=\"w\"> <\/span><span class=\"n\">ts<\/span><span class=\"p\">;<\/span>\n<span class=\"w\">    <\/span><span class=\"kt\">long<\/span><span class=\"w\"> <\/span><span class=\"kt\">long<\/span><span class=\"w\"> <\/span><span class=\"n\">days<\/span><span class=\"p\">,<\/span><span class=\"w\"> <\/span><span class=\"n\">years<\/span><span class=\"p\">;<\/span>\n<span class=\"w\">    <\/span><span class=\"n\">printk<\/span><span class=\"p\">(<\/span><span class=\"n\">KERN_INFO<\/span><span class=\"w\"> <\/span><span class=\"s\">\"myage insert successfully!<\/span><span class=\"se\">\\n<\/span><span class=\"s\">\"<\/span><span class=\"p\">);<\/span>\n<span class=\"w\">    <\/span><span class=\"k\">if<\/span><span class=\"w\"> <\/span><span class=\"p\">(<\/span><span class=\"n\">diff<\/span><span class=\"w\"> <\/span><span class=\"o\">&lt;<\/span><span class=\"w\"> <\/span><span class=\"mi\">0<\/span><span class=\"p\">)<\/span><span class=\"w\"> <\/span><span class=\"p\">{<\/span>\n<span class=\"w\">        <\/span><span class=\"n\">printk<\/span><span class=\"p\">(<\/span><span class=\"n\">KERN_WARNING<\/span><span class=\"w\"> <\/span><span class=\"s\">\"Your birthday is in the future! (diff=%lld)<\/span><span class=\"se\">\\n<\/span><span class=\"s\">\"<\/span><span class=\"p\">,<\/span><span class=\"w\"> <\/span><span class=\"n\">diff<\/span><span class=\"p\">);<\/span>\n<span class=\"w\">        <\/span><span class=\"k\">return<\/span><span class=\"w\"> <\/span><span class=\"mi\">0<\/span><span class=\"p\">;<\/span>\n<span class=\"w\">    <\/span><span class=\"p\">}<\/span>\n<span class=\"w\">    <\/span><span class=\"n\">days<\/span><span class=\"w\">  <\/span><span class=\"o\">=<\/span><span class=\"w\"> <\/span><span class=\"n\">diff<\/span><span class=\"w\"> <\/span><span class=\"o\">/<\/span><span class=\"w\"> <\/span><span class=\"mi\">86400<\/span><span class=\"p\">;<\/span><span class=\"w\">      <\/span><span class=\"c1\">// 1 天 = 86400 秒<\/span>\n<span class=\"w\">    <\/span><span class=\"n\">years<\/span><span class=\"w\"> <\/span><span class=\"o\">=<\/span><span class=\"w\"> <\/span><span class=\"n\">days<\/span><span class=\"w\"> <\/span><span class=\"o\">/<\/span><span class=\"w\"> <\/span><span class=\"mi\">365<\/span><span class=\"p\">;<\/span>\n<span class=\"w\">    <\/span><span class=\"n\">days<\/span><span class=\"w\">  <\/span><span class=\"o\">=<\/span><span class=\"w\"> <\/span><span class=\"n\">days<\/span><span class=\"w\"> <\/span><span class=\"o\">%<\/span><span class=\"w\"> <\/span><span class=\"mi\">365<\/span><span class=\"p\">;<\/span>\n<span class=\"w\">    <\/span><span class=\"n\">printk<\/span><span class=\"p\">(<\/span><span class=\"n\">KERN_INFO<\/span><span class=\"w\"> <\/span><span class=\"s\">\"Wow you have survived on this world %lld years and %lld days!<\/span><span class=\"se\">\\n<\/span><span class=\"s\">\"<\/span><span class=\"p\">,<\/span><span class=\"w\"> <\/span><span class=\"n\">years<\/span><span class=\"p\">,<\/span><span class=\"w\"> <\/span><span class=\"n\">days<\/span><span class=\"p\">);<\/span>\n<span class=\"w\">    <\/span><span class=\"p\">...<\/span>\n<span class=\"p\">}<\/span>\n<\/code><\/pre><\/div>\n\n<p><strong>評論與注意事項：<\/strong>\n1. 整體邏輯正確，符合題目（參數、export ts、無效日期回 <code>-EINVAL<\/code>、myage 相減並處理 &lt;0 情況）。\n2. <strong>module 名稱<\/strong>：Makefile 是 <code>obj-m += d2ts.o<\/code>，產生的是 <code>d2ts.ko<\/code>；題目指定的名稱是 <code>date2timestamp<\/code>。demo 時若助教要看 <code>date2timestamp.ko<\/code>，請把檔名改成 <code>date2timestamp.c<\/code> 並改 Makefile 的 <code>obj-m<\/code>。\n3. <strong>年數用 365 天近似<\/strong>：沒考慮閏年，活很多年時「天數」會差幾天（題目只要求轉成年跟日，可接受，但要知道是近似）。\n4. <strong><code>year &lt; 1970<\/code> 被當成無效<\/strong>：題目沒有這樣要求；<code>mktime64<\/code> 其實能處理 1970 前（得到負的 ts）。若助教輸入 1969 年生日會被拒絕——說得出理由即可。\n5. myage 沒有 <code>#include &lt;linux/time64.h&gt;<\/code>（<code>time64_t<\/code> 透過其他標頭間接取得，能編譯）。\n6. <strong>相依順序<\/strong>：必須先 <code>insmod d2ts.ko<\/code> 再 <code>insmod myage.ko<\/code>；卸載時先 <code>rmmod myage<\/code> 再 <code>rmmod d2ts<\/code>。\n7. 投影片範例輸出中助教的 <code>ts=63163929600<\/code>（2001/8/1）並不是 Unix timestamp（<code>mktime64<\/code> 應得到 996624000），推測助教範例用了其他算法；<strong>以題目提示的 <code>mktime64<\/code> 為準<\/strong>（「其餘文字不須照打，看得懂即可」）。<\/p>\n<hr />\n<h2 id=\"lab5-5\">5. 上機考實作步驟<\/h2>\n<div class=\"hl\"><pre><span><\/span><code><span class=\"c1\"># ===== hello_mo span><span class=\"o\">=<\/span><span class=\"k\">$(<\/span>PWD<span class=\"k\">)<\/span><span class=\"w\"> <\/span>clean\n<\/code><\/pre><\/div>\n\n<hr />\n<h2 id=\"lab5-6\">6. 常見錯誤與陷阱<\/h2>\n<ol>\n<li><code>rmmod hello_module.ko<\/code> → 應該是 <code>rmmod hello_module<\/code>（<strong>rmmod 不加 .ko，insmod 要加 .ko<\/strong>）。<\/li>\n<li>Makefile 指令前用空白 → <code>missing separator<\/code>。<\/li>\n<li><code>obj-m<\/code> 的名稱和 .c 檔名不一致 → 找不到來源。<\/li>\n<li>忘了 <code>sudo<\/code> → <code>Operation not permitted<\/code>。<\/li>\n<li>以為 printk 會印到 terminal → 要 <code>dmesg<\/code>。<\/li>\n<li><code>printk(KERN_INFO, \"...\")<\/code> 多了逗號 → <code>KERN_INFO<\/code> 是字串前綴，要直接相接。<\/li>\n<li><code>init_module<\/code> 回傳非 0 → 載入失敗（這也是 Exercise 中止安裝的方法，要回傳<strong>負<\/strong>的錯誤碼如 <code>-EINVAL<\/code>）。<\/li>\n<li>載入順序錯（先載 B）→ <code>Unknown symbol in module<\/code>；卸載順序錯（先卸 A）→ <code>Module is in use<\/code>。<\/li>\n<li>參數 <code>month=08<\/code> → 八進位問題導致 invalid param；請輸入 <code>month=8<\/code>。<\/li>\n<li>忘了 <code>EXPORT_SYMBOL<\/code> 或另一邊沒寫 <code>extern<\/code> → 連結不到。<\/li>\n<li>在 kernel module 中用 <code>printf<\/code>、<code>&lt;stdio.h&gt;<\/code>、浮點數運算 → 不行（kernel 不建議使用浮點數，補充）。<\/li>\n<li>沒裝 kernel headers（<code>/lib/modules/$(uname -r)/build<\/code> 不存在）→ 補充：<code>sudo apt install linux-headers-$(uname -r)<\/code>。<\/li>\n<\/ol>\n<hr />\n<h2 id=\"lab5-7\">7. 筆試模擬題<\/h2>\n<p><strong>Q1（選擇）<\/strong> 下列何者最適合做成 kernel module？\n(A) 文字編輯器　(B) 新硬體的驅動程式　(C) 網頁瀏覽器　(D) gcc<\/p>\n<blockquote>\n<p><strong>答：B<\/strong>。module 用來擴充 kernel 功能，最常見是驅動程式。<\/p>\n<\/blockquote>\n<p><strong>Q2（是非）<\/strong> 載入 kernel module 需要重新編譯 kernel 並重開機。<\/p>\n<blockquote>\n<p><strong>答：錯<\/strong>。這是 module 相對於 <code>obj-y<\/code> 編進 kernel 的優點：可動態載入／卸載。<\/p>\n<\/blockquote>\n<p><strong>Q3（選擇）<\/strong> 卸載 module 的正確指令？\n(A) <code>sudo rmmod hello.ko<\/code>　(B) <code>sudo rmmod hello<\/code>　(C) <code>sudo insmod -r hello<\/code>　(D) <code>sudo modinfo -d hello<\/code><\/p>\n<blockquote>\n<p><strong>答：B<\/strong>。<\/p>\n<\/blockquote>\n<p><strong>Q4（簡答）<\/strong> <code>init_module()<\/code> 回傳非 0 會發生什麼事？Exercise 中如何利用？<\/p>\n<blockquote>\n<p><strong>答：<\/strong> 代表初始化失敗，module 不會被載入，insmod 回報錯誤。Exercise 遇到無效日期時 <code>printk(KERN_ERR ...)<\/code> 並 <code>return -EINVAL;<\/code> 中止安裝。<\/p>\n<\/blockquote>\n<p><strong>Q5（輸出預測）<\/strong> symbol_B 的 <code>symbol_function(-100)<\/code> 在 dmesg 顯示？<\/p>\n<blockquote>\n<p><strong>答：<\/strong> <code>Symbol_function(-100): -1<\/code>。<\/p>\n<\/blockquote>\n<p><strong>Q6（順序）<\/strong> module B 使用 module A export 的 symbol，寫出正確的載入與卸載順序。<\/p>\n<blockquote>\n<p><strong>答：<\/strong> 載入：insmod A → insmod B；卸載：rmmod B → rmmod A。<\/p>\n<\/blockquote>\n<p><strong>Q7（選擇）<\/strong> <code>MODULE_PARM_DESC<\/code> 的內容會出現在哪個指令的輸出？\n(A) <code>lsmod<\/code>　(B) <code>dmesg<\/code>　(C) <code>modinfo<\/code>　(D) <code>insmod<\/code><\/p>\n<blockquote>\n<p><strong>答：C<\/strong>。<\/p>\n<\/blockquote>\n<p><strong>Q8（簡答）<\/strong> 解釋 Makefile 中 <code>make -C /lib/modules/$(shell uname -r)/build M=$(PWD) modules<\/code>。<\/p>\n<blockquote>\n<p><strong>答：<\/strong> <code>-C<\/code> 切到目前執行中 kernel 的 build 目錄，使用它的 kernel build 系統；<code>M=$(PWD)<\/code> 指定 module 原始碼在目前目錄；<code>modules<\/code> 是要建置的目標（編譯 module）。<\/p>\n<\/blockquote>\n<p><strong>Q9（輸出預測）<\/strong> 對 hello_module_2 執行 <code>sudo insmod hello_module_2.ko year=2025<\/code>（未給 month、date），dmesg 第二行？<\/p>\n<blockquote>\n<p><strong>答：<\/strong> <code>Today is 2025/1/1.<\/code>（未給的參數用預設值 1）。<\/p>\n<\/blockquote>\n<p><strong>Q10（是非）<\/strong> <code>lsmod<\/code> 的資料來源是 <code>/proc/modules<\/code>。<\/p>\n<blockquote>\n<p><strong>答：對<\/strong>。lsmod 解析 /proc/modules 並格式化輸出。<\/p>\n<\/blockquote>\n<p><strong>Q11（簡答）<\/strong> 為什麼輸入 <code>month=09<\/code> 會失敗？<\/p>\n<blockquote>\n<p><strong>答：<\/strong> 前導 0 被解析為八進位，09 不是合法八進位數字，造成 invalid param。應輸入 <code>month=9<\/code>。<\/p>\n<\/blockquote>\n<p><strong>Q12（選擇）<\/strong> 關於 <code>MODULE_LICENSE(\"GPL\")<\/code> 何者正確？\n(A) 讓 module 執行更快　(B) 宣告 module 以 GPL 授權、原始碼開放　(C) 讓 module 可以使用 printf　(D) 指定 module 作者<\/p>\n<blockquote>\n<p><strong>答：B<\/strong>。<\/p>\n<\/blockquote>\n<p><strong>Q13（簡答）<\/strong> 比較 kernel module 與一般 user program 的兩個差異。<\/p>\n<blockquote>\n<p><strong>答：<\/strong> ① 進入點：user program 是 <code>main<\/code>，module 是 <code>init_module<\/code>／<code>cleanup_module<\/code>；② 輸出：<code>printf<\/code> 到 terminal vs <code>printk<\/code> 到 kernel log；③ module 在 kernel space 執行，出錯可能讓整個系統當掉；④ module 不能用 libc。（任兩點）<\/p>\n<\/blockquote>", "toc": [{"id": "lab5-1-lab", "name": "1. 這個 LAB 在學什麼", "kids": []}, {"id": "lab5-2", "name": "2. 核心觀念", "kids": [{"id": "lab5-21-package-vs-kernel-module", "name": "2.1 Package vs Kernel module"}, {"id": "lab5-22-kernel-module-vs-user-program", "name": "2.2 Kernel module vs User program（補充整理，常考）"}, {"id": "lab5-23-module-vs-lab2-syscallobj-m-vs-obj-y", "name": "2.3 Module vs Lab2 的 syscall（obj-m vs obj-y）"}, {"id": "lab5-24-module", "name": "2.4 Module 基本元素"}, {"id": "lab5-25-module-parameters", "name": "2.5 Module Parameters"}, {"id": "lab5-26-symbols-export_symbol", "name": "2.6 Symbols 與 EXPORT_SYMBOL"}, {"id": "lab5-27", "name": "2.7 其他"}]}, {"id": "lab5-3-api", "name": "3. 指令／API 速查表", "kids": []}, {"id": "lab5-4", "name": "4. 程式範例逐行解說", "kids": [{"id": "lab5-41-hello_modulec", "name": "4.1 hello_module.c"}, {"id": "lab5-42-makefilemodule", "name": "4.2 Makefile（module 用）"}, {"id": "lab5-43-hello_module_2cmodule-parameter", "name": "4.3 hello_module_2.c（module parameter）"}, {"id": "lab5-44-symbol_ac-symbol_bc", "name": "4.4 symbol_A.c / symbol_B.c"}, {"id": "lab5-45-practicelab5d2tscdate2timestamp", "name": "4.5 學生作業 practice/lab5/d2ts.c（date2timestamp）"}]}, {"id": "lab5-5", "name": "5. 上機考實作步驟", "kids": [{"id": "lab5-exercise-init_module", "name": "Exercise 參考解法（精簡、符合題目「寫在 init_module 內」）"}]}, {"id": "lab5-6", "name": "6. 常見錯誤與陷阱", "kids": []}, {"id": "lab5-7", "name": "7. 筆試模擬題", "kids": []}]}, {"id": "lab6", "short": "Lab 6", "title": "Lab 6 複習：Process Control", "html": "<h1 id=\"lab6-lab-6-process-control\">Lab 6 複習：Process Control<\/h1>\n<blockquote>\n<p>來源：Lab6.pptx（29 張投影片，含講者備註）＋ practice/lab6/（ex1.c、ex2.c）<\/p>\n<\/blockquote>\n<hr />\n<h2 id=\"lab6-1-lab\">1. 這個 LAB 在學什麼<\/h2>\n<p>透過程式理解 <strong>process<\/strong> 的概念，以及 UNIX 用哪些 system call 控制 process：<code>fork()<\/code> 建立 child、<code>getpid()/getppid()<\/code> 取得 PID、<code>wait()<\/code> 讓 parent 等 child 結束、<code>exec<\/code> 系列（<code>execlp()<\/code>）讓 process 換成執行另一支程式。Exercise 1 觀察 fork 後 global／local 變數各自獨立；Exercise 2 建出指定形狀的 process tree。<\/p>\n<hr />\n<h2 id=\"lab6-2\">2. 核心觀念<\/h2>\n<h3 id=\"lab6-21-process\">2.1 Process 是什麼<\/h3>\n<ul>\n<li><strong>Process = 正在執行中的程式（a program in execution）<\/strong>。<\/li>\n<li>Process 的記憶體分成（必考）：\n  | 區段 | 內容 | 範例 |\n  |---|---|---|\n  | <strong>text<\/strong> section | 程式碼 | 編譯後的指令 |\n  | <strong>data<\/strong> section | <strong>全域變數<\/strong> | <code>int a = 10;<\/code>（函式外） |\n  | <strong>heap<\/strong> section | <strong>動態配置<\/strong>的記憶體 | <code>malloc()<\/code> 的空間 |\n  | <strong>stack<\/strong> section | <strong>暫存資料<\/strong>：區域變數、函式參數、回傳位址 | 函式內 <code>int b = 20;<\/code> |<\/li>\n<li>Process 不只是程式碼，還包含<strong>目前的執行狀態<\/strong>：<strong>program counter<\/strong> 與 CPU <strong>registers<\/strong> 的內容。<\/li>\n<li>每個 process 有自己的 base address／位址空間，彼此<strong>記憶體隔離<\/strong>，不會互相干擾。<\/li>\n<li>（補充）<strong>program vs process<\/strong>：program 是存在硬碟上的被動檔案；process 是載入記憶體、正在執行的主動實體。同一個 program 可以同時有多個 process。<\/li>\n<\/ul>\n<h3 id=\"lab6-22-process-tree\">2.2 Process tree<\/h3>\n<p>Parent process 建立 child process，child 又可以建立自己的 child，形成一棵 <strong>process tree<\/strong>。<\/p>\n<h3 id=\"lab6-23-pid\">2.3 PID<\/h3>\n<ul>\n<li>UNIX 用唯一的整數 <strong>process ID<\/strong> 辨識每個 process。<\/li>\n<li>每個 process 也有 <strong>parent process ID（PPID）<\/strong>，初始值就是建立它的那個 process 的 PID。<\/li>\n<li><code>getpid()<\/code> 回傳自己的 PID；<code>getppid()<\/code> 回傳 parent 的 PID。<\/li>\n<\/ul>\n<h3 id=\"lab6-24-fork\">2.4 fork()（最重要）<\/h3>\n<ul>\n<li>建立一個新的 child process，<strong>把 parent 的 memory image 複製一份給 child<\/strong>。<\/li>\n<li>fork 之後，parent 和 child <strong>都從 fork() 的下一行繼續執行<\/strong>，各自在自己的記憶體中跑。<\/li>\n<li><strong>回傳值（必考）<\/strong>：\n  | 情況 | 回傳值 |\n  |---|---|\n  | 在 <strong>parent<\/strong> 中 | <strong>child 的 PID<\/strong>（&gt; 0） |\n  | 在 <strong>child<\/strong> 中 | <strong>0<\/strong>（不是真的 PID，只是告訴它「你是 child」；child 要知道自己 PID 要呼叫 <code>getpid()<\/code>） |\n  | 失敗 | <strong>-1<\/strong>（沒有 child 被建立） |<\/li>\n<li>因為記憶體是<strong>複製<\/strong>的，child 改變數<strong>不影響<\/strong> parent（反之亦然）——不管是 global 還是 local 變數。<\/li>\n<li><strong>執行順序不確定<\/strong>：parent 和 child 誰先跑是由 <strong>CPU scheduler<\/strong> 決定；多個 child 的輸出順序是非決定性的（nondeterministic），可能有 race condition。<\/li>\n<\/ul>\n<h3 id=\"lab6-25-wait\">2.5 wait()<\/h3>\n<ul>\n<li>Parent 呼叫 <code>wait()<\/code> 會<strong>停下來（block）直到某一個 child 結束<\/strong>。<\/li>\n<li>回傳<strong>結束的那個 child 的 PID<\/strong>；錯誤（例如根本沒有 child）回傳 <strong>-1<\/strong>。<\/li>\n<li><code>wait(NULL)<\/code> 表示不在乎 child 的結束狀態；<code>wait(&amp;status)<\/code> 可取得狀態。<\/li>\n<li><strong>一次 wait() 只處理一個 child<\/strong>：有幾個 child 就要 wait 幾次（Exercise 2 的要求）。<\/li>\n<li>用 wait 可以<strong>保證 parent 最後才輸出<\/strong>。<\/li>\n<li>（補充）child 結束了但 parent 沒 wait，child 會變成 <strong>zombie<\/strong>；parent 比 child 先結束，child 變成 <strong>orphan<\/strong>，會被 init/systemd 收養（PPID 變成 1 或其他 subreaper）。<\/li>\n<\/ul>\n<h3 id=\"lab6-26-exec\">2.6 exec 系列<\/h3>\n<ul>\n<li>fork 只能做出「一模一樣」的 process；若要讓 child 執行<strong>不同的程式<\/strong>，就用 exec。<\/li>\n<li>exec 用新的程式<strong>覆蓋（overlay）<\/strong>目前 process 的 image（text、data、heap、stack 全換掉），<strong>PID 不變<\/strong>。<\/li>\n<li><strong>exec 成功就不會返回<\/strong>：exec 之後的程式碼不會被執行；只有失敗才會回傳 -1。<\/li>\n<li>常見模式 <strong>fork–exec<\/strong>：parent fork 出 child → child 呼叫 exec 執行新程式 → parent 繼續原本的程式碼（通常還會 wait）。<\/li>\n<li><code>execlp<\/code> 名稱解讀：<strong>l = list<\/strong>（參數一個一個列出來）；<strong>p = path<\/strong>（會去 <code>PATH<\/code> 環境變數的目錄找程式，所以只寫 <code>\"ls\"<\/code> 就好，不必寫 <code>/bin/ls<\/code>）。<\/li>\n<li>參數慣例：第 1 個參數是「要找的檔案」，第 2 個是新程式的 <strong>argv[0]（程式名稱，通常和第 1 個一樣）<\/strong>，後面是命令列參數，<strong>最後一定要以 <code>NULL<\/code> 結尾<\/strong>。<\/li>\n<\/ul>\n<hr />\n<h2 id=\"lab6-3-apisystem-call\">3. 指令／API／system call 速查表<\/h2>\n<table>\n<thead>\n<tr>\n<th>名稱<\/th>\n<th>標頭<\/th>\n<th>用途<\/th>\n<th>回傳值<\/th>\n<th>範例<\/th>\n<\/tr>\n<\/thead>\n<tbody>\n<tr>\n<td><code>pid_t fork(void)<\/code><\/td>\n<td><code>&lt;unistd.h&gt;<\/code><\/td>\n<td>建立 child process<\/td>\n<td>parent 得 child PID；child 得 0；失敗 -1<\/td>\n<td><code>pid_t pid = fork();<\/code><\/td>\n<\/tr>\n<tr>\n<td><code>pid_t getpid(void)<\/code><\/td>\n<td><code>&lt;unistd.h&gt;<\/code><\/td>\n<td>自己的 PID<\/td>\n<td>PID<\/td>\n<td><code>getpid()<\/code><\/td>\n<\/tr>\n<tr>\n<td><code>pid_t getppid(void)<\/code><\/td>\n<td><code>&lt;unistd.h&gt;<\/code><\/td>\n<td>parent 的 PID<\/td>\n<td>PPID<\/td>\n<td><code>getppid()<\/code><\/td>\n<\/tr>\n<tr>\n<td><code>pid_t wait(int *stat_loc)<\/code><\/td>\n<td><code>&lt;sys/wait.h&gt;<\/code><\/td>\n<td>等待任一 child 結束<\/td>\n<td>結束的 child PID；錯誤 -1<\/td>\n<td><code>wait(NULL);<\/code><\/td>\n<\/tr>\n<tr>\n<td><code>int execlp(const char *file, const char *arg0, ..., (char*)0)<\/code><\/td>\n<td><code>&lt;unistd.h&gt;<\/code><\/td>\n<td>用新程式取代目前 process<\/td>\n<td>成功不返回；失敗 -1<\/td>\n<td><code>execlp(\"ls\", \"ls\", \"-l\", NULL);<\/code><\/td>\n<\/tr>\n<tr>\n<td><code>exit(int status)<\/code><\/td>\n<td><code>&lt;stdlib.h&gt;<\/code><\/td>\n<td>結束 process<\/td>\n<td>—<\/td>\n<td><code>exit(0);<\/code><\/td>\n<\/tr>\n<tr>\n<td><code>perror(const char *s)<\/code><\/td>\n<td><code>&lt;stdio.h&gt;<\/code><\/td>\n<td>印出錯誤原因<\/td>\n<td>—<\/td>\n<td><code>perror(\"fork\");<\/code><\/td>\n<\/tr>\n<tr>\n<td><code>fflush(stdout)<\/code><\/td>\n<td><code>&lt;stdio.h&gt;<\/code><\/td>\n<td>把 stdout buffer 立刻寫出<\/td>\n<td>—<\/td>\n<td>fork 前使用<\/td>\n<\/tr>\n<\/tbody>\n<\/table>\n<hr />\n<h2 id=\"lab6-4\">4. 程式範例逐行解說<\/h2>\n<h3 id=\"lab6-41\">4.1 記憶體區段範例<\/h3>\n<div class=\"hl\"><pre><span><\/span><code><span class=\"kt\">int<\/span><span class=\"w\"> <\/span><span class=\"n\">a<\/span><span class=\"w\"> <\/span><span class=\"o\">=<\/span><span class=\"w\"> <\/span><span class=\"mi\">10<\/span><span class=\"p\">;<\/span><span class=\"w\">               <\/span><span class=\"c1\">// global → data section<\/span>\n<span class=\"kt\">void<\/span><span class=\"w\"> <\/span><span class=\"nf\">function<\/span><span class=\"p\">(){<\/span>\n<span class=\"w\">    <\/span><span class=\"kt\">int<\/span><span class=\"w\"> <\/span><span class=\"n\">b<\/span><span class=\"w\"> <\/span><span class=\"o\">=<\/span><span class=\"w\"> <\/span><span class=\"mi\">20<\/span><span class=\"p\">;<\/span><span class=\"w\">           <\/span><span class=\"c1\">// local → stack section<\/span>\n<span class=\"p\">}<\/span>\n<span class=\"kt\">int<\/span><span class=\"w\"> <\/span><span class=\"nf\">main<\/span><span class=\"p\">(){<\/span>\n<span class=\"w\">    <\/span><span class=\"kt\">int<\/span><span class=\"w\"> <\/span><span class=\"n\">c<\/span><span class=\"w\"> <\/span><span class=\"o\">=<\/span><span class=\"w\"> <\/span><span class=\"mi\">30<\/span><span class=\"p\">;<\/span><span class=\"w\">           <\/span><span class=\"c1\">// local → stack section<\/span>\n<span class=\"w\">    <\/span><span class=\"kt\">int<\/span><span class=\"w\"> <\/span><span class=\"o\">*<\/span><span class=\"n\">d<\/span><span class=\"w\"> <\/span><span class=\"o\">=<\/span><span class=\"w\"> <\/span><span class=\"p\">(<\/span><span class=\"kt\">int<\/span><span class=\"w\"> <\/span><span class=\"o\">*<\/span><span class=\"p\">)<\/span><span class=\"n\">malloc<\/span><span class=\"p\">(<\/span><span class=\"k\">sizeof<\/span><span class=\"p\">(<\/span><span class=\"kt\">int<\/span><span class=\"p\">));<\/span><span class=\"w\">   <\/span><span class=\"c1\">// d 本身在 stack，*d 指向 heap<\/span>\n<span class=\"w\">    <\/span><span class=\"o\">*<\/span><span class=\"n\">d<\/span><span class=\"w\"> <\/span><span class=\"o\">=<\/span><span class=\"w\"> <\/span><span class=\"mi\">40<\/span><span class=\"p\">;<\/span>\n<span class=\"w\">    <\/span><span class=\"n\">function<\/span><span class=\"p\">();<\/span>\n<span class=\"w\">    <\/span><span class=\"n\">free<\/span><span class=\"p\">(<\/span><span class=\"n\">d<\/span><span class=\"p\">);<\/span>\n<span class=\"w\">    <\/span><span class=\"k\">return<\/span><span class=\"w\"> <\/span><span class=\"mi\">0<\/span><span class=\"p\">;<\/span>\n<span class=\"p\">}<\/span>\n<\/code><\/pre><\/div>\n\n<p>注意：<strong>指標變數 <code>d<\/code> 本身在 stack<\/strong>，它指到的那塊 4 bytes 在 heap。<\/p>\n<h3 id=\"lab6-42-fork-switch\">4.2 fork + switch<\/h3>\n<div class=\"hl\"><pre><span><\/span><code><span class=\"kt\">pid_t<\/span><span class=\"w\"> <\/span><span class=\"n\">new_pid<\/span><span class=\"w\"> <\/span><span class=\"o\">=<\/span><span class=\"w\"> <\/span><span class=\"n\">fork<\/span><span class=\"p\">();<\/span>\n<span class=\"k\">switch<\/span><span class=\"p\">(<\/span><span class=\"n\">new_pid<\/span><span class=\"p\">){<\/span>\n<span class=\"w\">    <\/span><span class=\"k\">case<\/span><span class=\"w\"> <\/span><span class=\"mi\">-1<\/span><span class=\"p\">:<\/span>\n<span class=\"w\">        <\/span><span class=\"n\">printf<\/span><span class=\"p\">(<\/span><span class=\"s\">\"fork error<\/span><span class=\"se\">\\n<\/span><span class=\"s\">\"<\/span><span class=\"p\">);<\/span>\n<span class=\"w\">    <\/span><span class=\"k\">case<\/span><span class=\"w\"> <\/span><span class=\"mi\">0<\/span><span class=\"p\">:<\/span>\n<span class=\"w\">        <\/span><span class=\"n\">printf<\/span><span class=\"p\">(<\/span><span class=\"s\">\"------------this is child process------------<\/span><span class=\"se\">\\n<\/span><span class=\"s\">\"<\/span><span class=\"p\">);<\/span>\n<span class=\"w\">        <\/span><span class=\"n\">printf<\/span><span class=\"p\">(<\/span><span class=\"s\">\"Pid : %d<\/span><span class=\"se\">\\n<\/span><span class=\"s\">parent pid : %d<\/span><span class=\"se\">\\n<\/span><span class=\"s\">\"<\/span><span class=\"p\">,<\/span><span class=\"w\"> <\/span><span class=\"n\">getpid<\/span><span class=\"p\">(),<\/span><span class=\"w\"> <\/span><span class=\"n\">getppid<\/span><span class=\"p\">());<\/span>\n<span class=\"w\">        <\/span><span class=\"n\">printf<\/span><span class=\"p\">(<\/span><span class=\"s\">\"---------------------------------------------<\/span><span class=\"se\">\\n<\/span><span class=\"s\">\"<\/span><span class=\"p\">);<\/span>\n<span class=\"w\">        <\/span><span class=\"k\">break<\/span><span class=\"p\">;<\/span>\n<span class=\"w\">    <\/span><span class=\"k\">default<\/span><span class=\"o\">:<\/span>\n<span class=\"w\">        <\/span><span class=\"n\">printf<\/span><span class=\"p\">(<\/span><span class=\"s\">\"------------this is parent process-----------<\/span><span class=\"se\">\\n<\/span><span class=\"s\">\"<\/span><span class=\"p\">);<\/span>\n<span class=\"w\">        <\/span><span class=\"n\">printf<\/span><span class=\"p\">(<\/span><span class=\"s\">\"Pid : %d<\/span><span class=\"se\">\\n<\/span><span class=\"s\">child pid : %d<\/span><span class=\"se\">\\n<\/span><span class=\"s\">\"<\/span><span class=\"p\">,<\/span><span class=\"w\"> <\/span><span class=\"n\">getpid<\/span><span class=\"p\">(),<\/span><span class=\"w\"> <\/span><span class=\"n\">new_pid<\/span><span class=\"p\">);<\/span>\n<span class=\"w\">        <\/span><span class=\"n\">printf<\/span><span class=\"p\">(<\/span><span class=\"s\">\"---------------------------------------------<\/span><span class=\"se\">\\n<\/span><span class=\"s\">\"<\/span><span class=\"p\">);<\/span>\n<span class=\"w\">        <\/span><span class=\"k\">break<\/span><span class=\"p\">;<\/span>\n<span class=\"p\">}<\/span>\n<\/code><\/pre><\/div>\n\n<p>輸出（PID 每次不同）：<\/p>\n<div class=\"hl\"><pre><span><\/span><code>------------this is child process------------\nPid : 5962\nparent pid : 5961\n---------------------------------------------\n------------this is parent process-----------\nPid : 5961\nchild pid : 5962\n---------------------------------------------\n<\/code><\/pre><\/div>\n\n<ul>\n<li>child 的 <code>getppid()<\/code> = parent 的 <code>getpid()<\/code>；parent 的 <code>new_pid<\/code> = child 的 <code>getpid()<\/code>。<\/li>\n<li><strong>陷阱<\/strong>：投影片這版 <code>case -1:<\/code> 後面<strong>沒有 <code>break<\/code><\/strong>，fork 失敗時會 fall-through 執行 <code>case 0<\/code> 的內容，印出錯誤的「child」資訊。後面的 wait 範例有補上 break。<\/li>\n<li>child 和 parent 的區塊誰先印不一定（這次是 child 先）。<\/li>\n<\/ul>\n<h3 id=\"lab6-43-fork-if\">4.3 fork + if（等價寫法）<\/h3>\n<div class=\"hl\"><pre><span><\/span><code><span class=\"kt\">pid_t<\/span><span class=\"w\"> <\/span><span class=\"n\">new_pid<\/span><span class=\"w\"> <\/span><span class=\"o\">=<\/span><span class=\"w\"> <\/span><span class=\"n\">fork<\/span><span class=\"p\">();<\/span>\n<span class=\"k\">if<\/span><span class=\"w\"> <\/span><span class=\"p\">(<\/span><span class=\"n\">new_pid<\/span><span class=\"w\"> <\/span><span class=\"o\">&lt;<\/span><span class=\"w\"> <\/span><span class=\"mi\">0<\/span><span class=\"p\">)<\/span><span class=\"w\"> <\/span><span class=\"p\">{<\/span><span class=\"w\"> <\/span><span class=\"n\">printf<\/span><span class=\"p\">(<\/span><span class=\"s\">\"fork error<\/span><span class=\"se\">\\n<\/span><span class=\"s\">\"<\/span><span class=\"p\">);<\/span><span class=\"w\"> <\/span><span class=\"k\">return<\/span><span class=\"w\"> <\/span><span class=\"mi\">0<\/span><span class=\"p\">;<\/span><span class=\"w\"> <\/span><span class=\"p\">}<\/span>\n<span class=\"k\">else<\/span><span class=\"w\"> <\/span><span class=\"k\">if<\/span><span class=\"w\"> <\/span><span class=\"p\">(<\/span><span class=\"n\">new_pid<\/span><span class=\"w\"> <\/span><span class=\"o\">==<\/span><span class=\"w\"> <\/span><span class=\"mi\">0<\/span><span class=\"p\">)<\/span><span class=\"w\"> <\/span><span class=\"p\">{<\/span><span class=\"w\"> <\/span><span class=\"cm\">/* child */<\/span><span class=\"w\"> <\/span><span class=\"n\">printf<\/span><span class=\"p\">(<\/span><span class=\"s\">\"Pid : %d<\/span><span class=\"se\">\\n<\/span><span class=\"s\">Parent pid : %d<\/span><span class=\"se\">\\n<\/span><span class=\"s\">\"<\/span><span class=\"p\">,<\/span><span class=\"w\"> <\/span><span class=\"n\">getpid<\/span><span class=\"p\">(),<\/span><span class=\"w\"> <\/span><span class=\"n\">getppid<\/span><span class=\"p\">());<\/span><span class=\"w\"> <\/span><span class=\"k\">return<\/span><span class=\"w\"> <\/span><span class=\"mi\">0<\/span><span class=\"p\">;<\/span><span class=\"w\"> <\/span><span class=\"p\">}<\/span>\n<span class=\"k\">else<\/span><span class=\"w\"> <\/span><span class=\"p\">{<\/span><span class=\"w\"> <\/span><span class=\"cm\">/* parent */<\/span><span class=\"w\"> <\/span><span class=\"n\">printf<\/span><span class=\"p\">(<\/span><span class=\"s\">\"Pid : %d<\/span><span class=\"se\">\\n<\/span><span class=\"s\">Child pid : %d<\/span><span class=\"se\">\\n<\/span><span class=\"s\">\"<\/span><span class=\"p\">,<\/span><span class=\"w\"> <\/span><span class=\"n\">getpid<\/span><span class=\"p\">(),<\/span><span class=\"w\"> <\/span><span class=\"n\">new_pid<\/span><span class=\"p\">);<\/span><span class=\"w\"> <\/span><span class=\"k\">return<\/span><span class=\"w\"> <\/span><span class=\"mi\">0<\/span><span class=\"p\">;<\/span><span class=\"w\"> <\/span><span class=\"p\">}<\/span>\n<\/code><\/pre><\/div>\n\n<h3 id=\"lab6-44-fork-wait\">4.4 多次 fork + 兩次 wait<\/h3>\n<div class=\"hl\"><pre><span><\/span><code><span class=\"kt\">int<\/span><span class=\"w\"> <\/span><span class=\"nf\">main<\/span><span class=\"p\">(){<\/span>\n<span class=\"w\">    <\/span><span class=\"k\">if<\/span><span class=\"w\"> <\/span><span class=\"p\">(<\/span><span class=\"n\">fork<\/span><span class=\"p\">()<\/span><span class=\"w\"> <\/span><span class=\"o\">==<\/span><span class=\"w\"> <\/span><span class=\"mi\">0<\/span><span class=\"p\">)<\/span><span class=\"w\"> <\/span><span class=\"p\">{<\/span>\n<span class=\"w\">        <\/span><span class=\"n\">printf<\/span><span class=\"p\">(<\/span><span class=\"s\">\"I am child process 1.<\/span><span class=\"se\">\\n<\/span><span class=\"s\">\"<\/span><span class=\"p\">);<\/span>\n<span class=\"w\">        <\/span><span class=\"n\">printf<\/span><span class=\"p\">(<\/span><span class=\"s\">\"Pid: %d<\/span><span class=\"se\">\\t<\/span><span class=\"s\">Parent Pid: %d<\/span><span class=\"se\">\\n<\/span><span class=\"s\">\"<\/span><span class=\"p\">,<\/span><span class=\"w\"> <\/span><span class=\"n\">getpid<\/span><span class=\"p\">(),<\/span><span class=\"w\"> <\/span><span class=\"n\">getppid<\/span><span class=\"p\">());<\/span>\n<span class=\"w\">        <\/span><span class=\"k\">return<\/span><span class=\"w\"> <\/span><span class=\"mi\">0<\/span><span class=\"p\">;<\/span><span class=\"w\">                 <\/span><span class=\"c1\">// child 1 到此結束，不會往下執行第二個 fork<\/span>\n<span class=\"w\">    <\/span><span class=\"p\">}<\/span>\n<span class=\"w\">    <\/span><span class=\"k\">if<\/span><span class=\"w\"> <\/span><span class=\"p\">(<\/span><span class=\"n\">fork<\/span><span class=\"p\">()<\/span><span class=\"w\"> <\/span><span class=\"o\">==<\/span><span class=\"w\"> <\/span><span class=\"mi\">0<\/span><span class=\"p\">)<\/span><span class=\"w\"> <\/span><span class=\"p\">{<\/span>\n<span class=\"w\">        <\/span><span class=\"n\">printf<\/span><span class=\"p\">(<\/span><span class=\"s\">\"I am child process 2.<\/span><span class=\"se\">\\n<\/span><span class=\"s\">\"<\/span><span class=\"p\">);<\/span>\n<span class=\"w\">        <\/span><span class=\"n\">printf<\/span><span class=\"p\">(<\/span><span class=\"s\">\"Pid: %d<\/span><span class=\"se\">\\t<\/span><span class=\"s\">Parent Pid: %d<\/span><span class= /code><\/pre><\/div>\n\n<ul>\n<li><strong>能保證的<\/strong>：parent 最後印（兩次 wait）。<\/li>\n<li><strong>不能保證的<\/strong>：child 1 與 child 2 的先後（只是程式太短，child 1 通常先跑完）。<\/li>\n<li><strong>關鍵<\/strong>：child 裡的 <code>return 0<\/code> 很重要。如果拿掉，child 1 會繼續往下執行第二個 <code>fork()<\/code>，多生出一個 process。<\/li>\n<\/ul>\n<h3 id=\"lab6-45-wait\">4.5 wait 範例<\/h3>\n<div class=\"hl\"><pre><span><\/span><code><span class=\"k\">switch<\/span><span class=\"w\"> <\/span><span class=\"p\">(<\/span><span class=\"n\">new_pid<\/span><span class=\"p\">)<\/span><span class=\"w\"> <\/span><span class=\"p\">{<\/span>\n<span class=\"w\">    <\/span><span class=\"k\">case<\/span><span class=\"w\"> <\/span><span class=\"mi\">-1<\/span><span class=\"p\">:<\/span><span class=\"w\"> <\/span><span class=\"n\">printf<\/span><span class=\"p\">(<\/span><span class=\"s\">\"fork error<\/span><span class=\"se\">\\n<\/span><span class=\"s\">\"<\/span><span class=\"p\">);<\/span><span class=\"w\"> <\/span><span class=\"k\">break<\/span><span class=\"p\">;<\/span>\n<span class=\"w\">    <\/span><span class=\"k\">case<\/span><span class=\"w\"> <\/span><span class=\"mi\">0<\/span><span class=\"p\">:<\/span><span class=\"w\">  <\/span><span class=\"n\">printf<\/span><span class=\"p\">(<\/span><span class=\"s\">\"<\/span><span class=\"se\">\\n<\/span><span class=\"s\">-------this is child process-------<\/span><span class=\"se\">\\n<\/span><span class=\"s\">\"<\/span><span class=\"p\">);<\/span>\n<span class=\"w\">             <\/span><span class=\"n\">printf<\/span><span class=\"p\">(<\/span><span class=\"s\">\"pid: %d<\/span><span class=\"se\">\\t<\/span><span class=\"s\"> parent pid: %d<\/span><span class=\"se\">\\n<\/span><span class=\"s\">\"<\/span><span class=\"p\">,<\/span><span class=\"w\"> <\/span><span class=\"n\">getpid<\/span><span class=\"p\">(),<\/span><span class=\"w\"> <\/span><span class=\"n\">getppid<\/span><span class=\"p\">());<\/span><span class=\"w\"> <\/span><span class=\"k\">break<\/span><span class=\"p\">;<\/span>\n<span class=\"w\">    <\/span><span class=\"k\">default<\/span><span class=\"o\">:<\/span><span class=\"w\"> <\/span><span class=\"n\">wait<\/span><span class=\"p\">(<\/span><span class=\"nb\">NULL<\/span><span class=\"p\">);<\/span><span class=\"w\">                         <\/span><span class=\"c1\">// 先等 child 結束<\/span>\n<span class=\"w\">             <\/span><span class=\"n\">printf<\/span><span class=\"p\">(<\/span><span class=\"s\">\"<\/span><span class=\"se\">\\n<\/span><span class=\"s\">-------this is parent process------<\/span><span class=\"se\">\\n<\/span><span class=\"s\">\"<\/span><span class=\"p\">);<\/span>\n<span class=\"w\">             <\/span><span class=\"n\">printf<\/span><span class=\"p\">(<\/span><span class=\"s\">\"pid: %d<\/span><span class=\"se\">\\t<\/span><span class=\"s\"> child pid: %d<\/span><span class=\"se\">\\n<\/span><span class=\"s\">\"<\/span><span class=\"p\">,<\/span><span class=\"w\"> <\/span><span class=\"n\">getpid<\/span><span class=\"p\">(),<\/span><span class=\"w\"> <\/span><span class=\"n\">new_pid<\/span><span class=\"p\">);<\/span><span class=\"w\"> <\/span><span class=\"k\">break<\/span><span class=\"p\">;<\/span>\n<span class=\"p\">}<\/span>\n<\/code><\/pre><\/div>\n\n<p>因為 parent 先 wait，<strong>輸出一定是 child 區塊在前、parent 區塊在後<\/strong>。<\/p>\n<h3 id=\"lab6-46-exec\">4.6 exec 範例<\/h3>\n<div class=\"hl\"><pre><span><\/span><code><span class=\"kt\">pid_t<\/span><span class=\"w\"> <\/span><span class=\"n\">new_pid<\/span><span class=\"w\"> <\/span><span class=\"o\">=<\/span><span class=\"w\"> <\/span><span class=\"n\">fork<\/span><span class=\"p\">();<\/span>\n<span class=\"k\">switch<\/span><span class=\"p\">(<\/span><span class=\"n\">new_pid<\/span><span class=\"p\">){<\/span>\n<span class=\"w\">    <\/span><span class=\"k\">case<\/span><span class=\"w\"> <\/span><span class=\"mi\">-1<\/span><span class=\"p\">:<\/span><span class=\"w\"> <\/span><span class=\"n\">printf<\/span><span class=\"p\">(<\/span><span class=\"s\">\"fork error<\/span><span class=\"se\">\\n<\/span><span class=\"s\">\"<\/span><span class=\"p\">);<\/span><span class=\"w\"> <\/span><span class=\"k\">break<\/span><span class=\"p\">;<\/span>\n<span class=\"w\">    <\/span><span class=\"k\">case<\/span><span class=\"w\"> <\/span><span class=\"mi\">0<\/span><span class=\"w\"> <\/span><span class=\"p\">:<\/span><span class=\"w\"> <\/span><span class=\"n\">execlp<\/span><span class=\"p\">(<\/span><span class=\"s\">\"/bin/ls\"<\/span><span class=\"p\">,<\/span><span class=\"w\"> <\/span><span class=\"s\">\"ls\"<\/span><span class=\"p\">,<\/span><span class=\"w\"> <\/span><span class=\"s\">\"-l\"<\/span><span class=\"p\">,<\/span><span class=\"w\"> <\/span><span class=\"nb\">NULL<\/span><span class=\"p\">);<\/span><span class=\"w\">   <\/span><span class=\"c1\">// child 變成 ls -l<\/span>\n<span class=\"w\">             <\/span><span class=\"k\">break<\/span><span class=\"p\">;<\/span><span class=\"w\">                                 <\/span><span class=\"c1\">// exec 成功就不會執行到這<\/span>\n<span class=\"w\">    <\/span><span class=\"k\">default<\/span><span class=\"o\">:<\/span><span class=\"w\"> <\/span><span class=\"n\">printf<\/span><span class=\"p\">(<\/span><span class=\"s\">\"<\/span><span class=\"se\">\\n<\/span><span class=\"s\">------this is parent process-------<\/span><span class=\"se\">\\n<\/span><span class=\"s\">\"<\/span><span class=\"p\">);<\/span>\n<span class=\"w\">             <\/span><span class=\"n\">printf<\/span><span class=\"p\">(<\/span><span class=\"s\">\"Pid : %d<\/span><span class=\"se\">\\t<\/span><span class=\"s\"> chile pid : %d<\/span><span class=\"se\">\\t<\/span><span class=\"s\">\"<\/span><span class=\"p\">,<\/span><span class=\"w\"> <\/span><span class=\"n\">getpid<\/span><span class=\"p\">(),<\/span><span class=\"w\"> <\/span><span class=\"n\">new_pid<\/span><span class=\"p\">);<\/span>\n<span class=\"w\">             <\/span><span class=\"n\">printf<\/span><span class
