class=\"n\">print_info<\/span><span class=\"p\">(<\/span><span class=\"s\">\"Child process after increment:\"<\/span><span class=\"p\">,<\/span><span class=\"w\"> <\/span><span class=\"n\">local_var<\/span><span class=\"p\">);<\/span>\n<span class=\"w\">        <\/span><span class=\"n\">exit<\/span><span class=\"p\">(<\/span><span class=\"mi\">0<\/span><span class=\"p\">);<\/span>\n<span class=\"w\">    <\/span><span class=\"p\">}<\/span><span class=\"w\"> <\/span><span class=\"k\">else<\/span><span class=\"w\"> <\/span><span class=\"p\">{<\/span><span class=\"w\">                               <\/span><span class=\"c1\">// parent<\/span>\n<span class=\"w\">        <\/span><span class=\"n\">wait<\/span><span class=\"p\">(<\/span><span class=\"nb\">NULL<\/span><span class=\"p\">);<\/span>\n<span class=\"w\">        <\/span><span class=\"n\">print_info<\/span><span class=\"p\">(<\/span><span class=\"s\">\"Parent process:\"<\/span><span class=\"p\">,<\/span><span class=\"w\"> <\/span><span class=\"n\">local_var<\/span><span class=\"p\">);<\/span>\n<span class=\"w\">        <\/span><span class=\"n\">print_info<\/span><span class=\"p\">(<\/span><span class=\"s\">\"Parent process after increment:\"<\/span><span class=\"p\">,<\/span><span class=\"w\"> <\/span><span class=\"n\">local_var<\/span><span class=\"p\">);<\/span>\n<span class=\"w\">        <\/span><span class=\"n\">printf<\/span><span class=\"p\">(<\/span><span class=\"s\">\"------...------<\/span><span class=\"se\">\\n<\/span><span class=\"s\">\"<\/span><span class=\"p\">);<\/span>\n<span class=\"w\">    <\/span><span class=\"p\">}<\/span>\n<span class=\"w\">    <\/span><span class=\"k\">return<\/span><span class=\"w\"> <\/span><span class=\"mi\">0<\/span><span class=\"p\">;<\/span>\n<span class=\"p\">}<\/span>\n<\/code><\/pre><\/div>\n\n<p>輸出（與投影片 Result 一致）：<\/p>\n<div class=\"hl\"><pre><span><\/span><code>Initial value:\nPID: 6461     ,PPID: 5746     , Global variable: 10   , Local variable: 10\n--------------------------------------------------------------------------\nChild process:\nPID: 6462     ,PPID: 6461     , Global variable: 10   , Local variable: 10\nChild process after increment:\nPID: 6462     ,PPID: 6461     , Global variable: 11   , Local variable: 11\nParent process:\nPID: 6461     ,PPID: 5746     , Global variable: 10   , Local variable: 10\nParent process after increment:\nPID: 6461     ,PPID: 5746     , Global variable: 10   , Local variable: 10\n--------------------------------------------------------------------------\n<\/code><\/pre><\/div>\n\n<p><strong>重點<\/strong>：child 把 global 和 local 都加到 11，但 parent 看到的<strong>仍是 10<\/strong>——fork 複製了整份記憶體，<strong>連 global 變數也不共享<\/strong>（常見誤解：以為 global 會共享）。<\/p>\n<p><strong>評論<\/strong>：\n- <code>fflush(stdout)<\/code> 很好：避免 stdout 被導向檔案或 pipe 時（全緩衝），fork 把還沒印出的 \"Initial value\" 複製到 child 造成<strong>重複輸出<\/strong>（例如 <code>./ex1 &gt; out.txt<\/code> 會看到兩次）。\n- <code>wait(NULL)<\/code> 讓 parent 在 child 之後輸出，順序固定、好 demo。\n- 「Parent process after increment」那行 parent 其實<strong>沒有做遞增<\/strong>（只是再印一次），這和投影片的 Result 一致（parent 兩行都是 10）。題目文字說「increases both the values」語意上有點模糊；如果助教要求 parent 也要自己遞增，parent 會印出 11——但那是 parent 自己的 11，與 child 無關。考試時能解釋這一點即可。<\/p>\n<h3 id=\"lab6-48-practicelab6ex2cexercise-2process-tree\">4.8 學生作業 practice/lab6/ex2.c（Exercise 2：process tree）<\/h3>\n<p>目標樹：<\/p>\n<div class=\"hl\"><pre><span><\/span><code>        A\n      / | \\\n     B  D  E\n     |\n     C\n<\/code><\/pre><\/div>\n\n<div class=\"hl\"><pre><span><\/span><code><span class=\"n\">pid<\/span><span class=\"w\"> <\/span><span class=\"o\">=<\/span><span class=\"w\"> <\/span><span class=\"n\">fork<\/span><span class=\"p\">();<\/span><span class=\"w\">                          <\/span><span class=\"c1\">// A 產生 E<\/span>\n<span class=\"k\">if<\/span><span class=\"w\"> <\/span><span class=\"p\">(<\/span><span class=\"n\">pid<\/span><span class=\"w\"> <\/span><span class=\"o\">==<\/span><span class=\"w\"> <\/span><span class=\"mi\">0<\/span><span class=\"p\">)<\/span><span class=\"w\"> <\/span><span class=\"p\">{<\/span><span class=\"w\"> <\/span><span class=\"n\">report<\/span><span class=\"p\">(<\/span><span class=\"sc\">'E'<\/span><span class=\"p\">,<\/span><span class=\"w\"> <\/span><span class=\"s\">\"Child process\"<\/span><span class=\"p\">);<\/span><span class=\"w\"> <\/span><span class=\"n\">exit<\/span><span class=\"p\">(<\/span><span class=\"mi\">0<\/span><span class=\"p\">);<\/span><span class=\"w\"> <\/span><span class=\"p\">}<\/span>\n\n<span class=\"n\">pid<\/span><span class=\"w\"> <\/span><span class=\"o\">=<\/span><span class=\"w\"> <\/span><span class=\"n\">fork<\/span><span class=\"p\">();<\/span><span class=\"w\">                          <\/span><span class=\"c1\">// A 產生 B<\/span>\n<span class=\"k\">if<\/span><span class=\"w\"> <\/span><span class=\"p\">(<\/span><span class=\"n\">pid<\/span><span class=\"w\"> <\/span><span class=\"o\">==<\/span><span class=\"w\"> <\/span><span class=\"mi\">0<\/span><span class=\"p\">)<\/span><span class=\"w\"> <\/span><span class=\"p\">{<\/span><span class=\"w\">                        <\/span><span class=\"c1\">// B<\/span>\n<span class=\"w\">    <\/span><span class=\"kt\">pid_t<\/span><span class=\"w\"> <\/span><span class=\"n\">c<\/span><span class=\"w\"> <\/span><span class=\"o\">=<\/span><span class=\"w\"> <\/span><span class=\"n\">fork<\/span><span class=\"p\">();<\/span><span class=\"w\">                  <\/span><span class=\"c1\">// B 產生 C<\/span>\n<span class=\"w\">    <\/span><span class=\"k\">if<\/span><span class=\"w\"> <\/span><span class=\"p\">(<\/span><span class=\"n\">c<\/span><span class=\"w\"> <\/span><span class=\"o\">==<\/span><span class=\"w\"> <\/span><span class=\"mi\">0<\/span><span class=\"p\">)<\/span><span class=\"w\"> <\/span><span class=\"p\">{<\/span><span class=\"w\"> <\/span><span class=\"n\">report<\/span><span class=\"p\">(<\/span><span class=\"sc\">'C'<\/span><span class=\"p\">,<\/span><span class=\"w\"> <\/span><span class=\"s\">\"Child process\"<\/span><span class=\"p\">);<\/span><span class=\"w\"> <\/span><span class=\"n\">exit<\/span><span class=\"p\">(<\/span><span class=\"mi\">0<\/span><span class=\"p\">);<\/span><span class=\"w\"> <\/span><span class=\"p\">}<\/span>\n<span class=\"w\">    <\/span><span class=\"n\">wait<\/span><span class=\"p\">(<\/span><span class=\"nb\">NULL<\/span><span class=\"p\">);<\/span><span class=\"w\">                        <\/span><span class=\"c1\">// B 有 1 個 child → wait 1 次<\/span>\n<span class=\"w\">    <\/span><span class=\"n\">report<\/span><span class=\"p\">(<\/span><span class=\"sc\">'B'<\/span><span class=\"p\">,<\/span><span class=\"w\"> <\/span><span class=\"s\">\"Child process\"<\/span><span class=\"p\">);<\/span>\n<span class=\"w\">    <\/span><span class=\"n\">exit<\/span><span class=\"p\">(<\/span><span class=\"mi\">0<\/span><span class=\"p\">);<\/span>\n<span class=\"p\">}<\/span>\n\n<span class=\"n\">pid<\/span><span class=\"w\"> <\/span><span class=\"o\">=<\/span><span class=\"w\"> <\/span><span class=\"n\">fork<\/span><span class=\"p\">();<\/span><span class=\"w\">                          <\/span><span class=\"c1\">// A 產生 D<\/span>\n<span class=\"k\">if<\/span><span class=\"w\"> <\/span><span class=\"p\">(<\/span><span class=\"n\">pid<\/span><span class=\"w\"> <\/span><span class=\"o\">==<\/span><span class=\"w\"> <\/span><span class=\"mi\">0<\/span><span class=\"p\">)<\/span><span class=\"w\"> <\/span><span class=\"p\">{<\/span><span class=\"w\"> <\/span><span class=\"n\">report<\/span><span class=\"p\">(<\/span><span class=\"sc\">'D'<\/span><span class=\"p\">,<\/span><span class=\"w\"> <\/span><span class=\"s\">\"Child process\"<\/span><span class=\"p\">);<\/span><span class=\"w\"> <\/span><span class=\"n\">exit<\/span><span class=\"p\">(<\/span><span class=\"mi\">0<\/span><span class=\"p\">);<\/span><span class=\"w\"> <\/span><span class=\"p\">}<\/span>\n\n<span class=\"k\">for<\/span><span class=\"w\"> <\/span><span class=\"p\">(<\/span><span class=\"n\">i<\/span><span class=\"w\"> <\/span><span class=\"o\">=<\/span><span class=\"w\"> <\/span><span class=\"mi\">0<\/span><span class=\"p\">;<\/span><span class=\"w\"> <\/span><span class=\"n\">i<\/span><span class=\"w\"> <\/span><span class=\"o\">&lt;<\/span><span class=\"w\"> <\/span><span class=\"mi\">3<\/span><span class=\"p\">;<\/span><span class=\"w\"> <\/span><span class=\"n\">i<\/span><span class=\"o\">++<\/span><span class=\"p\">)<\/span><span class=\"w\"> <\/span><span class=\"n\">wait<\/span><span class=\"p\">(<\/span><span class=\"nb\">NULL<\/span><span class=\"p\">);<\/span><span class=\"w\">    <\/span><span class=\"c1\">// A 有 3 個 child → wait 3 次<\/span>\n<span class=\"n\">report<\/span><span class=\"p\">(<\/span><span class=\"sc\">'A'<\/span><span class=\"p\">,<\/span><span class=\"w\"> <\/span><span class=\"s\">\"Parent process\"<\/span><span class=\"p\">);<\/span>\n<\/code><\/pre><\/div>\n\n<p>輸出範例（與投影片一致）：<\/p>\n<div class=\"hl\"><pre><span><\/span><code>Child process E -   PID: 6455     , PPID: 6454\nChild process C -   PID: 6457     , PPID: 6456\nChild process B -   PID: 6456     , PPID: 6454\nChild process D -   PID: 6458     , PPID: 6454\nParent process A -  PID: 6454     , PPID: 5746\n<\/code><\/pre><\/div>\n\n<ul>\n<li>驗證：B、D、E 的 PPID = A 的 PID（6454）；C 的 PPID = B 的 PID（6456）。<\/li>\n<li><strong>保證<\/strong>：C 在 B 之前印（B 先 wait C）；A 最後印（wait 3 次）。E、D、B 之間的相對順序<strong>不保證<\/strong>。<\/li>\n<li>每個 child 在自己的分支最後都 <code>exit(0)<\/code>，<strong>防止 child 繼續往下執行 parent 的 fork<\/strong>——這正是備註強調的「不能單純連續 fork 四次」。<\/li>\n<li>程式正確、完整，符合題目要求。<\/li>\n<\/ul>\n<p><strong>為什麼不能連續 fork？<\/strong> <code>fork(); fork(); fork();<\/code> 會因為每個 child 也繼續執行後面的 fork，產生 2³ = 8 個 process，形狀也不對。<\/p>\n<hr />\n<h2 id=\"lab6-5\">5. 上機考實作步驟<\/h2>\n<div class=\"hl\"><pre><span><\/span><code>mkdir<span class=\"w\"> <\/span>-p<span class=\"w\"> <\/span>~/lab6<span class=\"w\"> <\/span><span class=\"o\">&amp;&amp;<\/span><spa   <\/span><span class=\"k\">if<\/span><span class=\"w\"> <\/span><span class=\"p\">(<\/span><span class=\"n\">fork<\/span><span class=\"p\">()<\/span><span class=\"w\"> <\/span><span class=\"o\">==<\/span><span class=\"w\"> <\/span><span class=\"mi\">0<\/span><span class=\"p\">)<\/span><span class=\"w\"> <\/span><span class=\"p\">{<\/span><span class=\"w\">                   <\/span><span class=\"cm\">/* C */<\/span>\n<span class=\"w\">            <\/span><span class=\"n\">printf<\/span><span class=\"p\">(<\/span><span class=\"s\">\"C: pid=%d ppid=%d<\/span><span class=\"se\">\\n<\/span><span class=\"s\">\"<\/span><span class=\"p\">,<\/span><span class=\"w\"> <\/span><span class=\"n\">getpid<\/span><span class=\"p\">(),<\/span><span class=\"w\"> <\/span><span class=\"n\">getppid<\/span><span class=\"p\">());<\/span>\n<span class=\"w\">            <\/span><span class=\"n\">exit<\/span><span class=\"p\">(<\/span><span class=\"mi\">0<\/span><span class=\"p\">);<\/span>\n<span class=\"w\">        <\/span><span class=\"p\">}<\/span>\n<span class=\"w\">        <\/span><span class=\"n\">wait<\/span><span class=\"p\">(<\/span><span class=\"nb\">NULL<\/span><span class=\"p\">);<\/span>\n<span class=\"w\">        <\/span><span class=\"n\">printf<\/span><span class=\"p\">(<\/span><span class=\"s\">\"B: pid=%d ppid=%d<\/span><span class=\"se\">\\n<\/span><span class=\"s\">\"<\/span><span class=\"p\">,<\/span><span class=\"w\"> <\/span><span class=\"n\">getpid<\/span><span class=\"p\">(),<\/span><span class=\"w\"> <\/span><span class=\"n\">getppid<\/span><span class=\"p\">());<\/span>\n<span class=\"w\">        <\/span><span class=\"n\">exit<\/span><span class=\"p\">(<\/span><span class=\"mi\">0<\/span><span class=\"p\">);<\/span>\n<span class=\"w\">    <\/span><span class=\"p\">}<\/span>\n<span class=\"w\">    <\/span><span class=\"k\">if<\/span><span class=\"w\"> <\/span><span class=\"p\">(<\/span><span class=\"n\">fork<\/span><span class=\"p\">()<\/span><span class=\"w\"> <\/span><span class=\"o\">==<\/span><span class=\"w\"> <\/span><span class=\"mi\">0<\/span><span class=\"p\">)<\/span><span class=\"w\"> <\/span><span class=\"p\">{<\/span><span class=\"w\"> <\/span><span class=\"n\">printf<\/span><span class=\"p\">(<\/span><span class=\"s\">\"D: pid=%d ppid=%d<\/span><span class=\"se\">\\n<\/span><span class=\"s\">\"<\/span><span class=\"p\">,<\/span><span class=\"w\"> <\/span><span class=\"n\">getpid<\/span><span class=\"p\">(),<\/span><span class=\"w\"> <\/span><span class=\"n\">getppid<\/span><span class=\"p\">());<\/span><span class=\"w\"> <\/span><span class=\"n\">exit<\/span><span class=\"p\">(<\/span><span class=\"mi\">0<\/span><span class=\"p\">);<\/span><span class=\"w\"> <\/span><span class=\"p\">}<\/span>\n<span class=\"w\">    <\/span><span class=\"k\">if<\/span><span class=\"w\"> <\/span><span class=\"p\">(<\/span><span class=\"n\">fork<\/span><span class=\"p\">()<\/span><span class=\"w\"> <\/span><span class=\"o\">==<\/span><span class=\"w\"> <\/span><span class=\"mi\">0<\/span><span class=\"p\">)<\/span><span class=\"w\"> <\/span><span class=\"p\">{<\/span><span class=\"w\"> <\/span><span class=\"n\">printf<\/span><span class=\"p\">(<\/span><span class=\"s\">\"E: pid=%d ppid=%d<\/span><span class=\"se\">\\n<\/span><span class=\"s\">\"<\/span><span class=\"p\">,<\/span><span class=\"w\"> <\/span><span class=\"n\">getpid<\/span><span class=\"p\">(),<\/span><span class=\"w\"> <\/span><span class=\"n\">getppid<\/span><span class=\"p\">());<\/span><span class=\"w\"> <\/span><span class=\"n\">exit<\/span><span class=\"p\">(<\/span><span class=\"mi\">0<\/span><span class=\"p\">);<\/span><span class=\"w\"> <\/span><span class=\"p\">}<\/span>\n<span class=\"w\">    <\/span><span class=\"k\">for<\/span><span class=\"w\"> <\/span><span class=\"p\">(<\/span><span class=\"kt\">int<\/span><span class=\"w\"> <\/span><span class=\"n\">i<\/span><span class=\"w\"> <\/span><span class=\"o\">=<\/span><span class=\"w\"> <\/span><span class=\"mi\">0<\/span><span class=\"p\">;<\/span><span class=\"w\"> <\/span><span class=\"n\">i<\/span><span class=\"w\"> <\/span><span class=\"o\">&lt;<\/span><span class=\"w\"> <\/span><span class=\"mi\">3<\/span><span class=\"p\">;<\/span><span class=\"w\"> <\/span><span class=\"n\">i<\/span><span class=\"o\">++<\/span><span class=\"p\">)<\/span><span class=\"w\"> <\/span><span class=\"n\">wait<\/span><span class=\"p\">(<\/span><span class=\"nb\">NULL<\/span><span class=\"p\">);<\/span>\n<span class=\"w\">    <\/span><span class=\"n\">printf<\/span><span class=\"p\">(<\/span><span class=\"s\">\"A: pid=%d ppid=%d<\/span><span class=\"se\">\\n<\/span><span class=\"s\">\"<\/span><span class=\"p\">,<\/span><span class=\"w\"> <\/span><span class=\"n\">getpid<\/span><span class=\"p\">(),<\/span><span class=\"w\"> <\/span><span class=\"n\">getppid<\/span><span class=\"p\">());<\/span>\n<span class=\"w\">    <\/span><span class=\"k\">return<\/span><span class=\"w\"> <\/span><span class=\"mi\">0<\/span><span class=\"p\">;<\/span>\n<span class=\"p\">}<\/span>\n<\/code><\/pre><\/div>\n\n<hr />\n<h2 id=\"lab6-6\">6. 常見錯誤與陷阱<\/h2>\n<ol>\n<li><strong>child 分支沒有 <code>exit()<\/code>／<code>return<\/code><\/strong> → child 繼續往下跑 parent 的程式碼，又 fork 出多餘的 process。<\/li>\n<li>以為 <strong>global 變數在 fork 後共享<\/strong> → 錯，每個 process 各有一份複製。<\/li>\n<li>以為 fork 在 child 回傳的 0 是 child 的 PID → 錯，要用 <code>getpid()<\/code>。<\/li>\n<li>以為 parent/child <strong>執行順序固定<\/strong> → 由 scheduler 決定；要固定順序就用 <code>wait()<\/code>。<\/li>\n<li><strong>wait 次數不足<\/strong>：有 3 個 child 只 wait 1 次 → parent 可能在其他 child 結束前就印出／結束。<\/li>\n<li><code>execlp<\/code> 參數<strong>忘了最後的 <code>NULL<\/code><\/strong> → 未定義行為。<\/li>\n<li>以為 exec 之後的程式碼還會執行 → exec 成功就不會返回；只有失敗才會繼續（應在後面加 <code>perror(\"execlp\"); exit(1);<\/code>）。<\/li>\n<li><code>switch<\/code> 中 <code>case -1:<\/code> 忘了 <code>break<\/code> → fall-through（投影片範例 4.2 就有這個問題）。<\/li>\n<li><strong>printf buffer + fork<\/strong>：fork 前沒 <code>fflush(stdout)<\/code> 且輸出被導向檔案時，fork 前的輸出會出現兩次。<\/li>\n<li>沒 <code>#include &lt;sys/wait.h&gt;<\/code> 就用 <code>wait()<\/code> → 編譯警告／錯誤。<\/li>\n<\/ol>\n<hr />\n<h2 id=\"lab6-7\">7. 筆試模擬題<\/h2>\n<p><strong>Q1（選擇）<\/strong> <code>fork()<\/code> 在 child process 中的回傳值為？\n(A) child 的 PID　(B) parent 的 PID　(C) 0　(D) -1<\/p>\n<blockquote>\n<p><strong>答：C<\/strong>。parent 拿到 child 的 PID；失敗 -1。<\/p>\n<\/blockquote>\n<p><strong>Q2（選擇）<\/strong> 下列變數各存在 process 的哪個區段？<code>int g = 1;<\/code>（全域）、函式內 <code>int x = 2;<\/code>、<code>malloc<\/code> 出來的空間\n(A) data / stack / heap　(B) stack / data / heap　(C) data / heap / stack　(D) text / stack / heap<\/p>\n<blockquote>\n<p><strong>答：A<\/strong>。<\/p>\n<\/blockquote>\n<p><strong>Q3（輸出預測）<\/strong> 下列程式共印出幾行 <code>hi<\/code>？<\/p>\n<div class=\"hl\"><pre><span><\/span><code><span class=\"kt\">int<\/span><span class=\"w\"> <\/span><span class=\"nf\">main<\/span><span class=\"p\">(){<\/span><span class=\"w\"> <\/span><span class=\"n\">fork<\/span><span class=\"p\">();<\/span><span class=\"w\"> <\/span><span class=\"n\">fork<\/span><span class=\"p\">();<\/span><span class=\"w\"> <\/span><span class=\"n\">printf<\/span><span class=\"p\">(<\/span><span class=\"s\">\"hi<\/span><span class=\"se\">\\n<\/span><span class=\"s\">\"<\/span><span class=\"p\">);<\/span><span class=\"w\"> <\/span><span class=\"k\">return<\/span><span class=\"w\"> <\/span><span class=\"mi\">0<\/span><span class=\"p\">;<\/span><span class=\"w\"> <\/span><span class=\"p\">}<\/span>\n<\/code><\/pre><\/div>\n\n<blockquote>\n<p><strong>答：4 行<\/strong>。第一次 fork 後 2 個 process，各自再 fork → 4 個 process，每個印一次。<\/p>\n<\/blockquote>\n<p><strong>Q4（輸出預測）<\/strong><\/p>\n<div class=\"hl\"><pre><span><\/span><code><span class=\"kt\">int<\/span><span class=\"w\"> <\/span><span class=\"n\">x<\/span><span class=\"w\"> <\/span><span class=\"o\">=<\/span><span class=\"w\"> <\/span><span class=\"mi\">5<\/span><span class=\"p\">;<\/span>\n<span class=\"kt\">int<\/span><span class=\"w\"> <\/span><span class=\"nf\">main<\/span><span class=\"p\">(){<\/span>\n<span class=\"w\">    <\/span><span class=\"kt\">pid_t<\/span><span class=\"w\"> <\/span><span class=\"n\">p<\/span><span class=\"w\"> <\/span><span class=\"o\">=<\/span><span class=\"w\"> <\/span><span class=\"n\">fork<\/span><span class=\"p\">();<\/span>\n<span class=\"w\">    <\/span><span class=\"k\">if<\/span><span class=\"w\"> <\/span><span class=\"p\">(<\/span><span class=\"n\">p<\/span><span class=\"w\"> <\/span><span class=\"o\">==<\/span><span class=\"w\"> <\/span><span class=\"mi\">0<\/span><span class=\"p\">)<\/span><span class=\"w\"> <\/span><span class=\"p\">{<\/span><span class=\"w\"> <\/span><span class=\"n\">x<\/span><span class=\"w\"> <\/span><span class=\"o\">+=<\/span><span class=\"w\"> <\/span><span class=\"mi\">10<\/span><span class=\"p\">;<\/span><span class=\"w\"> <\/span><span class=\"n\">printf<\/span><span class=\"p\">(<\/span><span class=\"s\">\"child x=%d<\/span><span class=\"se\">\\n<\/span><span class=\"s\">\"<\/span><span class=\"p\">,<\/span><span class=\"w\"> <\/span><span class=\"n\">x<\/span><span class=\"p\">);<\/span><span class=\"w\"> <\/span><span class=\"k\">return<\/span><span class=\"w\"> <\/span><span class=\"mi\">0<\/span><span class=\"p\">;<\/span><span class=\"w\"> <\/span><span class=\"p\">}<\/span>\n<span class=\"w\">    <\/span><span class=\"n\">wait<\/span><span class=\"p\">(<\/span><span class=\"nb\">NULL<\/span><span class=\"p\">);<\/span>\n<span class=\"w\">    <\/span><span class=\"n\">printf<\/span><span class=\"p\">(<\/span><span class=\"s\">\"parent x=%d<\/span><span class=\"se\">\\n<\/span><span class=\"s\">\"<\/span><span class=\"p\">,<\/span><span class=\"w\"> <\/span><span class=\"n\">x<\/span><span class=\"p\">);<\/span>\n<span class=\"w\">    <\/span><span class=\"k\">return<\/span><span class=\"w\"> <\/span><span class=\"mi\">0<\/span><span class=\"p\">;<\/span>\n<span class=\"p\">}<\/span>\n<\/code><\/pre><\/div>\n\n<blockquote>\n<p><strong>答：<\/strong>\n<code>child x=15\nparent x=5<\/code>\nfork 複製記憶體，child 的修改不影響 parent；wait 保證 child 先印。<\/p>\n<\/blockquote>\n<p><strong>Q5（是非）<\/strong> exec 成功後，exec 呼叫之後的程式碼仍會繼續執行。<\/p>\n<blockquote>\n<p><strong>答：錯<\/strong>。process image 已被新程式覆蓋，成功的 exec 不會返回。<\/p>\n<\/blockquote>\n<p><strong>Q6（簡答）<\/strong> <code>execlp(\"ls\", \"ls\", \"-l\", NULL)<\/code> 中各參數的意義？<code>l<\/code> 和 <code>p<\/code> 代表什麼？<\/p>\n<blockquote>\n<p><strong>答：<\/strong> 第 1 個 <code>\"ls\"<\/code>：要到 PATH 中尋找的檔案；第 2 個 <code>\"ls\"<\/code>：新程式的 argv[0]；<code>\"-l\"<\/code>：命令列參數；<code>NULL<\/code>：參數列結束標記。l = list（參數逐一列出），p = path（自動搜尋 PATH）。<\/p>\n<\/blockquote>\n<p><strong>Q7（選擇）<\/strong> <code>wait()<\/code> 的回傳值為？\n(A) child 的 exit status　(B) 結束的 child 之 PID，錯誤時 -1　(C) 永遠 0　(D) parent 的 PID<\/p>\n<blockquote>\n<p><strong>答：B<\/strong>。exit status 透過參數 <code>stat_loc<\/code> 取得。<\/p>\n<\/blockquote>\n<p><strong>Q8（簡答）<\/strong> parent 有 3 個 child，要確保 parent 在所有 child 結束後才印訊息，要怎麼做？<\/p>\n<blockquote>\n<p><strong>答：<\/strong> 呼叫 3 次 <code>wait()<\/code>（一次 wait 只回收一個 child），例如 <code>for(i=0;i&lt;3;i++) wait(NULL);<\/code>。<\/p>\n<\/blockquote>\n<p><strong>Q9（輸出預測）<\/strong> 投影片多次 fork 範例中，下列敘述何者「一定」成立？\n(A) child 1 一定在 child 2 前印　(B) parent 一定最後印　(C) child 2 一定最後印　(D) 輸出順序每次都一樣<\/p>\n<blockquote>\n<p><strong>答：B<\/strong>。parent wait 兩次後才印；child 之間的順序由 scheduler 決定。<\/p>\n<\/blockquote>\n<p><strong>Q10（是非）<\/strong> 一個 process 包含程式碼，也包含 program counter 與 registers 等目前執行狀態。<\/p>\n<blockquote>\n<p><strong>答：對<\/strong>。<\/p>\n<\/blockquote>\n<p><strong>Q11（簡答）<\/strong> 為什麼 Exercise 2 不能直接 <code>fork()<\/code> 四次？<\/p>\n<blockquote>\n<p><strong>答：<\/strong> fork 後 child 也會執行後面的程式碼，連續 fork 4 次會產生 2⁴ = 16 個 process，且樹的形狀不符。必須用 fork 回傳值判斷身分，只讓特定 process 繼續 fork，並讓沒有 child 的 process 印完就 exit。<\/p>\n<\/blockquote>\n<p><strong>Q12（程式填空）<\/strong> 讓 child 執行 <code>ls -l<\/code>、parent 等 child 結束後印 \"done\"：<\/p>\n<div class=\"hl\"><pre><span><\/span><code><span class=\"kt\">pid_t<\/span><span class=\"w\"> <\/span><span class=\"n\">pid<\/span><span class=\"w\"> <\/span><span class=\"o\">=<\/span><span class=\"w\"> <\/span><span class=\"n\">fork<\/span><span class=\"p\">();<\/span>\n<span class=\"k\">if<\/span><span class=\"w\"> <\/span><span class=\"p\">(<\/span><span class=\"n\">pid<\/span><span class=\"w\"> <\/span><span class=\"o\">==<\/span><span class=\"w\"> <\/span><span class=\"mi\">0<\/span><span class=\"p\">)<\/span><span class=\"w\"> <\/span><span class=\"p\">{<\/span><span class=\"w\"> <\/span><span class=\"n\">________________<\/span><span class=\"p\">;<\/span><span class=\"w\"> <\/span><span class=\"n\">perror<\/span><span class=\"p\">(<\/span><span class=\"s\">\"exec\"<\/span><span class=\"p\">);<\/span><span class=\"w\"> <\/span><span class=\"n\">exit<\/span><span class=\"p\">(<\/span><span class=\"mi\">1<\/span><span class=\"p\">);<\/span><span class=\"w\"> <\/span><span class=\"p\">}<\/span>\n<span class=\"n\">________<\/span><span class=\"p\">;<\/span>\n<span class=\"n\">printf<\/span><span class=\"p\">(<\/span><span class=\"s\">\"done<\/span><span class=\"se\">\\n<\/span><span class=\"s\">\"<\/span><span class=\"p\">);<\/span>\n<\/code><\/pre><\/div>\n\n<blockquote>\n<p><strong>答：<\/strong> <code>execlp(\"ls\", \"ls\", \"-l\", NULL)<\/code>；<code>wait(NULL)<\/code>。<\/p>\n<\/blockquote>\n<p><strong>Q13（輸出預測）<\/strong> 在 child 中呼叫 <code>getppid()<\/code>，若 parent 已經先結束，可能得到什麼？<\/p>\n<blockquote>\n<p><strong>答：<\/strong>（補充）child 成為 orphan，被 init/systemd（或 subreaper）收養，<code>getppid()<\/code> 會回傳收養者的 PID（例如 1），而不是原 parent 的 PID。<\/p>\n<\/blockquote>", "toc": [{"id": "lab6-1-lab", "name": "1. 這個 LAB 在學什麼", "kids": []}, {"id": "lab6-2", "name": "2. 核心觀念", "kids": [{"id": "lab6-21-process", "name": "2.1 Process 是什麼"}, {"id": "lab6-22-process-tree", "name": "2.2 Process tree"}, {"id": "lab6-23-pid", "name": "2.3 PID"}, {"id": "lab6-24-fork", "name": "2.4 fork()（最重要）"}, {"id": "lab6-25-wait", "name": "2.5 wait()"}, {"id": "lab6-26-exec", "name": "2.6 exec 系列"}]}, {"id": "lab6-3-apisystem-call", "name": "3. 指令／API／system call 速查表", "kids": []}, {"id": "lab6-4", "name": "4. 程式範例逐行解說", "kids": [{"id": "lab6-41", "name": "4.1 記憶體區段範例"}, {"id": "lab6-42-fork-switch", "name": "4.2 fork + switch"}, {"id": "lab6-43-fork-if", "name": "4.3 fork + if（等價寫法）"}, {"id": "lab6-44-fork-wait", "name": "4.4 多次 fork + 兩次 wait"}, {"id": "lab6-45-wait", "name": "4.5 wait 範例"}, {"id": "lab6-46-exec", "name": "4.6 exec 範例"}, {"id": "lab6-47-practicelab6ex1cexercise-1", "name": "4.7 學生作業 practice/lab6/ex1.c（Exercise 1）"}, {"id": "lab6-48-practicelab6ex2cexercise-2process-tree", "name": "4.8 學生作業 practice/lab6/ex2.c（Exercise 2：process tree）"}]}, {"id": "lab6-5", "name": "5. 上機考實作步驟", "kids": []}, {"id": "lab6-6", "name": "6. 常見錯誤與陷阱", "kids": []}, {"id": "lab6-7", "name": "7. 筆試模擬題", "kids": []}]}, {"id": "lab7", "short": "Lab 7", "title": "Lab 7 複習：IPC — Message Queue（7-1）＋ Shared Memory（7-2）", "html": "<h1 id=\"lab7-lab-7-ipc-message-queue7-1-shared-memory7-2\">Lab 7 複習：IPC — Message Queue（7-1）＋ Shared Memory（7-2）<\/h1>\n<blockquote>\n<p>來源：Lab7-1.pdf（27 頁）、Lab7-2.pdf（30 頁）——兩份 PDF 都是<strong>圖片型<\/strong>投影片，沒有文字層，內容是將頁面圖片逐張檢視後整理的。\n學生程式：practice/lab7/ex1/（sender.c、receiver.c）、practice/lab7/ex2/（producer.c、consumer.c）以及編好的執行檔。<\/p>\n<\/blockquote>\n<hr />\n<h2 id=\"lab7-1-lab\">1. 這個 LAB 在學什麼<\/h2>\n<p>學兩種讓<strong>不相關的 process 交換資料<\/strong>的 POSIX IPC（Inter-Process Communication）機制：\n- <strong>7-1 Message Queue<\/strong>：kernel 維護一個訊息佇列，sender 用 <code>mq_send()<\/code> 丟訊息進去，receiver 用 <code>mq_receive()<\/code> 依序取出。Exercise 1：sender 反覆輸入字串直到 <code>exit<\/code>，receiver 反覆接收並印出，最後 close &amp; unlink。\n- <strong>7-2 Shared Memory<\/strong>：用 <code>shm_open()<\/code> 建一個共享記憶體物件，<code>ftruncate()<\/code> 設大小，<code>mmap()<\/code> 映射到自己的位址空間，兩個 process 直接讀寫同一塊實體記憶體。Exercise 2：producer 把使用者輸入寫進 shared memory，consumer 印出來。\n- 兩者編譯都要加 <strong><code>-lrt<\/code><\/strong>（librt）。<\/p>\n<hr />\n<h1 id=\"lab7-part-1lab-7-1-message-queue\">Part 1：Lab 7-1 Message Queue<\/h1>\n<h2 id=\"lab7-21\">2.1 核心觀念<\/h2>\n<h3 id=\"lab7-message-queue\">什麼是 Message Queue<\/h3>\n<ul>\n<li>提供一種<strong>簡單又有效率<\/strong>的方式，在<strong>兩個不相關的 process<\/strong> 之間傳遞資料。<\/li>\n<li>Process A 把 message 放進 queue，Process B 從 queue 取出；訊息是一則一則的（有邊界），不是位元組串流。<\/li>\n<li>Linux 內部結構：<code>struct msqid_ds<\/code> 裡有 <code>ipc_perm<\/code> 結構（擁有者與權限）、<code>*msg_first<\/code>、<code>*msg_last<\/code> 指標，指向一串 <code>struct msg<\/code> 的 linked list，每個 <code>msg<\/code> 有 <code>*next<\/code>、<code>type<\/code>、<code>message<\/code>。<\/li>\n<\/ul>\n<h3 id=\"lab7-posix-message-queue\">POSIX Message Queue 五個主要函式<\/h3>\n<table>\n<thead>\n<tr>\n<th>函式<\/th>\n<th>作用<\/th>\n<\/tr>\n<\/thead>\n<tbody>\n<tr>\n<td><code>mq_open()<\/code><\/td>\n<td>建立新的 queue 或開啟既有的 queue<\/td>\n<\/tr>\n<tr>\n<td><code>mq_close()<\/code><\/td>\n<td>關閉 queue（<strong>不會刪除 queue<\/strong>）<\/td>\n<\/tr>\n<tr>\n<td><code>mq_unlink()<\/code><\/td>\n<td>刪除 queue（移除名字）<\/td>\n<\/tr>\n<tr>\n<td><code>mq_send()<\/code><\/td>\n<td>寫一則訊息進 queue<\/td>\n<\/tr>\n<tr>\n<td><code>mq_receive()<\/code><\/td>\n<td>從 queue 讀一則訊息<\/td>\n<\/tr>\n<\/tbody>\n<\/table>\n<h3 id=\"lab7-close-vs-unlink\">close vs unlink（必考）<\/h3>\n<ul>\n<li><code>mq_close(mqd)<\/code>：只是這個 process <strong>不再使用<\/strong>這個 descriptor，queue 還存在，訊息還在。<\/li>\n<li><code>mq_unlink(name)<\/code>：<strong>移除 queue 的名字<\/strong>；之後沒有 <code>O_CREAT<\/code> 的 <code>mq_open<\/code> 就無法用這個名字開到它。真正<strong>銷毀<\/strong> queue 的時機：reference count 降到 0 時立即銷毀，否則<strong>延後到所有參照都 close 之後<\/strong>。<\/li>\n<li>慣例：sender 只 close；最後一個用完的（receiver）負責 unlink。<\/li>\n<\/ul>\n<h3 id=\"lab7-mq_attr\">mq_attr 屬性<\/h3>\n<div class=\"hl\"><pre><span><\/span><code><span class=\"k\">struct<\/span><span class=\"w\"> <\/span><span class=\"nc\">mq_attr<\/span><span class=\"w\"> <\/span><span class=\"p\">{<\/span>\n<span class=\"w\">    <\/span><span class=\"kt\">long<\/span><span class=\"w\"> <\/span><span class=\"n\">mq_flags<\/span><span class=\"p\">;<\/span><span class=\"w\">    <\/span><span class=\"cm\">/* 0 或 O_NONBLOCK            [mq_getattr(), mq_setattr()] */<\/span>\n<span class=\"w\">    <\/span><span class=\"kt\">long<\/span><span class=\"w\"> <\/span><span class=\"n\">mq_maxmsg<\/span><span class=\"p\">;<\/span><span class=\"w\">   <\/span><span class=\"cm\">/* queue 最多幾則訊息          [mq_open(), mq_getattr()] */<\/span>\n<span class=\"w\">    <\/span><span class=\"kt\">long<\/span><span class=\"w\"> <\/span><span class=\"n\">mq_msgsize<\/span><span class=\"p\">;<\/span><span class=\"w\">  <\/span><span class=\"cm\">/* 每則訊息最大 bytes          [mq_open(), mq_getattr()] */<\/span>\n<span class=\"w\">    <\/span><span class=\"kt\">long<\/span><span class=\"w\"> <\/span><span class=\"n\">mq_curmsgs<\/span><span class=\"p\">;<\/span><span class=\"w\">  <\/span><span class=\"cm\">/* 目前 queue 中有幾則訊息     [mq_getattr()] */<\/span>\n<span class=\"p\">};<\/span>\n<\/code><\/pre><\/div>\n\n<ul>\n<li><strong><code>mq_open()<\/code> 只需要指定兩個欄位：<code>mq_maxmsg<\/code> 和 <code>mq_msgsize<\/code><\/strong>（其他欄位建立時會被忽略）。<\/li>\n<li>傳 <code>NULL<\/code> 則使用系統預設值（補充：Linux 預設通常是 maxmsg=10、msgsize=8192）。<\/li>\n<\/ul>\n<h3 id=\"lab7-mq_receive-buffer\">mq_receive 的 buffer 大小規則（必考）<\/h3>\n<p><code>msg_len<\/code>（buffer 可用空間）<strong>必須 ≥ queue 的 <code>mq_msgsize<\/code><\/strong>，否則 <code>mq_receive<\/code> 失敗（errno = EMSGSIZE）。<\/p>\n<h3 id=\"lab7-mqd_t\">mqd_t<\/h3>\n<p><code>mq_open<\/code> 回傳的 message queue descriptor，型別 <code>mqd_t<\/code>，在 Linux 中就是 <code>int<\/code>。<\/p>\n<h2 id=\"lab7-22-api\">2.2 API 速查表<\/h2>\n<table>\n<thead>\n<tr>\n<th>函式<\/th>\n<th>原型<\/th>\n<th>回傳值<\/th>\n<th>重點參數<\/th>\n<th>範例<\/th>\n<\/tr>\n<\/thead>\n<tbody>\n<tr>\n<td><code>mq_open<\/code><\/td>\n<td><code>mqd_t mq_open(const char *name, int oflag, ... /* mode_t mode, struct mq_attr *attr */);<\/code><\/td>\n<td>descriptor；失敗 <code>(mqd_t)-1<\/code><\/td>\n<td><code>name<\/code> 以 <code>/<\/code> 開頭；oflag 見下；有 <code>O_CREAT<\/code> 時要給 mode、attr<\/td>\n<td><code>mq_open(\"/myMsgQueue\", O_WRONLY\\|O_CREAT, 0644, NULL)<\/code><\/td>\n<\/tr>\n<tr>\n<td><code>mq_close<\/code><\/td>\n<td><code>int mq_close(mqd_t mqdes);<\/code><\/td>\n<td>0 / -1<\/td>\n<td>—<\/td>\n<td><code>mq_close(mqd)<\/code><\/td>\n<\/tr>\n<tr>\n<td><code>mq_unlink<\/code><\/td>\n<td><code>int mq_unlink(const char *name);<\/code><\/td>\n<td>0 / -1<\/td>\n<td>—<\/td>\n<td><code>mq_unlink(\"/myMsgQueue\")<\/code><\/td>\n<\/tr>\n<tr>\n<td><code>mq_send<\/code><\/td>\n<td><code>int mq_send(mqd_t mqdes, const char *msg_ptr, size_t msg_len, unsigned int msg_prio);<\/code><\/td>\n<td>0 / -1<\/td>\n<td><code>msg_len<\/code> = 訊息長度；<code>msg_prio<\/code> 本課給 0（忽略優先權）<\/td>\n<td><code>mq_send(mqd, buf, strlen(buf)+1, 0)<\/code><\/td>\n<\/tr>\n<tr>\n<td><code>mq_receive<\/code><\/td>\n<td><code>ssize_t mq_receive(mqd_t mqdes, char *msg_ptr, size_t msg_len, unsigned int *msg_prio);<\/code><\/td>\n<td>收到的 bytes 數 / -1<\/td>\n<td><code>msg_len<\/code> ≥ <code>mq_msgsize<\/code>；<code>msg_prio<\/code> 給 NULL<\/td>\n<td><code>mq_receive(mqd, buf, attr.mq_msgsize, NULL)<\/code><\/td>\n<\/tr>\n<tr>\n<td><code>mq_getattr<\/code>（補充，學生有用）<\/td>\n<td><code>int mq_getattr(mqd_t, struct mq_attr *);<\/code><\/td>\n<td>0 / -1<\/td>\n<td>查實際的 msgsize<\/td>\n<td>—<\/td>\n<\/tr>\n<tr>\n<td><code>fgets<\/code><\/td>\n<td><code>char *fgets(char *s, int n, FILE *stream)<\/code><\/td>\n<td>失敗/EOF 回 NULL<\/td>\n<td>從 stream 讀最多 n-1 字元，<strong>會保留換行<\/strong><\/td>\n<td><code>fgets(buf, BUFSIZ, stdin)<\/code><\/td>\n<\/tr>\n<tr>\n<td><code>strcmp<\/code><\/td>\n<td><code>int strcmp(s1, s2)<\/code><\/td>\n<td>相等回 0<\/td>\n<td>—<\/td>\n<td><code>strcmp(message, \"hello\")<\/code><\/td>\n<\/tr>\n<\/tbody>\n<\/table>\n<p>標頭：<code>&lt;fcntl.h&gt;<\/code>（<code>O_*<\/code> 常數）、<code>&lt;sys/stat.h&gt;<\/code>（mode 常數）、<code>&lt;mqueue.h&gt;<\/code>。<\/p>\n<p><strong>oflag：<\/strong>\n| Flag | 意義 |\n|---|---|\n| <code>O_CREAT<\/code> | 不存在就建立 |\n| <code>O_EXCL<\/code> | 搭配 <code>O_CREAT<\/code>：若已存在就失敗（獨佔建立） |\n| <code>O_RDONLY<\/code> / <code>O_WRONLY<\/code> / <code>O_RDWR<\/code> | 只讀／只寫／讀寫 |\n| <code>O_NONBLOCK<\/code> | 非阻塞模式（queue 空時 receive 直接回錯，不等待） |<\/p>\n<p><strong>mode（<code>&lt;sys/stat.h&gt;<\/code>）：<\/strong>\n| 常數 | 八進位 | 意義 |\n|---|---|---|\n| <code>S_IRUSR<\/code> <code>S_IWUSR<\/code> <code>S_IXUSR<\/code> | 0400 0200 0100 | User read/write/execute |\n| <code>S_IRGRP<\/code> <code>S_IWGRP<\/code> <code>S_IXGRP<\/code> | 040 020 010 | Group read/write/execute |\n| <code>S_IROTH<\/code> <code>S_IWOTH<\/code> <code>S_IXOTH<\/code> | 04 02 01 | Other read/write/execute |<\/p>\n<p>例：<code>0644<\/code> = <code>S_IRUSR|S_IWUSR|S_IRGRP|S_IROTH<\/code>。<\/p>\n<h2 id=\"lab7-23\">2.3 程式範例逐行解說<\/h2>\n<h3 id=\"lab7-example1senderc\">投影片 example1/sender.c<\/h3>\n<div class=\"hl\"><pre><span><\/span><code><span class=\"cp\">#include<\/span><span class=\"w\"> <\/span><span class=\"cpf\">&lt;fcntl.h&gt;<\/span><span class=\"w\">      <\/span><span class=\"c1\">// defines O_* constants for mq_open()<\/span>\n<span class=\"cp\">#include<\/span><span class=\"w\"> <\/span><span class=\"cpf\">&lt;mqueue.h&gt;<\/span>\n<span class=\"cp\">#include<\/span><span class=\"w\"> <\/span><span class=\"cpf\">&lt;stdio.h&gt;<\/span>\n<span class=\"cp\">#include<\/span><span class=\"w\"> <\/span><span class=\"cpf\">&lt;string.h&gt;<\/span>\n<span class=\"cp\">#define NAME \"/myMsgQueue\"<\/span>\n<span class=\"cp\">#define MAX_MSGSIZE 1000<\/span>\n\n<span class=\"kt\">int<\/span><span class=\"w\"> <\/span><span class=\"nf\">main<\/span><span class=\"p\">()<\/span><span class=\"w\"> <\/span><span class=\"p\">{<\/span>\n<span class=\"w\">    <\/span><span class=\"n\">mqd_t<\/span><span class=\"w\"> <\/span><span class=\"n\">mqd<\/span><span class=\"w\"> <\/span><span class=\"o\">=<\/span><span class=\"w\"> <\/span><span class=\"n\">mq_open<\/span><span class=\"p\">(<\/span><span class=\"n\">NAME<\/span><span class=\"p\">,<\/span><span class=\"w\"> <\/span><span class=\"n\">O_WRONLY<\/span><span class=\"w\"> <\/span><span class=\"o\">|<\/span><span class=\"w\"> <\/span><span class=\"n\">O_CREAT<\/span><span class=\"p\">,<\/span><span class=\"w\"> <\/span><span class=\"mo\">0644<\/span><span class=\"p\">,<\/span><span class=\"w\"> <\/span><span class=\"nb\">NULL<\/span><span class=\"p\">);<\/span><span class=\"w\">   <\/span><span class=\"c1\">// 預設屬性<\/span>\n<span class=\"w\">    <\/span><span class=\"k\">if<\/span><span class=\"w\"> <\/span><span class=\"p\">(<\/span><span class=\"n\">mqd<\/span><span class=\"w\"> <\/span><span class=\"o\">==<\/span><span class=\"w\"> <\/span><span class=\"mi\">-1<\/span><span class=\"p\">)<\/span><span class=\"w\"> <\/span><span class=\"p\">{<\/span><span class=\"w\"> <\/span><span class=\"n\">perror<\/span><span class=\"p\">(<\/span><span class=\"s\">\"Failed to open or create the message queue. <\/span><span class=\"se\">\\n<\/span><span class=\"s\">\"<\/span><span class=\"p\">);<\/span><span class=\"w\"> <\/span><span class=\"k\">return<\/span><span class=\"w\"> <\/span><span class=\"mi\">1<\/span><span class=\"p\">;<\/span><span class=\"w\"> <\/span><span class=\"p\">}<\/span>\n<span class=\"w\">    <\/span><span class=\"n\">printf<\/span><span class=\"p\">(<\/span><span class=\"s\">\"Send to receiver: <\/span><span class=\"se\">\\n<\/span><span class=\"s\">\"<\/span><span class=\"p\">);<\/span>\n<span class=\"w\">    <\/span><span class=\"k\">while<\/span><span class=\"w\"> <\/span><span class=\"p\">(<\/span><span class=\"mi\">1<\/span><span class=\"p\">)<\/span><span class=\"w\"> <\/span><span class=\"p\">{<\/span>\n<span class=\"w\">        <\/span><span class=\"kt\">char<\/span><span class=\"w\"> <\/span><span class=\"n\">buffer<\/span><span class=\"p\">[<\/span><span class=\"n\">MAX_MSGSIZE<\/span><span class=\"p\">];<\/span>\n<span class=\"w\">        <\/span><span class=\"k\">for<\/span><span class=\"w\"> <\/span><span class=\"p\">(<\/span><span class=\"kt\">int<\/span><span class=\"w\"> <\/span><span class=\"n\">i<\/span><span class=\"w\"> <\/span><span class=\"o\">=<\/span><span class=\"w\"> <\/span><span class=\"mi\">0<\/span><span class=\"p\">;<\/span><span class=\"w\"> <\/span><span class=\"n\">i<\/span><span class=\"w\"> <\/span><span class=\"o\">&lt;<\/span><span class=\"w\"> <\/span><span class=\"k\">sizeof<\/span><span class=\"p\">(<\/span><span class=\"n\">buffer<\/span><span class=\"p\">);<\/span><span class=\"w\"> <\/span><span class=\"n\">i<\/span><span class=\"o\">++<\/span><span class=\"p\">)<\/span><span class=\"w\"> <\/span><span class=\"n\">buffer<\/span><span class=\"p\">[<\/span><span class=\"n\">i<\/span><span class=\"p\">]<\/span><span class=\"w\"> <\/span><span class=\"o\">=<\/span><span class=\"w\"> <\/span><span class=\"sc\">'\\0'<\/span><span class=\"p\">;<\/span><span class=\"w\">   <\/span><span class=\"c1\">// 字串以 '\\0' 結尾<\/span>\n<span class=\"w\">        <\/span><span class=\"n\">printf<\/span><span class=\"p\">(<\/span><span class=\"s\">\"&gt; \"<\/span><span class=\"p\">);<\/span>\n<span class=\"w\">        <\/span><span class=\"n\">fgets<\/span><span class=\"p\">(<\/span><span class=\"n\">buffer<\/span><span class=\"p\">,<\/span><span class=\"w\"> <\/span><span class=\"n\">MAX_MSGSIZE<\/span><span class=\"p\">,<\/span><span class=\"w\"> <\/span><span class=\"n\">stdin<\/span><span class=\"p\">);<\/span>\n<span class=\"w\">        <\/span><span class=\"kt\">int<\/span><span class=\"w\"> <\/span><span class=\"n\">send<\/span><span class=\"w\"> <\/span><span class=\"o\">=<\/span><span class=\"w\"> <\/span><span class=\"n\">mq_send<\/span><span class=\"p\">(<\/span><span class=\"n\">mqd<\/span><span class=\"p\">,<\/span><span class=\"w\"> <\/span><span class=\"n\">buffer<\/span><span class=\"p\">,<\/span><span class=\"w\"> <\/span><span class=\"n\">strlen<\/span><span class=\"p\">(<\/span><span class=\"n\">buffer<\/span><span class=\"p\">)<\/span><span class=\"w\"> <\/span><span class=\"o\">+<\/span><sp n class=\"w\"> <\/span><span class=\"o\">+<\/span><span class=\"w\"> <\/span><span class=\"mi\">1<\/span><span class=\"p\">,<\/span><span class=\"w\"> <\/span><span class=\"mi\">0<\/span><span class=\"p\">)<\/span><span class=\"w\"> <\/span><span class=\"o\">==<\/span><span class=\"w\"> <\/span><span class=\"mi\">-1<\/span><span class=\"p\">)<\/span><span class=\"w\"> <\/span><span class=\"p\">{<\/span><span class=\"w\"> <\/span><span class=\"n\">perror<\/span><span class=\"p\">(...);<\/span><span class=\"w\"> <\/span><span class=\"k\">return<\/span><span class=\"w\"> <\/span><span class=\"mi\">1<\/span><span class=\"p\">;<\/span><span class=\"w\"> <\/span><span class=\"p\">}<\/span>\n<span class=\"w\">    <\/span><span class=\"k\">if<\/span><span class=\"w\"> <\/span><span class=\"p\">(<\/span><span class=\"n\">strcmp<\/span><span class=\"p\">(<\/span><span class=\"n\">buffer<\/span><span class=\"p\">,<\/span><span class=\"w\"> <\/span><span class=\"s\">\"exit\"<\/span><span class=\"p\">)<\/span><span class=\"w\"> <\/span><span class=\"o\">==<\/span><span class=\"w\"> <\/span><span class=\"mi\">0<\/span><span class=\"p\">)<\/span><span class=\"w\"> <\/span><span class=\"k\">break<\/span><span class=\"p\">;<\/span><span class=\"w\">      <\/span><span class=\"c1\">// exit 也送出去，通知 receiver 結束<\/span>\n<span class=\"p\">}<\/span>\n<span class=\"k\">if<\/span><span class=\"w\"> <\/span><span class=\"p\">(<\/span><span class=\"n\">mq_close<\/span><span class=\"p\">(<\/span><span class=\"n\">mqd<\/span><span class=\"p\">)<\/span><span class=\"w\"> <\/span><span class=\"o\">==<\/span><span class=\"w\"> <\/span><span class=\"mi\">-1<\/span><span class=\"p\">)<\/span><span class=\"w\"> <\/span><span class=\"p\">{<\/span><span class=\"w\"> <\/span><span class=\"p\">...<\/span><span class=\"w\"> <\/span><span class=\"p\">}<\/span><span class=\"w\">                 <\/span><span class=\"c1\">// sender 只 close，不 unlink<\/span>\n<\/code><\/pre><\/div>\n\n<h3 id=\"lab7-practicelab7ex1receiverc\">practice/lab7/ex1/receiver.c<\/h3>\n<div class=\"hl\"><pre><span><\/span><code><span class=\"n\">mqd_t<\/span><span class=\"w\"> <\/span><span class=\"n\">mqd<\/span><span class=\"w\"> <\/span><span class=\"o\">=<\/span><span class=\"w\"> <\/span><span class=\"n\">mq_open<\/span><span class=\"p\">(<\/span><span class=\"n\">NAME<\/span><span class=\"p\">,<\/span><span class=\"w\"> <\/span><span class=\"n\">O_RDONLY<\/span><span class=\"w\"> <\/span><span class=\"o\">|<\/span><span class=\"w\"> <\/span><span class=\"n\">O_CREAT<\/span><span class=\"p\">,<\/span><span class=\"w\"> <\/span><span class=\"mo\">0644<\/span><span class=\"p\">,<\/span><span class=\"w\"> <\/span><span class=\"o\">&amp;<\/span><span class=\"n\">attr<\/span><span class=\"p\">);<\/span>\n<span class=\"n\">mq_getattr<\/span><span class=\"p\">(<\/span><span class=\"n\">mqd<\/span><span class=\"p\">,<\/span><span class=\"w\"> <\/span><span class=\"o\">&amp;<\/span><span class=\"n\">attr<\/span><span class=\"p\">);<\/span><span class=\"w\">                      <\/span><span class=\"c1\">// 查實際 mq_msgsize<\/span>\n<span class=\"kt\">char<\/span><span class=\"w\"> <\/span><span class=\"o\">*<\/span><span class=\"n\">buffer<\/span><span class=\"w\"> <\/span><span class=\"o\">=<\/span><span class=\"w\"> <\/span><span class=\"n\">malloc<\/span><span class=\"p\">(<\/span><span class=\"n\">attr<\/span><span class=\"p\">.<\/span><span class=\"n\">mq_msgsize<\/span><span class=\"p\">);<\/span><span class=\"w\">      <\/span><span class=\"c1\">// buffer 大小 &gt;= mq_msgsize<\/span>\n<span class=\"k\">while<\/span><span class=\"w\"> <\/span><span class=\"p\">(<\/span><span class=\"mi\">1<\/span><span class=\"p\">)<\/span><span class=\"w\"> <\/span><span class=\"p\">{<\/span>\n<span class=\"w\">    <\/span><span class=\"kt\">ssize_t<\/span><span class=\"w\"> <\/span><span class=\"n\">msg_size<\/span><span class=\"w\"> <\/span><span class=\"o\">=<\/span><span class=\"w\"> <\/span><span class=\"n\">mq_receive<\/span><span class=\"p\">(<\/span><span class=\"n\">mqd<\/span><span class=\"p\">,<\/span><span class=\"w\"> <\/span><span class=\"n\">buffer<\/span><span class=\"p\">,<\/span><span class=\"w\"> <\/span><span class=\"n\">attr<\/span><span class=\"p\">.<\/span><span class=\"n\">mq_msgsize<\/span><span class=\"p\">,<\/span><span class=\"w\"> <\/span><span class=\"nb\">NULL<\/span><span class=\"p\">);<\/span>\n<span class=\"w\">    <\/span><span class=\"k\">if<\/span><span class=\"w\"> <\/span><span class=\"p\">(<\/span><span class=\"n\">msg_size<\/span><span class=\"w\"> <\/span><span class=\"o\">==<\/span><span class=\"w\"> <\/span><span class=\"mi\">-1<\/span><span class=\"p\">)<\/span><span class=\"w\"> <\/span><span class=\"p\">{<\/span><span class=\"w\"> <\/span><span class=\"p\">...;<\/span><span class=\"w\"> <\/span><span class=\"k\">return<\/span><span class=\"w\"> <\/span><span class=\"mi\">1<\/span><span class=\"p\">;<\/span><span class=\"w\"> <\/span><span class=\"p\">}<\/span>\n<span class=\"w\">    <\/span><span class=\"k\">if<\/span><span class=\"w\"> <\/span><span class=\"p\">(<\/span><span class=\"n\">strcmp<\/span><span class=\"p\">(<\/span><span class=\"n\">buffer<\/span><span class=\"p\">,<\/span><span class=\"w\"> <\/span><span class=\"s\">\"exit\"<\/span><span class=\"p\">)<\/span><span class=\"w\"> <\/span><span class=\"o\">==<\/span><span class=\"w\"> <\/span><span class=\"mi\">0<\/span><span class=\"p\">)<\/span><span class=\"w\"> <\/span><span class=\"p\">{<\/span><span class=\"w\"> <\/span><span class=\"n\">printf<\/span><span class=\"p\">(<\/span><span class=\"s\">\"Exiting receive...<\/span><span class=\"se\">\\n<\/span><span class=\"s\">\"<\/span><span class=\"p\">);<\/span><span class=\"w\"> <\/span><span class=\"k\">break<\/span><span class=\"p\">;<\/span><span class=\"w\"> <\/span><span class=\"p\">}<\/span>\n<span class=\"w\">    <\/span><span class=\"n\">printf<\/span><span class=\"p\">(<\/span><span class=\"s\">\"received: %s<\/span><span class=\"se\">\\n<\/span><span class=\"s\">\"<\/span><span class=\"p\">,<\/span><span class=\"w\"> <\/span><span class=\"n\">buffer<\/span><span class=\"p\">);<\/span>\n<span class=\"p\">}<\/span>\n<span class=\"n\">free<\/span><span class=\"p\">(<\/span><span class=\"n\">buffer<\/span><span class=\"p\">);<\/span>\n<span class=\"n\">mq_close<\/span><span class=\"p\">(<\/span><span class=\"n\">mqd<\/span><span class=\"p\">);<\/span>\n<span class=\"n\">mq_unlink<\/span><span class=\"p\">(<\/span><span class=\"n\">NAME<\/span><span class=\"p\">);<\/span><span class=\"w\">                             <\/span><span class=\"c1\">// receiver 負責刪除 queue<\/span>\n<\/code><\/pre><\/div>\n\n<p>互動結果（與投影片 Exercise 結果一致）：<\/p>\n<div class=\"hl\"><pre><span><\/span><code>$ ./sender                    $ ./receiver\nSend to receiver:             received: test\n&gt; test                        received: 123\n&gt; 123                         Exiting receive...\n&gt; exit\n<\/code><\/pre><\/div>\n\n<p><strong>評論<\/strong>：\n- 寫得完整且比範例穩健：自訂屬性、<code>mq_getattr<\/code> + <code>malloc<\/code> 確保 buffer 夠大、<code>exit<\/code> 會先送給 receiver 再離開、EOF 也處理、sender 只 close、receiver close + unlink。符合題目全部要求。\n- 小提醒：\n  1. 因為用 <code>O_CREAT<\/code> 但沒加 <code>O_EXCL<\/code>，如果系統中已有<strong>舊的同名 queue<\/strong>（例如之前跑投影片範例時用預設 8192 建的、又沒被 unlink），<code>attr<\/code> 會被忽略、直接開舊的。receiver 用 <code>mq_getattr<\/code> 已防範這點；sender 送的訊息 ≤1000 bytes，也不會出錯。\n  2. 若 receiver 沒在跑，sender 送超過 <code>mq_maxmsg<\/code>（10）則訊息後，<code>mq_send<\/code> 會<strong>阻塞<\/strong>等待空位。\n  3. 去掉了換行，所以 receiver 的 printf 自己補 <code>\\n<\/code>；和投影片範例（保留換行）寫法不同，但都正確。\n  4. 若 receiver 因 Ctrl+C 中途結束，queue 沒被 unlink 會殘留（補充：可在 <code>/dev/mqueue/<\/code> 看到，<code>rm /dev/mqueue/myMsgQueue<\/code> 清掉）。\n- <code>practice/lab7<\/code> 資料夾裡已有編好的 <code>sender<\/code>、<code>receiver<\/code>、<code>producer<\/code>、<code>consumer<\/code> 執行檔。<\/p>\n<h2 id=\"lab7-24-exercise-1-50-pts\">2.4 Exercise 1 題目（50 pts.）<\/h2>\n<ul>\n<li><strong>sender.c<\/strong>：建立 message queue；使用者可以反覆輸入字串，直到輸入 <code>\"exit\"<\/code>；把訊息送進 queue。<\/li>\n<li><strong>receiver.c<\/strong>：反覆從 queue 收訊息並印在螢幕上；最後 close &amp; unlink queue。<\/li>\n<li>提示可用 <code>fgets(buf, BUFSIZ, stdin)<\/code>、<code>strcmp(message, \"hello\")<\/code>（相等回 0）。<\/li>\n<li>參考解法：即上面學生版程式（已完整）。<\/li>\n<\/ul>\n<hr />\n<h1 id=\"lab7-part-2lab-7-2-shared-memory\">Part 2：Lab 7-2 Shared Memory<\/h1>\n<h2 id=\"lab7-31\">3.1 核心觀念<\/h2>\n<h3 id=\"lab7-process\">兩種讓不相關 process 共享記憶體的技術<\/h3>\n<table>\n<thead>\n<tr>\n<th><\/th>\n<th>Shared memory-mapped file<\/th>\n<th>Shared memory（POSIX shm）<\/th>\n<\/tr>\n<\/thead>\n<tbody>\n<tr>\n<td>需不需要檔案<\/td>\n<td><strong>需要明確建立一個檔案<\/strong>來映射<\/td>\n<td><strong>不需要<\/strong>建立對應的檔案<\/td>\n<\/tr>\n<tr>\n<td>原理<\/td>\n<td>兩個 process 的 page table 中，對應映射區的 PT entries 指向同一組實體記憶體分頁<\/td>\n<td>同左，只是物件由 kernel 在 <code>/dev/shm<\/code> 建立<\/td>\n<\/tr>\n<\/tbody>\n<\/table>\n<h3 id=\"lab7-_1\">位置<\/h3>\n<p>每個 process 的位址空間（stack、heap、data、text）中，有一段 <strong>shared memory (mapped)<\/strong> 區域，P1 和 P2 的這段區域都對應到<strong>同一塊實體 shared memory<\/strong>。一方寫入，另一方<strong>立刻<\/strong>看得到，不需要經過 kernel 複製（所以是最快的 IPC，補充）。<\/p>\n<h3 id=\"lab7-posix-shared-memory\">POSIX Shared Memory 使用流程<\/h3>\n<ol>\n<li><code>shm_open()<\/code>：以名稱開啟或建立物件，回傳 <strong>file descriptor<\/strong>（就像 <code>open()<\/code>）。<\/li>\n<li><code>ftruncate()<\/code>：設定物件大小（新建立的物件大小是 0，一定要設）。<\/li>\n<li><code>mmap()<\/code>：把 fd 映射進自己的虛擬位址空間，<strong>flags 要用 <code>MAP_SHARED<\/code><\/strong>。<\/li>\n<li>讀寫回傳的指標。<\/li>\n<li><code>munmap()<\/code>：解除映射；<code>close(fd)<\/code>。<\/li>\n<li><code>shm_unlink()<\/code>：刪除物件。<\/li>\n<\/ol>\n<h3 id=\"lab7-devshm-kernel-persistence\"><code>/dev/shm<\/code> 與 kernel persistence（必考）<\/h3>\n<ul>\n<li>Linux 把 shared memory 物件建成<strong>偽檔案（pseudo-file）<\/strong>，放在特殊位置 <strong><code>/dev/shm<\/code><\/strong>。<\/li>\n<li>Shared memory 具有 <strong>kernel persistence<\/strong>：<strong>即使目前沒有任何 process 開著它，物件依然存在<\/strong>，直到系統關機或呼叫 <code>shm_unlink()<\/code>。\n  → 所以 producer 結束後，consumer 還能讀到資料。<\/li>\n<\/ul>\n<h3 id=\"lab7-_2\">同步問題<\/h3>\n<p>和 memory-mapped file 一樣，若兩個以上 process <strong>同時<\/strong>存取，需要用 <strong>semaphore<\/strong>（或其他同步機制）同步（課程後面的 Lab 會介紹）。本 Lab 是「producer 先寫完、consumer 後讀」，靠人工控制執行順序避開競爭。<\/p>\n<h3 id=\"lab7-message-queue-vs-shared-memory\">Message Queue vs Shared Memory（補充比較）<\/h3>\n<table>\n<thead>\n<tr>\n<th><\/th>\n<th>Message Queue<\/th>\n<th>Shared Memory<\/th>\n<\/tr>\n<\/thead>\n<tbody>\n<tr>\n<td>資料怎麼傳<\/td>\n<td>經由 kernel 複製（send 複製進 kernel、receive 複製出來）<\/td>\n<td>直接讀寫同一塊記憶體，不複製<\/td>\n<\/tr>\n<tr>\n<td>速度<\/td>\n<td>較慢<\/td>\n<td>最快<\/td>\n<\/tr>\n<tr>\n<td>同步<\/td>\n<td>kernel 處理（queue 空時 receive 阻塞）<\/td>\n<td><strong>要自己同步<\/strong>（semaphore 等）<\/td>\n<\/tr>\n<tr>\n<td>資料單位<\/td>\n<td>一則一則的訊息<\/td>\n<td>一塊位元組，自己定義格式<\/td>\n<\/tr>\n<tr>\n<td>物件位置<\/td>\n<td><code>/dev/mqueue<\/code><\/td>\n<td><code>/dev/shm<\/code><\/td>\n<\/tr>\n<\/tbody>\n<\/table>\n<h2 id=\"lab7-32-api\">3.2 API 速查表<\/h2>\n<table>\n<thead>\n<tr>\n<th>函式<\/th>\n<th>原型<\/th>\n<th>回傳值<\/th>\n<th>重點<\/th>\n<th>範例<\/th>\n<\/tr>\n<\/thead>\n<tbody>\n<tr>\n<td><code>shm_open<\/code><\/td>\n<td><code>int shm_open(const char *name, int oflag, mode_t mode);<\/code>（<code>&lt;sys/mman.h&gt;<\/code>）<\/td>\n<td>fd；失敗 -1<\/td>\n<td>oflag：<code>O_CREAT<\/code> <code>O_EXCL<\/code> <code>O_RDONLY<\/code> <code>O_RDWR<\/code> <code>O_TRUNC<\/code>（<strong>沒有 O_WRONLY<\/strong>）；mode 權限<\/td>\n<td><code>shm_open(NAME, O_CREAT\\|O_EXCL, 0666)<\/code><\/td>\n<\/tr>\n<tr>\n<td><code>ftruncate<\/code><\/td>\n<td><code>int ftruncate(int fildes, off_t length);<\/code>（<code>&lt;unistd.h&gt;<\/code>）<\/td>\n<td>0 / -1<\/td>\n<td>設定物件（檔案）大小<\/td>\n<td><code>ftruncate(fd, 2048)<\/code><\/td>\n<\/tr>\n<tr>\n<td><code>mmap<\/code><\/td>\n<td><code>void *mmap(void *addr, size_t length, int prot, int flags, int fd, off_t offset);<\/code><\/td>\n<td>映射起始位址；失敗 <strong><code>MAP_FAILED<\/code><\/strong><\/td>\n<td>addr 給 NULL 讓 kernel 選；prot；flags；offset 從檔案哪裡開始<\/td>\n<td><code>mmap(NULL, 1024, PROT_WRITE, MAP_SHARED, shm_fd, 0)<\/code><\/td>\n<\/tr>\n<tr>\n<td><code>munmap<\/code><\/td>\n<td><code>int munmap(void *addr, size_t length);<\/code><\/td>\n<td>0 / -1<\/td>\n<td>解除映射<\/td>\n<td><code>munmap(address, 2048)<\/code><\/td>\n<\/tr>\n<tr>\n<td><code>shm_unlink<\/code><\/td>\n<td><code>int shm_unlink(const char *name);<\/code><\/td>\n<td>0 / -1<\/td>\n<td>刪除物件<\/td>\n<td><code>shm_unlink(NAME)<\/code><\/td>\n<\/tr>\n<\/tbody>\n<\/table>\n<p><strong>shm_open oflag（<code>&lt;fcntl.h&gt;<\/code>）<\/strong>\n| Flag | 意義 |\n|---|---|\n| <code>O_CREAT<\/code> | 不存在就建立 |\n| <code>O_EXCL<\/code> | 搭配 O_CREAT 獨佔建立（已存在就失敗） |\n| <code>O_RDONLY<\/code> | 唯讀 |\n| <code>O_RDWR<\/code> | 讀寫 |\n| <code>O_TRUNC<\/code> | 把物件截成長度 0 |<\/p>\n<p><strong>mmap 的 prot<\/strong>\n| 值 | 意義 |\n|---|---|\n| <code>PROT_READ<\/code> | 可讀 |\n| <code>PROT_WRITE<\/code> | 可寫 |\n| <code>PROT_EXEC<\/code> | 可執行 |\n| <code>PROT_NONE<\/code> | 不可存取 |<\/p>\n<p><strong>mmap 的 flags（本課重點兩個）<\/strong>\n| 值 | 意義 |\n|---|---|\n| <strong><code>MAP_SHARED<\/code><\/strong> | 對映射區的修改<strong>其他 process 看得到<\/strong>，並寫回底層檔案 |\n| <strong><code>MAP_PRIVATE<\/code><\/strong> | 修改是<strong>私有的<\/strong>（copy-on-write），別人看不到 |\n| 其他 | <code>MAP_ANONYMOUS<\/code>（不對應檔案）、<code>MAP_FIXED<\/code>（精確使用 addr）、<code>MAP_LOCKED<\/code>、<code>MAP_HUGETLB<\/code>、<code>MAP_NORESERVE<\/code>、<code>MAP_POPULATE<\/code>、<code>MAP_UNINITIALIZED<\/code> |<\/p>\n<p><strong>編譯：<\/strong> POSIX IPC 程式要連結 <strong>librt<\/strong>：<code>gcc -o producer producer.c -lrt<\/code>（補充：glibc 2.34 以後這些函式已併入 libc，不加 <code>-lrt<\/code> 通常也能編，但照投影片加上最保險）。<\/p>\n<h2 id=\"lab7-33\">3.3 程式範例逐行解說<\/h2>\n<h3 id=\"lab7-producerc\">投影片 producer.c<\/h3>\n<div class=\"hl\"><pre><span><\/span><code><span class=\"cp\">#include<\/span><span class=\"w\"> <\/span><span class=\"cpf\">&lt;fcntl.h&gt;<\/span>\n<span class=\"cp\">#include<\/span><span class=\"w\"> <\/span><span class=\"cpf\">&lt;stdio.h&gt;<\/span>\n<span class=\"cp\">#include<\/span><span class=\"w\"> <\/span><span class=\"cpf\">&lt;sys/mman.h&gt;<\/span>\n<span class=\"cp\">#include<\/span><span class=\"w\"> <\/span><span class=\"cpf\">&lt;unistd.h&gt;<\/span><span class=\"w\">       <\/span><span class=\"c1\">// ftruncate() &amp; close()<\/span>\n<span class=\"cp\">#define NAME \"/myShareMemory\"<\/span>\n<span class=\"cp\">#define SMSIZE 1024<\/span>\n<span class=\"kt\">int<\/span><span class=\"w\"> <\/span><span class=\"nf\">main<\/span><span class=\"p\">()<\/span><span class=\"w\"> <\/span><span class=\"p\">{<\/span>\n<span class=\"w\">    <\/span><span class=\"kt\">int<\/span><span class=\"w\"> <\/span><span class=\"n\">fd<\/span><span class=\"w\"> <\/span><span class=\"o\">=<\/span><span class=\"w\"> <\/span><span class=\"n\">shm_open<\/span><span class=\"p\">(<\/span><span class=\"n\">NAME<\/span><span class=\"p\">,<\/span><span class=\"w\"> <\/span><span class=\"n\">O_CREAT<\/span><span class=\"w\"> <\/span><span class=\"o\">|<\/span><span class=\"w\"> <\/span><span class=\"n\">O_RDWR<\/span><span class=\"p\">,<\/span><span class=\"w\"> <\/span><span class=\"mo\">0666<\/span><span class=\"p\">);<\/span><span class=\"w\">          <\/span><span class=\"c1\">// file descriptor<\/span>\n<span class=\"w\">    <\/span><span class=\"k\">if<\/span><span class=\"w\"> <\/span><span class=\"p\">(<\/span><span class=\"n\">fd<\/span><span class=\"w\"> <\/span><span class=\"o\">==<\/span><span class=\"w\"> <\/span><span class=\"mi\">-1<\/span><span class=\"p\">)<\/span><span class=\"w\"> <\/span><span class=\"p\">{<\/span><span class=\"w\"> <\/span><span class=\"n\">perror<\/span><span class=\"p\">(<\/span><span class=\"s\">\"Failed to open or create the shared memory. <\/span><span class=\"se\">\\n<\/span><span class=\"s\">\"<\/span><span class=\"p\">);<\/span><span class=\"w\"> <\/span><span class=\"k\">return<\/span><span class=\"w\"> <\/span><span class=\"mi\">1< s=\"p\">(<\/span><span class=\"n\">map_addr<\/span><span class=\"w\"> <\/span><span class=\"o\">==<\/span><span class=\"w\"> <\/span><span class=\"n\">MAP_FAILED<\/span><span class=\"p\">)<\/span><span class=\"w\"> <\/span><span class=\"p\">{<\/span><span class=\"w\"> <\/span><span class=\"n\">perror<\/span><span class=\"p\">(<\/span><span class=\"s\">\"Failed to create the map. <\/span><span class=\"se\">\\n<\/span><span class=\"s\">\"<\/span><span class=\"p\">);<\/span><span class=\"w\"> <\/span><span class=\"k\">return<\/span><span class=\"w\"> <\/span><span class=\"mi\">1<\/span><span class=\"p\">;<\/span><span class=\"w\"> <\/span><span class=\"p\">}<\/span>\n<span class=\"w\">    <\/span><span class=\"kt\">char<\/span><span class=\"w\"> <\/span><span class=\"o\">*<\/span><span class=\"n\">ptr<\/span><span class=\"p\">,<\/span><span class=\"w\"> <\/span><span class=\"n\">buffer<\/span><span class=\"p\">[<\/span><span class=\"n\">SMSIZE<\/span><span class=\"p\">];<\/span>\n<span class=\"w\">    <\/span><span class=\"n\">ptr<\/span><span class=\"w\"> <\/span><span class=\"o\">=<\/span><span class=\"w\"> <\/span><span class=\"n\">map_addr<\/span><span class=\"p\">;<\/span>\n<span class=\"w\">    <\/span><span class=\"n\">sprintf<\/span><span class=\"p\">(<\/span><span class=\"n\">ptr<\/span><span class=\"p\">,<\/span><span class=\"w\"> <\/span><span class=\"s\">\"%s\"<\/span><span class=\"p\">,<\/span><span class=\"w\"> <\/span><span class=\"n\">buffer<\/span><span class=\"p\">);<\/span><span class=\"w\">                                <\/span><span class=\"c1\">// 把 buffer 寫進 shared memory<\/span>\n<span class=\"w\">    <\/span><span class=\"k\">if<\/span><span class=\"w\"> <\/span><span class=\"p\">(<\/span><span class=\"n\">munmap<\/span><span class=\"p\">(<\/span><span class=\"n\">map_addr<\/span><span class=\"p\">,<\/span><span class=\"w\"> <\/span><span class=\"mi\">1024<\/span><span class=\"p\">)<\/span><span class=\"w\"> <\/span><span class=\"o\">==<\/span><span class=\"w\"> <\/span><span class=\"mi\">-1<\/span><span class=\"p\">)<\/span><span class=\"w\"> <\/span><span class=\"p\">{<\/span><span class=\"w\"> <\/span><span class=\"p\">...;<\/span><span class=\"w\"> <\/span><span class=\"k\">return<\/span><span class=\"w\"> <\/span><span class=\"mi\">1<\/span><span class=\"p\">;<\/span><span class=\"w\"> <\/span><span class=\"p\">}<\/span>\n<span class=\"w\">    <\/span><span class=\"k\">if<\/span><span class=\"w\"> <\/span><span class=\"p\">(<\/span><span class=\"n\">close<\/span><span class=\"p\">(<\/span><span class=\"n\">fd<\/span><span class=\"p\">)<\/span><span class=\"w\"> <\/span><span class=\"o\">==<\/span><span class=\"w\"> <\/span><span class=\"mi\">-1<\/span><span class=\"p\">)<\/span><span class=\"w\"> <\/span><span class=\"p\">{<\/span><span class=\"w\"> <\/span><span class=\"p\">...;<\/span><span class=\"w\"> <\/span><span class=\"k\">return<\/span><span class=\"w\"> <\/span><span class=\"mi\">1<\/span><span class=\"p\">;<\/span><span class=\"w\"> <\/span><span class=\"p\">}<\/span>\n<span class=\"w\">    <\/span><span class=\"k\">return<\/span><span class=\"w\"> <\/span><span class=\"mi\">0<\/span><span class=\"p\">;<\/span>\n<span class=\"p\">}<\/span>\n<\/code><\/pre><\/div>\n\n<ul>\n<li>注意：範例中 <code>buffer<\/code> <strong>沒有初始化<\/strong>就被 <code>sprintf<\/code> 寫進 shared memory，內容是未定義的垃圾——這只是骨架，Exercise 要你改成讀使用者輸入。<\/li>\n<li>結束時 <strong>沒有 shm_unlink<\/strong>——故意的，因為 kernel persistence 讓資料留給 consumer。<\/li>\n<li>錯誤檢查要和 <strong><code>MAP_FAILED<\/code><\/strong> 比，不是和 NULL 比。<\/li>\n<\/ul>\n<h3 id=\"lab7-consumerc\">投影片 consumer.c<\/h3>\n<div class=\"hl\"><pre><span><\/span><code><span class=\"kt\">int<\/span><span class=\"w\"> <\/span><span class=\"n\">fd<\/span><span class=\"w\"> <\/span><span class=\"o\">=<\/span><span class=\"w\"> <\/span><span class=\"n\">shm_open<\/span><span class=\"p\">(<\/span><span class=\"n\">NAME<\/span><span class=\"p\">,<\/span><span class=\"w\"> <\/span><span class=\
