.h&gt;<\/span>\n<span class=\"cp\">#include<\/span><span class=\"w\"> <\/span><span class=\"cpf\">&lt;sys/syscall.h&gt;<\/span>\n<span class=\"cp\">#include<\/span><span class=\"w\"> <\/span><span class=\"cpf\">&lt;unistd.h&gt;<\/span>\n<span class=\"kt\">int<\/span><span class=\"w\"> <\/span><span class=\"nf\">main<\/span><span class=\"p\">(<\/span><span class=\"kt\">void<\/span><span class=\"p\">)<\/span><span class=\"w\"> <\/span><span class=\"p\">{<\/span>\n<span class=\"w\">    <\/span><span class=\"n\">printf<\/span><span class=\"p\">(<\/span><span class=\"s\">\"%ld<\/span><span class=\"se\">\\n<\/span><span class=\"s\">\"<\/span><span class=\"p\">,<\/span><span class=\"w\"> <\/span><span class=\"n\">syscall<\/span><span class=\"p\">(<\/span><span class=\"mi\">462<\/span><span class=\"p\">));<\/span>\n<span class=\"w\">    <\/span><span class=\"k\">return<\/span><span class=\"w\"> <\/span><span class=\"mi\">0<\/span><span class=\"p\">;<\/span>\n<span class=\"p\">}<\/span>\n<\/code><\/pre><\/div>\n\n<ul>\n<li><code>syscall()<\/code> 回傳 <code>long<\/code>，所以用 <code>%ld<\/code>。<\/li>\n<li>執行 <code>./test<\/code> → terminal 印出 <code>0<\/code>（syscall 的回傳值）。<\/li>\n<li><strong><code>Hello<\/code> 不會出現在 terminal<\/strong>，要 <code>sudo dmesg | tail<\/code> 才會看到 <code>[ 684.324225] Hello<\/code>。<\/li>\n<li>若在<strong>舊 kernel<\/strong>（沒有 462 的那個）執行，會印 <code>-1<\/code>（errno = ENOSYS，補充）。<\/li>\n<\/ul>\n<p>編譯：投影片用 <code>make test<\/code>——沒有 Makefile 時，make 的內建規則會自動執行 <code>cc test.c -o test<\/code>。也可直接 <code>gcc test.c -o test<\/code>。<\/p>\n<h3 id=\"lab2-47-exercise-2-syscall_define1\">4.7 Exercise 2 參考解法：<code>SYSCALL_DEFINE1<\/code><\/h3>\n<p><code>hello/hello.c<\/code>：<\/p>\n<div class=\"hl\"><pre><span><\/span><code><span class=\"cp\">#include<\/span><span class=\"w\"> <\/span><span class=\"cpf\">&lt;linux/kernel.h&gt;<\/span>\n<span class=\"cp\">#include<\/span><span class=\"w\"> <\/span><span class=\"cpf\">&lt;linux/syscalls.h&gt;<\/span>\n\n<span class=\"n\">SYSCALL_DEFINE1<\/span><span class=\"p\">(<\/span><span class=\"n\">hello<\/span><span class=\"p\">,<\/span><span class=\"w\"> <\/span><span class=\"kt\">int<\/span><span class=\"p\">,<\/span><span class=\"w\"> <\/span><span class=\"n\">n<\/span><span class=\"p\">){<\/span>\n<span class=\"w\">    <\/span><span class=\"kt\">int<\/span><span class=\"w\"> <\/span><span class=\"n\">i<\/span><span class=\"p\">;<\/span>\n<span class=\"w\">    <\/span><span class=\"k\">for<\/span><span class=\"w\"> <\/span><span class=\"p\">(<\/span><span class=\"n\">i<\/span><span class=\"w\"> <\/span><span class=\"o\">=<\/span><span class=\"w\"> <\/span><span class=\"mi\">0<\/span><span class=\"p\">;<\/span><span class=\"w\"> <\/span><span class=\"n\">i<\/span><span class=\"w\"> <\/span><span class=\"o\">&lt;<\/span><span class=\"w\"> <\/span><span class=\"n\">n<\/span><span class=\"p\">;<\/span><span class=\"w\"> <\/span><span class=\"n\">i<\/span><span class=\"o\">++<\/span><span class=\"p\">)<\/span>\n<span class=\"w\">        <\/span><span class=\"n\">pr_info<\/span><span class=\"p\">(<\/span><span class=\"s\">\"Hello<\/span><span class=\"se\">\\n<\/span><span class=\"s\">\"<\/span><span class=\"p\">);<\/span>\n<span class=\"w\">    <\/span><span class=\"k\">return<\/span><span class=\"w\"> <\/span><span class=\"mi\">0<\/span><span class=\"p\">;<\/span>\n<span class=\"p\">}<\/span>\n<\/code><\/pre><\/div>\n\n<p><code>include/linux/syscalls.h<\/code> 的宣告要一起改：<\/p>\n<div class=\"hl\"><pre><span><\/span><code><span class=\"n\">asmlinkage<\/span><span class=\"w\"> <\/span><span class=\"kt\">long<\/span><span class=\"w\"> <\/span><span class=\"n\">sys_hello<\/span><span class=\"p\">(<\/span><span class=\"kt\">int<\/span><span class=\"w\"> <\/span><span class=\"n\">n<\/span><span class=\"p\">);<\/span>\n<\/code><\/pre><\/div>\n\n<p>syscall table 不用改（編號、名稱不變）。測試程式：<\/p>\n<div class=\"hl\"><pre><span><\/span><code><span class=\"cp\">#include<\/span><span class=\"w\"> <\/span><span class=\"cpf\">&lt;stdio.h&gt;<\/span>\n<span class=\"cp\">#include<\/span><span class=\"w\"> <\/span><span class=\"cpf\">&lt;sys/syscall.h&gt;<\/span>\n<span class=\"cp\">#include<\/span><span class=\"w\"> <\/span><span class=\"cpf\">&lt;unistd.h&gt;<\/span>\n<span class=\"kt\">int<\/span><span class=\"w\"> <\/span><span class=\"nf\">main<\/span><span class=\"p\">(<\/span><span class=\"kt\">void<\/span><span class=\"p\">)<\/span><span class=\"w\"> <\/span><span class=\"p\">{<\/span>\n<span class=\"w\">    <\/span><span class=\"n\">printf<\/span><span class=\"p\">(<\/span><span class=\"s\">\"%ld<\/span><span class=\"se\">\\n<\/span><span class=\"s\">\"<\/span><span class=\"p\">,<\/span><span class=\"w\"> <\/span><span class=\"n\">syscall<\/span><span class=\"p\">(<\/span><span class=\"mi\">462<\/span><span class=\"p\">,<\/span><span class=\"w\"> <\/span><span class=\"mi\">3<\/span><span class=\"p\">));<\/span><span class=\"w\">   <\/span><span class=\"cm\">/* 印 3 次 hello */<\/span>\n<span class=\"w\">    <\/span><span class=\"k\">return<\/span><span class=\"w\"> <\/span><span class=\"mi\">0<\/span><span class=\"p\">;<\/span>\n<span class=\"p\">}<\/span>\n<\/code><\/pre><\/div>\n\n<p><code>sudo dmesg | tail<\/code> 應看到 3 行 <code>Hello<\/code>。\n注意 <code>SYSCALL_DEFINE1(hello, int, n)<\/code> 的寫法是「<strong>型別, 名稱<\/strong>」分開成兩個參數，不是 <code>int n<\/code>。<\/p>\n<hr />\n<h2 id=\"lab2-5\">5. 上機考實作步驟<\/h2>\n<div class=\"hl\"><pre><span><\/span><code><span class=\"c1\"># ===== 0. 安裝工具 =====<\/span>\nsudo<span class=\"w\"> <\/span>apt<span class=\"w\"> <\/span>update\nsudo<span class=\"w\"> <\/span>apt-get<span class=\"w\"> <\/span>install<span class=\"w\"> <\/span>build-essential<span class=\"w\"> <\/span>vim<span class=\"w\"> <\/span>git<span class=\"w\"> <\/span>cscope<span class=\"w\"> <\/span>libncurses-dev<span class=\"w\"> <\/span>libssl-dev<span class=\"w\"> <\/span>bison<span class=\"w\"> <\/span>flex\n\n<span class=\"c1\"># ===== 1. 下載 kernel 原始碼 =====<\/span>\ngit<span class=\"w\"> <\/span>clone<span class=\"w\"> <\/span>--depth<span class=\"o\">=<\/span><span class=\"m\">1<\/span><span class=\"w\"> <\/span>-b<span class=\"w\"> <\/span>v7.1.3<span class=\"w\"> <\/span>https://git.kernel.org/pub/scm/linux/kernel/git/stable/linux.git\n<span class=\"c1\"># (備註：Ubuntu 24.04 也可改抓 v6.8：git clone --depth=1 --branch v6.8 https://git.kernel.org/pub/scm/linux/kernel/git/torvalds/linux.git)<\/span>\n<span class=\"nb\">cd<\/span><span class=\"w\"> <\/span>linux\n\n<span class=\"c1\"># ===== 2. 建立 syscall =====<\/span>\nmake<span class=\"w\"> <\/span>mrproper\nmkdir<span class=\"w\"> <\/span>hello<span class=\"w\"> <\/span><span class=\"o\">&amp;&amp;<\/span><span class=\"w\"> <\/span><span class=\"nb\">cd<\/span><span class=\"w\"> <\/span>hello\nvim<span class=\"w\"> <\/span>hello.c<span class=\"w\">            <\/span><span class=\"c1\"># 寫入 SYSCALL_DEFINE0(hello){ pr_info(\"Hello\\n\"); return 0; }<\/span>\n<span class=\"nb\">echo<\/span><span class=\"w\"> <\/span><span class=\"s1\">'obj-y += hello.o'<\/span><span class=\"w\"> <\/span>&gt;<span class=\"w\"> <\/span>Makefile\n<span class=\"nb\">cd<\/span><span class=\"w\"> <\/span>..\nvim<span class=\"w\"> <\/span>include/linux/syscalls.h<span class=\"w\">       <\/span><span class=\"c1\"># 加 asmlinkage long sys_hello(void);<\/span>\nvim<span class=\"w\"> <\/span>Kbuild<span class=\"w\">                          <\/span><span class=\"c1\"># 檔尾加 obj-y += hello/<\/span>\nvim<span class=\"w\"> <\/span>arch/x86/entry/syscalls/syscall_64.tbl<span class=\"w\">   <\/span><span class=\"c1\"># 加 462 common hello sys_hello<\/span>\n\n<span class=\"c1\"># ===== 3. 設定與編譯 =====<\/span>\ncp<span class=\"w\"> <\/span>/boot/config-<span class=\"k\">$(<\/span>uname<span class=\"w\"> <\/span>-r<span class=\"k\">)<\/span><span class=\"w\"> <\/span>.config\nmake<span class=\"w\"> <\/span>olddefconfig\nmake<span class=\"w\"> <\/span>localmodconfig<span class=\"w\">     <\/span><span class=\"c1\"># 一路按 Enter 用預設值<\/span>\nmake<span class=\"w\"> <\/span>-j<span class=\"w\"> <\/span><span class=\"k\">$(<\/span>nproc<span class=\"k\">)<\/span>\n<span class=\"c1\">#  - 缺 gelf.h / dwarf.h：sudo apt install libelf-dev libdw-dev<\/span>\n<span class=\"c1\">#  - gawk not found：     sudo apt install gawk<\/span>\n<span class=\"c1\">#  - 憑證錯誤：make menuconfig → Cryptographic API → Certificates for signature checking<\/span>\n<span class=\"c1\">#      → 清空 additional X.509 keys 路徑；取消 revocation certificates 的 *<\/span>\n<span class=\"c1\">#      → grep SYSTEM_TRUSTED_KEYS .config 確認為 \"\"<\/span>\n<span class=\"c1\">#  - 錯誤訊息太多看不到：make -j1<\/span>\n\n<span class=\"c1\"># ===== 4. 安裝 =====<\/span>\nsudo<span class=\"w\"> <\/span>make<span class=\"w\"> <\/span>-j<span class=\"w\"> <\/span><span class=\"k\">$(<\/span>nproc<span class=\"k\">)<\/span><span class=\"w\"> <\/span>modules_install\nsudo<span class=\"w\"> <\/span>make<span class=\"w\"> <\/span>install\nreboot\n<span class=\"c1\"># 開機時按住 Shift 進 GRUB → Advanced options for Ubuntu → Linux 7.1.3-dirty<\/span>\n\n<span class=\"c1\"># ===== 5. 測試 =====<\/span>\nuname<span class=\"w\"> <\/span>-r<span class=\"w\">                 <\/span><span class=\"c1\"># 確認是 7.1.3-dirty<\/span>\nmkdir<span class=\"w\"> <\/span>~/syscall_test<span class=\"w\"> <\/span><span class=\"o\">&amp;&amp;<\/span><span class=\"w\"> <\/span><span class=\"nb\">cd<\/span><span class=\"w\"> <\/span>~/syscall_test\nvim<span class=\"w\"> <\/span>test.c\nmake<span class=\"w\"> <\/span><span class=\"nb\">test<\/span><span class=\"w\">                <\/span><span class=\"c1\"># 或 gcc test.c -o test<\/span>\nchmod<span class=\"w\"> <\/span>+x<span class=\"w\"> <\/span><span class=\"nb\">test<\/span>\n./test<span class=\"w\">                   <\/span><span class=\"c1\"># 印出 0<\/span>\nsudo<span class=\"w\"> <\/span>dmesg<span class=\"w\"> <\/span><span class=\"p\">|<\/span><span class=\"w\"> <\/span>tail<span class=\"w\">        <\/span><span class=\"c1\"># 看到 Hello<\/span>\n\n<span class=\"c1\"># ===== Exercise 2：改完 hello.c 與 syscalls.h 後 =====<\/span>\n<span class=\"nb\">cd<\/span><span class=\"w\"> <\/span>~/linux\nmake<span class=\"w\"> <\/span>-j<span class=\"w\"> <\/span><span class=\"k\">$(<\/span>nproc<span class=\"k\">)<\/span>\nsudo<span class=\"w\"> <\/span>make<span class=\"w\"> <\/span>-j<span class=\"w\"> <\/span><span class=\"k\">$(<\/span>nproc<span class=\"k\">)<\/span><span class=\"w\"> <\/span>modules_install\nsudo<span class=\"w\"> <\/span>make<span class=\"w\"> <\/span>install\nreboot\n<\/code><\/pre><\/div>\n\n<hr />\n<h2 id=\"lab2-6\">6. 常見錯誤與陷阱<\/h2>\n<ol>\n<li><strong>以為 <code>pr_info<\/code> 會印在 terminal<\/strong>：它寫到 kernel ring buffer，要用 <code>dmesg<\/code> 看。terminal 只看到 <code>syscall()<\/code> 的回傳值。<\/li>\n<li><strong>沒開新 kernel<\/strong>：reboot 後沒在 GRUB 選 <code>7.1.3-dirty<\/code>，<code>syscall(462)<\/code> 會回傳 <code>-1<\/code>。先 <code>uname -r<\/code> 確認。<\/li>\n<li><strong>改了程式沒重編／重裝／重開機<\/strong>：syscall 是編進 kernel 映像的（<code>obj-y<\/code>），每次修改都要 <code>make<\/code> → <code>modules_install<\/code> → <code>install<\/code> → <code>reboot<\/code> 才生效。<\/li>\n<li><strong>Makefile 指令前用空白<\/strong>：一定要 TAB。<\/li>\n<li><strong>syscalls.h 宣告和 SYSCALL_DEFINE 參數不一致<\/strong>（Exercise 2 改成一個參數卻沒改宣告）。<\/li>\n<li><strong><code>SYSCALL_DEFINE1(hello, int n)<\/code><\/strong> 少了逗號——巨集要求型別和名稱分開。<\/li>\n<li><strong>在 kernel 程式用 <code>printf<\/code> / <code>#include &lt;stdio.h&gt;<\/code><\/strong>：kernel 沒有 libc。<\/li>\n<li><strong>printf 用 <code>%d<\/code> 印 <code>syscall()<\/code> 回傳的 long<\/strong>：會有警告，應用 <code>%ld<\/code>。<\/li>\n<li><strong>編號衝突<\/strong>：462 若已被新版 kernel 使用，就要換一個沒用過的編號（補充）。<\/li>\n<li>編 kernel 很慢 → 把 VM 的 CPU 核心數調高（接近實體邏輯處理器數）。<\/li>\n<li>所有 make 指令都要在 <code>linux/<\/code> 資料夾內執行。<\/li>\n<\/ol>\n<hr />\n<h2 id=\"lab2-7\">7. 筆試模擬題<\/h2>\n<p><strong>Q1（選擇）<\/strong> 下列何者最正確地描述 system call？\n(A) C 標準函式庫中的函式　(B) user-space 程式向 kernel 請求服務的機制　(C) 編譯器提供的內建函式　(D) shell 指令<\/p>\n<blockquote>\n<p><strong>答：B<\/strong>。libc 函式（如 <code>printf<\/code>）可能在內部呼叫 system call，但本身不是。<\/p>\n<\/blockquote>\n<p><strong>Q2（選擇）<\/strong> 在 kernel Makefile 中 <code>obj-y += hello.o<\/code> 的意思是？\n(A) 編成可載入模組　(B) 不編譯　(C) 直接靜態編進 kernel 映像檔　(D) 只編成 .o 不連結<\/p>\n<blockquote>\n<p><strong>答：C<\/strong>。<code>obj-m<\/code> 才是編成 module。<\/p>\n<\/blockquote>\n<p><strong>Q3（簡答）<\/strong> 新增一個 system call 需要修改哪些檔案？<\/p>\n<blockquote>\n<p><strong>答：<\/strong> ① 新增實作檔 <code>hello/hello.c<\/code> 與 <code>hello/Makefile<\/code>（<code>obj-y += hello.o<\/code>）；② <code>include/linux/syscalls.h<\/code> 加 <code>asmlinkage long sys_hello(void);<\/code>；③ 頂層 <code>Kbuild<\/code> 加 <code>obj-y += hello/<\/code>；④ <code>arch/x86/entry/syscalls/syscall_64.tbl<\/code> 加 <code>462 common hello sys_hello<\/code>。<\/p>\n<\/blockquote>\n<p><strong>Q4（輸出預測）<\/strong> 在已安裝新 kernel 的系統執行 test.c（<code>printf(\"%ld\\n\", syscall(462));<\/code>），terminal 顯示什麼？<code>Hello<\/code> 在哪裡？<\/p>\n<blockquote>\n<p><strong>答：<\/strong> terminal 印 <code>0<\/code>；<code>Hello<\/code> 在 kernel log，需 <code>sudo dmesg | tail<\/code> 查看。<\/p>\n<\/blockquote>\n<p><strong>Q5（是非）<\/strong> <code>asmlinkage<\/code> 表示函式參數從暫存器傳遞。<\/p>\n<blockquote>\n<p><strong>答：錯<\/strong>。依投影片，<code>asmlinkage<\/code> 告訴編譯器參數從 <strong>stack<\/strong> 取得。<\/p>\n<\/blockquote>\n<p><strong>Q6（選擇）<\/strong> syscall table 那一行 <code>462 common hello sys_hello<\/code> 中 <code>sys_hello<\/code> 代表？\n(A) syscall 編號　(B) ABI 類型　(C) syscall 名稱　(D) kernel 中的進入函式名稱<\/p>\n<blockquote>\n<p><strong>答：D<\/strong>。<\/p>\n<\/blockquote>\n<p><strong>Q7（簡答）<\/strong> <code>make -j $(nproc)<\/code> 中 <code>-j<\/code> 與 <code>$(nproc)<\/code> 的意義？<\/p>\n<blockquote>\n<p><strong>答：<\/strong> <code>-j<\/code> 指定同時執行的編譯 job 數；<code>$(nproc)<\/code> 取得 CPU 核心數，所以是「用全部核心平行編譯」。<\/p>\n<\/blockquote>\n<p><strong>Q8（簡答）<\/strong> <code>sudo make modules_install<\/code> 與 <code>sudo make install<\/code> 各做什麼？<\/p>\n<blockquote>\n<p><strong>答：<\/strong> 前者把編好的 kernel modules（.ko）裝到 <code>/lib/modules/&lt;版本&gt;/<\/code>；後者把 kernel 映像裝到 <code>/boot<\/code> 並更新 GRUB 開機選單。<\/p>\n<\/blockquote>\n<p><strong>Q9（程式填空）<\/strong> 讓 syscall 接受一個整數 n 並印 n 次 Hello：<\/p>\n<div class=\"hl\"><pre><span><\/span><code><span class=\"n\">SYSCALL_DEFINE1<\/span><span class=\"p\">(<\/span><span class=\"n\">______<\/span><span class=\"p\">)<\/span><span class=\"w\"> <\/span><span class=\"p\">{<\/span>\n<span class=\"w\">    <\/span><span class=\"kt\">int<\/span><span class=\"w\"> <\/span><span class=\"n\">i<\/span><span class=\"p\">;<\/span>\n<span class=\"w\">    <\/span><span class=\"k\">for<\/span><span class=\"w\"> <\/span><span class=\"p\">(<\/span><span class=\"n\">i<\/span><span class=\"w\"> <\/span><span class=\"o\">=<\/span><span class=\"w\"> <\/span><span class=\"mi\">0<\/span><span class=\"p\">;<\/span><span class=\"w\"> <\/span><span class=\"n\">i<\/span><span class=\"w\"> <\/span><span class=\"o\">&lt;<\/span><span class=\"w\"> <\/span><span class=\"n\">n<\/span><span class=\"p\">;<\/span><span class=\"w\"> <\/span><span class=\"n\">i<\/span><span class=\"o\">++<\/span><span class=\"p\">)<\/span><span class=\"w\"> <\/span><span class=\"n\">pr_info<\/span><span class=\"p\">(<\/span><span class=\"s\">\"Hello<\/span><span class=\"se\">\\n<\/span><span class=\"s\">\"<\/span><span class=\"p\">);<\/span>\n<span class=\"w\">    <\/span><span class=\"k\">return<\/span><span class=\"w\"> <\/span><span class=\"mi\">0<\/span><span class=\"p\">;<\/span>\n<span class=\"p\">}<\/span>\n<\/code><\/pre><\/div>\n\n<blockquote>\n<p><strong>答：<\/strong> <code>hello, int, n<\/code>。<\/p>\n<\/blockquote>\n<p><strong>Q10（是非）<\/strong> 修改 hello.c 後，只要重新 <code>make<\/code> 不用重開機，新的 syscall 就會生效。<\/p>\n<blockquote>\n<p><strong>答：錯<\/strong>。必須 <code>modules_install<\/code>、<code>install<\/code> 並 reboot 進新 kernel。<\/p>\n<\/blockquote>\n<p><strong>Q11（選擇）<\/strong> <code>make localmodconfig<\/code> 詢問新選項時直接按 Enter 會？\n(A) 選 y　(B) 選 m　(C) 選大寫的預設值（通常是 N）　(D) 中止<\/p>\n<blockquote>\n<p><strong>答：C<\/strong>。<\/p>\n<\/blockquote>\n<p><strong>Q12（簡答）<\/strong> 為何 user program 透過 <code>write()<\/code> 輸出時，實際會經過 C library？<\/p>\n<blockquote>\n<p><strong>答：<\/strong> libc 的 <code>write()<\/code> 是 wrapper，負責準備參數、觸發 system call 進入 kernel，由 kernel 的 <code>sys_write()<\/code> 真正執行，再把結果（或 -1 與 errno）傳回。<\/p>\n<\/blockquote>", "toc": [{"id": "lab2-1-lab", "name": "1. 這個 LAB 在學什麼", "kids": []}, {"id": "lab2-2", "name": "2. 核心觀念", "kids": [{"id": "lab2-21-system-call", "name": "2.1 什麼是 System Call"}, {"id": "lab2-22-syscall-4", "name": "2.2 新增 syscall 需要動的 4 個地方（必背）"}, {"id": "lab2-23", "name": "2.3 重要名詞"}, {"id": "lab2-24-makefile", "name": "2.4 Makefile 基本格式"}, {"id": "lab2-25-kernel", "name": "2.5 編譯 kernel 的設定指令（看備註）"}]}, {"id": "lab2-3-api", "name": "3. 指令／API 速查表", "kids": []}, {"id": "lab2-4", "name": "4. 程式範例逐行解說", "kids": [{"id": "lab2-41-linuxhellohelloc", "name": "4.1 linux/hello/hello.c（投影片範例）"}, {"id": "lab2-42-linuxhellomakefile", "name": "4.2 linux/hello/Makefile"}, {"id": "lab2-43-includelinuxsyscallsh-ifndef-config_arch_has_syscall_wrapper", "name": "4.3 include/linux/syscalls.h（加在 #ifndef CONFIG_ARCH_HAS_SYSCALL_WRAPPER 區段）"}, {"id": "lab2-44-linuxkbuild", "name": "4.4 linux/Kbuild（檔尾加一行）"}, {"id": "lab2-45-archx86entrysyscallssyscall_64tbl", "name": "4.5 arch/x86/entry/syscalls/syscall_64.tbl"}, {"id": "lab2-46-testc", "name": "4.6 測試程式 test.c"}, {"id": "lab2-47-exercise-2-syscall_define1", "name": "4.7 Exercise 2 參考解法：SYSCALL_DEFINE1"}]}, {"id": "lab2-5", "name": "5. 上機考實作步驟", "kids": []}, {"id": "lab2-6", "name": "6. 常見錯誤與陷阱", "kids": []}, {"id": "lab2-7", "name": "7. 筆試模擬題", "kids": []}]}, {"id": "lab3", "short": "Lab 3", "title": "Lab 3 複習：System Call vs APIs", "html": "<h1 id=\"lab3-lab-3-system-call-vs-apis\">Lab 3 複習：System Call vs APIs<\/h1>\n<blockquote>\n<p>來源：Lab3.pptx（33 張投影片，含講者備註）＋ practice/lab3/ex.c<\/p>\n<\/blockquote>\n<hr />\n<h2 id=\"lab3-1-lab\">1. 這個 LAB 在學什麼<\/h2>\n<p>認識 Unix-like 系統與 <strong>POSIX<\/strong> 標準、user space／kernel space 的分層，學會用 <strong>system call I/O<\/strong>（<code>open/read/write/close<\/code>）和 <strong>C library I/O<\/strong>（<code>fopen/fread/fwrite/fclose<\/code>）讀寫檔案，並用 <code>strace<\/code> 實驗證明：<strong><code>fread()<\/code> 因為有 user-space buffer，system call 次數遠少於 <code>read()<\/code>，所以快很多<\/strong>。另外介紹檔案權限碼（<code>ls -l<\/code>、<code>chmod<\/code>）。Exercise：只用 <code>&lt;unistd.h&gt;<\/code> 印出整數。<\/p>\n<hr />\n<h2 id=\"lab3-2\">2. 核心觀念<\/h2>\n<h3 id=\"lab3-21-unix-like\">2.1 Unix-like 系統<\/h3>\n<ul>\n<li>與 Unix 設計理念相似的 OS：<strong>Linux<\/strong>（嚴格說 Linux 只是 kernel；Ubuntu、Debian 等是發行版）、<strong>macOS<\/strong>、<strong>BSD 系列<\/strong>（FreeBSD、OpenBSD、NetBSD）。<\/li>\n<li>特色：<strong>一切都是檔案<\/strong>、命令列操作（CLI）、多使用者多工、process 管理、Shell 介面、開放並遵守 <strong>POSIX<\/strong>。<\/li>\n<\/ul>\n<h3 id=\"lab3-22-posix\">2.2 POSIX<\/h3>\n<ul>\n<li><strong>Portable Operating System Interface<\/strong>，由 <strong>IEEE<\/strong> 制定。<\/li>\n<li>規範 Unix／Unix-like 系統<strong>對外提供的程式介面與行為<\/strong>，讓程式容易在不同系統間移植。<\/li>\n<li>重要觀念（備註）：<strong>POSIX 規定 API「該有什麼功能和行為」，不規定 kernel 內部怎麼實作。<\/strong><\/li>\n<li>規範內容：① System interfaces（<code>read()<\/code>、<code>write()<\/code>、<code>fork()<\/code>、<code>wait()<\/code>…）② Library（含大部分 C 標準函式庫 <code>stdio.h<\/code>、<code>stdlib.h<\/code>）③ Shell 與工具 ④ 其他。<\/li>\n<li>投影片表格列出整學期會教的 POSIX 函式，括號數字是 x86-64 syscall 編號，例如 <code>read(0) write(1) open(2) close(3) fork(57) getpid(39) exec(59) wait(61) kill(62) mmap(9)<\/code>。有編號的是 system call；沒有編號的（<code>fopen<\/code>、<code>mq_open<\/code>、<code>pthread_create<\/code>、<code>sem_init<\/code>…）是 library 函式。<\/li>\n<\/ul>\n<h3 id=\"lab3-23-5\">2.3 分層架構（投影片第 5 頁）<\/h3>\n<div class=\"hl\"><pre><span><\/span><code> User application\n        │\n     Library（例如 C library）           ← user space\n ───────┼──── System call interface ────\n     OS kernel                           ← kernel space\n<\/code><\/pre><\/div>\n\n<ul>\n<li>User application 不能直接操作 kernel 資源，需要 OS 服務就要經過 <strong>system call interface<\/strong>。<\/li>\n<li>一般透過 library 函式呼叫；library 幫忙處理一些事，必要時才發 system call 進 kernel。<\/li>\n<\/ul>\n<h3 id=\"lab3-24-system-call-io-vs-c-library-io\">2.4 System call I/O vs C library I/O（重點比較）<\/h3>\n<table>\n<thead>\n<tr>\n<th><\/th>\n<th>System call I/O<\/th>\n<th>C Library I/O<\/th>\n<\/tr>\n<\/thead>\n<tbody>\n<tr>\n<td>函式<\/td>\n<td><code>open read write close<\/code><\/td>\n<td><code>fopen fread fwrite fclose<\/code><\/td>\n<\/tr>\n<tr>\n<td>標頭<\/td>\n<td><code>&lt;unistd.h&gt;<\/code>、<code>&lt;fcntl.h&gt;<\/code><\/td>\n<td><code>&lt;stdio.h&gt;<\/code><\/td>\n<\/tr>\n<tr>\n<td>代表檔案的東西<\/td>\n<td><strong>file descriptor（int）<\/strong><\/td>\n<td><strong><code>FILE *<\/code><\/strong>（stream）<\/td>\n<\/tr>\n<tr>\n<td>緩衝<\/td>\n<td>無 user-space buffer，每次呼叫都進 kernel<\/td>\n<td>有 user-space buffer，攢滿一批才呼叫一次 <code>read()<\/code>/<code>write()<\/code><\/td>\n<\/tr>\n<tr>\n<td>錯誤回傳<\/td>\n<td>-1 並設定 <code>errno<\/code><\/td>\n<td><code>fopen<\/code> 回 <code>NULL<\/code>；<code>fclose<\/code> 回 <code>EOF<\/code><\/td>\n<\/tr>\n<tr>\n<td>可移植性<\/td>\n<td>POSIX 系統<\/td>\n<td>任何有 C 標準函式庫的平台<\/td>\n<\/tr>\n<\/tbody>\n<\/table>\n<p><strong>為什麼 fread 比 read 快？<\/strong>（example4，必考）\n- 讀 10MB 檔，一次讀 1 byte、讀 10M 次：\n  - <code>read()<\/code> 版：<code>strace -c<\/code> 顯示 <strong>10,485,762 次 read syscall<\/strong>，花了 663 秒（在 strace 下）。\n  - <code>fread()<\/code> 版：只有 <strong>2,562 次 read syscall<\/strong>，約 1.5 秒。\n- 原因：<code>fread()<\/code> 第一次發現 buffer 空了，就呼叫一次 <code>read(fd, buf, 4096)<\/code> 從 kernel 拿 4096 bytes 放到 user-space buffer，之後 4096 次 <code>fread()<\/code> 都直接從 buffer 拿，不必進 kernel。<strong>每次 system call 都要切換 user mode ↔ kernel mode，成本很高<\/strong>，所以減少 syscall 次數就變快。\n- 這就是 Exercise 的學習目標：<strong>了解為何偏好使用把 system call 包裝過的函式。<\/strong><\/p>\n<h3 id=\"lab3-25-file-descriptor\">2.5 File Descriptor<\/h3>\n<ul>\n<li><code>open()<\/code> 回傳的小整數，代表一個開啟的檔案。<\/li>\n<li>每個程式啟動時 OS 自動開好三個：<strong>0 = stdin、1 = stdout、2 = stderr<\/strong>。stdout 預設連到 terminal，所以 <code>write(1, ...)<\/code> 就能印到螢幕。<\/li>\n<\/ul>\n<h3 id=\"lab3-26-permission-code\">2.6 權限碼（Permission Code）<\/h3>\n<p><code>ls -l<\/code> 輸出：<\/p>\n<div class=\"hl\"><pre><span><\/span><code>-rw-r--r-- 1 owner group 13 Sep 12 04:52 hello.txt\n│└┬┘└┬┘└┬┘\n│ │  │  └ Other\n│ │  └ Group\n│ └ Owner\n└ 類型：- 一般檔案、d 目錄\n<\/code><\/pre><\/div>\n\n<ul>\n<li><code>r<\/code>=4（讀）、<code>w<\/code>=2（寫）、<code>x<\/code>=1（執行），每組加總成一個八進位數字。<\/li>\n<li><code>rwxr-xr-x<\/code> = 7 5 5 = <code>755<\/code>；<code>rw-r--r--<\/code> = <code>644<\/code>；<code>-w-r--r--<\/code> = <code>244<\/code>。<\/li>\n<li>投影片示範：<code>chmod 0244 hello.txt<\/code> 後 owner 只剩寫入權，<code>cat hello.txt<\/code> → <code>Permission denied<\/code>。<\/li>\n<li><code>open()<\/code> 的 mode 參數 <code>0644<\/code> 前面的 <strong>0 表示八進位<\/strong>。<\/li>\n<\/ul>\n<h3 id=\"lab3-27-strace\">2.7 strace<\/h3>\n<p>攔截並顯示程式呼叫的 system calls 與 signals。<code>strace -c ./prog<\/code> 會統計每種 syscall 的次數（calls）、平均耗時（usecs/call）等。\n連最簡單的 <code>printf(\"Hello world\\n\")<\/code> 程式，<code>strace -c<\/code> 也看到 <code>execve, mmap, openat, write...<\/code> 共 34 次 syscall，其中真正輸出的只有 1 次 <code>write<\/code>。<\/p>\n<hr />\n<h2 id=\"lab3-3-api\">3. 指令／API 速查表<\/h2>\n<table>\n<thead>\n<tr>\n<th>名稱<\/th>\n<th>用途<\/th>\n<th>重要參數／回傳值<\/th>\n<th>範例<\/th>\n<\/tr>\n<\/thead>\n<tbody>\n<tr>\n<td><code>int open(const char *filename, int flags[, mode_t mode])<\/code><\/td>\n<td>開檔，取得 fd<\/td>\n<td>flags：<code>O_RDONLY<\/code> <code>O_WRONLY<\/code> <code>O_RDWR<\/code> <code>O_CREAT<\/code> <code>O_TRUNC<\/code> <code>O_APPEND<\/code>（可用 <code>\\|<\/code> 組合）；有 <code>O_CREAT<\/code> 時要給 mode。回傳 fd，失敗 -1 + errno<\/td>\n<td><code>open(\"hello.txt\", O_CREAT\\|O_WRONLY\\|O_TRUNC, 0644)<\/code><\/td>\n<\/tr>\n<tr>\n<td><code>ssize_t read(int fd, void *buf, size_t count)<\/code><\/td>\n<td>讀最多 count bytes<\/td>\n<td>回傳實際讀到的 bytes（≥0），<strong>0 = EOF<\/strong>，-1 = 錯誤<\/td>\n<td><code>read(f1, buffer, 4)<\/code><\/td>\n<\/tr>\n<tr>\n<td><code>ssize_t write(int fd, const void *buf, size_t count)<\/code><\/td>\n<td>寫 count bytes<\/td>\n<td>回傳實際寫入數（可能少於 count），-1 錯誤<\/td>\n<td><code>write(1, \"hi\\n\", 3)<\/code><\/td>\n<\/tr>\n<tr>\n<td><code>int close(int fd)<\/code><\/td>\n<td>關閉 fd<\/td>\n<td>0 成功，-1 錯誤<\/td>\n<td><code>close(f1)<\/code><\/td>\n<\/tr>\n<tr>\n<td><code>FILE *fopen(const char *filename, const char *mode)<\/code><\/td>\n<td>開檔<\/td>\n<td>mode：<code>r<\/code> <code>w<\/code> <code>a<\/code> <code>r+<\/code> <code>w+<\/code> <code>a+<\/code>；失敗回 <code>NULL<\/code><\/td>\n<td><code>fopen(\"XXX.txt\",\"w\")<\/code><\/td>\n<\/tr>\n<tr>\n<td><code>size_t fread(void *ptr, size_t size, size_t count, FILE *stream)<\/code><\/td>\n<td>讀 count 個 size 大小的元素<\/td>\n<td>回傳<strong>成功讀到的元素個數<\/strong><\/td>\n<td><code>fread(buffer, 1, sizeof(buffer), f1)<\/code><\/td>\n<\/tr>\n<tr>\n<td><code>size_t fwrite(const void *ptr, size_t size, size_t count, FILE *stream)<\/code><\/td>\n<td>寫<\/td>\n<td>回傳成功寫入的元素個數<\/td>\n<td><code>fwrite(buffer, sizeof(char), 4, f1)<\/code><\/td>\n<\/tr>\n<tr>\n<td><code>int fclose(FILE *stream)<\/code><\/td>\n<td>關閉並 flush buffer<\/td>\n<td>0 成功，失敗回 <code>EOF<\/code><\/td>\n<td><code>fclose(f1)<\/code><\/td>\n<\/tr>\n<tr>\n<td><code>ls -l<\/code><\/td>\n<td>長格式列檔<\/td>\n<td>權限、擁有者、大小、時間<\/td>\n<td><code>ls -l hello.txt<\/code><\/td>\n<\/tr>\n<tr>\n<td><code>chmod<\/code><\/td>\n<td>改權限<\/td>\n<td>八進位或 <code>u+x<\/code><\/td>\n<td><code>chmod 0244 hello.txt<\/code><\/td>\n<\/tr>\n<tr>\n<td><code>strace -c ./prog<\/code><\/td>\n<td>統計 syscall<\/td>\n<td>calls、usecs/call<\/td>\n<td><code>strace -c ./helloworld<\/code><\/td>\n<\/tr>\n<tr>\n<td><code>sudo sh -c \"echo 3 &gt; /proc/sys/vm/drop_caches\"<\/code><\/td>\n<td>清掉 page cache，讓計時公平<\/td>\n<td>—<\/td>\n<td>example4<\/td>\n<\/tr>\n<\/tbody>\n<\/table>\n<p>fopen mode 細節：\n| mode | 讀/寫 | 檔案不存在 | 檔案存在 |\n|---|---|---|---|\n| <code>\"r\"<\/code> | 讀 | 失敗 | 從頭讀 |\n| <code>\"w\"<\/code> | 寫 | 建立 | <strong>截成 0（清空）<\/strong> |\n| <code>\"a\"<\/code> | 附加寫 | 建立 | 寫在尾端 |\n| <code>\"r+\"<\/code> | 讀寫 | 失敗 | 不截斷 |\n| <code>\"w+\"<\/code> | 讀寫 | 建立 | 截斷 |\n| <code>\"a+\"<\/code> | 讀寫 | 建立 | 寫入一律在尾端 |<\/p>\n<hr />\n<h2 id=\"lab3-4\">4. 程式範例逐行解說<\/h2>\n<h3 id=\"lab3-41-example1-write_filec\">4.1 example1 – write_file.c<\/h3>\n<div class=\"hl\"><pre><span><\/span><code><span class=\"cp\">#include<\/span><span class=\"w\"> <\/span><span class=\"cpf\">&lt;unistd.h&gt;<\/span><span class=\"w\">     <\/span><span class=\"c1\">// open(), read(), write(), close()<\/span>\n<span class=\"cp\">#include<\/span><span class=\"w\"> <\/span><span class=\"cpf\">&lt;fcntl.h&gt;<\/span><span class=\"w\">      <\/span><span class=\"c1\">// O_CREAT, O_WRONLY ...<\/span>\n<span class=\"kt\">int<\/span><span class=\"w\"> <\/span><span class=\"nf\">main<\/span><span class=\"p\">()<\/span><span class=\"w\"> <\/span><span class=\"p\">{<\/span>\n<span class=\"w\">    <\/span><span class=\"kt\">int<\/span><span class=\"w\"> <\/span><span class=\"n\">fd<\/span><span class=\"p\">;<\/span>\n<span class=\"w\">    <\/span><span class=\"kt\">char<\/span><span class=\"w\"> <\/span><span class=\"n\">buffer<\/span><span class=\"p\">[]<\/span><span class=\"w\"> <\/span><span class=\"o\">=<\/span><span class=\"w\"> <\/span><span class=\"s\">\"Hello World<\/span><span class=\"se\">\\n<\/span><span class=\"s\">\"<\/span><span class=\"p\">;<\/span>\n<span class=\"w\">    <\/span><span class=\"n\">fd<\/span><span class=\"w\"> <\/span><span class=\"o\">=<\/span><span class=\"w\"> <\/span><span class=\"n\">open<\/span><span class=\"p\">(<\/span><span class=\"s\">\"hello.txt\"<\/span><span class=\"p\">,<\/span><span class=\"w\"> <\/span><span class=\"n\">O_CREAT<\/span><span class=\"w\"> <\/span><span class=\"o\">|<\/span><span class=\"w\"> <\/span><span class=\"n\">O_WRONLY<\/span><span class=\"p\">,<\/span><span class=\"w\"> <\/span><span class=\"mo\">0644<\/span><span class=\"p\">);<\/span>\n<span class=\"w\">    <\/span><span class=\"n\">write<\/span><span class=\"p\">(<\/span><span class=\"n\">fd<\/span><span class=\"p\">,<\/span><span class=\"w\"> <\/span><span class=\"n\">buffer<\/span><span class=\"p\">,<\/span><span class=\"w\"> <\/span><span class=\"k\">sizeof<\/span><span class=\"p\">(<\/span><span class=\"n\">buffer<\/span><span class=\"p\">));<\/span><span class=\"w\">   <\/span><span class=\"c1\">// 13 bytes（含結尾 '\\0'）<\/span>\n<span class=\"w\">    <\/span><span class=\"n\">close<\/span><span class=\"p\">(<\/span><span class=\"n\">fd<\/span><span class=\"p\">);<\/span>\n<span class=\"w\">    <\/span><span class=\"k\">return<\/span><span class=\"w\"> <\/span><span class=\"mi\">0<\/span><span class=\"p\">;<\/span>\n<span class=\"p\">}<\/span>\n<\/code><\/pre><\/div>\n\n<ul>\n<li><code>sizeof(buffer)<\/code> = 12 個字元 + <code>'\\0'<\/code> = <strong>13<\/strong>，所以檔案大小 13 bytes（<code>ls -l<\/code> 顯示 13），<strong>檔案裡其實多寫了一個 <code>'\\0'<\/code><\/strong>。<\/li>\n<li>投影片註解寫 <code>O_RDWR -&gt; open for write only<\/code>，但程式碼用的是 <code>O_WRONLY<\/code>——註解有誤，以程式碼為準。<\/li>\n<li>沒加 <code>O_TRUNC<\/code>：若 hello.txt 原本比較長，舊內容後半會殘留。<\/li>\n<\/ul>\n<h3 id=\"lab3-42-example1-read_filec\">4.2 example1 – read_file.c<\/h3>\n<div class=\"hl\"><pre><span><\/span><code><span class=\"cp\">#include<\/span><span class=\"w\"> <\/span><span class=\"cpf\">&lt;stdio.h&gt;<\/span>\n<span class=\"cp\">#include<\/span><span class=\"w\"> <\/span><span class=\"cpf\">&lt;unistd.h&gt;<\/span>\n<span class=\"cp\">#include<\/span><span class=\"w\"> <\/span><span class=\"cpf\">&lt;fcntl.h&gt;<\/span>\n<span class=\"kt\">int<\/span><span class=\"w\"> <\/span><span class=\"nf\">main<\/span><span class=\"p\">()<\/span><span class=\"w\"> <\/span><span class=\"p\">{<\/span>\n<span class=\"w\">    <\/span><span class=\"kt\">int<\/span><span class=\"w\"> <\/span><span class=\"n\">fd<\/span><span class=\"p\">;<\/span>\n<span class=\"w\">    <\/span><span class=\"kt\">char<\/span><span class=\"w\"> <\/span><span class=\"n\">buffer<\/span><span class=\"p\">[<\/span><span class=\"mi\">100<\/span><span class=\"p\">];<\/span>\n<span class=\"w\">    <\/span><span class=\"n\">fd<\/span><span class=\"w\"> <\/span><span class=\"o\">=<\/span><span class=\"w\"> <\/span><span class=\"n\">open<\/span><span class=\"p\">(<\/span><span class=\"s\">\"hello.txt\"<\/span><span class=\"p\">,<\/span><span class=\"w\"> <\/span><span class=\"n\">O_RDONLY<\/span><span class=\"p\">);<\/span>\n<span class=\"w\">    <\/span><span class=\"n\">read<\/span><span class=\"p\">(<\/span><span class=\"n\">fd<\/span><span class=\"p\">,<\/span><span class=\"w\"> <\/span><span class=\"n\">buffer<\/span><span class=\"p\">,<\/span><span class=\"w\"> <\/span><span class=\"k\">sizeof<\/span><span class=\"p\">(<\/span><span class=\"n\">buffer<\/span><span class=\"p\">));<\/span><span class=\"w\">   <\/span><span class=\"c1\">// 最多讀 100 bytes，實際讀到 13<\/span>\n<span class=\"w\">    <\/span><span class=\"n\">printf<\/span><span class=\"p\">(<\/span><span class=\"s\">\"%s\"<\/span><span class=\"p\">,<\/span><span class=\"w\"> <\/span><span class=\"n\">buffer<\/span><span class=\"p\">);<\/span>\n<span class=\"w\">    <\/span><span class=\"n\">close<\/span><span class=\"p\">(<\/span><span class=\"n\">fd<\/span><span class=\"p\">);<\/span>\n<span class=\"w\">    <\/span><span class=\"k\">return<\/span><span class=\"w\"> <\/span><span class=\"mi\">0<\/span><span class=\"p\">;<\/span>\n<span class=\"p\">}<\/span>\n<\/code><\/pre><\/div>\n\n<p>輸出 <code>Hello World<\/code>。能正常印是因為 write_file 剛好把 <code>'\\0'<\/code> 也寫進檔案；<strong><code>read()<\/code> 不會自動補 <code>'\\0'<\/code><\/strong>，一般檔案要自己用回傳值 <code>n<\/code> 補 <code>buffer[n] = '\\0'<\/code>。<\/p>\n<h3 id=\"lab3-43-example2-write_to_terminatorc\">4.3 example2 – write_to_terminator.c<\/h3>\n<div class=\"hl\"><pre><span><\/span><code><span class=\"cp\">#include<\/span><span class=\"w\"> <\/span><span class=\"cpf\">&lt;unistd.h&gt;<\/span>\n<span class=\"kt\">int<\/span><span class=\"w\"> <\/span><span class=\"nf\">main<\/span><span class=\"p\">(){<\/span>\n<span class=\"w\">    <\/span><span class=\"kt\">char<\/span><span class=\"w\"> <\/span><span class=\"n\">buffer<\/span><span class=\"p\">[]<\/span><span class=\"w\"> <\/span><span class=\"o\">=<\/span><span class=\"w\"> <\/span><span class=\"s\">\"Hello World<\/span><span class=\"se\">\\n<\/span><span class=\"s\">\"<\/span><span class=\"p\">;<\/span>\n<span class=\"w\">    <\/span><span class=\"n\">write<\/span><span class=\"p\">(<\/span><span class=\"mi\">1<\/span><span class=\"p\">,<\/span><span class=\"w\"> <\/span><span class=\"n\">buffer<\/span><span class=\"p\">,<\/span><span class=\"w\"> <\/span><span class=\"k\">sizeof<\/span><span class=\"p\">(<\/span><span class=\"n\">buffer<\/span><span class=\"p\">));<\/span><span class=\"w\">   <\/span><span class=\"c1\">// fd 1 = stdout<\/span>\n<span class=\"w\">    <\/span><span class=\"k\">return<\/span><span class=\"w\"> <\/span><span class=\"mi\">0<\/span><span class=\"p\">;<\/span>\n<span class=\"p\">}<\/span>\n<\/code><\/pre><\/div>\n\n<p>不用 <code>&lt;stdio.h&gt;<\/code> 也能印到螢幕：直接寫到 fd 1。<\/p>\n<h3 id=\"lab3-44-example3-fwrite_filec-fread_filec\">4.4 example3 – fwrite_file.c / fread_file.c<\/h3>\n<div class=\"hl\"><pre><span><\/span><code><span class=\"kt\">FILE<\/span><span class=\"w\"> <\/span><span class=\"o\">*<\/span><span class=\"n\">fp<\/span><span class=\"w\"> <\/span><span class=\"o\">=<\/span><span class=\"w\"> <\/span><span class=\"n\">fopen<\/span><span class=\"p\">(<\/span><span class=\"s\">\"hello.txt\"<\/span><span class=\"p\">,<\/span><span class=\"w\"> <\/span><span class=\"s\">\"w+\"<\/span><span class=\"p\">);<\/span><span class=\"w\">          <\/span><span class=\"c1\">// 讀寫，不存在就建，存在就清空<\/span>\n<span class=\"k\">if<\/span><span class=\"w\"> <\/span><span class=\"p\">(<\/span><span class=\"n\">fp<\/span><span class=\"w\"> <\/span><span class=\"o\">==<\/span><span class=\"w\"> <\/span><span class=\"nb\">NULL<\/span><span class=\"p\">)<\/span><span class=\"w\"> <\/span><span class=\"p\">{<\/span><span class=\"w\"> <\/span><span class=\"n\">perror<\/span><span class=\"p\">(<\/span><span class=\"s\">\"fopen\"<\/span><span class=\"p\">);<\/span><span class=\"w\"> <\/span><span class=\"n\">exit<\/span><span class=\"p\">(<\/span><span class=\"mi\">1<\/span><span class=\"p\">);<\/span><span class=\"w\"> <\/span><span class=\"p\">}<\/span>\n<span class=\"n\">fwrite<\/span><span class=\"p\">(<\/span><span class=\"n\">buffer<\/span><span class=\"p\">,<\/span><span class=\"w\"> <\/span><span class=\"k\">sizeof<\/span><span class=\"p\">(<\/span><span class=\"n\">buffer<\/span><span class=\"p\">),<\/span><span class=\"w\"> <\/span><span class=\"mi\">1<\/span><span class=\"p\">,<\/span><span class=\"w\"> <\/span><span class=\"n\">fp<\/span><span class=\"p\">);<\/span><span class=\"w\">        <\/span><span class=\"c1\">// 1 個大小為 13 的元素<\/span>\n<span class=\"n\">fclose<\/span><span class=\"p\">(<\/span><span class=\"n\">fp<\/span><span class=\"p\">);<\/span><span class=\"w\">                                   <\/span><span class=\"c1\">// flush buffer 並關閉<\/span>\n<\/code><\/pre><\/div>\n\n<div class=\"hl\"><pre><span><\/span><code><span class=\"kt\">FILE<\/span><span class=\"w\"> <\/span><span class=\"o\">*<\/span><span class=\"n\">fp<\/span><span class=\"w\"> <\/span><span class=\"o\">=<\/span><span class=\"w\"> <\/span><span class=\"n\">fopen<\/span><span class=\"p\">(<\/span><span class=\"s\">\"hello.txt\"<\/span><span class=\"p\">,<\/span><span class=\"w\"> <\/span><span class=\"s\">\"rb\"<\/span><span class=\"p\">);<\/span><span class=\"w\">          <\/span><span class=\"c1\">// 唯讀（binary）<\/span>\n<span class=\"kt\">size_t<\/span><span class=\"w\"> <\/span><span class=\"n\">n<\/span><span class=\"w\"> <\/span><span class=\"o\">=<\/span><span class=\"w\"> <\/span><span class=\"n\">fread<\/span><span class=\"p\">(<\/span><span class=\"n\">buffer<\/span><span class=\"p\">,<\/span><span class=\"w\"> <\/span><span class=\"mi\">1<\/span><span class=\"p\">,<\/span><span class=\"w\"> <\/span><span class=\"k\">sizeof<\/span><span class=\"p\">(<\/span><span class=\"n\">buffer<\/span><span class=\"p\">),<\/span><span class=\"w\"> <\/span><span class=\"n\">fp<\/span><span class=\"p\">);<\/span><span class=\"w\">   <\/span><span class=\"c1\">// n = 13<\/span>\n<span class=\"n\">printf<\/span><span class=\"p\">(<\/span><span class=\"s\">\"%s\"<\/span><span class=\"p\">,<\/span><span class=\"w\"> <\/span><span class=\"n\">buffer<\/span><span class=\"p\">);<\/span>\n<span class=\"n\">fclose<\/span><span class=\"p\">(<\/span><span class=\"n\">fp<\/span><span class=\"p\">);<\/span>\n<\/code><\/pre><\/div>\n\n<ul>\n<li><code>fwrite(buffer, sizeof(buffer), 1, fp)<\/code> 回傳 <strong>1<\/strong>（元素個數），不是 13。<\/li>\n<li><code>fread(buffer, 1, 100, fp)<\/code> 回傳 <strong>13<\/strong>（每個元素 1 byte）。<\/li>\n<li>這就是 size／count 順序的差別：回傳值單位是「元素」。<\/li>\n<\/ul>\n<h3 id=\"lab3-45-example4-read-vs-fread\">4.5 example4 – read() vs fread()<\/h3>\n<ol>\n<li><code>create_file<\/code> 建一個 10MB（10485760 bytes）的 my_file.txt。<\/li>\n<li><code>sequential_read<\/code>（用 read，每次 1 byte）vs <code>sequential_fread<\/code>（用 fread，每次 1 byte），每次執行前清 cache。<\/li>\n<li>結果：read 版 2.94 秒、fread 版 0.14 秒；<code>strace -c<\/code> 顯示 read 版 10,485,762 次 <code>read<\/code>，fread 版只有 2,562 次。<\/li>\n<\/ol>\n<h3 id=\"lab3-46-practicelab3exc-unistdh\">4.6 學生作業 practice/lab3/ex.c（只用 unistd.h 印整數）<\/h3>\n<div class=\"hl\"><pre><span><\/span><code><span class=\"cp\">#include<\/span><span class=\"w\"> <\/span><span class=\"cpf\">&lt;unistd.h&gt;<\/span>\n<span class=\"kt\">void<\/span><span class=\"w\"> <\/span><span class=\"nf\">myp<\/span><span class=\"p\">(<\/span><span class=\"kt\">long<\/span><span class=\"w\"> <\/span><span class=\"kt\">long<\/span><span class=\"w\"> <\/span><span class=\"n\">a<\/span><span class=\"p\">)<\/span><span class=\"w\"> <\/span><span class=\"p\">{<\/span>\n<span class=\"w\">  <\/span><span class=\"kt\">char<\/span><span class=\"w\"> <\/span><span class=\"n\">buffer<\/span><span class=\"p\">[<\/span><span class=\"mi\">18<\/span><span class=\"p\">];<\/span>\n<span class=\"w\">  <\/span><span class=\"n\">buffer<\/span><span class=\"p\">[<\/span><span class=\"mi\">18<\/span><span class=\"p\">]<\/span><span class=\"w\"> <\/span><span class=\"o\">=<\/span><span class=\"w\"> <\/span><span class=\"sc\">'\\n'<\/span><span class=\"p\">;<\/span><span class=\"w\">          <\/span><span class=\"c1\">// ← BUG：索引 18 超出陣列（合法 0~17）<\/span>\n<span class=\"w\">  <\/span><span class=\"kt\">int<\/span><span class=\"w\"> <\/span><span class=\"n\">neg<\/span><span class=\"w\"> <\/span><span class=\"o\">=<\/span><span class=\"w\"> <\/span><span class=\"mi\">0<\/span><span class=\"p\">;<\/span>\n<span class=\"w\">  <\/span><span class=\"kt\">int<\/span><span class=\"w\"> <\/span><span class=\"n\">i<\/span><span class=\"w\"> <\/span><span class=\"o\">=<\/span><span class=\"w\"> <\/span><span class=\"mi\">17<\/span><span class=\"p\">;<\/span>\n<span class=\"w\">  <\/span><span class=\"k\">if<\/span><span class=\"p\">(<\/span><span class=\"n\">a<\/span><span class=\"w\"> <\/span><span class=\"o\">&lt;<\/span><span class=\"w\"> <\/span><span class=\"mi\">0<\/span><span class=\"p\">)<\/span><span class=\"w\"> <\/span><span class=\"p\">{<\/span><span class=\"w\"> <\/span><span class=\"n\">a<\/span><span class=\"w\"> <\/span><span class=\"o\">=<\/span><span class=\"w\"> <\/span><span class=\"n\">a<\/span><span class=\"w\"> <\/span><span class=\"o\">*<\/span><span class=\"w\"> <\/span><span class=\"p\">(<\/span><span class=\"mi\">-1<\/span><span class=\"p\">);<\/span><span class=\"w\"> <\/span><span class=\"n\">neg<\/span><span class=\"w\"> <\/span><span class=\"o\">=<\/span><span class=\"w\"> <\/span><span class=\"mi\">1<\/span><span class=\"p\">;<\/span><span class=\"w\"> <\/span><span class=\"p\">}<\/span>\n<span class=\"w\">  <\/span><span class=\"k\">else<\/span><span class=\"w\"> <\/span><span class=\"k\">if<\/span><span class=\"p\">(<\/span><span class=\"n\">a<\/span><span class=\"w\"> <\/span><span class=\"o\">==<\/span><span class=\"w\"> <\/span><span class=\"mi\">0<\/span><span class=\"p\">)<\/span><span class=\"w\"> <\/span><span class=\"p\">{<\/span><span class=\"w\"> <\/span><span class=\"n\">buffer<\/span><span class=\"p\">[<\/span><span class=\"n\">i<\/span><span class=\"o\">--<\/span><span class=\"p\">]<\/span><span class=\"w\"> <\/span><span class=\"o\">=<\/span><span class=\"w\"> <\/span><span class=\"sc\">'0'<\/span><span class=\"p\">;<\/span><span class=\"w\"> <\/span><span class=\"p\">}<\/span>\n<span class=\"w\">  <\/span><span class=\"k\">while<\/span><span class=\"p\">(<\/span><span class=\"n\">a<\/span><span class=\"w\"> <\/span><span class=\"o\">&gt;<\/span><span class=\"w\"> <\/span><span class=\"mi\">0<\/span><span class=\"p\">)<\/span><span class=\"w\"> <\/span><span class=\"p\">{<\/span><span class=\"w\"> <\/span><span class=\"n\">buffer<\/span><span class=\"p\">[<\/span><span class=\"n\">i<\/span><span class=\"o\">--<\/span><span class=\"p\">]<\/span><span class=\"w\"> <\/span><span class=\"o\">=<\/span><span class=\"w\"> <\/span><span class=\"sc\">'0'<\/span><span class=\"w\"> <\/span><span class=\"o\">+<\/span><span class=\"w\"> <\/span><span class=\"n\">a<\/span><span class=\"o\">%<\/span><span class=\"mi\">10<\/span><span class=\"p\">;<\/span><span class=\"w\"> <\/span><span class=\"n\">a<\/span><span class=\"w\"> <\/span><span class=\"o\">=<\/span><span class=\"w\"> <\/span><span class=\"n\">a<\/span><span class=\"o\">/<\/span><span class=\"mi\">10<\/span><span class=\"p\">;<\/span><span class=\"w\"> <\/span><span class=\"p\">}<\/span><span class=\"w\">   <\/span><span class=\"c1\">// 從尾巴往前填數字<\/span>\n<span class=\"w\">  <\/span><span class=\"k\">if<\/span><span class=\"p\">(<\/span><span class=\"n\">neg<\/span><span class=\"w\"> <\/span><span class=\"o\">==<\/span><span class=\"w\"> <\/span><span class=\"mi\">1<\/span><span class=\"p\">)<\/span><span class=\"w\"> <\/span><span class=\"p\">{<\/span><span class=\"w\"> <\/span><span class=\"n\">buffer<\/span><span class=\"p\">[<\/span><span class=\"n\">i<\/span><span class=\"o\">--<\/span><span class=\"p\">]<\/span><span class=\"w\"> <\/span><span class=\"o\">=<\/span><span class=\"w\"> <\/span><span class=\"sc\">'-'<\/span><span class=\"p\">;<\/span><span class=\"w\"> <\/span><span class=\"p\">}<\/span>\n<span class=\"w\">  <\/span><span class=\"n\">write<\/span><span class=\"p\">(<\/span><span class=\"mi\">1<\/span><span class=\"p\">,<\/span><span class=\"w\"> <\/span><span class=\"n\">buffer<\/span><span class=\"w\"> <\/span><span class=\"o\">+<\/span><span class=\"w\"> <\/span><span class=\"n\">i<\/span><span class=\"w\"> <\/span><span class=\"o\">+<\/span><span class=\"w\"> <\/span><span class=\"mi\">1<\/span><span class=\"p\">,<\/span><span class=\"w\"> <\/span><span class=\"mi\">18<\/span><span class=\"w\"> <\/span><span class=\"o\">-<\/span><span class=\"w\"> <\/span><span class=\"n\">i<\/span><span class=\"p\">);<\/span><span class=\"w\">   <\/span><span class=\"c1\">// 從第一個字元寫到 buffer[18]（含換行）<\/span>\n<span class=\"p\">}<\/span>\n<span class=\"kt\">int<\/span><span class=\"w\"> <\/span><span class=\"nf\">main<\/span><span class=\"p\">()<\/span><span class=\"w\"> <\/span><span class=\"p\">{<\/span>\n<span class=\"w\">  <\/span><span class=\"n\">myp<\/span><span class=\"p\">(<\/span><span class=\"mi\">0<\/span><span class=\"p\">);<\/span><span class=\"w\"> <\/span><span class=\"n\">myp<\/span><span class=\"p\">(<\/span><span class=\"mi\">100<\/span><span class=\"p\">);<\/span><span class=\"w\"> <\/span><span class=\"n\">myp<\/span><span class=\"p\">(<\/span><span class=\"mi\">2147483647<\/span><span class=\"p\">);<\/span><span class=\"w\"> <\/span><span class=\"n\">myp<\/span><span class=\"p\">(<\/span><span class=\"mi\">-2147483648<\/span><span class=\"p\">);<\/span><span class=\"w\"> <\/span><span class=\"n\">myp<\/span><span class=\"p\">(<\/span><span class=\"mi\">-1644604641554687<\/span><span class=\"p\">);<\/span>\n<span class=\"p\">}<\/span>\n<\/code><\/pre><\/div>\n\n<p><strong>思路<\/strong>：用 <code>a%10<\/code> 取個位數、<code>a/10<\/code> 去掉個位，從陣列尾端往前填，最後一次 <code>write<\/code> 輸出。負數先轉正、最後補 <code>-<\/code>；0 要特判（否則 while 一次都不跑）。<\/p>\n<p>預期輸出：<\/p>\n<div class=\"hl\"><pre><span><\/span><code>0\n100\n2147483647\n-2147483648\n-1644604641554687\n<\/code><\/pre><\/div>\n\n<p><strong>問題與 bug：<\/strong>\n1. <strong>陣列越界（未定義行為）<\/strong>：<code>char buffer[18]<\/code> 合法索引是 0~17，但程式寫入 <code>buffer[18] = '\\n'<\/code>，而且 <code>write(..., 18 - i)<\/code> 也會讀到 <code>buffer[18]<\/code>。能跑出正確結果純屬運氣（剛好沒蓋到重要資料）；換編譯器或開 <code>-O2<\/code>／<code>-fsanitize=address<\/code> 就可能壞掉。\n2. <strong>容量不足的風險<\/strong>：<code>long long<\/code> 最小值 <code>-9223372036854775808<\/code> 有 19 位數 + 負號 + 換行 = 21 字元，18 格放不下。\n3. <strong><code>LLONG_MIN<\/code> 取負號會溢位<\/strong>：<code>a * (-1)<\/code> 對 <code>-9223372036854775808<\/code> 是 signed overflow（UB）。題目測資沒測到，但值得知道。\n4. <code>main<\/code> 沒寫 <code>return 0;<\/code>（C99 起 main 會自動回 0，不算錯）。<\/p>\n<p><strong>修正版（參考解法）：<\/strong><\/p>\n<div class=\"hl\"><pre><span><\/span><code><span class=\"cp\">#include<\/span><span class=\"w\"> <\/span><span class=\"cpf\">&lt;unistd.h&gt;<\/span>\n\n<span class=\"kt\">void<\/span><span class=\"w\"> <\/span><span class=\"nf\">my_print<\/span><span class=\"p\">(<\/span><span class=\"kt\">long<\/span><span class=\"w\"> <\/span><span class=\"kt\">long<\/span><span class=\"w\"> <\/span><span class=\"n\">a<\/span><span class=\"p\">)<\/span><span class=\"w\"> <\/span><span class=\"p\">{<\/span>\n<span class=\"w\">    <\/span><span class=\"kt\">char<\/span><span class=\"w\"> <\/span><span class=\"n\">buf<\/span><span class=\"p\">[<\/span><span class=\"mi\">21<\/span><span class=\"p\">];<\/span><span class=\"w\">                       <\/span><span class=\"cm\">/* 19 位數 + '-' + '\\n' */<\/span>\n<span class=\"w\">    <\/span><span class=\"kt\">int<\/span><span class=\"w\"> <\/span><span class=\"n\">i<\/span><span class=\"w\"> <\/span><span class=\"o\">=<\/span><span class=\"w\"> <\/span><span class=\"mi\">20<\/span><span class=\"p\">;<\/span>\n<span class=\"w\">    <\/span><span class=\"kt\">unsigned<\/span><span class=\"w\"> <\/span><span class=\"kt\">long<\/span><span class=\"w\"> <\/span><span class=\"kt\">long<\/span><span class=\"w\"> <\/span><span class=\"n\">u<\/span><span class=\"p\">;<\/span>\n<span class=\"w\">    <\/span><span class=\"n\">buf<\/span><span class=\"p\">[<\/span><span class=\"n\">i<\/span><span class=\"o\">--<\/span><span class=\"p\">]<\/span><span class=\"w\"> <\/span><span class=\"o\">=<\/span><span class=\"w\"> <\/span><span class=\"sc\">'\\n'<\/span><span class=\"p\">;<\/span>\n<span class=\"w\">    <\/span><span class=\"k\">if<\/span><span class=\"w\"> <\/span><span class=\"p\">(<\/span><span class=\"n\">a<\/span><span class=\"w\"> <\/span><span class=\"o\">&lt;<\/span><span class=\"w\"> <\/span><span class=\"mi\">0<\/span><span class=\"p\">)<\/span><span class=\"w\"> <\/span><span class=\"n\">u<\/span><span class=\"w\"> <\/span><span class=\"o\">=<\/span><span class=\"w\"> <\/span><span class=\"p\">(<\/span><span class=\"kt\">unsigned<\/span><span class=\"w\"> <\/span><span class=\"kt\">long<\/span><span class=\"w\"> <\/span><span class=\"kt\">long<\/span><span class=\"p\">)(<\/span><span class=\"o\">-<\/span><span class=\"p\">(<\/span><span class=\"n\">a<\/span><span class=\"w\"> <\/span><span class=\"o\">+<\/span><span class=\"w\"> <\/span><span class=\"mi\">1<\/span><span class=\"p\">))<\/span><span class=\"w\"> <\/span><span class=\"o\">+<\/span><span class=\"w\"> <\/span><span class=\"mi\">1<\/span><span class=\"p\">;<\/span><span class=\"w\">   <\/span><span class=\"cm\">/* 避免 LLONG_MIN 溢位 */<\/span>\n<span class=\"w\">    <\/span><span class=\"k\">else<\/span><span class=\"w\">       <\/span><span class=\"n\">u<\/span><span class=\"w\"> <\/span><span class=\"o\">=<\/span><span class=\"w\"> <\/span><span class=\"p\">(<\/span><span class=\"kt\">unsigned<\/span><span class=\"w\"> <\/span><span class=\"kt\">long<\/span><span class=\"w\"> <\/span><span class=\"kt\">long<\/span><span class=\"p\">)<\/span><span class=\"n\">a<\/span><span class=\"p\">;<\/span>\n<span class=\"w\">    <\/span><span class=\"k\">if<\/span><span class=\"w\"> <\/span><span class=\"p\">(<\/span><span class=\"n\">u<\/span><span class=\"w\"> <\/span><span class=\"o\">==<\/span><span class=\"w\"> <\/span><span class=\"mi\">0<\/span><span class=\"p\">)<\/span><span class=\"w\"> <\/span><span class=\"n\">buf<\/span><span class=\"p\">[<\/span><span class=\"n\">i<\/span><span class=\"o\">--<\/span><span class=\"p\">]<\/span><span class=\"w\"> <\/span><span class=\"o\">=<\/span><span class=\"w\"> <\/span><span class=\"sc\">'0'<\/span><span class=\"p\">;<\/span>\n<span class=\"w\">    <\/span><span class=\"k\">while<\/span><span class=\"w\"> <\/span><span class=\"p\">(<\/span><span class=\"n\">u<\/span><span class=\"w\"> <\/span><span class=\"o\">&gt;<\/span><span class=\"w\"> <\/span><span class=\"mi\">0<\/span><span class=\"p\">)<\/span><span class=\"w\"> <\/span><span class=\"p\">{<\/span>\n<span class=\"w\">        <\/span><span class=\"n\">buf<\/span><span class=\"p\">[<\/span><span class=\"n\">i<\/span><span class=\"o\">--<\/span><span class=\"p\">]<\/span><span class=\"w\"> <\/span><span class=\"o\">=<\/span><span class=\"w\"> <\/span><span class=\"sc\">'0'<\/span><span class=\"w\"> <\/span><span class=\"o\">+<\/span><span class=\"w\"> <\/span><span class=\"p\">(<\/span><span class=\"n\">u<\/span><span class=\"w\"> <\/span><span class=\"o\">%<\/span><span class=\"w\"> <\/span><span class=\"mi\">10<\/span><span class=\"p\">);<\/span>\n<span class=\"w\">        <\/span><span class=\"n\">u<\/span><span class=\"w\"> <\/span><span class=\"o\">/=<\/span><span class=\"w\"> <\/span><span class=\"mi\">10<\/span><span class=\"p\">;<\/span>\n<span class=\"w\">    <\/span><span class=\"p\">}<\/span>\n<span class=\"w\">    <\/span><span class=\"k\">if<\/span><span class=\"w\"> <\/span><span class=\"p\">(<\/span><span class=\"n\">a<\/span><span class=\"w\"> <\/span><span class=\"o\">&lt;<\/span><span class=\"w\"> <\/span><span class=\"mi\">0<\/span><span class=\"p\">)<\/span><span class=\"w\"> <\/span><span class=\"n\">buf<\/span><span class=\"p\">[<\/span><span class=\"n\">i<\/span><span class=\"o\">--<\/span><span class=\"p\">]<\/span><span class=\"w\"> <\/span><span class=\"o\">=<\/span><span class=\"w\"> <\/span><span class=\"sc\">'-'<\/span><span class=\"p\">;<\/span>\n<span class=\"w\">    <\/span><span class=\"n\">write<\/span><span class=\"p\">(<\/span><span class=\"mi\">1<\/span><span class=\"p\">,<\/span><span class=\"w\"> <\/span><span class=\"n\">buf<\/span><span class=\"w\"> <\/span><span class=\"o\">+<\/span><span class=\"w\"> <\/span><span class=\"n\">i<\/span><span class=\"w\"> <\/span><span class=\"o\">+<\/span><span class=\"w\"> <\/span><span class=\"mi\">1<\/span><span class=\"p\">,<\/span><span class=\"w\"> <\/span><span class=\"mi\">20<\/span><span class=\"w\"> <\/span><span class=\"o\">-<\/span><span class=\"w\"> <\/span><span class=\"n\">i<\/span><span class=\"p\">);<\/span><span class=\"w\">      <\/span><span class=\"cm\">/* 從 buf[i+1] 寫到 buf[20] */<\/span>\n<span class=\"p\">}<\/span>\n\n<span class=\"kt\">int<\/span><span class=\"w\"> <\/span><span class=\"nf\">main<\/span><span class=\"p\">(<\/span><span class=\"kt\">void<\/span><span class=\"p\">)<\/span><span class=\"w\"> <\/span><span class=\"p\">{<\/span>\n<span class=\"w\">    <\/span><span class=\"n\">my_print<\/span><span class=\"p\">(<\/span><span class=\"mi\">0<\/span><span class=\"p\">);<\/span>\n<span class=\"w\">    <\/span><span class=\"n\">my_print<\/span><span class=\"p\">(<\/span><span class=\"mi\">100<\/span><span class=\"p\">);<\/span>\n<span class=\"w\">    <\/span><span class=\"n\">my_print<\/span><span class=\"p\">(<\/span><span class=\"mi\">2147483647<\/span><span class=\"p\">);<\/span>\n<span class=\"w\">    <\/span><span class=\"n\">my_print<\/span><span class=\"p\">(<\/span><span class=\"mi\">-2147483648LL<\/span><span class=\"p\">);<\/span>\n<span class=\"w\">    <\/span><span class=\"k\">return<\/span><span class=\"w\"> <\/span><span class=\"mi\">0<\/span><span class=\"p\">;<\/span>\n<span class=\"p\">}<\/span>\n<\/code><\/pre><\/div>\n\n<p>助教會檢查有沒有偷 <code>#include &lt;stdio.h&gt;<\/code>，所以<strong>整個檔案只能有 <code>&lt;unistd.h&gt;<\/code><\/strong>（不能用 <code>printf<\/code>、<code>sprintf<\/code>、<code>itoa<\/code>）。<\/p>\n<hr />\n<h2 id=\"lab3-5\">5. 上機考實作步驟<\/h2>\n<div class=\"hl\"><pre><span><\/span><code><span class=\"c1\"># 寫檔 / 讀檔範例<\/span>\nvim<span class=\"w\"> <\/span>write_file.c\nvim<span class=\"w\"> <\/span>read_file.c\ngcc<span class=\"w\"> <\/span>write_file.c<span class=\"w\"> <\/span>-o<span class=\"w\"> <\/span>write_file\ngcc<span class=\"w\"> <\/span>read_file.c<span class=\"w\"> <\/span>-o<span class=\"w\"> <\/span>read_file\n./write_file\n./read_file<span class=\"w\">                     <\/span><span class=\"c1\"># Hello World<\/span>\nls<span class=\"w\"> <\/span>-l<span class=\"w\"> <\/span>hello.txt<span class=\"w\">                 <\/span><span class=\"c1\"># -rw-r--r-- ... 13 ... hello.txt<\/span>\n\n<span class=\"c1\"># 權限實驗<\/span>\nchmod<span class=\"w\"> <\/span><span class=\"m\">0244<\/span><span class=\"w\"> <\/span>hello.txt\nls<span class=\"w\"> <\/span>-l<span class=\"w\"> <\/span>hello.txt<span class=\"w\">                 <\/span><span class=\"c1\"># --w-r--r--<\/span>\ncat<span class=\"w\"> <\/span>hello.txt<span class=\"w\">                   <\/span><span class=\"c1\"># Permission denied<\/span>\nchmod<span class=\"w\"> <\/span><span class=\"m\">644<\/span><span class=\"w\"> <\/span>hello.txt<span class=\"w\">             <\/span><span class=\"c1\"># 改回來<\/span>\n\n<span class=\"c1\"># 比較 read vs fread<\/span>\nsudo<span class=\"w\"> <\/span>sh<span class=\"w\"> <\/span>-c<span class=\"w\"> <\/span><span class=\"s2\">\"echo 3 &gt; /proc/sys/vm/drop_caches\"<\/span>\n./sequential_read<span class=\"w\"> <\/span><span class=\"m\">1<\/span>\nsudo<span class=\"w\"> <\/span>sh<span class=\"w\"> <\/span>-c<span class=\"w\"> <\/span><span class=\"s2\">\"echo 3 &gt; /proc/sys/vm/drop_caches\"<\/span>\n./sequential_fread<span class=\"w\"> <\/span><span class=\"m\">1<\/span>\nstrace<span class=\"w\"> <\/span>-c<span class=\"w\"> <\/span>./sequential_read<span class=\"w\"> <\/span><span class=\"m\">1<\/span>\nstrace<span class=\"w\"> <\/span>-c<span class=\"w\"> <\/span>./sequential_fread<span class=\"w\"> <\/span><span class=\"m\">1<\/span>\n\n<span class=\"c1\"># Exercise<\/span>\nvim<span class=\"w\"> <\/span>lab3.c<span class=\"w\">                      <\/span><span class=\"c1\"># 只 include &lt;unistd.h&gt;<\/span>\ngcc<span class=\"w\"> <\/span>lab3.c<span class=\"w\"> <\/span>-o<span class=\"w\"> <\/span>lab3\n./lab3\ngrep<span class=\"w\"> <\/span>include<span class=\"w\"> <\/span>lab3.c<span class=\"w\">             <\/span><span class=\"c1\"># 自我檢查：只能看到 unistd.h<\/span>\n<\/code><\/pre><\/div>\n\n<hr />\n<h2 id=\"lab3-6\">6. 常見錯誤與陷阱<\/h2>\n<ol>\n<li><code>open()<\/code> 有 <code>O_CREAT<\/code> 卻沒給第三個參數 mode → 新檔權限是亂的。<\/li>\n<li>mode 寫成 <code>644<\/code>（十進位）而不是 <code>0644<\/code>（八進位）→ 權限完全不對。<\/li>\n<li>以為 <code>read()<\/code> 會自動補 <code>'\\0'<\/code> → 印字串時印出垃圾。<\/li>\n<li>忘了 <code>read()<\/code> 回傳 <strong>0 代表 EOF<\/strong>，-1 才是錯誤。<\/li>\n<li><code>write()<\/code> 回傳值可能小於 count（部分寫入）。<\/li>\n<li><code>fread/fwrite<\/code> 的回傳值是「<strong>元素個數<\/strong>」，不是 byte 數。<\/li>\n<li>用 <code>fwrite<\/code> 後沒 <code>fclose<\/code>/<code>fflush<\/code> 就結束（例如程式 crash）→ buffer 內資料沒真的寫入檔案。<\/li>\n<li><code>\"w\"<\/code> 模式會<strong>清空<\/strong>既有檔案。<\/li>\n<li>混用 <code>printf<\/code> 與 <code>write(1, ...)<\/code>：printf 有 buffer、write 沒有，輸出順序可能跟程式碼順序不同（補充）。<\/li>\n<li>Exercise 的陣列大小與索引邊界（見 4.6）。<\/li>\n<\/ol>\n<hr />\n<h2 id=\"lab3-7\">7. 筆試模擬題<\/h2>\n<p><strong>Q1（選擇）<\/strong> POSIX 是由哪個組織制定？主要目的是？\n(A) ISO／定義 C 語法　(B) IEEE／讓程式在不同 Unix-like 系統間可移植　(C) Linux Foundation／規定 kernel 實作　(D) GNU／提供 shell<\/p>\n<blockquote>\n<p><strong>答：B<\/strong>。POSIX 規範介面與行為，不規定 kernel 內部實作。<\/p>\n<\/blockquote>\n<p><strong>Q2（是非）<\/strong> POSIX 規定了 <code>read()<\/code> 在 kernel 內部必須如何實作。<\/p>\n<blockquote>\n<p><strong>答：錯<\/strong>。只規定功能與行為。<\/p>\n<\/blockquote>\n<p><strong>Q3（選擇）<\/strong> 程式啟動時 fd 2 預設是？\n(A) stdin　(B) stdout　(C) stderr　(D) 第一個 open 的檔案<\/p>\n<blockquote>\n<p><strong>答：C<\/strong>。0=stdin、1=stdout、2=stderr。<\/p>\n<\/blockquote>\n<p><strong>Q4（簡答）<\/strong> 為何用 <code>fread()<\/code> 一次讀 1 byte 讀 10MB，比 <code>read()<\/code> 一次讀 1 byte 快很多？<\/p>\n<blockquote>\n<p><strong>答：<\/strong> <code>fread()<\/code> 有 user-space buffer，一次 <code>read()<\/code> syscall 就從 kernel 拿約 4096 bytes，之後的 fread 直接從 buffer 取，syscall 次數從約一千萬次降到幾千次；每次 syscall 都需 user/kernel mode 切換，成本高。<\/p>\n<\/blockquote>\n<p><strong>Q5（輸出預測）<\/strong><\/p>\n<div class=\"hl\"><pre><span><\/span><code><span class=\"kt\">char<\/span><span class=\"w\"> <\/span><span class=\"n\">buffer<\/span><span class=\"p\">[]<\/span><span class=\"w\"> <\/span><span class=\"o\">=<\/span><span class=\"w\"> <\/span><span class=\"s\">\"Hello World<\/span><span class=\"se\">\\n<\/span><span class=\"s\">\"<\/span><span class=\"p\">;<\/span>\n<span class=\"kt\">int<\/span><span class=\"w\"> <\/span><span class=\"n\">fd<\/span><span class=\"w\"> <\/span><span class=\"o\">=<\/span><span class=\"w\"> <\/span><span class=\"n\">open<\/span><span class=\"p\">(<\/span><span class=\"s\">\"a.txt\"<\/span><span class=\"p\">,<\/span><span class=\"w\"> <\/span><span class=\"n\">O_CREAT<\/span><span class=\"o\">|<\/span><span class=\"n\">O_WRONLY<\/span><span class=\"o\">|<\/span><span class=\"n\">O_TRUNC<\/span><span class=\"p\">,<\/span><span class=\"w\"> <\/span><span class=\"mo\">0644<\/span><span class=\"p\">);<\/span>\n<span class=\"kt\">ssize_t<\/span><span class=\"w\"> <\/span><span class=\"n\">n<\/span><span class=\"w\"> <\/span><span class=\"o\">=<\/span><span class=\"w\"> <\/span><span class=\"n\">write<\/span><span class=\"p\">(<\/span><span class=\"n\">fd<\/span><span class=\"p\">,<\/span><span class=\"w\"> <\/span><span class=\"n\">buffer<\/span><span class=\"p\">,<\/span><span class=\"w\"> <\/span><span class=\"k\">sizeof<\/span><span class=\"p\">(<\/span><span class=\"n\">buffer<\/span><span class=\"p\">));<\/span>\n<span class=\"n\">printf<\/span><span class=\"p\">(<\/span><span class=\"s\">\"%zd<\/span><span class=\"se\">\\n<\/span><span class=\"s\">\"<\/span><span class=\"p\">,<\/span><span class=\"w\"> <\/span><span class=\"n\">n<\/span><span class=\"p\">);<\/span>\n<\/code><\/pre><\/div>\n\n<blockquote>\n<p><strong>答：<\/strong> <code>13<\/code>（12 個字元 + <code>'\\0'<\/code>）。<\/p>\n<\/blockquote>\n<p><strong>Q6（權限）<\/strong> <code>chmod 754 file<\/code> 之後，<code>ls -l<\/code> 權限欄位顯示？<\/p>\n<blockquote>\n<p><strong>答：<\/strong> <code>-rwxr-xr--<\/code>（7=rwx、5=r-x、4=r--）。<\/p>\n<\/blockquote>\n<p><strong>Q7（選擇）<\/strong> <code>read()<\/code> 回傳 0 表示？\n(A) 錯誤　(B) 讀到 EOF　(C) 讀到 1 byte　(D) 檔案不存在<\/p>\n<blockquote>\n<p><strong>答：B<\/strong>。錯誤是 -1。<\/p>\n<\/blockquote>\n<p><strong>Q8（輸出預測）<\/strong> 檔案 data.txt 內容為 <code>ABCDE<\/code>（5 bytes，無換行）：<\/p>\n<div class=\"hl\"><pre><span><\/span><code><span class=\"kt\">FILE<\/span><span class=\"w\"> <\/span><span class=\"o\">*<\/span><span class=\"n\">fp<\/span><span class=\"w\"> <\/span><span class=\"o\">=<\/span><span class=\"w\"> <\/span><span class=\"n\">fopen<\/span><span class=\"p\">(<\/span><span class=\"s\">\"data.txt\"<\/span><span class=\"p\">,<\/span><span class=\"w\"> <\/span><span class=\"s\">\"r\"<\/span><span class=\"p\">);<\/span>\n<span class=\"kt\">char<\/span><span class=\"w\"> <\/span><span class=\"n\">buf<\/span><span class=\"p\">[<\/span><span class=\"mi\">10<\/span><span class=\"p\">];<\/span>\n<span class=\"kt\">size_t<\/span><span class=\"w\"> <\/span><span class=\"n\">n<\/span><span class=\"w\"> <\/span><span class=\"o\">=<\/span><span class=\"w\"> <\/span><span class=\"n\">fread<\/span><span class=\"p\">(<\/span><span class=\"n\">buf<\/span><span class=\"p\">,<\/span><span class=\"w\"> <\/span><span class=\"mi\">2<\/span><span class=\"p\">,<\/span><span class=\"w\"> <\/span><span class=\"mi\">4<\/span><span class=\"p\">,<\/span><span class=\"w\"> <\/span><span class=\"n\">fp<\/span><span class=\"p\">);<\/span>\n<span class=\"n\">printf<\/span><span class=\"p\">(<\/span><span class=\"s\">\"%zu<\/span><span class=\"se\">\\n<\/span><span class=\"s\">\"<\/span><span class=\"p\">,<\/span><span class=\"w\"> <\/span><span class=\"n\">n<\/span><span class=\"p\">);<\/span>\n<\/code><\/pre><\/div>\n\n<blockquote>\n<p><strong>答：<\/strong> <code>2<\/code>。要讀 4 個 2-byte 元素，但只有 5 bytes，只湊得出 2 個完整元素（第 5 個 byte 不足一個元素）。<\/p>\n<\/blockquote>\n<p><strong>Q9（選擇）<\/strong> 想「開檔寫入，不存在就建立，存在就清空」，用 <code>open<\/code> 應該怎麼寫 flags？\n(A) <code>O_WRONLY<\/code>　(B) <code>O_WRONLY|O_APPEND<\/code>　(C) <code>O_CREAT|O_WRONLY|O_TRUNC<\/code>　(D) <code>O_RDONLY|O_CREAT<\/code><\/p>\n<blockquote>\n<p><strong>答：C<\/strong>。對應 <code>fopen<\/code> 的 <code>\"w\"<\/code>。<\/p>\n<\/blockquote>\n<p><strong>Q10（簡答）<\/strong> <code>fopen<\/code> 的 <code>\"a+\"<\/code> 和 <code>\"w+\"<\/code> 差在哪？<\/p>\n<blockquote>\n<p><strong>答：<\/strong> 兩者都可讀寫、檔案不存在會建立。<code>\"w+\"<\/code> 會把既有檔案清空；<code>\"a+\"<\/code> 不清空，而且寫入一律附加在檔尾。<\/p>\n<\/blockquote>\n<p><strong>Q11（選擇）<\/strong> 下列哪一個「不是」system call？\n(A) <code>write<\/code>　(B) <code>fork<\/code>　(C) <code>fopen<\/code>　(D) <code>close<\/code><\/p>\n<blockquote>\n<p><strong>答：C<\/strong>。<code>fopen<\/code> 是 C library 函式，內部呼叫 <code>open<\/code>。<\/p>\n<\/blockquote>\n<p><strong>Q12（程式）<\/strong> 只用 <code>&lt;unistd.h&gt;<\/code>，寫出把字元 <code>'A'<\/code> 和換行印到螢幕的一行程式。<\/p>\n<blockquote>\n<p><strong>答：<\/strong> <code>write(1, \"A\\n\", 2);<\/code><\/p>\n<\/blockquote>\n<p><strong>Q13（簡答）<\/strong> <code>strace<\/code> 是做什麼的？<code>-c<\/code> 的作用？<\/p>\n<blockquote>\n<p><strong>答：<\/strong> 追蹤程式執行時呼叫的 system call 和收到的 signal；<code>-c<\/code> 會統計每種 syscall 的次數、耗時並在結束時列表。<\/p>\n<\/blockquote>", "toc": [{"id": "lab3-1-lab", "name": "1. 這個 LAB 在學什麼", "kids": []}, {"id": "lab3-2", "name": "2. 核心觀念", "kids": [{"id": "lab3-21-unix-like", "name": "2.1 Unix-like 系統"}, {"id": "lab3-22-posix", "name": "2.2 POSIX"}, {"id": "lab3-23-5", "name": "2.3 分層架構（投影片第 5 頁）"}, {"id": "lab3-24-system-call-io-vs-c-library-io", "name": "2.4 System call I/O vs C library I/O（重點比較）"}, {"id": "lab3-25-file-descriptor", "name": "2.5 File Descriptor"}, {"id": "lab3-26-permission-code", "name": "2.6 權限碼（Permission Code）"}, {"id": "lab3-27-strace", "name": "2.7 strace"}]}, {"id": "lab3-3-api", "name": "3. 指令／API 速查表", "kids": []}, {"id": "lab3-4", "name": "4. 程式範例逐行解說", "kids": [{"id": "lab3-41-example1-write_filec", "name": "4.1 example1 – write_file.c"}, {"id": "lab3-42-example1-read_filec", "name": "4.2 example1 – read_file.c"}, {"id": "lab3-43-example2-write_to_terminatorc", "name": "4.3 example2 – write_to_terminator.c"}, {"id": "lab3-44-example3-fwrite_filec-fread_filec", "name": "4.4 example3 – fwrite_file.c / fread_file.c"}, {"id": "lab3-45-example4-read-vs-fread", "name": "4.5 example4 – read() vs fread()"}, {"id": "lab3-46-practicelab3exc-unistdh", "name": "4.6 學生作業 practice/lab3/ex.c（只用 unistd.h 印整數）"}]}, {"id": "lab3-5", "name": "5. 上機考實作步驟", "kids": []}, {"id": "lab3-6", "name": "6. 常見錯誤與陷阱", "kids": []}, {"id": "lab3-7", "name": "7. 筆試模擬題", "kids": []}]}, {"id": "lab4", "short": "Lab 4", "title": "Lab 4 複習：Library（Static & Dynamic）", "html": "<h1 id=\"lab4-lab-4-librarystatic-dynamic\">Lab 4 複習：Library（Static &amp; Dynamic）<\/h1>\n<blockquote>\n<p>來源：Lab4.pptx（28 張投影片，含講者備註）＋ practice/lab4/（ex1.c、sort.c、exlib.h、exlib.a、exlib.so、ex1、ex_dy）<\/p>\n<\/blockquote>\n<hr />\n<h2 id=\"lab4-1-lab\">1. 這個 LAB 在學什麼<\/h2>\n<p>把函式打包成 <strong>library<\/strong> 給其他程式使用，分成兩種：<strong>Static Library（.a，archive）<\/strong>在連結時就把程式碼複製進執行檔；<strong>Dynamic／Shared Library（.so）<\/strong>只在執行檔裡記錄「需要哪個 .so」，執行時才由 loader 載入。學會用 <code>gcc -c<\/code>、<code>ar rcs<\/code> 做 static library，用 <code>-fPIC<\/code>、<code>-shared<\/code> 做 shared library，並處理「執行時找不到 .so」的問題（複製到 <code>/lib<\/code>）、用 <code>ldd<\/code> 檢查相依。<\/p>\n<hr />\n<h2 id=\"lab4-2\">2. 核心觀念<\/h2>\n<h3 id=\"lab4-21-library\">2.1 Library 是什麼<\/h3>\n<ul>\n<li>把一些行為（behavior）實作成的集合，提供定義良好的介面，照規定呼叫即可。<\/li>\n<li>例：不用自己寫就能呼叫 <code>printf()<\/code>；用高階語言包裝 system call。<\/li>\n<\/ul>\n<h3 id=\"lab4-22-static-vs-dynamic\">2.2 Static vs Dynamic（必考比較表）<\/h3>\n<table>\n<thead>\n<tr>\n<th>特性<\/th>\n<th>Static Library（<code>.a<\/code>, Windows <code>.lib<\/code>）<\/th>\n<th>Dynamic/Shared Library（<code>.so<\/code>, <code>.dll<\/code>, <code>.dylib<\/code>）<\/th>\n<\/tr>\n<\/thead>\n<tbody>\n<tr>\n<td>連結時機<\/td>\n<td><strong>編譯（連結）時<\/strong>直接把程式碼複製進執行檔<\/td>\n<td><strong>執行時<\/strong>才載入<\/td>\n<\/tr>\n<tr>\n<td>執行檔大小<\/td>\n<td>大（包含 library code）<\/td>\n<td>小（只含符號／參照）<\/td>\n<\/tr>\n<tr>\n<td>更新 library<\/td>\n<td>要<strong>重新編譯<\/strong>程式<\/td>\n<td><strong>替換 .so 檔<\/strong>即可<\/td>\n<\/tr>\n<tr>\n<td>執行效率<\/td>\n<td>較快（少一層間接呼叫）<\/td>\n<td>稍慢（需動態載入、間接呼叫）<\/td>\n<\/tr>\n<tr>\n<td>共用性<\/td>\n<td>無，每個程式各一份<\/td>\n<td>多個程式可<strong>共用記憶體中的同一份<\/strong><\/td>\n<\/tr>\n<tr>\n<td>優點<\/td>\n<td>不用考慮相依性；執行檔可獨立存在<\/td>\n<td>省硬碟、省記憶體<\/td>\n<\/tr>\n<tr>\n<td>缺點<\/td>\n<td>多程式用同一 library 時浪費空間；更新要重編<\/td>\n<td>不同程式需要不同版本時有<strong>相依性問題<\/strong><\/td>\n<\/tr>\n<\/tbody>\n<\/table>\n<h3 id=\"lab4-23\">2.3 建置流程<\/h3>\n<p><strong>Static：<\/strong><\/p>\n<div class=\"hl\"><pre><span><\/span><code>add.c ─compiler→ add.o ┐\nsub.c ─compiler→ sub.o ┴─archiver(ar)→ lib.a ┐\nmain.c ─compiler→ main.o ────────────────────┴─linker→ Executable（已含 add/sub 的程式碼）\n<\/code><\/pre><\/div>\n\n<p>執行檔獨立存在，<strong>執行時不需要 lib.a<\/strong>（刪掉 lib.a 程式仍能跑）。<\/p>\n<p><strong>Dynamic：<\/strong><\/p>\n<div class=\"hl\"><pre><span><\/span><code>add.c ─compiler(-fPIC)→ add.o ┐\nsub.c ─compiler(-fPIC)→ sub.o ┴─linker(-shared)→ lib.so ┐\nmain.c ─compiler→ main.o ───────────────────────────────┴─linker→ Executable（只記錄 add/sub 在 lib.so）\n執行時：Loader 把 lib.so 載入記憶體，多個執行檔可共用\n<\/code><\/pre><\/div>\n\n<h3 id=\"lab4-24\">2.4 重要名詞<\/h3>\n<ul>\n<li><strong>archive<\/strong>：static library 本質上就是把多個 <code>.o<\/code> 打包成一個檔案。<\/li>\n<li><strong><code>ar rcs<\/code><\/strong>：<code>r<\/code> = replace（新增或覆蓋 archive 中的檔案）、<code>c<\/code> = create（archive 不存在就建立，不顯示警告）、<code>s<\/code> = 建立符號索引（symbol index，等同 <code>ranlib<\/code>），讓 linker 快速找到符號；少了 <code>s<\/code> 可能連結變慢或找不到符號。<\/li>\n<li><strong><code>-fPIC<\/code><\/strong>：Position-Independent Code，<strong>位置無關碼<\/strong>。shared library 會被載入到每個 process 不同的位址，程式碼不能寫死絕對位址。<\/li>\n<li><strong><code>-shared<\/code><\/strong>：讓 gcc 產生 shared object（.so）而不是執行檔。<\/li>\n<li><strong><code>-L.<\/code><\/strong>：告訴 linker 去<strong>目前目錄<\/strong>找 library。<\/li>\n<li><strong>dynamic linker / loader<\/strong>：執行時負責找到並載入 .so；預設只找 <code>/lib<\/code>、<code>/usr/lib<\/code> 等系統路徑（以及 <code>/etc/ld.so.conf<\/code> 設定的路徑），<strong>不會找目前目錄<\/strong>。<\/li>\n<li><strong><code>ldd<\/code><\/strong>：列出程式使用到的 shared library 及其路徑。<\/li>\n<\/ul>\n<hr />\n<h2 id=\"lab4-3\">3. 指令速查表<\/h2>\n<table>\n<thead>\n<tr>\n<th>名稱<\/th>\n<th>用途<\/th>\n<th>重要參數<\/th>\n<th>範例<\/th>\n<\/tr>\n<\/thead>\n<tbody>\n<tr>\n<td><code>gcc -c<\/code><\/td>\n<td>只編譯成 <code>.o<\/code>，不連結<\/td>\n<td>可一次多檔<\/td>\n<td><code>gcc -c add.c sub.c<\/code><\/td>\n<\/tr>\n<tr>\n<td><code>ar rcs<\/code><\/td>\n<td>打包 static library<\/td>\n<td>r=replace、c=create、s=index<\/td>\n<td><code>ar rcs lib.a add.o sub.o<\/code><\/td>\n<\/tr>\n<tr>\n<td><code>ar t<\/code><\/td>\n<td>列出 archive 內容<\/td>\n<td>—<\/td>\n<td><code>ar t lib.a<\/code><\/td>\n<\/tr>\n<tr>\n<td><code>gcc main.c -L. lib.a -o x<\/code><\/td>\n<td>連結 static library<\/td>\n<td><code>-L.<\/code> 目前目錄<\/td>\n<td><code>gcc main.c -L. lib.a -o example_static<\/code><\/td>\n<\/tr>\n<tr>\n<td><code>gcc -c -fPIC<\/code><\/td>\n<td>編譯成位置無關的 .o<\/td>\n<td>—<\/td>\n<td><code>gcc -c -fPIC add.c sub.c<\/code><\/td>\n<\/tr>\n<tr>\n<td><code>gcc -shared<\/code><\/td>\n<td>產生 .so<\/td>\n<td>—<\/td>\n<td><code>gcc add.o sub.o -shared -o lib.so<\/code><\/td>\n<\/tr>\n<tr>\n<td><code>gcc main.c -L. lib.so -o x<\/code><\/td>\n<td>連結 shared library<\/td>\n<td>—<\/td>\n<td><code>gcc main.c -L. lib.so -o example_dynamic<\/code><\/td>\n<\/tr>\n<tr>\n<td><code>sudo cp lib.so /lib/<\/code><\/td>\n<td>讓 loader 找得到<\/td>\n<td>—<\/td>\n<td><code>sudo cp lib.so /lib/lib.so<\/code><\/td>\n<\/tr>\n<tr>\n<td><code>ldd<\/code><\/td>\n<td>列出相依的 .so<\/td>\n<td>—<\/td>\n<td><code>ldd example_dynamic<\/code><\/td>\n<\/tr>\n<tr>\n<td><code>ls -l<\/code><\/td>\n<td>比較檔案大小<\/td>\n<td>—<\/td>\n<td><code>ls -l<\/code><\/td>\n<\/tr>\n<tr>\n<td>（補充）<code>LD_LIBRARY_PATH<\/code><\/td>\n<td>不用 sudo，暫時加搜尋路徑<\/td>\n<td>—<\/td>\n<td><code>LD_LIBRARY_PATH=. ./example_dynamic<\/code><\/td>\n<\/tr>\n<tr>\n<td>（補充）<code>-lname<\/code><\/td>\n<td>連結 <code>libname.a/.so<\/code><\/td>\n<td>檔名要以 <code>lib<\/code> 開頭<\/td>\n<td><code>gcc main.c -L. -lexlib<\/code>（需 <code>libexlib.so<\/code>）<\/td>\n<\/tr>\n<tr>\n<td>（補充）<code>nm<\/code><\/td>\n<td>列出 .o/.a/.so 的符號<\/td>\n<td><code>T<\/code> = 有定義的函式<\/td>\n<td><code>nm exlib.a<\/code><\/td>\n<\/tr>\n<\/tbody>\n<\/table>\n<hr />\n<h2 id=\"lab4-4\">4. 程式範例逐行解說<\/h2>\n<h3 id=\"lab4-41-mainc-addc-subc-libh\">4.1 投影片範例：main.c / add.c / sub.c / lib.h<\/h3>\n<div class=\"hl\"><pre><span><\/span><code><span class=\"c1\">// lib.h<\/span>\n<span class=\"kt\">int<\/span><span class=\"w\"> <\/span><span class=\"nf\">add<\/span><span class=\"p\">(<\/span><span class=\"kt\">int<\/span><span class=\"w\"> <\/span><span class=\"n\">arg<\/span><span class=\"p\">);<\/span>\n<span class=\"kt\">int<\/span><span class=\"w\"> <\/span><span class=\"nf\">sub<\/span><span class=\"p\">(<\/span><span class=\"kt\">int<\/span><span class=\"w\"> <\/span><span class=\"n\">arg<\/span><span class=\"p\">);<\/span>\n<span class=\"c1\">// add.c<\/span>\n<span class=\"cp\">#include<\/span><span class=\"w\"> <\/span><span class=\"cpf\">\"lib.h\"<\/span>\n<span class=\"kt\">int<\/span><span class=\"w\"> <\/span><span class=\"nf\">add<\/span><span class=\"p\">(<\/span><span class=\"kt\">int<\/span><span class=\"w\"> <\/span><span class=\"n\">arg<\/span><span class=\"p\">)<\/span><span class=\"w\"> <\/span><span class=\"p\">{<\/span><span class=\"w\"> <\/span><span class=\"n\">arg<\/span><span class=\"o\">++<\/span><span class=\"p\">;<\/span><span class=\"w\"> <\/span><span class=\"k\">return<\/span><span class=\"w\"> <\/span><span class=\"n\">arg<\/span><span class=\"p\">;<\/span><span class=\"w\"> <\/span><span class=\"p\">}<\/span>\n<span class=\"c1\">// sub.c<\/span>\n<span class=\"cp\">#include<\/span><span class=\"w\"> <\/span><span class=\"cpf\">\"lib.h\"<\/span>\n<span class=\"kt\">int<\/span><span class=\"w\"> <\/span><span class=\"nf\">sub<\/span><span class=\"p\">(<\/span><span class=\"kt\">int<\/span><span class=\"w\"> <\/span><span class=\"n\">arg<\/span><span class=\"p\">)<\/span><span class=\"w\"> <\/span><span class=\"p\">{<\/span><span class=\"w\"> <\/span><span class=\"n\">arg<\/span><span class=\"o\">--<\/span><span class=\"p\">;<\/span><span class=\"w\"> <\/span><span class=\"k\">return<\/span><span class=\"w\"> <\/span><span class=\"n\">arg<\/span><span class=\"p\">;<\/span><span class=\"w\"> <\/span><span class=\"p\">}<\/span>\n<span class=\"c1\">// main.c<\/span>\n<span class=\"cp\">#include<\/span><span class=\"w\"> <\/span><span class=\"cpf\">&lt;stdio.h&gt;<\/span>\n<span class=\"cp\">#include<\/span><span class=\"w\"> <\/span><span class=\"cpf\">\"lib.h\"<\/span>\n<span class=\"kt\">int<\/span><span class=\"w\"> <\/span><span class=\"nf\">main<\/span><span class=\"p\">()<\/span><span class=\"w\"> <\/span><span class=\"p\">{<\/span>\n<span class=\"w\">    <\/span><span class=\"kt\">int<\/span><span class=\"w\"> <\/span><span class=\"n\">n1<\/span><span class=\"w\"> <\/span><span class=\"o\">=<\/span><span class=\"w\"> <\/span><span class=\"n\">add<\/span><span class=\"p\">(<\/span><span class=\"mi\">5<\/span><span class=\"p\">);<\/span>\n<span class=\"w\">    <\/span><span class=\"kt\">int<\/span><span class=\"w\"> <\/span><span class=\"n\">n2<\/span><span class=\"w\"> <\/span><span class=\"o\">=<\/span><span class=\"w\"> <\/span><span class=\"n\">sub<\/span><span class=\"p\">(<\/span><span class=\"mi\">5<\/span><span class=\"p\">);<\/span>\n<span class=\"w\">    <\/span><span class=\"n\">printf<\/span><span class=\"p\">(<\/span><span class=\"s\">\"After add, n1 = %d<\/span><span class=\"se\">\\n<\/span><span class=\"s\">\"<\/span><span class=\"p\">,<\/span><span class=\"w\"> <\/span><span class=\"n\">n1<\/span><span class=\"p\">);<\/span>\n<span class=\"w\">    <\/span><span class=\"n\">printf<\/span><span class=\"p\">(<\/span><span class=\"s\">\"After sub, n2 = %d<\/span><span class=\"se\">\\n<\/span><span class=\"s\">\"<\/span><span class=\"p\">,<\/span><span class=\"w\"> <\/span><span class=\"n\">n2<\/span><span class=\"p\">);<\/span>\n<span class=\"w\">    <\/span><span class=\"k\">return<\/span><span class=\"w\"> <\/span><span class=\"mi\">0<\/span><span class=\"p\">;<\/span>\n<span class=\"p\">}<\/span>\n<\/code><\/pre><\/div>\n\n<p>輸出：<\/p>\n<div class=\"hl\"><pre><span><\/span><code>After add, n1 = 6\nAfter sub, n2 = 4\n<\/code><\/pre><\/div>\n\n<ul>\n<li><code>\"lib.h\"<\/code>（雙引號）會先在目前目錄找標頭；<code>&lt;stdio.h&gt;<\/code>（角括號）只找系統路徑。<\/li>\n<li>header 只放<strong>宣告<\/strong>，實作在 .c，打包進 library。<\/li>\n<\/ul>\n<h3 id=\"lab4-42-static\">4.2 Static 流程實錄<\/h3>\n<div class=\"hl\"><pre><span><\/span><code>$ gcc -c add.c sub.c          → 產生 add.o sub.o\n$ ar rcs lib.a add.o sub.o    → 產生 lib.a\n$ gcc main.c -L. lib.a -o example_static\n$ ./example_static\nAfter add, n1 = 6\nAfter sub, n2 = 4\n<\/code><\/pre><\/div>\n\n<h3 id=\"lab4-43-dynamic\">4.3 Dynamic 流程實錄（含錯誤）<\/h3>\n<div class=\"hl\"><pre><span><\/span><code>$ gcc -c -fPIC add.c sub.c\n$ gcc add.o sub.o -shared -o lib.so\n$ gcc main.c -L. lib.so -o example_dynamic\n$ ./example_dynamic\n./example_dynamic: error while loading shared libraries: lib.so: cannot open shared object file: No such file or directory\n$ sudo cp lib.so /lib/lib.so\n$ ./example_dynamic\nAfter add, n1 = 6\nAfter sub, n2 = 4\n$ ldd example_dynamic\n    linux-vdso.so.1 (...)\n    lib.so =&gt; /lib/lib.so (...)\n    libc.so.6 =&gt; /lib/x86_64-linux-gnu/libc.so.6 (...)\n    /lib64/ld-linux-x86-64.so.2 (...)\n<\/code><\/pre><\/div>\n\n<p><strong>為什麼編譯成功、執行卻失敗？<\/strong> 編譯時 <code>-L.<\/code> 告訴 linker 去目前目錄找；但<strong>執行時<\/strong>是 dynamic linker 在找，它只看系統路徑（<code>/lib<\/code>、<code>/usr/lib<\/code>），而 lib.so 不在清單中。複製到 <code>/lib<\/code> 就解決。<\/p>\n<h3 id=\"lab4-44-practicelab4\">4.4 學生作業 practice/lab4<\/h3>\n<p><strong>exlib.h<\/strong><\/p>\n<div class=\"hl\"><pre><span><\/span><code><span class=\"kt\">int<\/span><span class=\"w\"> <\/span><span class=\"o\">*<\/span><span class=\"nf\">sort<\/span><span class=\"p\">(<\/span><span class=\"kt\">int<\/span><span class=\"w\"> <\/span><span class=\"o\">*<\/span><span class=\"n\">arr<\/span><span class=\"p\">);<\/span>\n<\/code><\/pre><\/div>\n\n<p><strong>sort.c<\/strong><\/p>\n<div class=\"hl\"><pre><span><\/span><code><span class=\"cp\">#include<\/span><span class=\"w\"> <\/span><span class=\"cpf\">&lt;stdio.h&gt;<\/span>\n<span class=\"kt\">int<\/span><span class=\"w\"> <\/span><span class=\"o\">*<\/span><span class=\"nf\">sort<\/span><span class=\"p\">(<\/span><span class=\"kt\">int<\/span><span class=\"w\"> <\/span><span class=\"o\">*<\/span><span class=\"n\">arr<\/span><span class=\"p\">)<\/span><span class=\"w\"> <\/span><span class=\"p\">{<\/span>\n<span class=\"w\">  <\/span><span class=\"k\">for<\/span><span class=\"p\">(<\/span><span class=\"kt\">int<\/span><span class=\"w\"> <\/span><span class=\"n\">i<\/span><span class=\"w\"> <\/span><span class=\"o\">=<\/span><span class=\"w\"> <\/span><span class=\"mi\">0<\/span><span class=\"p\">;<\/span><span class=\"w\"> <\/span><span class=\"n\">i<\/span><span class=\"w\"> <\/span><span class=\"o\">&lt;<\/span><span class=\"w\"> <\/span><span class=\"mi\">5<\/span><span class=\"p\">;<\/span><span class=\"w\"> <\/span><span class=\"n\">i<\/span><span class=\"o\">++<\/span><span class=\"p\">)<\/span>\n<span class=\"w\">    <\/span><span class=\"k\">for<\/span><span class=\"p\">(<\/span><span class=\"kt\">int<\/span><span class=\"w\"> <\/span><span class=\"n\">j<\/span><span class=\"w\"> <\/span><span class=\"o\">=<\/span><span class=\"w\"> <\/span><span class=\"n\">i<\/span><span class=\"p\">;<\/span><span class=\"w\"> <\/span><span class=\"n\">j<\/span><span class=\"w\"> <\/span><span class=\"o\">&lt;<\/span><span class=\"w\"> <\/span><span class=\"mi\">5<\/span><span class=\"p\">;<\/span><span class=\"w\"> <\/span><span class=\"n\">j<\/span><span class=\"o\">++<\/span><span class=\"p\">)<\/span>\n<span class=\"w\">      <\/span><span class=\"k\">if<\/span><span class=\"p\">(<\/span><span class=\"n\">arr<\/span><span class=\"p\">[<\/span><span class=\"n\">j<\/span><span class=\"p\">]<\/span><span class=\"w\"> <\/span><span class=\"o\">&lt;<\/span><span class=\"w\"> <\/span><span class=\"n\">arr<\/span><span class=\"p\">[<\/span><span class=\"n\">i<\/span><span class=\"p\">])<\/span><span class=\"w\"> <\/span><span class=\"p\">{<\/span><span class=\"w\">          <\/span><span class=\"c1\">// 後面有更小的就交換到位置 i<\/span>\n<span class=\"w\">        <\/span><span class=\"kt\">int<\/span><span class=\"w\"> <\/span><span class=\"n\">temp<\/span><span class=\"w\"> <\/span><span class=\"o\">=<\/span><span class=\"w\"> <\/span><span class=\"n\">arr<\/span><span class=\"p\">[<\/span><span class=\"n\">j<\/span><span class=\"p\">];<\/span><span class=\"w\"> <\/span><span class=\"n\">arr<\/span><span class=\"p\">[<\/span><span class=\"n\">j<\/span><span class=\"p\">]<\/span><span class=\"w\"> <\/span><span class=\"o\">=<\
