<style>
:root{
  --bg:#fbfaf7;--panel:#f2f0ea;--text:#1f2328;--muted:#656d76;--line:#dcd8cf;
  --accent:#1f6f5c;--accent-soft:#e1efe9;--code:#f4f2ec;--mark:#ffe58a;--ans:#eef5ff;
}
:root[data-theme="dark"]{
  --bg:#16181c;--panel:#1d2026;--text:#e6e6e3;--muted:#9aa0a8;--line:#30343c;
  --accent:#5cc2a3;--accent-soft:#1f3a33;--code:#22252b;--mark:#6b5b12;--ans:#1c2635;
}
*{box-sizing:border-box}
html,body{margin:0}
body{background:var(--bg);color:var(--text);font:16px/1.7 system-ui,-apple-system,"Segoe UI","Microsoft JhengHei","PingFang TC",sans-serif}
a{color:var(--accent)}
#side{position:fixed;top:0;left:0;bottom:0;width:280px;background:var(--panel);border-right:1px solid var(--line);display:flex;flex-direction:column;z-index:20}
#side header{padding:14px 14px 10px;border-bottom:1px solid var(--line)}
#side h1{font-size:17px;margin:0 0 10px}
#q{width:100%;padding:8px 10px;border:1px solid var(--line);border-radius:8px;background:var(--bg);color:var(--text);font-size:15px}
#tabs{display:flex;flex-wrap:wrap;gap:6px;padding:10px 14px;border-bottom:1px solid var(--line)}
#tabs button{border:1px solid var(--line);background:var(--bg);color:var(--text);border-radius:999px;padding:3px 10px;font-size:13px;cursor:pointer}
#tabs button.on{background:var(--accent);border-color:var(--accent);color:#fff}
#toc{overflow:auto;padding:8px 6px 20px;flex:1;font-size:14px}
#toc a{display:block;padding:4px 10px;border-radius:6px;color:var(--text);text-decoration:none}
#toc a:hover{background:var(--accent-soft)}
#toc a.sub{padding-left:24px;color:var(--muted);font-size:13px}
#toc a.cur{background:var(--accent-soft);color:var(--accent);font-weight:600}
#side footer{padding:10px 14px;border-top:1px solid var(--line);display:flex;gap:8px}
#side footer button,.bar button{flex:1;border:1px solid var(--line);background:var(--bg);color:var(--text);border-radius:8px;padding:6px;font-size:13px;cursor:pointer}
main{margin-left:280px;padding:28px 40px 120px;max-width:1000px}
.bar{display:none}
h1{font-size:28px;line-height:1.3;margin:0 0 16px}
h2{font-size:22px;margin:40px 0 12px;padding-bottom:6px;border-bottom:2px solid var(--line)}
h3{font-size:18px;margin:28px 0 8px}
h2,h3{scroll-margin-top:16px}
table{border-collapse:collapse;width:100%;font-size:14.5px;margin:12px 0;display:block;overflow-x:auto}
th,td{border:1px solid var(--line);padding:6px 10px;text-align:left;vertical-align:top}
th{background:var(--panel)}
code{font-family:"Cascadia Code",Consolas,"SFMono-Regular",monospace;font-size:.9em;background:var(--code);padding:1px 5px;border-radius:4px}
.hl{background:var(--code)!important;border:1px solid var(--line);border-radius:8px;margin:10px 0;overflow-x:auto}
.hl pre{margin:0;padding:12px 14px;font-size:14px;line-height:1.55}
.hl code{background:none;padding:0}
pre{overflow-x:auto}
blockquote{margin:10px 0;padding:8px 14px;border-left:4px solid var(--accent);background:var(--accent-soft);border-radius:0 8px 8px 0}
blockquote p{margin:4px 0}
blockquote.ans{background:var(--ans);border-left-color:#4a7bd0;cursor:pointer;position:relative}
blockquote.ans.hide > *{filter:blur(6px);user-select:none}
blockquote.ans.hide::after{content:"點一下看答案";position:absolute;inset:0;display:flex;align-items:center;justify-content:center;font-size:14px;color:var(--muted);font-weight:600}
.ansbar{display:flex;gap:8px;margin:8px 0 16px}
.ansbar button{border:1px solid var(--accent);background:var(--bg);color:var(--accent);border-radius:8px;padding:5px 12px;cursor:pointer;font-size:14px}
mark{background:var(--mark);color:inherit;border-radius:3px}
#results .r{display:block;padding:10px 14px;margin:8px 0;border:1px solid var(--line);border-radius:10px;text-decoration:none;color:var(--text);background:var(--panel)}
#results .r b{color:var(--accent)}
#results .r small{color:var(--muted);display:block;margin-top:4px;font-size:13.5px}
.empty{color:var(--muted)}
#top{position:fixed;right:18px;bottom:18px;width:44px;height:44px;border-radius:50%;border:1px solid var(--line);background:var(--panel);color:var(--text);font-size:20px;cursor:pointer;z-index:10}

<script>
const PAGES = [{"id": "p0", "short": "總覽速查", "title": "OS Lab 總覽與考前速查", "html": "<h1 id=\"p0-os-lab\">OS Lab 總覽與考前速查<\/h1>\n<blockquote>\n<p>各 Lab 詳細內容請看 <code>Lab1_review.md<\/code> ~ <code>Lab7_review.md<\/code>。這份是考前 30 分鐘看的濃縮版。<\/p>\n<\/blockquote>\n<hr />\n<h2 id=\"p0-1-lab\">1. 每個 LAB 一行重點<\/h2>\n<table>\n<thead>\n<tr>\n<th>Lab<\/th>\n<th>主題<\/th>\n<th>一句話重點<\/th>\n<\/tr>\n<\/thead>\n<tbody>\n<tr>\n<td>1<\/td>\n<td>Shell Script<\/td>\n<td>Vim 三模式（<code>i<\/code>/<code>Esc<\/code>/<code>:wq<\/code>）＋ Bash：變數賦值不能有空格、比較要有空格、<code>expr<\/code> 要空格且 <code>\\*<\/code>、三種引號、<code>test<\/code> 回傳 0 = true、<code>case<\/code>/<code>while<\/code>/function；Exercise 猜數字。<\/td>\n<\/tr>\n<tr>\n<td>2<\/td>\n<td>Adding a New System Call<\/td>\n<td>改 5 處：<code>hello/hello.c<\/code>（<code>SYSCALL_DEFINE0<\/code>）、<code>hello/Makefile<\/code>（<code>obj-y<\/code>）、<code>syscalls.h<\/code>（<code>asmlinkage<\/code>）、<code>Kbuild<\/code>（<code>obj-y += hello/<\/code>）、<code>syscall_64.tbl<\/code>（<code>462 common hello sys_hello<\/code>），重編 kernel、install、reboot，<code>syscall(462)<\/code> 後用 <code>dmesg<\/code> 看。<\/td>\n<\/tr>\n<tr>\n<td>3<\/td>\n<td>System Call vs APIs<\/td>\n<td>POSIX（IEEE，規範介面不規範實作）；<code>open/read/write/close<\/code> vs <code>fopen/fread/fwrite/fclose<\/code>；<strong>fread 有 user-space buffer → syscall 次數少很多 → 快<\/strong>；fd 0/1/2；權限碼 rwx=421；Exercise 只用 <code>&lt;unistd.h&gt;<\/code> 印整數。<\/td>\n<\/tr>\n<tr>\n<td>4<\/td>\n<td>Library<\/td>\n<td>static <code>.a<\/code>（<code>gcc -c<\/code> → <code>ar rcs<\/code> → 連結時複製進執行檔）vs shared <code>.so<\/code>（<code>-fPIC<\/code> → <code>-shared<\/code> → 執行時載入，需放 <code>/lib<\/code>）；<code>ldd<\/code> 看相依。<\/td>\n<\/tr>\n<tr>\n<td>5<\/td>\n<td>Kernel Module<\/td>\n<td><code>obj-m<\/code> 編出 <code>.ko<\/code>；<code>init_module<\/code>/<code>cleanup_module<\/code>；<code>insmod x.ko<\/code> / <code>rmmod x<\/code> / <code>lsmod<\/code> / <code>modinfo<\/code> / <code>dmesg<\/code>；<code>module_param<\/code>；<code>EXPORT_SYMBOL<\/code> 有載入順序相依；init 回傳 <code>-EINVAL<\/code> 中止載入。<\/td>\n<\/tr>\n<tr>\n<td>6<\/td>\n<td>Process Control<\/td>\n<td>process 記憶體 text/data/heap/stack；<code>fork()<\/code> 回傳 parent=child PID、child=0、失敗 -1，記憶體是<strong>複製<\/strong>的；<code>wait()<\/code> 一次等一個 child；<code>execlp<\/code> 覆蓋 image、成功不返回；Exercise 建 A→(B→C),D,E 的樹。<\/td>\n<\/tr>\n<tr>\n<td>7-1<\/td>\n<td>Message Queue<\/td>\n<td><code>mq_open/mq_send/mq_receive/mq_close/mq_unlink<\/code>；close 不刪、unlink 才刪；<code>msg_len ≥ mq_msgsize<\/code>；送字串用 <code>strlen+1<\/code>；<code>-lrt<\/code>。<\/td>\n<\/tr>\n<tr>\n<td>7-2<\/td>\n<td>Shared Memory<\/td>\n<td><code>shm_open → ftruncate → mmap(MAP_SHARED) → 讀寫 → munmap/close → shm_unlink<\/code>；物件在 <code>/dev/shm<\/code>，kernel persistence；<code>MAP_FAILED<\/code>；同時存取需 semaphore；<code>-lrt<\/code>。<\/td>\n<\/tr>\n<\/tbody>\n<\/table>\n<hr />\n<h2 id=\"p0-2-lab-api\">2. 跨 LAB 最常考的指令／API 速查表<\/h2>\n<h3 id=\"p0-21-shell\">2.1 Shell 與系統指令<\/h3>\n<table>\n<thead>\n<tr>\n<th>指令<\/th>\n<th>用途<\/th>\n<th>Lab<\/th>\n<\/tr>\n<\/thead>\n<tbody>\n<tr>\n<td><code>vim file<\/code> → <code>i<\/code> → <code>Esc<\/code> → <code>:wq<\/code><\/td>\n<td>編輯／存檔離開<\/td>\n<td>1<\/td>\n<\/tr>\n<tr>\n<td><code>chmod u+x a.sh<\/code> / <code>chmod 644 f<\/code><\/td>\n<td>改權限（r=4 w=2 x=1）<\/td>\n<td>1, 3<\/td>\n<\/tr>\n<tr>\n<td><code>ls -l<\/code><\/td>\n<td>看權限、大小<\/td>\n<td>3, 4<\/td>\n<\/tr>\n<tr>\n<td><code>ls \\| sort -r<\/code><\/td>\n<td>pipe<\/td>\n<td>1<\/td>\n<\/tr>\n<tr>\n<td><code>sudo apt update<\/code> / <code>sudo apt install pkg<\/code><\/td>\n<td>套件管理<\/td>\n<td>1, 2, 5<\/td>\n<\/tr>\n<tr>\n<td><code>uname -r<\/code><\/td>\n<td>目前 kernel 版本<\/td>\n<td>2, 5<\/td>\n<\/tr>\n<tr>\n<td><code>nproc<\/code><\/td>\n<td>CPU 核心數<\/td>\n<td>2<\/td>\n<\/tr>\n<tr>\n<td><code>sudo dmesg \\| tail [-n]<\/code><\/td>\n<td>看 kernel log（printk / pr_info 的輸出）<\/td>\n<td>2, 5<\/td>\n<\/tr>\n<tr>\n<td><code>strace -c ./prog<\/code><\/td>\n<td>統計 system call 次數<\/td>\n<td>3<\/td>\n<\/tr>\n<tr>\n<td><code>ar rcs lib.a a.o b.o<\/code><\/td>\n<td>打包 static library<\/td>\n<td>4<\/td>\n<\/tr>\n<tr>\n<td><code>ldd ./prog<\/code><\/td>\n<td>看用了哪些 .so<\/td>\n<td>4<\/td>\n<\/tr>\n<tr>\n<td><code>insmod x.ko<\/code> / <code>rmmod x<\/code> / <code>lsmod<\/code> / <code>modinfo x.ko<\/code><\/td>\n<td>module 操作<\/td>\n<td>5<\/td>\n<\/tr>\n<tr>\n<td><code>cat /proc/modules<\/code><\/td>\n<td>已載入 module<\/td>\n<td>5<\/td>\n<\/tr>\n<tr>\n<td><code>ls /dev/shm<\/code>、<code>ls /dev/mqueue<\/code>（補充）<\/td>\n<td>看 IPC 物件<\/td>\n<td>7<\/td>\n<\/tr>\n<\/tbody>\n<\/table>\n<h3 id=\"p0-22-c-api\">2.2 C API<\/h3>\n<table>\n<thead>\n<tr>\n<th>API<\/th>\n<th>回傳值重點<\/th>\n<th>標頭<\/th>\n<th>Lab<\/th>\n<\/tr>\n<\/thead>\n<tbody>\n<tr>\n<td><code>syscall(n, ...)<\/code><\/td>\n<td>成功 ≥0，失敗 -1<\/td>\n<td><code>&lt;sys/syscall.h&gt;<\/code> <code>&lt;unistd.h&gt;<\/code><\/td>\n<td>2<\/td>\n<\/tr>\n<tr>\n<td><code>open(path, flags, mode)<\/code><\/td>\n<td>fd；-1<\/td>\n<td><code>&lt;fcntl.h&gt;<\/code> <code>&lt;unistd.h&gt;<\/code><\/td>\n<td>3<\/td>\n<\/tr>\n<tr>\n<td><code>read(fd, buf, n)<\/code><\/td>\n<td>bytes 數；<strong>0=EOF<\/strong>；-1<\/td>\n<td><code>&lt;unistd.h&gt;<\/code><\/td>\n<td>3<\/td>\n<\/tr>\n<tr>\n<td><code>write(fd, buf, n)<\/code><\/td>\n<td>bytes 數；-1<\/td>\n<td><code>&lt;unistd.h&gt;<\/code><\/td>\n<td>3<\/td>\n<\/tr>\n<tr>\n<td><code>close(fd)<\/code><\/td>\n<td>0；-1<\/td>\n<td><code>&lt;unistd.h&gt;<\/code><\/td>\n<td>3, 7<\/td>\n<\/tr>\n<tr>\n<td><code>fopen(path, mode)<\/code><\/td>\n<td><code>FILE*<\/code>；NULL<\/td>\n<td><code>&lt;stdio.h&gt;<\/code><\/td>\n<td>3<\/td>\n<\/tr>\n<tr>\n<td><code>fread/fwrite(ptr, size, count, fp)<\/code><\/td>\n<td><strong>元素個數<\/strong><\/td>\n<td><code>&lt;stdio.h&gt;<\/code><\/td>\n<td>3<\/td>\n<\/tr>\n<tr>\n<td><code>fclose(fp)<\/code><\/td>\n<td>0；EOF<\/td>\n<td><code>&lt;stdio.h&gt;<\/code><\/td>\n<td>3<\/td>\n<\/tr>\n<tr>\n<td><code>fork()<\/code><\/td>\n<td>parent: child PID；child: 0；-1<\/td>\n<td><code>&lt;unistd.h&gt;<\/code><\/td>\n<td>6<\/td>\n<\/tr>\n<tr>\n<td><code>getpid()<\/code> / <code>getppid()<\/code><\/td>\n<td>自己／parent PID<\/td>\n<td><code>&lt;unistd.h&gt;<\/code><\/td>\n<td>6<\/td>\n<\/tr>\n<tr>\n<td><code>wait(&amp;st)<\/code> / <code>wait(NULL)<\/code><\/td>\n<td>結束的 child PID；-1<\/td>\n<td><code>&lt;sys/wait.h&gt;<\/code><\/td>\n<td>6<\/td>\n<\/tr>\n<tr>\n<td><code>execlp(file, argv0, ..., NULL)<\/code><\/td>\n<td>成功不返回；-1<\/td>\n<td><code>&lt;unistd.h&gt;<\/code><\/td>\n<td>6<\/td>\n<\/tr>\n<tr>\n<td><code>mq_open(name, oflag, mode, attr)<\/code><\/td>\n<td><code>mqd_t<\/code>；<code>(mqd_t)-1<\/code><\/td>\n<td><code>&lt;mqueue.h&gt;<\/code> <code>&lt;fcntl.h&gt;<\/code> <code>&lt;sys/stat.h&gt;<\/code><\/td>\n<td>7-1<\/td>\n<\/tr>\n<tr>\n<td><code>mq_send(q, msg, len, prio)<\/code><\/td>\n<td>0；-1<\/td>\n<td><code>&lt;mqueue.h&gt;<\/code><\/td>\n<td>7-1<\/td>\n<\/tr>\n<tr>\n<td><code>mq_receive(q, buf, len, &amp;prio)<\/code><\/td>\n<td>bytes 數；-1（len ≥ mq_msgsize）<\/td>\n<td><code>&lt;mqueue.h&gt;<\/code><\/td>\n<td>7-1<\/td>\n<\/tr>\n<tr>\n<td><code>mq_close(q)<\/code> / <code>mq_unlink(name)<\/code><\/td>\n<td>0；-1<\/td>\n<td><code>&lt;mqueue.h&gt;<\/code><\/td>\n<td>7-1<\/td>\n<\/tr>\n<tr>\n<td><code>shm_open(name, oflag, mode)<\/code><\/td>\n<td>fd；-1<\/td>\n<td><code>&lt;sys/mman.h&gt;<\/code> <code>&lt;fcntl.h&gt;<\/code><\/td>\n<td>7-2<\/td>\n<\/tr>\n<tr>\n<td><code>ftruncate(fd, len)<\/code><\/td>\n<td>0；-1<\/td>\n<td><code>&lt;unistd.h&gt;<\/code><\/td>\n<td>7-2<\/td>\n<\/tr>\n<tr>\n<td><code>mmap(NULL, len, prot, MAP_SHARED, fd, 0)<\/code><\/td>\n<td>位址；<strong>MAP_FAILED<\/strong><\/td>\n<td><code>&lt;sys/mman.h&gt;<\/code><\/td>\n<td>7-2<\/td>\n<\/tr>\n<tr>\n<td><code>munmap(addr, len)<\/code> / <code>shm_unlink(name)<\/code><\/td>\n<td>0；-1<\/td>\n<td><code>&lt;sys/mman.h&gt;<\/code><\/td>\n<td>7-2<\/td>\n<\/tr>\n<\/tbody>\n<\/table>\n<h3 id=\"p0-23-kernel\">2.3 Kernel 端<\/h3>\n<table>\n<thead>\n<tr>\n<th>項目<\/th>\n<th>說明<\/th>\n<th>Lab<\/th>\n<\/tr>\n<\/thead>\n<tbody>\n<tr>\n<td><code>SYSCALL_DEFINE0(hello)<\/code> / <code>SYSCALL_DEFINE1(hello, int, n)<\/code><\/td>\n<td>定義 syscall（型別、名稱用逗號分開）<\/td>\n<td>2<\/td>\n<\/tr>\n<tr>\n<td><code>asmlinkage long sys_hello(void);<\/code><\/td>\n<td>syscalls.h 中的宣告<\/td>\n<td>2<\/td>\n<\/tr>\n<tr>\n<td><code>pr_info(...)<\/code> = <code>printk(KERN_INFO ...)<\/code><\/td>\n<td>寫入 kernel log<\/td>\n<td>2, 5<\/td>\n<\/tr>\n<tr>\n<td><code>obj-y<\/code> vs <code>obj-m<\/code><\/td>\n<td>編進 kernel vs 編成 .ko module<\/td>\n<td>2, 5<\/td>\n<\/tr>\n<tr>\n<td><code>init_module<\/code> / <code>cleanup_module<\/code><\/td>\n<td>module 載入／卸載進入點；init 回非 0 = 失敗<\/td>\n<td>5<\/td>\n<\/tr>\n<tr>\n<td><code>module_param(name, int, 0)<\/code> + <code>MODULE_PARM_DESC<\/code><\/td>\n<td>module 參數<\/td>\n<td>5<\/td>\n<\/tr>\n<tr>\n<td><code>EXPORT_SYMBOL(x)<\/code> + <code>extern<\/code><\/td>\n<td>跨 module 共用符號<\/td>\n<td>5<\/td>\n<\/tr>\n<tr>\n<td><code>MODULE_LICENSE(\"GPL\")<\/code><\/td>\n<td>授權宣告<\/td>\n<td>5<\/td>\n<\/tr>\n<tr>\n<td><code>mktime64(y,m,d,h,mi,s)<\/code> / <code>ktime_get_real_seconds()<\/code><\/td>\n<td>日期 → timestamp / 現在時間<\/td>\n<td>5<\/td>\n<\/tr>\n<tr>\n<td><code>return -EINVAL;<\/code><\/td>\n<td>中止 module 載入<\/td>\n<td>5<\/td>\n<\/tr>\n<\/tbody>\n<\/table>\n<h3 id=\"p0-24\">2.4 常見回傳值口訣<\/h3>\n<ul>\n<li><strong>-1 + errno<\/strong>：幾乎所有 system call 失敗的回傳方式（<code>open read write close fork wait exec mq_* shm_open ftruncate munmap<\/code>）。<\/li>\n<li><strong>例外<\/strong>：<code>fopen<\/code> 失敗回 <strong>NULL<\/strong>、<code>fclose<\/code> 失敗回 <strong>EOF<\/strong>、<code>mmap<\/code> 失敗回 <strong>MAP_FAILED<\/strong>、<code>mq_open<\/code> 失敗回 <strong>(mqd_t)-1<\/strong>、shell <code>test<\/code> 成功回 <strong>0<\/strong>。<\/li>\n<li><strong>0 有特殊意義<\/strong>：<code>read()<\/code> 回 0 = EOF；<code>fork()<\/code> 回 0 = 我是 child；kernel module <code>init<\/code> 回 0 = 成功。<\/li>\n<\/ul>\n<hr />\n<h2 id=\"p0-3\">3. 上機考常見步驟（依投影片實際教法）<\/h2>\n<h3 id=\"p0-31-c\">3.1 一般 C 程式編譯<\/h3>\n<div class=\"hl\"><pre><span><\/span><code>gcc<span class=\"w\"> <\/span>prog.c<span class=\"w\"> <\/span>-o<span class=\"w\"> <\/span>prog<span class=\"w\">          <\/span><span class=\"c1\"># 基本編譯<\/span>\n./prog\nmake<span class=\"w\"> <\/span>prog<span class=\"w\">                   <\/span><span class=\"c1\"># 沒有 Makefile 時 make 也能用內建規則編 prog.c（Lab2 的 make test）<\/span>\ngcc<span class=\"w\"> <\/span>-c<span class=\"w\"> <\/span>a.c<span class=\"w\">                  <\/span><span class=\"c1\"># 只編成 a.o 不連結<\/span>\ngcc<span class=\"w\"> <\/span>prog.c<span class=\"w\"> <\/span>-o<span class=\"w\"> <\/span>prog<span class=\"w\"> <\/span>-lrt<span class=\"w\">     <\/span><span class=\"c1\"># 用到 mq_* / shm_* 時（Lab7）<\/span>\n<\/code><\/pre><\/div>\n\n<p>gcc 參數一覽：\n| 參數 | 意義 |\n|---|---|\n| <code>-o name<\/code> | 指定輸出檔名 |\n| <code>-c<\/code> | 只編譯不連結，產生 <code>.o<\/code> |\n| <code>-fPIC<\/code> | 產生位置無關碼（做 .so 用） |\n| <code>-shared<\/code> | 產生 shared library |\n| <code>-L.<\/code> | 連結時去目前目錄找 library |\n| <code>-lrt<\/code> | 連結 librt（POSIX IPC） |\n| <code>-l名稱<\/code>（補充） | 連結 <code>lib名稱.so/.a<\/code> |\n| <code>-Wall<\/code>（補充） | 開啟警告，考場除錯好用 |<\/p>\n<h3 id=\"p0-32-shell-scriptlab1\">3.2 Shell script（Lab1）<\/h3>\n<div class=\"hl\"><pre><span><\/span><code>vim<span class=\"w\"> <\/span>run.sh<span class=\"w\">                  <\/span><span class=\"c1\"># 第一行 #!/bin/bash<\/span>\nchmod<span class=\"w\"> <\/span>u+x<span class=\"w\"> <\/span>run.sh\n./run.sh<span class=\"w\"> <\/span>參數1<span class=\"w\"> <\/span>參數2\n<\/code><\/pre><\/div>\n\n<h3 id=\"p0-33-static-librarylab4\">3.3 Static library（Lab4）<\/h3>\n<div class=\"hl\"><pre><span><\/span><code>gcc<span class=\"w\"> <\/span>-c<span class=\"w\"> <\/span>sort.c<span class=\"w\">                       <\/span><span class=\"c1\"># sort.o<\/span>\nar<span class=\"w\"> <\/span>rcs<span class=\"w\"> <\/span>exlib.a<span class=\"w\"> <\/span>sort.o<span class=\"w\">               <\/span><span class=\"c1\"># 打包<\/span>\ngcc<span class=\"w\"> <\/span>exercise.c<span class=\"w\"> <\/span>-L.<span class=\"w\"> <\/span>exlib.a<span class=\"w\"> <\/span>-o<span class=\"w\"> <\/span>exercise1\n./exercise1\n<\/code><\/pre><\/div>\n\n<h3 id=\"p0-34-shared-librarylab4\">3.4 Shared library（Lab4）<\/h3>\n<div class=\"hl\"><pre><span><\/span><code>gcc<span class=\"w\"> <\/span>-c<span class=\"w\"> <\/span>-fPIC<span class=\"w\"> <\/span>sort.c\ngcc<span class=\"w\"> <\/span>sort.o<span class=\"w\"> <\/span>-shared<span class=\"w\"> <\/span>-o<span class=\"w\"> <\/span>exlib.so\ngcc<span class=\"w\"> <\/span>exercise.c<span class=\"w\"> <\/span>-L.<span class=\"w\"> <\/span>exlib.so<span class=\"w\"> <\/span>-o<span class=\"w\"> <\/span>exercise2\nsudo<span class=\"w\"> <\/span>cp<span class=\"w\"> <\/span>exlib.so<span class=\"w\"> <\/span>/lib/exlib.so<span class=\"w\">      <\/span><span class=\"c1\"># 否則執行時 cannot open shared object file<\/span>\n./exercise2\nldd<span class=\"w\"> <\/span>exercise2\nls<span class=\"w\"> <\/span>-l<span class=\"w\">                               <\/span><span class=\"c1\"># 比較大小<\/span>\n<\/code><\/pre><\/div>\n\n<h3 id=\"p0-35-system-calllab2\">3.5 新增 system call（Lab2）<\/h3>\n<div class=\"hl\"><pre><span><\/span><code><span class=\"nb\">cd<\/span><span class=\"w\"> <\/span>~/linux\nmkdir<span class=\"w\"> <\/span>hello<span class=\"p\">;<\/span><span class=\"w\"> <\/span>vim<span class=\"w\"> <\/span>hello/hello.c<span class=\"p\">;<\/span><span class=\"w\"> <\/span><span class=\"nb\">echo<\/span><span class=\"w\"> <\/span><span class=\"s1\">'obj-y += hello.o'<\/span><span class=\"w\"> <\/span>&gt;<span class=\"w\"> <\/span>hello/Makefile\nvim<span class=\"w\"> <\/span>include/linux/syscalls.h<span class=\"w\">        <\/span><span class=\"c1\"># asmlinkage long sys_hello(void);<\/span>\nvim<span class=\"w\"> <\/span>Kbuild<span class=\"w\">                          <\/span><span class=\"c1\"># obj-y += hello/<\/span>\nvim<span class=\"w\"> <\/span>arch/x86/entry/syscalls/syscall_64.tbl<span class=\"w\">   <\/span><span class=\"c1\"># 462 common hello sys_hello<\/span>\ncp<span class=\"w\"> <\/span>/boot/config-<span class=\"k\">$(<\/span>uname<span class=\"w\"> <\/span>-r<span class=\"k\">)<\/span><span class=\"w\"> <\/span>.config\nmake<span class=\"w\"> <\/span>olddefconfig\nmake<span class=\"w\"> <\/span>localmodconfig\nmake<span class=\"w\"> <\/span>-j<span class=\"w\"> <\/span><span class=\"k\">$(<\/span>nproc<span class=\"k\">)<\/span>\nsudo<span class=\"w\"> <\/span>make<span class=\"w\"> <\/span>-j<span class=\"w\"> <\/span><span class=\"k\">$(<\/span>nproc<span class=\"k\">)<\/span><span class=\"w\"> <\/span>modules_install\nsudo<span class=\"w\"> <\/span>make<span class=\"w\"> <\/span>install\nreboot<span class=\"w\">                              <\/span><span class=\"c1\"># GRUB（按住 Shift）→ Advanced options → 7.1.3-dirty<\/span>\ngcc<span class=\"w\"> <\/span>test.c<span class=\"w\"> <\/span>-o<span class=\"w\"> <\/span><span class=\"nb\">test<\/span><span class=\"w\"> <\/span><span class=\"o\">&amp;&amp;<\/span><span class=\"w\"> <\/span>./test<span class=\"w\">        <\/span><span class=\"c1\"># 印 0<\/span>\nsudo<span class=\"w\"> <\/span>dmesg<span class=\"w\"> <\/span><span class=\"p\">|<\/span><span class=\"w\"> <\/span>tail<span class=\"w\">                   <\/span><span class=\"c1\"># 看到 Hello<\/span>\n<\/code><\/pre><\/div>\n\n<h3 id=\"p0-36-kernel-modulelab5\">3.6 Kernel module（Lab5）<\/h3>\n<p>Makefile（指令前是 <strong>TAB<\/strong>）：<\/p>\n<div class=\"hl\"><pre><span><\/span><code><span class=\"nv\">obj-m<\/span><span class=\"w\"> <\/span><span class=\"o\">+=<\/span><span class=\"w\"> <\/span>date2timestamp.o\n<span class=\"nv\">obj-m<\/span><span class=\"w\"> <\/span><span class=\"o\">+=<\/span><span class=\"w\"> <\/span>myage.o\n\n<span class=\"nf\">all<\/span><span class=\"o\">:<\/span>\n<span class=\"w\">    <\/span>make<span class=\"w\"> <\/span>-C<span class=\"w\"> <\/span>/lib/modules/<span class=\"k\">$(<\/span>shell<span class=\"w\"> <\/span>uname<span class=\"w\"> <\/span>-r<span class=\"k\">)<\/span>/build<span class=\"w\"> <\/span><span class=\"nv\">M<\/span><span class=\"o\">=<\/span><span class=\"k\">$(<\/span>PWD<span class=\"k\">)<\/span><span class=\"w\"> <\/span>modules\n<span class=\"nf\">clean<\/span><span class=\"o\">:<\/span>\n<span class=\"w\">    <\/span>make<span class=\"w\"> <\/span>-C<span class=\"w\"> <\/span>/lib/modules/<span class=\"k\">$(<\/span>shell<span class=\"w\"> <\/span>uname<span class=\"w\"> <\/span>-r<span class=\"k\">)<\/span>/build<span class=\"w\"> <\/span><span class=\"nv\">M<\/span><span class=\"o\">=<\/span><span class=\"k\">$(<\/span>PWD<span class=\"k\">)<\/span><span class=\"w\"> <\/span>clean\n<\/code><\/pre><\/div>\n\n<div class=\"hl\"><pre><span><\/span><code>make\nmodinfo<span class=\"w\"> <\/span>date2timestamp.ko\nsudo<span class=\"w\"> <\/span>insmod<span class=\"w\"> <\/span>date2timestamp.ko<span class=\"w\"> <\/span><span class=\"nv\">year<\/span><span class=\"o\">=<\/span><span class=\"m\">2001<\/span><span class=\"w\"> <\/span><span class=\"nv\">month<\/span><span class=\"o\">=<\/span><span class=\"m\">8<\/span><span class=\"w\"> <\/span><span class=\"nv\">date<\/span><span class=\"o\">=<\/span><span class=\"m\">1<\/span><span class=\"w\">   <\/span><span class=\"c1\"># 參數不要寫 08<\/span>\nsudo<span class=\"w\"> <\/span>insmod<span class=\"w\"> <\/span>myage.ko<span class=\"w\">                <\/span><span class=\"c1\"># 依賴者後載入<\/span>\nlsmod<span class=\"w\"> <\/span><span class=\"p\">|<\/span><span class=\"w\"> <\/span>head\nsudo<span class=\"w\"> <\/span>dmesg<span class=\"w\"> <\/span><span class=\"p\">|<\/span><span class=\"w\"> <\/span>tail<span class=\"w\"> <\/span>-3\nsudo<span class=\"w\"> <\/span>rmmod<span class=\"w\"> <\/span>myage<span class=\"w\">                    <\/span><span class=\"c1\"># 依賴者先卸載；rmmod 不加 .ko<\/span>\nsudo<span class=\"w\"> <\/span>rmmod<span class=\"w\"> <\/span>date2timestamp\nmake<span class=\"w\"> <\/span>clean\n<\/code><\/pre><\/div>\n\n<h3 id=\"p0-37-processlab6\">3.7 Process（Lab6）<\/h3>\n<div class=\"hl\"><pre><span><\/span><code>gcc<span class=\"w\"> <\/span>ex1.c<span class=\"w\"> <\/span>-o<span class=\"w\"> <\/span>ex1<span class=\"w\"> <\/span><span class=\"o\">&amp;&amp;<\/span><span class=\"w\"> <\/span>./ex1\ngcc<span class=\"w\"> <\/span>ex2.c<span class=\"w\"> <\/span>-o<span class=\"w\"> <\/span>ex2<span class=\"w\"> <\/span><span class=\"o\">&amp;&amp;<\/span><span class=\"w\"> <\/span>./ex2\n<\/code><\/pre><\/div>\n\n<p>模板：<\/p>\n<div class=\"hl\"><pre><span><\/span><code><span class=\"kt\">pid_t<\/span><span class=\"w\"> <\/span><span class=\"n\">pid<\/span><span class=\"w\"> <\/span><span class=\"o\">=<\/span><span class=\"w\"> <\/span><span class=\"n\">fork<\/span><span class=\"p\">();<\/span>\n<span class=\"k\">if<\/span><span class=\"w\"> <\/span><span class=\"p\">(<\/span><span class=\"n\">pid<\/span><span class=\"w\"> <\/span><span class=\"o\">&lt;<\/span><span class=\"w\"> <\/span><span class=\"mi\">0<\/span><span class=\"p\">)<\/span><span class=\"w\">       <\/span><span class=\"p\">{<\/span><span class=\"w\"> <\/span><span class=\"n\">perror<\/span><span class=\"p\">(<\/span><span class=\"s\">\"fork\"<\/span><span class=\"p\">);<\/span><span class=\"w\"> <\/span><span class=\"n\">exit<\/span><span class=\"p\">(<\/span><span class=\"mi\">1<\/span><span class=\"p\">);<\/span><span class=\"w\"> <\/span><span class=\"p\">}<\/span>\n<span class=\"k\">else<\/span><span class=\"w\"> <\/span><span class=\"k\">if<\/span><span class=\"w\"> <\/span><span class=\"p\">(<\/span><span class=\"n\">pid<\/span><span class=\"w\"> <\/span><span class=\"o\">==<\/span><span class=\"w\"> <\/span><span class=\"mi\">0<\/span><span class=\"p\">)<\/span><span class=\"w\"> <\/span><span class=\"p\">{<\/span><span class=\"w\"> <\/span><span class=\"cm\">/* child */<\/span><span class=\"w\"> <\/span><span class=\"p\">...;<\/span><span class=\"w\"> <\/span><span class=\"n\">exit<\/span><span class=\"p\">(<\/span><span class=\"mi\">0<\/span><span class=\"p\">);<\/span><span class=\"w\"> <\/span><span class=\"p\">}<\/span><span class=\"w\">   <\/span><span class=\"cm\">/* child 記得 exit！ */<\/span>\n<span class=\"k\">else<\/span><span class=\"w\">               <\/span><span class=\"p\">{<\/span><span class=\"w\"> <\/span><span class=\"n\">wait<\/span><span class=\"p\">(<\/span><span class=\"nb\">NULL<\/span><span class=\"p\">);<\/span><span class=\"w\"> <\/span><span class=\"cm\">/* parent */<\/span><span class=\"w\"> <\/span><span class=\"p\">...<\/span><span class=\"w\"> <\/span><span class=\"p\">}<\/span>\n<\/code><\/pre><\/div>\n\n<h3 id=\"p0-38-ipclab7\">3.8 IPC（Lab7）<\/h3>\n<div class=\"hl\"><pre><span><\/span><code>gcc<span class=\"w\"> <\/span>sender.c<span class=\"w\"> <\/span>-o<span class=\"w\"> <\/span>sender<span class=\"w\"> <\/span>-lrt<span class=\"p\">;<\/span><span class=\"w\">     <\/span>gcc<span class=\"w\"> <\/span>receiver.c<span class=\"w\"> <\/span>-o<span class=\"w\"> <\/span>receiver<span class=\"w\"> <\/span>-lrt\n./receiver<span class=\"w\">   <\/span><span class=\"c1\"># terminal 1<\/span>\n./sender<span class=\"w\">     <\/span><span class=\"c1\"># terminal 2（Ctrl+Shift+T 開分頁），輸入 exit 結束<\/span>\ngcc<span class=\"w\"> <\/span>-o<span class=\"w\"> <\/span>producer<span class=\"w\"> <\/span>producer.c<span class=\"w\"> <\/span>-lrt<span class=\"p\">;<\/span><span class=\"w\"> <\/span>gcc<span class=\"w\"> <\/span>-o<span class=\"w\"> <\/span>consumer<span class=\"w\"> <\/span>consumer.c<span class=\"w\"> <\/span>-lrt\n./producer<span class=\"w\"> <\/span><span class=\"o\">&amp;&amp;<\/span><span class=\"w\"> <\/span>./consumer\n<\/code><\/pre><\/div>\n\n<h3 id=\"p0-39-makefile-lab2lab5\">3.9 Makefile 格式（Lab2、Lab5）<\/h3>\n<div class=\"hl\"><pre><span><\/span><code><span class=\"nf\">target<\/span><span class=\"o\">:<\/span><span class=\"w\"> <\/span><span class=\"n\">dependencies<\/span>\n<span class=\"err\">&lt;TAB&gt;command<\/span>\n<\/code><\/pre><\/div>\n\n<p><code>make<\/code> 預設執行第一個 target（<code>all<\/code>）；<code>make clean<\/code> 執行 clean。<strong>command 前必須是 TAB。<\/strong><\/p>\n<hr />\n<h2 id=\"p0-4\">4. 最容易被考的觀念對比（筆試速記）<\/h2>\n<table>\n<thead>\n<tr>\n<th>對比<\/th>\n<th>重點<\/th>\n<\/tr>\n<\/thead>\n<tbody>\n<tr>\n<td>System call vs Library function<\/td>\n<td>syscall 進 kernel（如 <code>write<\/code>）；library 在 user space 包裝 syscall（如 <code>printf<\/code>、<code>fwrite<\/code>），可加 buffer 減少 syscall 次數<\/td>\n<\/tr>\n<tr>\n<td><code>read()<\/code> vs <code>fread()<\/code><\/td>\n<td>fread 有 user-space buffer，一次 read 4096 bytes，syscall 次數少很多 → 快<\/td>\n<\/tr>\n<tr>\n<td>fd vs <code>FILE*<\/code><\/td>\n<td>int（system call） vs stream 指標（C library）<\/td>\n<\/tr>\n<tr>\n<td>Static vs Shared library<\/td>\n<td>連結時複製（大、快、獨立、更新要重編） vs 執行時載入（小、省空間、可共用、更新換檔、相依性問題）<\/td>\n<\/tr>\n<tr>\n<td><code>obj-y<\/code> vs <code>obj-m<\/code><\/td>\n<td>編進 kernel（重編+reboot） vs 編成 .ko（insmod 動態載入）<\/td>\n<\/tr>\n<tr>\n<td>Kernel module vs User program<\/td>\n<td><code>init_module<\/code>/<code>cleanup_module<\/code> vs <code>main<\/code>；<code>printk<\/code>→dmesg vs <code>printf<\/code>→terminal；kernel space 無 libc，出錯可能整台當機<\/td>\n<\/tr>\n<tr>\n<td><code>insmod<\/code> vs <code>rmmod<\/code><\/td>\n<td><code>insmod x.ko<\/code>（含 .ko） vs <code>rmmod x<\/code>（不含 .ko）<\/td>\n<\/tr>\n<tr>\n<td>fork vs exec<\/td>\n<td>fork 複製出新 process（PID 不同、內容一樣）；exec 在同一個 process（PID 不變）換上新程式<\/td>\n<\/tr>\n<tr>\n<td>fork 後的變數<\/td>\n<td>global、local、heap <strong>全部複製<\/strong>，互不影響<\/td>\n<\/tr>\n<tr>\n<td><code>mq_close<\/code> vs <code>mq_unlink<\/code><\/td>\n<td>關閉 descriptor vs 刪除 queue（名稱）<\/td>\n<\/tr>\n<tr>\n<td>Message queue vs Shared memory<\/td>\n<td>kernel 複製訊息、自帶同步 vs 直接共用記憶體、最快、要自己同步<\/td>\n<\/tr>\n<tr>\n<td><code>MAP_SHARED<\/code> vs <code>MAP_PRIVATE<\/code><\/td>\n<td>修改他人可見 vs 私有<\/td>\n<\/tr>\n<tr>\n<td>Shell <code>test<\/code> 回傳值 vs C<\/td>\n<td>0 = true（shell） vs 0 = false（C）<\/td>\n<\/tr>\n<\/tbody>\n<\/table>\n<hr />\n<h2 id=\"p0-5-10\">5. 考前 10 個「一定要記得」<\/h2>\n<ol>\n<li>Shell：<code>x=1<\/code>（不空格）、<code>[ \"$a\" = \"$b\" ]<\/code>（要空格）、<code>x=`expr $x + 1`<\/code>、<code>expr 2 \\* 3<\/code>。<\/li>\n<li>Vim：<code>i<\/code> 編輯、<code>Esc<\/code> 回 normal、<code>:wq<\/code> 存檔離開。<\/li>\n<li><code>fork()<\/code>：parent 得 child PID、child 得 0、失敗 -1；有幾個 child 就 wait 幾次；child 分支要 exit。<\/li>\n<li><code>execlp(\"ls\", \"ls\", \"-l\", NULL)<\/code>——最後的 NULL 不能忘；成功就不返回。<\/li>\n<li><code>read<\/code> 回 0 = EOF；<code>open<\/code> 的 mode 是八進位 <code>0644<\/code>。<\/li>\n<li>static：<code>gcc -c<\/code> → <code>ar rcs lib.a *.o<\/code> → <code>gcc main.c -L. lib.a -o x<\/code>；shared：<code>gcc -c -fPIC<\/code> → <code>gcc *.o -shared -o lib.so<\/code> → <code>gcc main.c -L. lib.so -o x<\/code> → <code>sudo cp lib.so /lib/<\/code>。<\/li>\n<li>module：Makefile <code>obj-m<\/code>、<code>insmod x.ko<\/code>、<code>rmmod x<\/code>、<code>dmesg | tail<\/code>、init 回 <code>-EINVAL<\/code> 中止；export 符號的 module 先載後卸。<\/li>\n<li>syscall：<code>SYSCALL_DEFINEn<\/code>、<code>asmlinkage<\/code>、<code>syscall_64.tbl<\/code>、<code>Kbuild<\/code>、重編+install+reboot，<code>syscall(462)<\/code> 回 0、訊息在 dmesg。<\/li>\n<li>MQ：<code>mq_send(q, buf, strlen(buf)+1, 0)<\/code>、<code>mq_receive<\/code> 的長度 ≥ <code>mq_msgsize<\/code>、receiver 最後 <code>mq_close<\/code> + <code>mq_unlink<\/code>。<\/li>\n<li>SHM：<code>shm_open → ftruncate → mmap(MAP_SHARED) → munmap → close<\/code>，讀方最後 <code>shm_unlink<\/code>；失敗比 <code>MAP_FAILED<\/code>；編譯加 <code>-lrt<\/code>。<\/li>\n<\/ol>\n<hr />\n<h2 id=\"p0-6\">6. 學生練習程式碼的問題清單（考前自我檢查）<\/h2>\n<table>\n<thead>\n<tr>\n<th>檔案<\/th>\n<th>狀態<\/th>\n<th>問題<\/th>\n<\/tr>\n<\/thead>\n<tbody>\n<tr>\n<td><code>practice/lab1/ex.sh<\/code><\/td>\n<td>可執行<\/td>\n<td><strong>沒有用 function<\/strong>（題目要求）；沒檢查猜測值是否在範圍內、是否為數字<\/td>\n<\/tr>\n<tr>\n<td><code>practice/lab3/ex.c<\/code><\/td>\n<td>輸出正確但有 UB<\/td>\n<td><code>char buffer[18]<\/code> 卻寫 <code>buffer[18]<\/code>（越界）；<code>long long<\/code> 最小值放不下、取負會溢位<\/td>\n<\/tr>\n<tr>\n<td><code>practice/lab4/ex1.c<\/code><\/td>\n<td>可執行<\/td>\n<td>亂數<strong>沒保證不重複<\/strong>（題目要求不重複）；檔名與題目（exercise.c / exercise1 / exercise2）不同<\/td>\n<\/tr>\n<tr>\n<td><code>practice/lab4/sort.c<\/code><\/td>\n<td>正確<\/td>\n<td>長度寫死 5；多餘的 <code>#include &lt;stdio.h&gt;<\/code><\/td>\n<\/tr>\n<tr>\n<td><code>practice/lab5/d2ts.c<\/code>、<code>myage.c<\/code><\/td>\n<td>正確<\/td>\n<td>module 名稱是 <code>d2ts<\/code> 而非 <code>date2timestamp<\/code>；年份用 365 天近似；<code>year &lt; 1970<\/code> 被當無效（題目沒要求）<\/td>\n<\/tr>\n<tr>\n<td><code>practice/lab6/ex1.c<\/code>、<code>ex2.c<\/code><\/td>\n<td>正確<\/td>\n<td>ex1 的 parent「after increment」沒有真的遞增（與投影片範例輸出一致，可解釋）<\/td>\n<\/tr>\n<tr>\n<td><code>practice/lab7/ex1<\/code>、<code>ex2<\/code><\/td>\n<td>正確<\/td>\n<td>比投影片範例更完整；注意先跑 producer 再跑 consumer、殘留 queue 的處理<\/td>\n<\/tr>\n<\/tbody>\n<\/table>", "toc": [{"id": "p0-1-lab", "name": "1. 每個 LAB 一行重點", "kids": []}, {"id": "p0-2-lab-api", "name": "2. 跨 LAB 最常考的指令／API 速查表", "kids": [{"id": "p0-21-shell", "name": "2.1 Shell 與系統指令"}, {"id": "p0-22-c-api", "name": "2.2 C API"}, {"id": "p0-23-kernel", "name": "2.3 Kernel 端"}, {"id": "p0-24", "name": "2.4 常見回傳值口訣"}]}, {"id": "p0-3", "name": "3. 上機考常見步驟（依投影片實際教法）", "kids": [{"id": "p0-31-c", "name": "3.1 一般 C 程式編譯"}, {"id": "p0-32-shell-scriptlab1", "name": "3.2 Shell script（Lab1）"}, {"id": "p0-33-static-librarylab4", "name": "3.3 Static library（Lab4）"}, {"id": "p0-34-shared-librarylab4", "name": "3.4 Shared library（Lab4）"}, {"id": "p0-35-system-calllab2", "name": "3.5 新增 system call（Lab2）"}, {"id": "p0-36-kernel-modulelab5", "name": "3.6 Kernel module（Lab5）"}, {"id": "p0-37-processlab6", "name": "3.7 Process（Lab6）"}, {"id": "p0-38-ipclab7", "name": "3.8 IPC（Lab7）"}, {"id": "p0-39-makefile-lab2lab5", "name": "3.9 Makefile 格式（Lab2、Lab5）"}]}, {"id": "p0-4", "name": "4. 最容易被考的觀念對比（筆試速記）", "kids": []}, {"id": "p0-5-10", "name": "5. 考前 10 個「一定要記得」", "kids": []}, {"id": "p0-6", "name": "6. 學生練習程式碼的問題清單（考前自我檢查）", "kids": []}]}, {"id": "lab1", "short": "Lab 1", "title": "Lab 1 複習：Shell Script（Vim + Bash）", "html": "<h1 id=\"lab1-lab-1-shell-scriptvim-bash\">Lab 1 複習：Shell Script（Vim + Bash）<\/h1>\n<blockquote>\n<p>來源：Lab1.pptx（54 張投影片）＋ practice/lab1/ex.sh<\/p>\n<\/blockquote>\n<hr />\n<h2 id=\"lab1-1-lab\">1. 這個 LAB 在學什麼<\/h2>\n<p>學會在 Linux terminal 用 <strong>Vim<\/strong> 編輯檔案，並把多個指令寫進一個文字檔變成 <strong>shell script<\/strong>，交給 shell（Bash）逐行解讀執行。重點語法：變數、<code>expr<\/code> 算術、三種引號、<code>read<\/code>、命令列參數、<code>if<\/code>／<code>test<\/code>、比較運算子、<code>for<\/code>／<code>while<\/code>、<code>case<\/code>、function、pipe <code>|<\/code>。Exercise 是用 shell script 寫「猜數字遊戲」。<\/p>\n<hr />\n<h2 id=\"lab1-2\">2. 核心觀念<\/h2>\n<h3 id=\"lab1-21-shell-shell-script\">2.1 Shell 與 Shell Script<\/h3>\n<ul>\n<li><strong>Shell<\/strong>：使用者和 OS 之間的「指令解譯器」。你打一行指令，shell 解讀後請 OS 執行。Windows 對應的是 CMD。<\/li>\n<li><strong>Shell script<\/strong>：把很多指令寫在一個文字檔裡，讓 shell 一次照順序執行。最常見用途是<strong>把要重複做的事自動化<\/strong>。<\/li>\n<li><strong>Bash<\/strong>：GNU 專案寫的自由軟體 Unix shell，是大多數 Linux 發行版（與舊版 macOS）的預設 shell。<\/li>\n<li>第一行 <code>#!/bin/sh<\/code> 或 <code>#!/bin/bash<\/code> 叫 <strong>shebang<\/strong>，告訴系統要用哪個直譯器跑這個檔案。（補充：Ubuntu 的 <code>/bin/sh<\/code> 其實是 <code>dash<\/code>，不支援 <code>((i++))<\/code>、<code>for ((...))<\/code> 這類 bash 專屬語法；用到這些時 shebang 要寫 <code>#!/bin/bash<\/code>。）<\/li>\n<\/ul>\n<h3 id=\"lab1-22-vim\">2.2 Vim 的三種模式（必考）<\/h3>\n<table>\n<thead>\n<tr>\n<th>模式<\/th>\n<th>如何進入<\/th>\n<th>用途<\/th>\n<\/tr>\n<\/thead>\n<tbody>\n<tr>\n<td>Normal mode（一般模式）<\/td>\n<td>開檔預設；在其他模式按 <code>Esc<\/code><\/td>\n<td>移動、下指令前的狀態<\/td>\n<\/tr>\n<tr>\n<td>Insert mode（編輯模式）<\/td>\n<td>Normal 下按 <code>i<\/code><\/td>\n<td>輸入文字，左下角會顯示 <code>-- INSERT --<\/code><\/td>\n<\/tr>\n<tr>\n<td>Command-line mode（命令模式）<\/td>\n<td>Normal 下按 <code>:<\/code><\/td>\n<td><code>:w<\/code> 存檔、<code>:q<\/code> 離開、<code>:wq<\/code> 存檔並離開<\/td>\n<\/tr>\n<\/tbody>\n<\/table>\n<p>（補充：<code>:q!<\/code> 不存檔強制離開。）<\/p>\n<h3 id=\"lab1-23-script\">2.3 執行 script 需要「執行權限」<\/h3>\n<p>寫好的 <code>.sh<\/code> 預設沒有 x 權限，要先 <code>chmod u+x helloworld.sh<\/code>（或 <code>chmod +x<\/code>），才能用 <code>./helloworld.sh<\/code> 執行。<code>./<\/code> 代表「目前目錄下的這個檔案」。<\/p>\n<h3 id=\"lab1-24\">2.4 變數<\/h3>\n<ul>\n<li><strong>System variables<\/strong>：系統內建，如 <code>$PWD<\/code>（目前目錄）、<code>$HOME<\/code>、<code>$PATH<\/code>。<\/li>\n<li><strong>User defined variables (UDV)<\/strong>：自己定義，例如 <code>no=10<\/code>，用 <code>echo $no<\/code> 取值。<\/li>\n<li><strong>賦值時等號兩邊不能有空格<\/strong>：<code>no=10<\/code> 對；<code>no = 10<\/code> 錯（shell 會把 <code>no<\/code> 當指令）。<\/li>\n<li><strong>比較時等號兩邊一定要有空格<\/strong>：<code>[ \"$a\" = \"$b\" ]<\/code>。<\/li>\n<\/ul>\n<h3 id=\"lab1-25-expr\">2.5 <code>expr<\/code> 算術<\/h3>\n<ul>\n<li>語法：<code>expr op1 運算子 op2<\/code>，<strong>運算子兩邊要有空格<\/strong>：<code>expr 1 + 3<\/code> → <code>4<\/code>。<\/li>\n<li>乘法要寫 <code>\\*<\/code>：因為 <code>*<\/code> 在 shell 會被展開成「目前目錄的所有檔名」（wildcard），加 <code>\\<\/code> 讓它被當一般字元。<\/li>\n<li>要把運算結果存進變數要用反引號：<code>i=\\<\/code>expr $i + 1``。<\/li>\n<\/ul>\n<h3 id=\"lab1-26\">2.6 三種引號（必考）<\/h3>\n<table>\n<thead>\n<tr>\n<th>引號<\/th>\n<th>行為<\/th>\n<th>例子（<code>var=hi<\/code>）<\/th>\n<th>輸出<\/th>\n<\/tr>\n<\/thead>\n<tbody>\n<tr>\n<td>雙引號 <code>\"<\/code><\/td>\n<td>會展開變數 <code>$<\/code> 和反引號 <code>`<\/code>，其他特殊字元當純文字<\/td>\n<td><code>echo \"$var, there\"<\/code><\/td>\n<td><code>hi, there<\/code><\/td>\n<\/tr>\n<tr>\n<td>單引號 <code>'<\/code><\/td>\n<td><strong>全部<\/strong>當純文字<\/td>\n<td><code>echo '$var, there'<\/code><\/td>\n<td><code>$var, there<\/code><\/td>\n<\/tr>\n<tr>\n<td>反引號 <code>`<\/code><\/td>\n<td>執行裡面的指令，把結果放回原處<\/td>\n<td><code>echo \"`expr 1 + 3`\"<\/code><\/td>\n<td><code>4<\/code><\/td>\n<\/tr>\n<\/tbody>\n<\/table>\n<p>其他投影片示範：<code>echo \"expr 1 + 3\"<\/code> → <code>expr 1 + 3<\/code>（只是字串）；<code>echo '`expr 1 + 3`'<\/code> → <code>`expr 1 + 3`<\/code>（單引號連反引號也不展開）。<\/p>\n<h3 id=\"lab1-27\">2.7 命令列參數<\/h3>\n<table>\n<thead>\n<tr>\n<th>符號<\/th>\n<th>意義<\/th>\n<\/tr>\n<\/thead>\n<tbody>\n<tr>\n<td><code>$0<\/code><\/td>\n<td>script 本身的名稱<\/td>\n<\/tr>\n<tr>\n<td><code>$1<\/code>, <code>$2<\/code>…<\/td>\n<td>第 1、2… 個參數<\/td>\n<\/tr>\n<tr>\n<td><code>$#<\/code><\/td>\n<td>參數個數<\/td>\n<\/tr>\n<\/tbody>\n<\/table>\n<h3 id=\"lab1-28-test-expr\">2.8 <code>test<\/code> / <code>[ expr ]<\/code><\/h3>\n<ul>\n<li><code>test 運算式<\/code> 與 <code>[ 運算式 ]<\/code> 等價，用來判斷運算式真假。<\/li>\n<li><strong>回傳 0 代表 true，非 0 代表 false<\/strong>（和 C 語言相反，必考）。<\/li>\n<li><code>[<\/code> 後面、<code>]<\/code> 前面都要有空格。<\/li>\n<\/ul>\n<h3 id=\"lab1-29-pipe\">2.9 Pipe <code>|<\/code><\/h3>\n<p>把 A 的輸出直接接到 B 的輸入，不需要暫存檔。例：<code>ls | sort -r<\/code> 反向排序列出目錄內容。<\/p>\n<hr />\n<h2 id=\"lab1-3\">3. 指令／語法速查表<\/h2>\n<table>\n<thead>\n<tr>\n<th>名稱<\/th>\n<th>用途<\/th>\n<th>重要參數／說明<\/th>\n<th>範例<\/th>\n<\/tr>\n<\/thead>\n<tbody>\n<tr>\n<td><code>vim 檔名<\/code><\/td>\n<td>開啟／建立檔案<\/td>\n<td><code>i<\/code> 編輯、<code>Esc<\/code> 回 normal、<code>:w<\/code> <code>:q<\/code> <code>:wq<\/code><\/td>\n<td><code>vim helloworld.sh<\/code><\/td>\n<\/tr>\n<tr>\n<td><code>sudo apt-get update<\/code><\/td>\n<td>更新套件列表<\/td>\n<td>—<\/td>\n<td><code>sudo apt-get update<\/code><\/td>\n<\/tr>\n<tr>\n<td><code>sudo apt-get install<\/code><\/td>\n<td>安裝套件<\/td>\n<td>—<\/td>\n<td><code>sudo apt-get install vim<\/code><\/td>\n<\/tr>\n<tr>\n<td><code>echo<\/code><\/td>\n<td>輸出字串<\/td>\n<td>引號規則見上<\/td>\n<td><code>echo Hello World!<\/code><\/td>\n<\/tr>\n<tr>\n<td><code>chmod<\/code><\/td>\n<td>改權限<\/td>\n<td><code>u+x<\/code> 給擁有者執行權<\/td>\n<td><code>chmod u+x a.sh<\/code><\/td>\n<\/tr>\n<tr>\n<td><code>read<\/code><\/td>\n<td>從鍵盤讀入變數<\/td>\n<td>可一次讀多個：<code>read v1 v2<\/code><\/td>\n<td><code>read fname lname<\/code><\/td>\n<\/tr>\n<tr>\n<td><code>expr<\/code><\/td>\n<td>整數運算<\/td>\n<td><code>+ - \\* /<\/code>，運算子兩側要空格<\/td>\n<td><code>x=`expr $a \\* 2`<\/code><\/td>\n<\/tr>\n<tr>\n<td><code>test<\/code> / <code>[ ]<\/code><\/td>\n<td>條件判斷<\/td>\n<td>0=true<\/td>\n<td><code>[ \"$a\" -lt \"$b\" ]<\/code><\/td>\n<\/tr>\n<tr>\n<td><code>-eq -ne -lt -le -gt -ge<\/code><\/td>\n<td>數值比較<\/td>\n<td>等於／不等於／小於／小於等於／大於／大於等於<\/td>\n<td><code>[ $i -lt 6 ]<\/code><\/td>\n<\/tr>\n<tr>\n<td><code>=<\/code>, <code>!=<\/code><\/td>\n<td>字串比較<\/td>\n<td>兩邊要空格<\/td>\n<td><code>[ \"$T1\" = \"$T2\" ]<\/code><\/td>\n<\/tr>\n<tr>\n<td><code>-n str<\/code> / <code>-z str<\/code><\/td>\n<td>字串長度 &gt;0 / =0<\/td>\n<td>—<\/td>\n<td><code>[ -z \"$x\" ]<\/code><\/td>\n<\/tr>\n<tr>\n<td><code>if … then … elif … else … fi<\/code><\/td>\n<td>條件<\/td>\n<td><code>fi<\/code> 結尾<\/td>\n<td>見下<\/td>\n<\/tr>\n<tr>\n<td><code>for … in …; do … done<\/code><\/td>\n<td>迴圈<\/td>\n<td>也可 <code>for ((i=1;i&lt;6;i++))<\/code>（bash）<\/td>\n<td><code>for i in 1 2 3; do echo $i; done<\/code><\/td>\n<\/tr>\n<tr>\n<td><code>while [ ]; do … done<\/code><\/td>\n<td>迴圈<\/td>\n<td>遞增可用 <code>i=`expr $i + 1`<\/code> 或 <code>((i++))<\/code>、<code>((i=i+1))<\/code>、<code>((i+=1))<\/code><\/td>\n<td>見下<\/td>\n<\/tr>\n<tr>\n<td><code>case $var in pat) cmd;; esac<\/code><\/td>\n<td>多分支<\/td>\n<td><code>*)<\/code> 為預設；每個分支 <code>;;<\/code> 結尾<\/td>\n<td>見下<\/td>\n<\/tr>\n<tr>\n<td>函式<\/td>\n<td><code>Name() { … }<\/code> 呼叫時只寫 <code>Name<\/code><\/td>\n<td>—<\/td>\n<td><code>PrintNumber<\/code><\/td>\n<\/tr>\n<tr>\n<td><code>A \\| B<\/code><\/td>\n<td>Pipe<\/td>\n<td>A 的 stdout → B 的 stdin<\/td>\n<td><code>ls \\| sort -r<\/code><\/td>\n<\/tr>\n<tr>\n<td>附錄常用<\/td>\n<td><code>ls cd pwd mkdir touch cat cp mv rm find grep<\/code><\/td>\n<td><code>cd ~<\/code> 回家目錄<\/td>\n<td>—<\/td>\n<\/tr>\n<tr>\n<td>快捷鍵<\/td>\n<td><code>Ctrl+Alt+T<\/code> 開 terminal、<code>Ctrl+C<\/code> 強制停止、<code>Ctrl+L<\/code> 清畫面、<code>Ctrl+D<\/code> 關閉、<code>Ctrl+S<\/code> 鎖定/<code>Ctrl+Q<\/code> 解鎖<\/td>\n<td>—<\/td>\n<td>—<\/td>\n<\/tr>\n<\/tbody>\n<\/table>\n<hr />\n<h2 id=\"lab1-4\">4. 程式範例逐行解說<\/h2>\n<h3 id=\"lab1-41-hello-world-script\">4.1 Hello World script<\/h3>\n<div class=\"hl\"><pre><span><\/span><code><span class=\"ch\">#!/bin/bash<\/span>\n<span class=\"nb\">echo<\/span><span class=\"w\"> <\/span><span class=\"s2\">\"Hello World!\"<\/span>\n<\/code><\/pre><\/div>\n\n<p>步驟：<code>vim helloworld.sh<\/code> → <code>i<\/code> 輸入 → <code>Esc<\/code> → <code>:wq<\/code> → <code>chmod u+x helloworld.sh<\/code> → <code>./helloworld.sh<\/code> → 印出 <code>Hello World!<\/code>。<\/p>\n<h3 id=\"lab1-42-myshellsh\">4.2 參數（投影片 myshell.sh）<\/h3>\n<div class=\"hl\"><pre><span><\/span><code><span class=\"nb\">echo<\/span><span class=\"w\"> <\/span><span class=\"s2\">\"Welcome to use <\/span><span class=\"nv\">$0<\/span><span class=\"s2\">\"<\/span>\n<span class=\"nb\">echo<\/span><span class=\"w\"> <\/span><span class=\"s2\">\"Hi, <\/span><span class=\"nv\">$1<\/span><span class=\"s2\"> <\/span><span class=\"nv\">$2<\/span><span class=\"s2\">, we have <\/span><span class=\"nv\">$#<\/span><span class=\"s2\"> argument(s).\"<\/span>\n<\/code><\/pre><\/div>\n\n<p>執行 <code>./myshell.sh nelson yeh<\/code> →<\/p>\n<div class=\"hl\"><pre><span><\/span><code>Welcome to use ./myshell.sh\nHi, nelson yeh, we have 2 argument(s).\n<\/code><\/pre><\/div>\n\n<p><code>$0<\/code> 是你<strong>打的路徑<\/strong>（含 <code>./<\/code>），<code>$#<\/code> 不算 <code>$0<\/code>。<\/p>\n<h3 id=\"lab1-43-if-elif-else\">4.3 if / elif / else<\/h3>\n<div class=\"hl\"><pre><span><\/span><code><span class=\"k\">if<\/span><span class=\"w\"> <\/span><span class=\"o\">[<\/span><span class=\"w\"> <\/span><span class=\"s2\">\"foo\"<\/span><span class=\"w\"> <\/span><span class=\"o\">=<\/span><span class=\"w\"> <\/span><span class=\"s2\">\"bar\"<\/span><span class=\"w\"> <\/span><span class=\"o\">]<\/span><span class=\"p\">;<\/span><span class=\"w\"> <\/span><span class=\"k\">then<\/span>\n<span class=\"w\">   <\/span><span class=\"nb\">echo<\/span><span class=\"w\"> <\/span>foo<span class=\"w\"> <\/span>eq<span class=\"w\"> <\/span>bar\n<span class=\"k\">elif<\/span><span class=\"w\"> <\/span><span class=\"o\">[<\/span><span class=\"w\"> <\/span><span class=\"s2\">\"foo\"<\/span><span class=\"w\"> <\/span><span class=\"o\">=<\/span><span class=\"w\"> <\/span><span class=\"s2\">\"foo\"<\/span><span class=\"w\"> <\/span><span class=\"o\">]<\/span><span class=\"p\">;<\/span><span class=\"w\"> <\/span><span class=\"k\">then<\/span>\n<span class=\"w\">   <\/span><span class=\"nb\">echo<\/span><span class=\"w\"> <\/span>foo<span class=\"w\"> <\/span>eq<span class=\"w\"> <\/span>foo\n<span class=\"k\">else<\/span>\n<span class=\"w\">   <\/span><span class=\"nb\">echo<\/span><span class=\"w\"> <\/span>foo<span class=\"w\"> <\/span>not<span class=\"w\"> <\/span>eq<span class=\"w\"> <\/span>foo\n<span class=\"k\">fi<\/span>\n<\/code><\/pre><\/div>\n\n<p>輸出：<code>foo eq foo<\/code>。第一個條件假、第二個真。<\/p>\n<h3 id=\"lab1-44-while\">4.4 while 迴圈<\/h3>\n<div class=\"hl\"><pre><span><\/span><code><span class=\"nv\">i<\/span><span class=\"o\">=<\/span><span class=\"m\">1<\/span>\n<span class=\"k\">while<\/span><span class=\"w\"> <\/span><span class=\"o\">[<\/span><span class=\"w\"> <\/span><span class=\"nv\">$i<\/span><span class=\"w\"> <\/span>-lt<span class=\"w\"> <\/span><span class=\"m\">6<\/span><span class=\"w\"> <\/span><span class=\"o\">]<\/span><span class=\"p\">;<\/span><span class=\"w\"> <\/span><span class=\"k\">do<\/span>\n<span class=\"w\">     <\/span><span class=\"nb\">echo<\/span><span class=\"w\"> <\/span>Item<span class=\"w\"> <\/span><span class=\"nv\">$i<\/span>\n<span class=\"w\">     <\/span><span class=\"nv\">i<\/span><span class=\"o\">=<\/span><span class=\"sb\">`<\/span>expr<span class=\"w\"> <\/span><span class=\"nv\">$i<\/span><span class=\"w\"> <\/span>+<span class=\"w\"> <\/span><span class=\"m\">1<\/span><span class=\"sb\">`<\/span>\n<span class=\"k\">done<\/span>\n<\/code><\/pre><\/div>\n\n<p>輸出 <code>Item 1<\/code> ~ <code>Item 5<\/code>（5 行）。條件 <code>-lt 6<\/code> 表示 i&lt;6。<\/p>\n<h3 id=\"lab1-45-casenamesh\">4.5 case（name.sh）<\/h3>\n<div class=\"hl\"><pre><span><\/span><code><span class=\"k\">case<\/span><span class=\"w\"> <\/span><span class=\"nv\">$1<\/span><span class=\"w\"> <\/span><span class=\"k\">in<\/span>\n<span class=\"w\">  <\/span><span class=\"s2\">\"Amy\"<\/span><span class=\"o\">)<\/span><span class=\"w\">    <\/span><span class=\"nb\">echo<\/span><span class=\"w\"> <\/span><span class=\"s2\">\"Amy Lin\"<\/span><span class=\"p\">;;<\/span>\n<span class=\"w\">  <\/span><span class=\"s2\">\"Jimmy\"<\/span><span class=\"o\">)<\/span><span class=\"w\">  <\/span><span class=\"nb\">echo<\/span><span class=\"w\"> <\/span><span class=\"s2\">\"Jimmy Wang\"<\/span><span class=\"p\">;;<\/span>\n<span class=\"w\">  <\/span><span class=\"s2\">\"Johnny\"<\/span><span class=\"o\">)<\/span><span class=\"w\"> <\/span><span class=\"nb\">echo<\/span><span class=\"w\"> <\/span><span class=\"s2\">\"Johnny Chen\"<\/span><span class=\"p\">;;<\/span>\n<span class=\"w\">  <\/span><span class=\"s2\">\"Purple\"<\/span><span class=\"o\">)<\/span><span class=\"w\"> <\/span><span class=\"nb\">echo<\/span><span class=\"w\"> <\/span><span class=\"s2\">\"Purple Red\"<\/span><span class=\"p\">;;<\/span>\n<span class=\"w\">  <\/span>*<span class=\"o\">)<\/span><span class=\"w\">        <\/span><span class=\"nb\">echo<\/span><span class=\"w\"> <\/span><span class=\"s2\">\"Error\"<\/span>\n<span class=\"k\">esac<\/span>\n<\/code><\/pre><\/div>\n\n<p><code>./name.sh Amy<\/code> → <code>Amy Lin<\/code>；<code>./name.sh Bob<\/code> → <code>Error<\/code>。最後一個分支的 <code>;;<\/code> 可省略。<\/p>\n<h3 id=\"lab1-46\">4.6 函式<\/h3>\n<div class=\"hl\"><pre><span><\/span><code><span class=\"nv\">num<\/span><span class=\"o\">=<\/span><span class=\"m\">10<\/span>\nPrintNumber<span class=\"o\">()<\/span><span class=\"w\"> <\/span><span class=\"o\">{<\/span>\n<span class=\"w\">    <\/span><span class=\"nb\">echo<\/span><span class=\"w\"> <\/span><span class=\"s2\">\"The number is <\/span><span class=\"nv\">$num<\/span><span class=\"s2\">!\"<\/span>\n<span class=\"o\">}<\/span>\nPrintNumber\n<\/code><\/pre><\/div>\n\n<p>輸出 <code>The number is 10!<\/code>。函式要<strong>先定義再呼叫<\/strong>；shell 變數預設是全域的，所以函式內看得到 <code>num<\/code>。<\/p>\n<h3 id=\"lab1-47-pipe-ex3sh-ex4sh\">4.7 Pipe 範例（ex3.sh | ex4.sh）<\/h3>\n<div class=\"hl\"><pre><span><\/span><code><span class=\"ch\">#!/bin/sh<\/span>\n<span class=\"c1\">#ex3.sh<\/span>\n<span class=\"nb\">echo<\/span><span class=\"w\"> <\/span><span class=\"s2\">\"Amy\"<\/span><span class=\"p\">;<\/span><span class=\"w\"> <\/span><span class=\"nb\">echo<\/span><span class=\"w\"> <\/span><span class=\"s2\">\"Jimmy\"<\/span><span class=\"p\">;<\/span><span class=\"w\"> <\/span><span class=\"nb\">echo<\/span><span class=\"w\"> <\/span><span class=\"s2\">\"Johnny\"<\/span><span class=\"p\">;<\/span><span class=\"w\"> <\/span><span class=\"nb\">echo<\/span><span class=\"w\"> <\/span><span class=\"s2\">\"Purple\"<\/span>\n<\/code><\/pre><\/div>\n\n<div class=\"hl\"><pre><span><\/span><code><span class=\"ch\">#!/bin/sh<\/span>\n<span class=\"c1\">#ex4.sh<\/span>\n<span class=\"k\">while<\/span><span class=\"w\"> <\/span><span class=\"nb\">read<\/span><span class=\"w\"> <\/span>first<span class=\"w\"> <\/span><span class=\"p\">;<\/span><span class=\"w\"> <\/span><span class=\"k\">do<\/span>\n<span class=\"w\">    <\/span><span class=\"k\">case<\/span><span class=\"w\"> <\/span><span class=\"nv\">$first<\/span><span class=\"w\"> <\/span><span class=\"k\">in<\/span>\n<span class=\"w\">        <\/span><span class=\"s2\">\"Amy\"<\/span><span class=\"o\">)<\/span><span class=\"nb\">echo<\/span><span class=\"w\"> <\/span><span class=\"s2\">\"Amy Lin\"<\/span><span class=\"p\">;;<\/span>\n<span class=\"w\">        <\/span><span class=\"s2\">\"Jimmy\"<\/span><span class=\"o\">)<\/span><span class=\"nb\">echo<\/span><span class=\"w\"> <\/span><span class=\"s2\">\"Jimmy Wang\"<\/span><span class=\"p\">;;<\/span>\n<span class=\"w\">        <\/span><span class=\"s2\">\"Johnny\"<\/span><span class=\"o\">)<\/span><span class=\"nb\">echo<\/span><span class=\"w\"> <\/span><span class=\"s2\">\"Jhonny Chen\"<\/span><span class=\"p\">;;<\/span>\n<span class=\"w\">        <\/span><span class=\"s2\">\"Purple\"<\/span><span class=\"o\">)<\/span><span class=\"nb\">echo<\/span><span class=\"w\"> <\/span><span class=\"s2\">\"Purple Red\"<\/span><span class=\"p\">;;<\/span>\n<span class=\"w\">        <\/span>*<span class=\"o\">)<\/span><span class=\"nb\">echo<\/span><span class=\"w\"> <\/span><span class=\"s2\">\"error\"<\/span>\n<span class=\"w\">    <\/span><span class=\"k\">esac<\/span>\n<span class=\"k\">done<\/span>\n<\/code><\/pre><\/div>\n\n<p><code>./ex3.sh | ./ex4.sh<\/code> → ex3 的 4 行輸出變成 ex4 的輸入，<code>while read<\/code> 一次讀一行，直到 EOF 結束。輸出 <code>Amy Lin / Jimmy Wang / Jhonny Chen / Purple Red<\/code>（投影片原文把 Johnny 拼成 Jhonny，是投影片的 typo，不影響邏輯）。<\/p>\n<h3 id=\"lab1-48-practicelab1exsh\">4.8 學生作業 practice/lab1/ex.sh（猜數字）<\/h3>\n<div class=\"hl\"><pre><span><\/span><code><span class=\"ch\">#!/bin/sh<\/span>\n<span class=\"nb\">echo<\/span><span class=\"w\"> <\/span><span class=\"s2\">\"Please enter the target number between 1 and 10\"<\/span>\n<span class=\"nb\">read<\/span><span class=\"w\"> <\/span>target\n<span class=\"nv\">min<\/span><span class=\"o\">=<\/span><span class=\"m\">1<\/span>\n<span class=\"nv\">max<\/span><span class=\"o\">=<\/span><span class=\"m\">10<\/span>\n<span class=\"k\">while<\/span><span class=\"w\"> <\/span><span class=\"o\">[<\/span><span class=\"w\"> <\/span><span class=\"nv\">$min<\/span><span class=\"w\"> <\/span>-le<span class=\"w\"> <\/span><span class=\"nv\">$max<\/span><span class=\"w\"> <\/span><span class=\"o\">]<\/span><span class=\"p\">;<\/span><span class=\"w\"> <\/span><span class=\"k\">do<\/span>\n<span class=\"w\">    <\/span><span class=\"nb\">echo<\/span><span class=\"w\"> <\/span><span class=\"s2\">\"Please guess a number between <\/span><span class=\"nv\">$min<\/span><span class=\"s2\"> and <\/span><span class=\"nv\">$max<\/span><span class=\"s2\">\"<\/span>\n<span class=\"w\">    <\/span><span class=\"nb\">read<\/span><span class=\"w\"> <\/span>guess\n<span class=\"w\">    <\/span><span class=\"k\">if<\/span><span class=\"w\"> <\/span><span class=\"o\">[<\/span><span class=\"w\"> <\/span><span class=\"nv\">$guess<\/span><span class=\"w\"> <\/span>-gt<span class=\"w\"> <\/span><span class=\"nv\">$target<\/span><span class=\"w\"> <\/span><span class=\"o\">]<\/span><span class=\"p\">;<\/span><span class=\"w\"> <\/span><span class=\"k\">then<\/span>\n<span class=\"w\">        <\/span><span class=\"nv\">max<\/span><span class=\"o\">=<\/span><span class=\"s2\">\"`expr <\/span><span class=\"nv\">$guess<\/span><span class=\"s2\"> - 1`\"<\/span>\n<span class=\"w\">        <\/span><span class=\"nb\">echo<\/span><span class=\"w\"> <\/span><span class=\"s2\">\"Too high!\"<\/span>\n<span class=\"w\">    <\/span><span class=\"k\">elif<\/span><span class=\"w\"> <\/span><span class=\"o\">[<\/span><span class=\"w\"> <\/span><span class=\"nv\">$guess<\/span><span class=\"w\"> <\/span>-lt<span class=\"w\"> <\/span><span class=\"nv\">$target<\/span><span class=\"w\"> <\/span><span class=\"o\">]<\/span><span class=\"p\">;<\/span><span class=\"w\"> <\/span><span class=\"k\">then<\/span>\n<span class=\"w\">        <\/span><span class=\"nv\">min<\/span><span class=\"o\">=<\/span><span class=\"s2\">\"`expr <\/span><span class=\"nv\">$guess<\/span><span class=\"s2\"> + 1`\"<\/span>\n<span class=\"w\">        <\/span><span class=\"nb\">echo<\/span><span class=\"w\"> <\/span><span class=\"s2\">\"Too low!\"<\/span>\n<span class=\"w\">    <\/span><span class=\"k\">else<\/span>\n<span class=\"w\">        <\/span><span class=\"nb\">echo<\/span><span class=\"w\"> <\/span><span class=\"s2\">\"Bingo!\"<\/span>\n<span class=\"w\">        <\/span><span class=\"nv\">max<\/span><span class=\"o\">=<\/span><span class=\"s2\">\"`expr <\/span><span class=\"nv\">$min<\/span><span class=\"s2\"> - 1`\"<\/span>\n<span class=\"w\">    <\/span><span class=\"k\">fi<\/span>\n<span class=\"k\">done<\/span>\n<\/code><\/pre><\/div>\n\n<p>逐行：\n- 讀入目標 <code>target<\/code>，範圍初值 1~10。\n- <code>while [ $min -le $max ]<\/code>：只要範圍還沒空就繼續猜。\n- 猜太大 → 上界縮成 <code>guess-1<\/code>；太小 → 下界變 <code>guess+1<\/code>。\n- 猜中 → 把 <code>max<\/code> 設成 <code>min-1<\/code> 讓迴圈條件變假而離開（取代 <code>break<\/code> 的技巧）。<\/p>\n<p>範例互動（target=5）：猜 8 → <code>Too high!<\/code>，提示變 <code>between 1 and 7<\/code>；猜 3 → <code>Too low!<\/code>，提示 <code>between 4 and 7<\/code>；猜 5 → <code>Bingo!<\/code>。<\/p>\n<p><strong>需要注意的問題：<\/strong>\n1. <strong>沒有使用 function<\/strong>：Exercise (2/3) 明確要求「Use function to ask for guessing number」，這份程式沒有定義任何函式，demo 時可能被扣分。建議改成下面的參考解。\n2. <strong>沒檢查輸入<\/strong>：猜的數字超出 <code>[min,max]<\/code> 也照算（例如目前範圍 4~7 卻輸入 9，會把 max 改成 8，範圍反而變大）；輸入非數字時 <code>[ ... -gt ... ]<\/code> 會報錯 <code>integer expression expected<\/code>。\n3. 沒檢查 target 是否在 1~10。\n4. 用 <code>#!/bin/sh<\/code> 沒問題，因為只用了 POSIX 語法（<code>expr<\/code>、<code>[ ]<\/code>）。<\/p>\n<h3 id=\"lab1-49-exercise-function\">4.9 Exercise 參考解法（含 function 與輸入檢查）<\/h3>\n<div class=\"hl\"><pre><span><\/span><code><span class=\"ch\">#!/bin/bash<\/span>\n<span class=\"c1\"># NGG.sh - Number Guessing Game<\/span>\n<span class=\"nv\">min<\/span><span class=\"o\">=<\/span><span class=\"m\">1<\/span>\n<span class=\"nv\">max<\/span><span class=\"o\">=<\/span><span class=\"m\">10<\/span>\n\nask_guess<span class=\"o\">()<\/span><span class=\"w\"> <\/span><span class=\"o\">{<\/span><span class=\"w\">            <\/span><span class=\"c1\"># 用 function 詢問猜測值<\/span>\n<span class=\"w\">    <\/span><span class=\"nb\">echo<\/span><span class=\"w\"> <\/span><span class=\"s2\">\"Please guess a number between <\/span><span class=\"nv\">$min<\/span><span class=\"s2\"> and <\/span><span class=\"nv\">$max<\/span><span class=\"s2\">\"<\/span>\n<span class=\"w\">    <\/span><span class=\"nb\">read<\/span><span class=\"w\"> <\/span>guess\n<span class=\"o\">}<\/span>\n\n<span class=\"nb\">echo<\/span><span class=\"w\"> <\/span><span class=\"s2\">\"Please enter the target number between 1 and 10:\"<\/span>\n<span class=\"nb\">read<\/span><span class=\"w\"> <\/span>target\n<span class=\"k\">while<\/span><span class=\"w\"> <\/span><span class=\"o\">[<\/span><span class=\"w\"> <\/span><span class=\"s2\">\"<\/span><span class=\"nv\">$target<\/span><span class=\"s2\">\"<\/span><span class=\"w\"> <\/span>-lt<span class=\"w\"> <\/span><span class=\"m\">1<\/span><span class=\"w\"> <\/span><span class=\"o\">]<\/span><span class=\"w\"> <\/span><span class=\"o\">||<\/span><span class=\"w\"> <\/span><span class=\"o\">[<\/span><span class=\"w\"> <\/span><span class=\"s2\">\"<\/span><span class=\"nv\">$target<\/span><span class=\"s2\">\"<\/span><span class=\"w\"> <\/span>-gt<span class=\"w\"> <\/span><span class=\"m\">10<\/span><span class=\"w\"> <\/span><span class=\"o\">]<\/span><span class=\"p\">;<\/span><span class=\"w\"> <\/span><span class=\"k\">do<\/span>\n<span class=\"w\">    <\/span><span class=\"nb\">echo<\/span><span class=\"w\"> <\/span><span class=\"s2\">\"Out of range, enter again:\"<\/span>\n<span class=\"w\">    <\/span><span class=\"nb\">read<\/span><span class=\"w\"> <\/span>target\n<span class=\"k\">done<\/span>\n\n<span class=\"k\">while<\/span><span class=\"w\"> <\/span>true<span class=\"p\">;<\/span><span class=\"w\"> <\/span><span class=\"k\">do<\/span>\n<span class=\"w\">    <\/span>ask_guess\n<span class=\"w\">    <\/span><span class=\"k\">if<\/span><span class=\"w\"> <\/span><span class=\"o\">[<\/span><span class=\"w\"> <\/span><span class=\"s2\">\"<\/span><span class=\"nv\">$guess<\/span><span class=\"s2\">\"<\/span><span class=\"w\"> <\/span>-lt<span class=\"w\"> <\/span><span class=\"s2\">\"<\/span><span class=\"nv\">$min<\/span><span class=\"s2\">\"<\/span><span class=\"w\"> <\/span><span class=\"o\">]<\/span><span class=\"w\"> <\/span><span class=\"o\">||<\/span><span class=\"w\"> <\/span><span class=\"o\">[<\/span><span class=\"w\"> <\/span><span class=\"s2\">\"<\/span><span class=\"nv\">$guess<\/span><span class=\"s2\">\"<\/span><span class=\"w\"> <\/span>-gt<span class=\"w\"> <\/span><span class=\"s2\">\"<\/span><span class=\"nv\">$max<\/span><span class=\"s2\">\"<\/span><span class=\"w\"> <\/span><span class=\"o\">]<\/span><span class=\"p\">;<\/span><span class=\"w\"> <\/span><span class=\"k\">then<\/span>\n<span class=\"w\">        <\/span><span class=\"nb\">echo<\/span><span class=\"w\"> <\/span><span class=\"s2\">\"Out of range!\"<\/span>\n<span class=\"w\">        <\/span><span class=\"k\">continue<\/span>\n<span class=\"w\">    <\/span><span class=\"k\">fi<\/span>\n<span class=\"w\">    <\/span><span class=\"k\">if<\/span><span class=\"w\"> <\/span><span class=\"o\">[<\/span><span class=\"w\"> <\/span><span class=\"s2\">\"<\/span><span class=\"nv\">$guess<\/span><span class=\"s2\">\"<\/span><span class=\"w\"> <\/span>-gt<span class=\"w\"> <\/span><span class=\"s2\">\"<\/span><span class=\"nv\">$target<\/span><span class=\"s2\">\"<\/span><span class=\"w\"> <\/span><span class=\"o\">]<\/span><span class=\"p\">;<\/span><span class=\"w\"> <\/span><span class=\"k\">then<\/span>\n<span class=\"w\">        <\/span><span class=\"nb\">echo<\/span><span class=\"w\"> <\/span><span class=\"s2\">\"Too high!\"<\/span>\n<span class=\"w\">        <\/span><span class=\"nv\">max<\/span><span class=\"o\">=<\/span><span class=\"sb\">`<\/span>expr<span class=\"w\"> <\/span><span class=\"nv\">$guess<\/span><span class=\"w\"> <\/span>-<span class=\"w\"> <\/span><span class=\"m\">1<\/span><span class=\"sb\">`<\/span>\n<span class=\"w\">    <\/span><span class=\"k\">elif<\/span><span class=\"w\"> <\/span><span class=\"o\">[<\/span><span class=\"w\"> <\/span><span class=\"s2\">\"<\/span><span class=\"nv\">$guess<\/span><span class=\"s2\">\"<\/span><span class=\"w\"> <\/span>-lt<span class=\"w\"> <\/span><span class=\"s2\">\"<\/span><span class=\"nv\">$target<\/span><span class=\"s2\">\"<\/span><span class=\"w\"> <\/span><span class=\"o\">]<\/span><span class=\"p\">;<\/span><span class=\"w\"> <\/span><span class=\"k\">then<\/span>\n<span class=\"w\">        <\/span><span class=\"nb\">echo<\/span><span class=\"w\"> <\/span><span class=\"s2\">\"Too low!\"<\/span>\n<span class=\"w\">        <\/span><span class=\"nv\">min<\/span><span class=\"o\">=<\/span><span class=\"sb\">`<\/span>expr<span class=\"w\"> <\/span><span class=\"nv\">$guess<\/span><span class=\"w\"> <\/span>+<span class=\"w\"> <\/span><span class=\"m\">1<\/span><span class=\"sb\">`<\/span>\n<span class=\"w\">    <\/span><span class=\"k\">else<\/span>\n<span class=\"w\">        <\/span><span class=\"nb\">echo<\/span><span class=\"w\"> <\/span><span class=\"s2\">\"Bingo!\"<\/span>\n<span class=\"w\">        <\/span><span class=\"k\">break<\/span>\n<span class=\"w\">    <\/span><span class=\"k\">fi<\/span>\n<span class=\"k\">done<\/span>\n<\/code><\/pre><\/div>\n\n<hr />\n<h2 id=\"lab1-5\">5. 上機考實作步驟<\/h2>\n<div class=\"hl\"><pre><span><\/span><code><span class=\"c1\"># 0. 開 terminal：Ctrl + Alt + T<\/span>\n<span class=\"c1\"># 1. (需要時) 安裝 vim<\/span>\nsudo<span class=\"w\"> <\/span>apt-get<span class=\"w\"> <\/span>update\nsudo<span class=\"w\"> <\/span>apt-get<span class=\"w\"> <\/span>install<span class=\"w\"> <\/span>vim\n\n<span class=\"c1\"># 2. 建立 script<\/span>\nvim<span class=\"w\"> <\/span>NGG.sh<span class=\"w\">          <\/span><span class=\"c1\"># 按 i 輸入程式 → Esc → :wq<\/span>\n\n<span class=\"c1\"># 3. 給執行權限並執行<\/span>\nchmod<span class=\"w\"> <\/span>u+x<span class=\"w\"> <\/span>NGG.sh\n./NGG.sh\n\n<span class=\"c1\"># 4. (或不改權限直接用 bash 跑)<\/span>\nbash<span class=\"w\"> <\/span>NGG.sh\n\n<span class=\"c1\"># 5. 測 pipe<\/span>\n./ex3.sh<span class=\"w\"> <\/span><span class=\"p\">|<\/span><span class=\"w\"> <\/span>./ex4.sh\nls<span class=\"w\"> <\/span><span class=\"p\">|<\/span><span class=\"w\"> <\/span>sort<span class=\"w\"> <\/span>-r\n<\/code><\/pre><\/div>\n\n<p>除錯技巧（補充）：<code>bash -x NGG.sh<\/code> 會把每一行執行前的內容印出來，方便看變數值。<\/p>\n<hr />\n<h2 id=\"lab1-6\">6. 常見錯誤與陷阱<\/h2>\n<table>\n<thead>\n<tr>\n<th>錯誤寫法<\/th>\n<th>問題<\/th>\n<th>正確<\/th>\n<\/tr>\n<\/thead>\n<tbody>\n<tr>\n<td><code>no = 10<\/code><\/td>\n<td>賦值有空格 → <code>no: command not found<\/code><\/td>\n<td><code>no=10<\/code><\/td>\n<\/tr>\n<tr>\n<td><code>[ \"$a\"=\"$b\" ]<\/code><\/td>\n<td>比較沒空格 → 永遠為真（被當成一個非空字串）<\/td>\n<td><code>[ \"$a\" = \"$b\" ]<\/code><\/td>\n<\/tr>\n<tr>\n<td><code>[$a -lt 5]<\/code><\/td>\n<td><code>[<\/code> 後、<code>]<\/code> 前沒空格<\/td>\n<td><code>[ $a -lt 5 ]<\/code><\/td>\n<\/tr>\n<tr>\n<td><code>expr 2*3<\/code><\/td>\n<td>沒空格且 <code>*<\/code> 沒跳脫<\/td>\n<td><code>expr 2 \\* 3<\/code><\/td>\n<\/tr>\n<tr>\n<td><code>i=expr $i + 1<\/code><\/td>\n<td>少了反引號<\/td>\n<td><code>i=`expr $i + 1`<\/code><\/td>\n<\/tr>\n<tr>\n<td><code>echo '$var'<\/code> 以為會印值<\/td>\n<td>單引號不展開<\/td>\n<td><code>echo \"$var\"<\/code><\/td>\n<\/tr>\n<tr>\n<td><code>./a.sh: Permission denied<\/code><\/td>\n<td>沒執行權限<\/td>\n<td><code>chmod u+x a.sh<\/code><\/td>\n<\/tr>\n<tr>\n<td><code>#!/bin/sh<\/code> 裡寫 <code>((i++))<\/code><\/td>\n<td>dash 不支援（補充）<\/td>\n<td>改用 <code>#!/bin/bash<\/code><\/td>\n<\/tr>\n<tr>\n<td><code>if [ ... ] then<\/code><\/td>\n<td><code>then<\/code> 前少 <code>;<\/code> 或換行<\/td>\n<td><code>if [ ... ]; then<\/code><\/td>\n<\/tr>\n<tr>\n<td>case 分支忘了 <code>;;<\/code><\/td>\n<td>語法錯誤<\/td>\n<td>每個分支結尾 <code>;;<\/code><\/td>\n<\/tr>\n<tr>\n<td>用 <code>&gt;<\/code> 比數字：<code>[ $a &gt; $b ]<\/code><\/td>\n<td><code>&gt;<\/code> 在 <code>[ ]<\/code> 裡是<strong>重新導向<\/strong>，會建立檔案<\/td>\n<td><code>-gt<\/code><\/td>\n<\/tr>\n<tr>\n<td>變數沒加引號、值為空<\/td>\n<td><code>[ = foo ]<\/code> 語法錯<\/td>\n<td><code>\"$var\"<\/code><\/td>\n<\/tr>\n<\/tbody>\n<\/table>\n<hr />\n<h2 id=\"lab1-7\">7. 筆試模擬題<\/h2>\n<p><strong>Q1（選擇）<\/strong> Vim 中，從 insert mode 回到 normal mode 要按？\n(A) <code>:<\/code>　(B) <code>i<\/code>　(C) <code>Esc<\/code>　(D) <code>Ctrl+C<\/code><\/p>\n<blockquote>\n<p><strong>答：C<\/strong>。<code>i<\/code> 是 normal → insert；<code>:<\/code> 是 normal → command-line。<\/p>\n<\/blockquote>\n<p><strong>Q2（選擇）<\/strong> 想「存檔並離開」Vim，應在命令模式輸入？\n(A) <code>:q<\/code>　(B) <code>:w<\/code>　(C) <code>:wq<\/code>　(D) <code>:x!<\/code><\/p>\n<blockquote>\n<p><strong>答：C<\/strong>。<code>:w<\/code> 只存、<code>:q<\/code> 只離開。<\/p>\n<\/blockquote>\n<p><strong>Q3（是非）<\/strong> 在 shell 中 <code>test<\/code> 指令回傳 0 代表 false。<\/p>\n<blockquote>\n<p><strong>答：錯<\/strong>。回傳 0 代表 <strong>true<\/strong>，非 0 為 false。<\/p>\n<\/blockquote>\n<p><strong>Q4（輸出預測）<\/strong><\/p>\n<div class=\"hl\"><pre><span><\/span><code><span class=\"nv\">var<\/span><span class=\"o\">=<\/span>hi\n<span class=\"nb\">echo<\/span><span class=\"w\"> <\/span><span class=\"s2\">\"<\/span><span class=\"nv\">$var<\/span><span class=\"s2\">, there\"<\/span>\n<span class=\"nb\">echo<\/span><span class=\"w\"> <\/span><span class=\"s1\">'$var, there'<\/span>\n<span class=\"nb\">echo<\/span><span class=\"w\"> <\/span><span class=\"s2\">\"`expr 1 + 3`\"<\/span>\n<span class=\"nb\">echo<\/span><span class=\"w\"> <\/span><span class=\"s1\">'`expr 1 + 3`'<\/span>\n<\/code><\/pre><\/div>\n\n<blockquote>\n<p><strong>答：<\/strong>\n<code>hi, there\n$var, there\n4\n`expr 1 + 3`<\/code>\n雙引號展開 <code>$<\/code> 與反引號；單引號全部原樣。<\/p>\n<\/blockquote>\n<p><strong>Q5（簡答）<\/strong> 為什麼 <code>expr 3 * 4<\/code> 可能出錯？如何修正？<\/p>\n<blockquote>\n<p><strong>答：<\/strong> <code>*<\/code> 會被 shell 展開成目前目錄所有檔名（wildcard）。改寫 <code>expr 3 \\* 4<\/code>，用 <code>\\<\/code> 跳脫。<\/p>\n<\/blockquote>\n<p><strong>Q6（輸出預測）<\/strong> 執行 <code>./myshell.sh a b c<\/code>：<\/p>\n<div class=\"hl\"><pre><span><\/span><code><span class=\"nb\">echo<\/span><span class=\"w\"> <\/span><span class=\"s2\">\"<\/span><span class=\"nv\">$0<\/span><span class=\"s2\"> <\/span><span class=\"nv\">$#<\/span><span class=\"s2\"> <\/span><span class=\"nv\">$2<\/span><span class=\"s2\">\"<\/span>\n<\/code><\/pre><\/div>\n\n<blockquote>\n<p><strong>答：<\/strong> <code>./myshell.sh 3 b<\/code>。<\/p>\n<\/blockquote>\n<p><strong>Q7（選擇）<\/strong> 下列哪一個是「數值小於等於」比較運算子？\n(A) <code>-lt<\/code>　(B) <code>-le<\/code>　(C) <code>-ge<\/code>　(D) <code>&lt;=<\/code><\/p>\n<blockquote>\n<p><strong>答：B<\/strong>。<code>-lt<\/code> 小於、<code>-ge<\/code> 大於等於；<code>&lt;=<\/code> 不能在 <code>[ ]<\/code> 中比數字。<\/p>\n<\/blockquote>\n<p><strong>Q8（是非）<\/strong> <code>count = 5<\/code> 可以把 5 存進變數 count。<\/p>\n<blockquote>\n<p><strong>答：錯<\/strong>。賦值時等號兩邊不能有空格，應寫 <code>count=5<\/code>。<\/p>\n<\/blockquote>\n<p><strong>Q9（輸出預測）<\/strong><\/p>\n<div class=\"hl\"><pre><span><\/span><code><span class=\"nv\">i<\/span><span class=\"o\">=<\/span><span class=\"m\">1<\/span>\n<span class=\"k\">while<\/span><span class=\"w\"> <\/span><span class=\"o\">[<\/span><span class=\"w\"> <\/span><span class=\"nv\">$i<\/span><span class=\"w\"> <\/span>-lt<span class=\"w\"> <\/span><span class=\"m\">4<\/span><span class=\"w\"> <\/span><span class=\"o\">]<\/span><span class=\"p\">;<\/span><span class=\"w\"> <\/span><span class=\"k\">do<\/span>\n<span class=\"w\">  <\/span><span class=\"nb\">echo<\/span><span class=\"w\"> <\/span>Item<span class=\"w\"> <\/span><span class=\"nv\">$i<\/span>\n<span class=\"w\">  <\/span><span class=\"nv\">i<\/span><span class=\"o\">=<\/span><span class=\"sb\">`<\/span>expr<span class=\"w\"> <\/span><span class=\"nv\">$i<\/span><span class=\"w\"> <\/span>+<span class=\"w\"> <\/span><span class=\"m\">1<\/span><span class=\"sb\">`<\/span>\n<span class=\"k\">done<\/span>\n<span class=\"nb\">echo<\/span><span class=\"w\"> <\/span><span class=\"nv\">$i<\/span>\n<\/code><\/pre><\/div>\n\n<blockquote>\n<p><strong>答：<\/strong> <code>Item 1<\/code>、<code>Item 2<\/code>、<code>Item 3<\/code>，最後一行 <code>4<\/code>。<\/p>\n<\/blockquote>\n<p><strong>Q10（簡答）<\/strong> 解釋 <code>ls | sort -r<\/code> 的作用與 pipe 的優點。<\/p>\n<blockquote>\n<p><strong>答：<\/strong> 把 <code>ls<\/code> 的輸出當作 <code>sort -r<\/code> 的輸入，反向排序列出檔名。Pipe 不需要中間的暫存檔就能串接程式。<\/p>\n<\/blockquote>\n<p><strong>Q11（選擇）<\/strong> <code>[ -z \"$str\" ]<\/code> 何時為真？\n(A) str 非空　(B) str 長度為 0　(C) str 等於 \"z\"　(D) str 為數字<\/p>\n<blockquote>\n<p><strong>答：B<\/strong>。<code>-n<\/code> 是長度 &gt; 0。<\/p>\n<\/blockquote>\n<p><strong>Q12（簡答）<\/strong> 寫好 <code>a.sh<\/code> 後執行 <code>./a.sh<\/code> 出現 <code>Permission denied<\/code>，原因與解法？<\/p>\n<blockquote>\n<p><strong>答：<\/strong> 檔案沒有執行權限。<code>chmod u+x a.sh<\/code>（或用 <code>bash a.sh<\/code> 直接交給 bash 執行）。<\/p>\n<\/blockquote>", "toc": [{"id": "lab1-1-lab", "name": "1. 這個 LAB 在學什麼", "kids": []}, {"id": "lab1-2", "name": "2. 核心觀念", "kids": [{"id": "lab1-21-shell-shell-script", "name": "2.1 Shell 與 Shell Script"}, {"id": "lab1-22-vim", "name": "2.2 Vim 的三種模式（必考）"}, {"id": "lab1-23-script", "name": "2.3 執行 script 需要「執行權限」"}, {"id": "lab1-24", "name": "2.4 變數"}, {"id": "lab1-25-expr", "name": "2.5 expr 算術"}, {"id": "lab1-26", "name": "2.6 三種引號（必考）"}, {"id": "lab1-27", "name": "2.7 命令列參數"}, {"id": "lab1-28-test-expr", "name": "2.8 test / [ expr ]"}, {"id": "lab1-29-pipe", "name": "2.9 Pipe |"}]}, {"id": "lab1-3", "name": "3. 指令／語法速查表", "kids": []}, {"id": "lab1-4", "name": "4. 程式範例逐行解說", "kids": [{"id": "lab1-41-hello-world-script", "name": "4.1 Hello World script"}, {"id": "lab1-42-myshellsh", "name": "4.2 參數（投影片 myshell.sh）"}, {"id": "lab1-43-if-elif-else", "name": "4.3 if / elif / else"}, {"id": "lab1-44-while", "name": "4.4 while 迴圈"}, {"id": "lab1-45-casenamesh", "name": "4.5 case（name.sh）"}, {"id": "lab1-46", "name": "4.6 函式"}, {"id": "lab1-47-pipe-ex3sh-ex4sh", "name": "4.7 Pipe 範例（ex3.sh | ex4.sh）"}, {"id": "lab1-48-practicelab1exsh", "name": "4.8 學生作業 practice/lab1/ex.sh（猜數字）"}, {"id": "lab1-49-exercise-function", "name": "4.9 Exercise 參考解法（含 function 與輸入檢查）"}]}, {"id": "lab1-5", "name": "5. 上機考實作步驟", "kids": []}, {"id": "lab1-6", "name": "6. 常見錯誤與陷阱", "kids": []}, {"id": "lab1-7", "name": "7. 筆試模擬題", "kids": []}]}, {"id": "lab2", "short": "Lab 2", "title": "Lab 2 複習：Adding a New System Call", "html": "<h1 id=\"lab2-lab-2-adding-a-new-system-call\">Lab 2 複習：Adding a New System Call<\/h1>\n<blockquote>\n<p>來源：Lab2.pptx（45 張投影片，含講者備註）。practice/ 沒有 lab2 資料夾。<\/p>\n<\/blockquote>\n<hr />\n<h2 id=\"lab2-1-lab\">1. 這個 LAB 在學什麼<\/h2>\n<p>下載 Linux kernel 原始碼，<strong>自己新增一個 system call<\/strong>（<code>sys_hello<\/code>，編號 462），重新編譯、安裝 kernel、從 GRUB 開進新 kernel，再寫 user program 用 <code>syscall(462)<\/code> 呼叫它，最後用 <code>dmesg<\/code> 看 kernel 印出的訊息。Exercise 2 要把它改成可以吃一個參數（印 n 次 hello）。<\/p>\n<hr />\n<h2 id=\"lab2-2\">2. 核心觀念<\/h2>\n<h3 id=\"lab2-21-system-call\">2.1 什麼是 System Call<\/h3>\n<ul>\n<li><strong>System call 是 user-space 程式向 kernel 請求服務的機制<\/strong>。user program 不能直接碰硬體或 kernel 資料，必須透過 system call 進入 kernel mode。<\/li>\n<li>例子：Process 管理 <code>fork() exec() exit() wait()<\/code>；檔案操作 <code>open() read() write() close()<\/code>。<\/li>\n<li>呼叫路徑（投影片圖）：\n  <code>User Program  ──write()──►  C library (libc write())  ──System Call──►  Kernel (sys_write())\n           User Space                          ｜                  Kernel Space<\/code>\n  libc 的 <code>write()<\/code> 只是包裝（wrapper），真正做事的是 kernel 裡的 <code>sys_write()<\/code>。<\/li>\n<\/ul>\n<h3 id=\"lab2-22-syscall-4\">2.2 新增 syscall 需要動的 4 個地方（必背）<\/h3>\n<table>\n<thead>\n<tr>\n<th>步驟<\/th>\n<th>檔案<\/th>\n<th>加入的內容<\/th>\n<th>為什麼<\/th>\n<\/tr>\n<\/thead>\n<tbody>\n<tr>\n<td>① 實作<\/td>\n<td><code>linux/hello/hello.c<\/code><\/td>\n<td><code>SYSCALL_DEFINE0(hello){...}<\/code><\/td>\n<td>syscall 本體<\/td>\n<\/tr>\n<tr>\n<td>② 子目錄 Makefile<\/td>\n<td><code>linux/hello/Makefile<\/code><\/td>\n<td><code>obj-y += hello.o<\/code><\/td>\n<td><code>obj-y<\/code> = <strong>直接編進 kernel 映像檔<\/strong>（不是 module）<\/td>\n<\/tr>\n<tr>\n<td>③ 宣告<\/td>\n<td><code>linux/include/linux/syscalls.h<\/code><\/td>\n<td><code>asmlinkage long sys_hello(void);<\/code><\/td>\n<td>集中宣告所有 syscall 原型<\/td>\n<\/tr>\n<tr>\n<td>④ 頂層建置<\/td>\n<td><code>linux/Kbuild<\/code><\/td>\n<td><code>obj-y += hello/<\/code><\/td>\n<td>讓 Kbuild 也去編譯 hello 資料夾<\/td>\n<\/tr>\n<tr>\n<td>⑤ syscall table<\/td>\n<td><code>arch/x86/entry/syscalls/syscall_64.tbl<\/code><\/td>\n<td><code>462 common hello sys_hello<\/code><\/td>\n<td>註冊編號，user space 呼叫 462 時 kernel 才找得到對應函式<\/td>\n<\/tr>\n<\/tbody>\n<\/table>\n<h3 id=\"lab2-23\">2.3 重要名詞<\/h3>\n<ul>\n<li><strong><code>asmlinkage<\/code><\/strong>：告訴編譯器這個函式的參數要從 <strong>stack<\/strong> 取得，而不是暫存器（投影片備註的說法）。syscall 進入點都會加。<\/li>\n<li><strong><code>obj-y<\/code> vs <code>obj-m<\/code><\/strong>：<code>obj-y<\/code> 把東西<strong>靜態編進 kernel<\/strong>（開機就常駐）；<code>obj-m<\/code> 編成可載入的 <strong>module (.ko)<\/strong>（Lab5 會用）。<\/li>\n<li><strong>Kbuild<\/strong>：Kernel Build System，以 Makefile 為基礎的 kernel 建置框架；每個子目錄有自己的 Kbuild/Makefile，由最上層 Makefile 統籌。<\/li>\n<li><strong>syscall table 欄位<\/strong>：<code>462<\/code>=syscall 編號、<code>common<\/code>=x86 的 64-bit 與 x32 ABI 都適用（投影片備註說「所有共同支援的架構」）、<code>hello<\/code>=名字、<code>sys_hello<\/code>=進入函式名稱。<\/li>\n<li><strong><code>SYSCALL_DEFINEn(name, type1, arg1, ...)<\/code><\/strong>：定義有 n 個參數的 syscall 的巨集；會自動產生 <code>sys_name<\/code> 函式。<code>SYSCALL_DEFINE0(hello)<\/code> → <code>sys_hello(void)<\/code>。<\/li>\n<li><strong><code>pr_info()<\/code><\/strong>：等於 <code>printk(KERN_INFO ...)<\/code>，把訊息寫進 <strong>kernel log<\/strong>（不是 terminal！），要用 <code>dmesg<\/code> 看。<\/li>\n<li><strong>GRUB<\/strong>：GRand Unified Bootloader，開機載入程式，用來選擇要開哪一個 kernel。<\/li>\n<li><strong><code>syscall()<\/code> 回傳值<\/strong>：成功回傳 0 或正數，失敗回傳 -1。<\/li>\n<\/ul>\n<h3 id=\"lab2-24-makefile\">2.4 Makefile 基本格式<\/h3>\n<div class=\"hl\"><pre><span><\/span><code><span class=\"nf\">target<\/span><span class=\"o\">:<\/span><span class=\"w\"> <\/span><span class=\"n\">dependencies<\/span>\n<span class=\"err\">&lt;TAB&gt;command<\/span>\n<\/code><\/pre><\/div>\n\n<ul>\n<li>target：要產生的東西（或 <code>clean<\/code> 這種虛擬目標）；dependencies：依賴的檔案；command：要執行的指令。<\/li>\n<li><strong>command 前面一定要是 TAB，不能是空白<\/strong>（必考）。<\/li>\n<\/ul>\n<h3 id=\"lab2-25-kernel\">2.5 編譯 kernel 的設定指令（看備註）<\/h3>\n<table>\n<thead>\n<tr>\n<th>指令<\/th>\n<th>作用<\/th>\n<\/tr>\n<\/thead>\n<tbody>\n<tr>\n<td><code>cp /boot/config-$(uname -r) .config<\/code><\/td>\n<td>把目前正在跑的 kernel 設定檔複製過來當 <code>.config<\/code><\/td>\n<\/tr>\n<tr>\n<td><code>make olddefconfig<\/code><\/td>\n<td>保留舊設定，新版 kernel 新增的選項自動套預設值<\/td>\n<\/tr>\n<tr>\n<td><code>make localmodconfig<\/code><\/td>\n<td>依目前已載入的 modules 精簡 <code>.config<\/code>（編譯更快）；遇到新選項會詢問，<code>y<\/code>=編進 kernel、<code>m<\/code>=編成 module、<code>n<\/code>=不編，大寫是預設，直接 Enter<\/td>\n<\/tr>\n<tr>\n<td><code>make -j $(nproc)<\/code><\/td>\n<td>用 CPU 核心數個 job 平行編譯 kernel（10+ 分鐘）<\/td>\n<\/tr>\n<tr>\n<td><code>sudo make -j $(nproc) modules_install<\/code><\/td>\n<td>把 <code>.ko<\/code> 模組裝到 <code>/lib/modules/&lt;版本&gt;/<\/code><\/td>\n<\/tr>\n<tr>\n<td><code>sudo make install<\/code><\/td>\n<td>把 kernel 裝到 <code>/boot<\/code> 並更新 GRUB 設定<\/td>\n<\/tr>\n<tr>\n<td><code>make mrproper<\/code><\/td>\n<td>清除所有編譯產物與設定（徹底清乾淨）<\/td>\n<\/tr>\n<\/tbody>\n<\/table>\n<hr />\n<h2 id=\"lab2-3-api\">3. 指令／API 速查表<\/h2>\n<table>\n<thead>\n<tr>\n<th>名稱<\/th>\n<th>用途<\/th>\n<th>重要參數／回傳值<\/th>\n<th>範例<\/th>\n<\/tr>\n<\/thead>\n<tbody>\n<tr>\n<td><code>git clone --depth=1 -b v7.1.3 &lt;url&gt;<\/code><\/td>\n<td>下載 kernel 原始碼<\/td>\n<td><code>--depth=1<\/code> 只抓最新一版<\/td>\n<td>見步驟<\/td>\n<\/tr>\n<tr>\n<td><code>make mrproper<\/code><\/td>\n<td>清理<\/td>\n<td>—<\/td>\n<td><code>make mrproper<\/code><\/td>\n<\/tr>\n<tr>\n<td><code>make menuconfig<\/code><\/td>\n<td>文字介面設定 kernel 選項<\/td>\n<td>用來處理憑證錯誤<\/td>\n<td>—<\/td>\n<\/tr>\n<tr>\n<td><code>grep SYSTEM_TRUSTED_KEYS .config<\/code><\/td>\n<td>確認憑證路徑已清空<\/td>\n<td>應看到 <code>\"\"<\/code><\/td>\n<td>—<\/td>\n<\/tr>\n<tr>\n<td><code>make -j $(nproc)<\/code><\/td>\n<td>平行編譯<\/td>\n<td><code>-j<\/code> = jobs；<code>$(nproc)<\/code> = 核心數<\/td>\n<td>—<\/td>\n<\/tr>\n<tr>\n<td><code>make -j1<\/code><\/td>\n<td>單核編譯<\/td>\n<td>錯誤訊息不會被洗掉，方便除錯<\/td>\n<td>—<\/td>\n<\/tr>\n<tr>\n<td><code>SYSCALL_DEFINE0(name)<\/code><\/td>\n<td>定義無參數 syscall<\/td>\n<td>—<\/td>\n<td><code>SYSCALL_DEFINE0(hello)<\/code><\/td>\n<\/tr>\n<tr>\n<td><code>SYSCALL_DEFINE1(name, type, arg)<\/code><\/td>\n<td>定義 1 個參數的 syscall<\/td>\n<td>型別和名稱用逗號分開<\/td>\n<td><code>SYSCALL_DEFINE1(hello, int, n)<\/code><\/td>\n<\/tr>\n<tr>\n<td><code>pr_info(fmt, ...)<\/code> / <code>printk(KERN_INFO ...)<\/code><\/td>\n<td>印到 kernel log<\/td>\n<td>—<\/td>\n<td><code>pr_info(\"Hello\\n\");<\/code><\/td>\n<\/tr>\n<tr>\n<td><code>long syscall(long number, ...)<\/code><\/td>\n<td>以編號直接呼叫 syscall<\/td>\n<td><code>#include &lt;sys/syscall.h&gt;<\/code>、<code>&lt;unistd.h&gt;<\/code>；成功 ≥0，失敗 -1<\/td>\n<td><code>syscall(462)<\/code><\/td>\n<\/tr>\n<tr>\n<td><code>dmesg<\/code><\/td>\n<td>顯示 kernel 訊息<\/td>\n<td>搭配 <code>tail<\/code> 看最後 10 行<\/td>\n<td><code>sudo dmesg \\| tail<\/code><\/td>\n<\/tr>\n<tr>\n<td><code>uname -r<\/code><\/td>\n<td>顯示目前 kernel 版本<\/td>\n<td>開新 kernel 後應是 <code>7.1.3-dirty<\/code><\/td>\n<td>—<\/td>\n<\/tr>\n<\/tbody>\n<\/table>\n<hr />\n<h2 id=\"lab2-4\">4. 程式範例逐行解說<\/h2>\n<h3 id=\"lab2-41-linuxhellohelloc\">4.1 <code>linux/hello/hello.c<\/code>（投影片範例）<\/h3>\n<div class=\"hl\"><pre><span><\/span><code><span class=\"cp\">#include<\/span><span class=\"w\"> <\/span><span class=\"cpf\">&lt;linux/kernel.h&gt;<\/span>\n<span class=\"cp\">#include<\/span><span class=\"w\"> <\/span><span class=\"cpf\">&lt;linux/syscalls.h&gt;<\/span>\n\n<span class=\"n\">SYSCALL_DEFINE0<\/span><span class=\"p\">(<\/span><span class=\"n\">hello<\/span><span class=\"p\">){<\/span>\n<span class=\"w\">    <\/span><span class=\"n\">pr_info<\/span><span class=\"p\">(<\/span><span class=\"s\">\"Hello<\/span><span class=\"se\">\\n<\/span><span class=\"s\">\"<\/span><span class=\"p\">);<\/span>\n<span class=\"w\">    <\/span><span class=\"k\">return<\/span><span class=\"w\"> <\/span><span class=\"mi\">0<\/span><span class=\"p\">;<\/span>\n<span class=\"p\">}<\/span>\n<\/code><\/pre><\/div>\n\n<ul>\n<li>引入的是 <code>&lt;linux/...&gt;<\/code> kernel 標頭，<strong>不能用 <code>&lt;stdio.h&gt;<\/code>、<code>printf<\/code><\/strong>（kernel 裡沒有 C 標準函式庫）。<\/li>\n<li><code>SYSCALL_DEFINE0(hello)<\/code> 展開後就是 <code>asmlinkage long sys_hello(void)<\/code>。<\/li>\n<li><code>pr_info<\/code> 輸出到 kernel log；<code>return 0<\/code> 會變成 user 端 <code>syscall()<\/code> 的回傳值。<\/li>\n<\/ul>\n<h3 id=\"lab2-42-linuxhellomakefile\">4.2 <code>linux/hello/Makefile<\/code><\/h3>\n<div class=\"hl\"><pre><span><\/span><code><span class=\"nv\">obj-y<\/span><span class=\"w\"> <\/span><span class=\"o\">+=<\/span><span class=\"w\"> <\/span>hello.o\n<\/code><\/pre><\/div>\n\n<p>Kbuild 看到 <code>hello.o<\/code> 會自動在同資料夾找 <code>hello.c<\/code> 編譯並連進 kernel。<\/p>\n<h3 id=\"lab2-43-includelinuxsyscallsh-ifndef-config_arch_has_syscall_wrapper\">4.3 <code>include/linux/syscalls.h<\/code>（加在 <code>#ifndef CONFIG_ARCH_HAS_SYSCALL_WRAPPER<\/code> 區段）<\/h3>\n<div class=\"hl\"><pre><span><\/span><code><span class=\"n\">asmlinkage<\/span><span class=\"w\"> <\/span><span class=\"kt\">long<\/span><span class=\"w\"> <\/span><span class=\"n\">sys_hello<\/span><span class=\"p\">(<\/span><span class=\"kt\">void<\/span><span class=\"p\">);<\/span>\n<\/code><\/pre><\/div>\n\n<h3 id=\"lab2-44-linuxkbuild\">4.4 <code>linux/Kbuild<\/code>（檔尾加一行）<\/h3>\n<div class=\"hl\"><pre><span><\/span><code><span class=\"nv\">obj-y<\/span><span class=\"w\"> <\/span><span class=\"o\">+=<\/span><span class=\"w\"> <\/span>hello/\n<\/code><\/pre><\/div>\n\n<h3 id=\"lab2-45-archx86entrysyscallssyscall_64tbl\">4.5 <code>arch/x86/entry/syscalls/syscall_64.tbl<\/code><\/h3>\n<div class=\"hl\"><pre><span><\/span><code>462   common   hello   sys_hello\n<\/code><\/pre><\/div>\n\n<p>加在 461（<code>lsm_list_modules<\/code>）後面。注意 table 註解說 512~547 是 x32 專用區，不要把新 syscall 放那裡。<\/p>\n<h3 id=\"lab2-46-testc\">4.6 測試程式 test.c<\/h3>\n<div class=\"hl\"><pre><span><\/span><code><span class=\"cp\">#include<\/span><span class=\"w\"> <\/span><span class=\"cpf\">&lt;stdio
